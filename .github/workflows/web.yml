# .github/workflows/web.yml
#
# Build the canonical gpu,parallel WASM package once per workflow run, then
# share it across Angular builds, both unit suites, and the fixture-gated
# browser smoke. Consumers sync the compiler output using the guarded worker
# patch and refresh its stamp so package lifecycle hooks do not compile again.
# No path filter: API type changes can also break the web build.

name: web

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  build-wasm:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: build-wasm (shared pkg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to match raw-wasm/rust-toolchain.toml. rustup would resolve
      # the toolchain file automatically when wasm-pack runs from raw-wasm/,
      # but installing it explicitly makes the version visible and lets the
      # components/target install happen once, up front.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      # Prebuilt binary — `cargo install wasm-pack` would add a ~2-minute
      # compile to every run.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # `-Z build-std` rebuilds the standard library, which is slow uncached.
      # Mirror raw-pipeline.yml's cache step.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Build raw-wasm (pkg/)
        run: bash src/raw-pipeline/raw-wasm/build.sh

      # Upload the unpatched compiler output. Each consumer runs the canonical
      # sync script, including its guarded wasm-bindgen-rayon worker patch.
      - name: Upload raw-wasm package
        uses: actions/upload-artifact@v4
        with:
          name: web-raw-wasm
          path: src/raw-pipeline/raw-wasm/pkg/
          if-no-files-found: error
          retention-days: 1

  web-build:
    name: web-build (ng build maple)
    needs: [changes, build-wasm]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Shared brand contract
        working-directory: src/web
        run: bun run brand:check

      - name: Download raw-wasm package
        uses: actions/download-artifact@v4
        with:
          name: web-raw-wasm
          path: src/raw-pipeline/raw-wasm/pkg/

      # Downloads belong to this workflow run and checkout. Refresh the stamp
      # after checkout: both prebuild and nested prebuild:maple invoke raw-wasm,
      # whose mtime guard would otherwise rebuild against newer checkout files.
      - name: Sync raw-wasm package without compiling
        run: |
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm_bg.wasm
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm.js
          touch src/raw-pipeline/raw-wasm/pkg/.build-stamp
          bash src/web/scripts/sync-raw-wasm.sh

      # The real gate. `ng build maple` exits non-zero on any TS / template
      # compile error; a plain `run:` step propagates that exit code.
      - name: Production web build (ng build maple)
        working-directory: src/web
        run: bun run build

      # Same gate for the Hosted app (`maple-syrup`) — it shares the WASM
      # `pkg/` built above but has its own routes/app.config, so a Hosted-only
      # compile break (e.g. #2283's `/settings` route) wouldn't otherwise fail
      # CI. Same job as `ng build maple` so a Hosted build break fails the
      # same gate.
      - name: Production Hosted web build (ng build maple-syrup)
        working-directory: src/web
        run: bunx ng build maple-syrup

      - name: Hosted artifact contract
        working-directory: src/web
        run: bun run check:hosted-artifact

      - name: Hosted capability boundary
        working-directory: src/web
        run: bun run check:hosted-capabilities

      # MW1 (#3020) adoption ratchet — fails if a raw <button> or a
      # btn-primary/btn-ghost class re-enters a migrated Settings directory.
      - name: Maple UI adoption check
        working-directory: src/web
        run: bun run maple-ui:adoption-check

      - name: Install Google Chrome for production artifact tests
        working-directory: src/web
        run: bun x playwright install --with-deps chrome

      - name: Production artifacts in installed Google Chrome
        working-directory: src/web
        run: bun run e2e:production-artifacts

      # #2451: the cross-width editor gates run inside the step above, and a
      # required job whose test count silently drops to zero (a skip, a
      # renamed file, a project filter) is indistinguishable from a pass.
      # This reads the run's JSON report and fails unless EXACTLY the expected
      # number of those tests passed in `chrome-hosted`.
      - name: Editor cross-width gate count is exact and non-zero
        working-directory: src/web
        run: bun run e2e:check-editor-gates

      # #2746: a failure here (e.g. welcome-intake.spec.ts's browser-audit
      # assertion) previously left CI showing only the audit's pass/fail
      # verdict — the underlying console/page errors, failed requests, and
      # error responses it attached via `testInfo.attach('production-
      # browser-audit.json', …)` (e2e/support/production-test.ts) were
      # captured by Playwright but never left the runner. Upload the whole
      # Playwright output (per-test attachments under `test-results/`, plus
      # the browsable HTML report) so a red run has the actual browser
      # errors to diagnose instead of "re-run and hope it passes".
      - name: Upload production e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-artifacts
          path: |
            src/web/test-results/production-chrome/
            src/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web-test:
    name: web-test (ng test maple)
    needs: [changes, build-wasm]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Single-run on CI (the @angular/build:unit-test builder is non-watch in a
    # non-interactive env). `timeout-minutes` is a backstop against any
    # accidental watch-mode hang burning the full job budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Download raw-wasm package
        uses: actions/download-artifact@v4
        with:
          name: web-raw-wasm
          path: src/raw-pipeline/raw-wasm/pkg/

      # Downloads belong to this workflow run and checkout. Refresh the stamp
      # after checkout: both prebuild and nested prebuild:maple invoke raw-wasm,
      # whose mtime guard would otherwise rebuild against newer checkout files.
      - name: Sync raw-wasm package without compiling
        run: |
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm_bg.wasm
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm.js
          touch src/raw-pipeline/raw-wasm/pkg/.build-stamp
          bash src/web/scripts/sync-raw-wasm.sh

      # The gate. `ng test maple` runs the unit suite and exits non-zero on any
      # failing spec; a plain `run:` step propagates that exit code.
      - name: Run web unit tests (ng test maple)
        working-directory: src/web
        run: bun x ng test maple

  web-test-common:
    name: web-test (ng test Maple-common)
    needs: [changes, build-wasm]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Single-run on CI (the @angular/build:unit-test builder is non-watch in a
    # non-interactive env). `timeout-minutes` is a backstop against any
    # accidental watch-mode hang burning the full job budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Download raw-wasm package
        uses: actions/download-artifact@v4
        with:
          name: web-raw-wasm
          path: src/raw-pipeline/raw-wasm/pkg/

      # Downloads belong to this workflow run and checkout. Refresh the stamp
      # after checkout: both prebuild and nested prebuild:maple invoke raw-wasm,
      # whose mtime guard would otherwise rebuild against newer checkout files.
      - name: Sync raw-wasm package without compiling
        run: |
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm_bg.wasm
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm.js
          touch src/raw-pipeline/raw-wasm/pkg/.build-stamp
          bash src/web/scripts/sync-raw-wasm.sh

      # The gate. `ng test Maple-common` runs the shared-library unit suite and
      # exits non-zero on any failing spec; a plain `run:` step propagates that
      # exit code. Capital-M `Maple-common` is the angular.json project name.
      - name: Run web unit tests (ng test Maple-common)
        working-directory: src/web
        run: bun x ng test Maple-common

      - name: Install Chromium for durable batch transfer tests
        working-directory: src/web
        run: bun x playwright install --with-deps chromium

      - name: Test batch transfer recovery and real Hosted UI
        working-directory: src/web
        run: bun run e2e:batch-transfer

      - name: Upload batch transfer browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: batch-transfer-browser-results
          path: src/web/test-results/
          if-no-files-found: ignore

  # Browser-WebGPU smoke (#2315). raw-pipeline.yml's `raw-gpu` job proves
  # raw-core↔WGSL agreement on lavapipe (SPIR-V); it says nothing about a
  # BROWSER's own WGSL compiler and WebGPU implementation, which is what the
  # web live path (`WebLiveSession` / `render_bytes_gpu`) actually ships
  # against. That surface had zero CI coverage before this job — only a human
  # opening the app locally.
  #
  # Reuses the two existing dev-server e2e specs that already drive the real
  # WASM/WebGPU render path end to end, rather than writing a new one:
  #   * e2e/raw-open.spec.ts — opens a real RAW, asserts the WASM decode
  #     completes with no `unreachable` trap (the #OOM regression class).
  #   * e2e/slider-tick-render.perf.spec.ts — opens the live editor, which
  #     opens a real GPU/WASM live session (WebGPU present when the adapter
  #     resolves, WASM-CPU fallback otherwise), and drives the Exposure
  #     slider through real per-tick renders. Its own `test.use({
  #     launchOptions: { args: ['--enable-unsafe-webgpu', ...] } })` is what
  #     makes a WebGPU adapter resolve at all in headless Chromium — measured
  #     null without the flag, non-null with it (see that file's own header).
  #     `MAPLE_PERF=1` un-skips it below.
  # Both specs use test-fixtures/raws/test_0006.DNG. Probe it immediately
  # after checkout so absent gitignored fixtures skip dependency installation,
  # artifact download/sync, and Chromium provisioning explicitly. The other
  # web jobs still build and test regardless of fixture availability.
  #
  # Non-required for now (see raw-pipeline.yml's raw-gpu-metal job for the
  # same reasoning) — `continue-on-error` is the mechanism, since this repo
  # has no server-side required-checks list to omit a new job from.
  web-webgpu-smoke:
    name: web-webgpu-smoke (raw-open + slider-tick-render in headless Chrome)
    needs: [changes, build-wasm]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe smoke RAW fixture
        id: fixture
        shell: bash
        run: |
          if [[ -f test-fixtures/raws/test_0006.DNG || -f test-fixtures/raws/test_0017.dng ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping WebGPU smoke: neither test_0006.DNG nor test_0017.dng is available."
            echo "WebGPU smoke skipped: RAW fixture missing; dependency and browser provisioning were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.fixture.outputs.available == 'true'
        with:
          bun-version: latest

      - name: Install web deps
        if: steps.fixture.outputs.available == 'true'
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Download raw-wasm package
        if: steps.fixture.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-raw-wasm
          path: src/raw-pipeline/raw-wasm/pkg/

      # Downloads belong to this workflow run and checkout. Refresh the stamp
      # after checkout: both prebuild and nested prebuild:maple invoke raw-wasm,
      # whose mtime guard would otherwise rebuild against newer checkout files.
      - name: Sync raw-wasm package without compiling
        if: steps.fixture.outputs.available == 'true'
        run: |
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm_bg.wasm
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm.js
          touch src/raw-pipeline/raw-wasm/pkg/.build-stamp
          bash src/web/scripts/sync-raw-wasm.sh

      # playwright.config.ts's default project is bundled Chromium (no
      # `channel: 'chrome'`, unlike playwright.production.config.ts) — install
      # that browser specifically, matching what the specs below actually run
      # against.
      - name: Install Playwright Chromium
        if: steps.fixture.outputs.available == 'true'
        working-directory: src/web
        run: bun x playwright install --with-deps chromium

      # MAPLE_PERF=1 un-skips slider-tick-render.perf.spec.ts; raw-open.spec.ts
      # has no such gate. The mask-group interaction test also runs here.
      # Each still skips individually without its RAW
      # fixture — see the job comment above.
      - name: Browser WebGPU smoke (raw-open + slider-tick-render + mask-groups)
        if: steps.fixture.outputs.available == 'true'
        working-directory: src/web
        env:
          MAPLE_PERF: '1'
        run: bun x playwright test e2e/raw-open.spec.ts e2e/slider-tick-render.perf.spec.ts e2e/mask-groups.spec.ts

      # playwright.config.ts has no HTML reporter (`reporter: [['list']]`), so
      # the artifact worth keeping on a failure is the trace
      # (`trace: 'retain-on-failure'`) under test-results/, not a report dir.
      - name: Upload Playwright traces
        if: failure() && steps.fixture.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-webgpu-smoke-traces
          path: src/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  web-workflow-acceptance:
    name: web-workflow-acceptance (WB and Auto Tone persistence + export)
    needs: [changes, build-wasm]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile
      - name: Install API deps
        working-directory: src/api
        run: bun install --frozen-lockfile
      - name: Download raw-wasm package
        uses: actions/download-artifact@v4
        with:
          name: web-raw-wasm
          path: src/raw-pipeline/raw-wasm/pkg/
      - name: Sync raw-wasm package without compiling
        run: |
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm_bg.wasm
          test -s src/raw-pipeline/raw-wasm/pkg/raw_wasm.js
          touch src/raw-pipeline/raw-wasm/pkg/.build-stamp
          bash src/web/scripts/sync-raw-wasm.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache native RAW build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-workflow-native-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: Build real server workflow library
        run: bash src/api/scripts/build-raw-ffi.sh
      - name: Install Playwright Chrome
        working-directory: src/web
        run: bun x playwright install --with-deps chrome
      # Committed synthetic RAWs: no external fixture download or skip path.
      - name: Qualify white balance and Auto Tone
        working-directory: src/web
        run: |
          bun x playwright test --config playwright.workflow.config.ts white-balance-workflow.spec.ts
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          stats = json.loads(Path('test-results/workflow/results.json').read_text())['stats']
          assert stats['expected'] == 24, stats
          assert stats['unexpected'] == stats['skipped'] == stats['flaky'] == 0, stats
          PYCODE
      - name: Preserve white balance and Auto Tone report
        id: wb_report
        working-directory: src/web
        run: cp test-results/workflow/results.json "$RUNNER_TEMP/wb-auto-tone-results.json"
      - name: Qualify 100 repeated cycles on each Web deployment
        working-directory: src/web
        run: |
          bun x playwright test --config playwright.workflow.config.ts repeated-workflow.spec.ts
          python3 ../../tools/check_web_cycle_evidence.py test-results/workflow/results.json
      # Playwright cleans test-results before its next run. Restore the separate
      # mode report afterwards, including when the cycle gate failed.
      - name: Restore white balance and Auto Tone report
        if: always() && steps.wb_report.outcome == 'success'
        working-directory: src/web
        run: |
          mkdir -p test-results/workflow
          cp "$RUNNER_TEMP/wb-auto-tone-results.json" test-results/workflow/wb-auto-tone-results.json
      - name: Upload workflow acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-workflow-acceptance
          path: src/web/test-results/
          if-no-files-found: error
          retention-days: 7

  result:
    name: Web result
    needs:
      [
        changes,
        build-wasm,
        web-build,
        web-test,
        web-test-common,
        web-webgpu-smoke,
        web-workflow-acceptance,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 tools/ci_result.py build-wasm=web web-build=web
          web-test=web web-test-common=web web-webgpu-smoke=web web-workflow-acceptance=web
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
