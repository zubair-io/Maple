<div class="flex min-h-0 flex-col gap-2.5 overflow-y-auto p-4">
  <p class="brn-summary m-0 text-[13px] font-medium text-text-main">{{ summary() }}</p>
  <app-batch-rename-preview-list [rows]="resultRows()" ariaLabel="Rename results" />
</div>

<div class="flex shrink-0 justify-end gap-2 border-t-[0.5px] border-border px-4 py-3">
  <button
    type="button"
    class="dlg-button dlg-button-primary brn-btn brn-btn-primary"
    (click)="close.emit()"
  >
    Close
  </button>
</div>
