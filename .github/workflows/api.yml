name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({ping:1})' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.50.0
        ports:
          - 7700:7700
        env:
          MEILI_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install API deps
        working-directory: src/api
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: api-native-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      # The paired white-balance regression calls the real native decoder.
      # Build it before tests so a clean runner cannot pass by skipping FFI.
      - name: Build native RAW library for API integration tests
        run: bash src/api/scripts/build-raw-ffi.sh
      - name: Run API tests
        working-directory: src/api
        env:
          MAPLE_MONGO_URI: mongodb://localhost:27017
          MAPLE_JWT_SECRET: ci-test-secret-not-for-production-only
        run: bun test --timeout 30000
      - name: Verify real Meilisearch task and search compatibility
        working-directory: src/api
        env:
          MAPLE_MEILISEARCH_INTEGRATION_URL: http://localhost:7700
        run: bun test src/enrichment/meilisearch-real.integration.test.ts --timeout 30000
      # Capability-registry evidence check (#2430): the #2431 sidecar
      # transaction contract (already part of the full `bun test` above) is
      # re-run through tools/qualification/record.sh --check, which compares
      # its executed / failed / skipped counts against the committed record
      # in test-fixtures/qualification/sidecar_contract_api.json — the file
      # the capability registry cites as this surface's persistence
      # evidence. A test added or removed without re-recording fails here.
      # The Rust toolchain used above also builds the record stamper
      # (src/raw-pipeline/codegen/src/qualification_record.rs), which is
      # what knows the current pipeline + schema version and corpus hash.
      - name: Sidecar contract evidence check
        env:
          MAPLE_MONGO_URI: mongodb://localhost:27017
          MAPLE_JWT_SECRET: ci-test-secret-not-for-production-only
        run: bash tools/qualification/record.sh --check sidecar_contract_api bun -- bash -c 'cd src/api && bun test src/routes/xmp.sidecar-contract.test.ts --timeout 30000'
