[package]
name = "maple-windows"
version = "0.1.0"
edition = "2021"
description = "Native Windows desktop host for Maple RAW Photo Editor"

[dependencies]
raw-core = { path = "../raw-pipeline/raw-core", features = ["avif", "gpu"] }
raw-ffi = { path = "../raw-pipeline/raw-ffi", features = ["gpu"] }
raw-gpu = { path = "../raw-pipeline/raw-gpu" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
notify = "6.1"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
quick-xml = "0.37"
bytemuck = { version = "1.14", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "fileapi", "shellapi"] }

[build-dependencies]
tauri-build = { version = "2.0", optional = true }

[features]
default = []
tauri = ["dep:tauri-build"]

# `src/windows` is its own cargo workspace, and a `[patch]` only applies to the
# workspace that declares it — so the override in
# `src/raw-pipeline/Cargo.toml` does NOT reach this manifest, even though
# raw-core is a path dependency of it. Without this entry the Windows host
# would be the one build still linking the unpatched rav1d, where a corrupt
# AVIF aborts the process instead of returning a decode error (#3517).
#
# Keep the two entries in lockstep. See
# `src/raw-pipeline/third_party/rav1d/MAPLE-PATCH.md`.
[patch.crates-io]
rav1d = { path = "../raw-pipeline/third_party/rav1d" }
