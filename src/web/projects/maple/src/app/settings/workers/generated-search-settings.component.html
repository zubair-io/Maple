<maple-settings-row
  [expanded]="expanded()"
  (toggle)="toggleExpanded()"
  testid="generated-search-row"
>
  <div class="wrow-summary" srow-summary>
    <maple-settings-icon [name]="chevron()" [size]="12" [stroke]="2" [color]="'#a8a29e'" />
    <span class="wrow-id">
      <span class="mono">generated-search</span>
    </span>
    <span class="status-pill">
      <span class="status-dot" [style.background]="statusColor()"></span>
      <span class="status-label" data-testid="gs-status">
        {{ statusLabel() }}
      </span>
    </span>
    <span class="wrow-readout" data-testid="gs-summary">{{ summaryLine() }}</span>
    <span class="wrow-spacer"></span>
    <button
      type="button"
      class="btn-ghost"
      data-testid="gs-run-now"
      [disabled]="running()"
      (click)="runNow()"
    >
      {{ running() ? 'Running…' : 'Run now' }}
    </button>
  </div>

  @if (expanded()) {
    <div class="panel">
      @if (loading()) {
        <p class="muted">Loading…</p>
      } @else {
        @if (error(); as message) {
          <p class="error" role="alert">{{ message }}</p>
        }

        <!-- Master switch first: everything below is inert while paused. -->
        <div class="row">
          <label class="toggle">
            <input
              type="checkbox"
              [checked]="enabled()"
              [disabled]="saving()"
              (change)="toggleEnabled()"
            />
            <span>Run daily</span>
          </label>
          @if (saved()) {
            <span class="saved">Saved</span>
          }
        </div>

        @if (draft(); as d) {
          <maple-generated-search-knobs
            [draft]="d"
            [saving]="saving()"
            (changed)="draft.set($event)"
            (save)="save()"
          />
        }

        <maple-generated-search-collections
          [cards]="cards()"
          [requested]="config()?.collections_per_day ?? null"
        />
      }
    </div>
  }
</maple-settings-row>
