<div class="flex flex-wrap gap-2 px-3 py-1.5" role="tablist" aria-label="Library filter">
  @for (chip of chips(); track chip.value) {
    <button
      type="button"
      [class]="chipClass(active() === chip.value)"
      role="tab"
      [attr.aria-selected]="active() === chip.value"
      (click)="onChipClick(chip.value)"
    >
      {{ chip.label }}
    </button>
  }
</div>
