@if (readonly()) {
  <!-- Split into its own sub-component to keep this template's cyclomatic
       complexity down — see mui-rating-flags-display.component.ts's header
       comment. -->
  <mui-rating-flags-display [rating]="rating()" [flag]="flag()" [max]="max()" />
} @else {
  <div [class]="rootClasses()">
    <div
      class="stars flex items-center gap-[2px] outline-offset-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary"
      role="slider"
      tabindex="0"
      [attr.aria-label]="'Rating'"
      aria-valuemin="0"
      [attr.aria-valuemax]="max()"
      [attr.aria-valuenow]="rating()"
      (keydown)="onKeydown($event)"
    >
      @for (star of stars(); track star) {
        <button
          type="button"
          class="star inline-flex cursor-pointer items-center justify-center border-none bg-transparent p-[2px] leading-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          [attr.aria-label]="star + ' star' + (star > 1 ? 's' : '')"
          (click)="setRating(star)"
        >
          <mui-icon
            [name]="star <= rating() ? 'star-filled' : 'star'"
            size="sm"
            [color]="star <= rating() ? 'var(--color-star)' : 'var(--color-border)'"
          />
        </button>
      }
    </div>
    @if (rating() > 0) {
      <mui-badge
        variant="rating"
        [value]="rating()"
        [label]="rating() + ' out of ' + max() + ' stars'"
      />
    }
    <mui-rating-flags-selector [(flag)]="flag" [disabled]="disabled()" [variant]="variant()" />
  </div>
}
