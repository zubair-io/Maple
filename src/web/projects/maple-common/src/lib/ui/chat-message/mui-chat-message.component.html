<div class="mui-chat-message flex items-start gap-2" [class.is-own]="own()" [class]="rowClasses()">
  @if (!own()) {
    <mui-avatar [name]="author()" size="sm" />
  }
  <div
    class="bubble flex flex-col gap-[2px] max-w-[320px] rounded-lg py-1 px-2"
    [class]="bubbleClasses()"
  >
    <div class="meta flex items-center gap-1">
      @if (!own()) {
        <mui-text variant="chip-label" class="author font-bold">{{ author() }}</mui-text>
      }
      <mui-timestamp
        [value]="sentAt()"
        format="relative"
        class="time text-text-muted text-[10px]"
      />
    </div>
    <mui-text variant="body">{{ text() }}</mui-text>
  </div>
</div>
