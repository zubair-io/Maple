<mui-popover [open]="open()" [placement]="placement()" (closeRequested)="closeRequested.emit()">
  <div class="mui-command-menu" (keydown)="onKeydown($event)">
    <div class="search-row">
      <mui-input
        variant="search"
        [value]="query()"
        (valueChange)="setQuery($event)"
        [placeholder]="placeholder()"
        ariaLabel="Command search"
      />
    </div>
    <div class="results" role="listbox">
      @if (filtered().length === 0) {
        <mui-text variant="body" color="muted" [block]="true" class="empty">
          No matching commands
        </mui-text>
      }
      @for (command of filtered(); track command.id; let i = $index) {
        <button
          type="button"
          role="option"
          class="item"
          [class.active]="clampedActiveIndex() === i"
          [attr.aria-selected]="clampedActiveIndex() === i"
          (click)="selectItem(command)"
          (mouseenter)="activeIndex.set(i)"
        >
          @if (command.icon) {
            <mui-icon [name]="command.icon" size="sm" />
          }
          <mui-text variant="body">{{ command.label }}</mui-text>
          @if (command.shortcut) {
            <span class="shortcut">{{ command.shortcut }}</span>
          }
        </button>
      }
    </div>
  </div>
</mui-popover>
