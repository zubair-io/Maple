<div
  class="dlg-backdrop"
  role="dialog"
  aria-modal="true"
  aria-label="Move to…"
  (click)="onBackdropClick()"
  (keydown.escape)="onCancel()"
>
  <div class="dlg-card mtd-card" (click)="$event.stopPropagation()">
    <div class="dlg-header mtd-header">
      <span class="dlg-title">Move to…</span>
      <mui-button
        variant="ghost"
        size="sm"
        [iconOnly]="true"
        iconLeading="x"
        ariaLabel="Close"
        (pressed)="onCancel()"
      />
    </div>

    <div class="mtd-body">
      <div class="mtd-tree" role="tree">
        <app-move-to-tree-picker
          [nodes]="rootFolders()"
          [selectedId]="selectedNodeId()"
          [sourceFolderId]="sourceFolderId()"
          (select)="onNodeSelected($event)"
        />
      </div>
    </div>

    <div class="mtd-footer">
      <mui-button variant="ghost" (pressed)="onCancel()">Cancel</mui-button>
      <mui-button variant="primary" [disabled]="!canConfirm()" (pressed)="onConfirm()">
        Move
      </mui-button>
    </div>
  </div>
</div>
