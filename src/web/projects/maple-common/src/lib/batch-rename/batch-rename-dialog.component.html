<div
  class="brn-backdrop"
  role="dialog"
  aria-modal="true"
  aria-label="Batch Rename"
  (click)="onBackdropClick()"
  (keydown.escape)="phase() === 'done' ? onClose() : onCancel()"
>
  <div class="brn-card" (click)="$event.stopPropagation()">
    <div class="brn-header">
      <span class="brn-title">Batch Rename ({{ selections().length }})</span>
    </div>

    @if (phase() === 'done' && applyResult(); as result) {
      <app-batch-rename-results
        [result]="result"
        [summary]="summaryMessage(result)"
        (close)="onClose()"
      />
    } @else {
      <app-batch-rename-form
        [template]="template()"
        [sequenceStart]="sequenceStart()"
        [sequencePadWidth]="sequencePadWidth()"
        [collision]="collision()"
        [maxTemplateLength]="maxTemplateLength"
        [tokenHelp]="tokenHelp"
        [collisionOptions]="collisionOptions"
        [resolving]="resolving()"
        [hasUnresolved]="hasUnresolved()"
        [unresolvedMessage]="hasUnresolved() ? unresolvedMessage() : ''"
        [previewLoading]="previewLoading()"
        [previewItems]="previewItems()"
        [previewError]="previewError()"
        [applyError]="applyError()"
        [duplicateCount]="duplicateCount()"
        [canApply]="canApply()"
        [busy]="applyBusy()"
        (templateInput)="onTemplateInput($event)"
        (sequenceStartInput)="onSequenceStartInput($event)"
        (sequencePadWidthInput)="onSequencePadWidthInput($event)"
        (collisionChange)="onCollisionChange($event)"
        (insertToken)="insertToken($event)"
        (apply)="onApply()"
        (cancel)="onCancel()"
      />
    }
  </div>
</div>
