<div class="mui-user-management flex flex-col gap-6">
  <div class="invite flex items-end gap-6 p-4 border border-border rounded-lg bg-surface">
    <div class="invite-field flex-1 min-w-0">
      <mui-form-field
        label="Invite by email"
        [(value)]="inviteValue"
        placeholder="teammate@example.com"
        (committed)="onInviteCommitted($event)"
      />
    </div>
    @if (inviteLink()) {
      <div class="invite-qr flex flex-col items-center gap-1 flex-none">
        <mui-qr-code [value]="inviteLink()" size="sm" ariaLabel="Invite link QR code" />
        <mui-text variant="body" color="muted">Scan to accept invite</mui-text>
      </div>
    }
  </div>

  <div class="users flex flex-col border border-border rounded-lg bg-surface overflow-hidden">
    @for (user of users(); track user.id) {
      <mui-list-row [label]="user.name" [subtitle]="user.email + ' · ' + user.role">
        <mui-button trailing variant="ghost" size="sm" (pressed)="requestRevoke(user)">
          Revoke
        </mui-button>
      </mui-list-row>
    }
  </div>

  <mui-dialog
    [open]="dialogOpen()"
    title="Revoke access?"
    [message]="dialogMessage()"
    variant="confirm"
    confirmLabel="Revoke"
    [destructive]="true"
    (confirmed)="confirmRevoke()"
    (dismissed)="dismissRevoke()"
  />
</div>
