[package]
name = "pano-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
raw-core = { path = "../raw-core" }
akaze = "0.7"
# image 0.23 is akaze's image dep; used in features/akaze.rs to bridge the
# version boundary (workspace image = 0.25 is a different type).
image023 = { package = "image", version = "0.23" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
imageproc = "0.25"
nalgebra = "0.33"
argmin = "0.10"
arrsac = "0.10"
sample-consensus = "1.0"
rand = "0.8"
rand_distr = "0.4"
wgpu = "23"
bytemuck.workspace = true
palette = "0.7"
bitvec = "1"
pathfinding = "4"
thiserror.workspace = true
tracing = "0.1"
rayon = { workspace = true }
half = "2"
png.workspace = true
clap.workspace = true
image.workspace = true
tempfile = "3"
# Used by `pano-smoke` for the memory pre-flight (auto-detect total
# vs available RAM so the cap matches the actual machine instead of
# a hardcoded 12 GB).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# `ort` (ONNX Runtime FFI) was the original target for ML matching but
# 2.0.0-rc.{10,12} ship a VitisAI exec-provider call that fails to
# compile against the current ort-sys. Until upstream fixes that, ML
# inference goes through `tract` — a pure-Rust ONNX runtime, no FFI
# build, slower than ORT/CUDA but plenty fast for sparse-keypoint
# matchers like LightGlue (≤ a few hundred ms on a CPU at preview res).
[dependencies.tract-onnx]
version = "0.21"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
# Spec § 9 defaults to ["ml-aliked", "ml-lightglue", "gpu-wgpu"]. The
# ml-* features pull `tract-onnx`. They're opt-in so the classical
# baseline (AKAZE+GMS) builds without the extra dep tree. Re-promote
# to default once the LightGlue model is bundled and verified on
# the reference scene set.
default = ["gpu-wgpu"]
ml-aliked = ["dep:tract-onnx"]
ml-lightglue = ["dep:tract-onnx"]
ml-superpoint = ["dep:tract-onnx"]   # research license — never default
ml-udis = ["dep:tract-onnx"]         # parallax composition — opt-in
ml-depth = ["dep:tract-onnx"]        # depth-aware blend — opt-in
gpu-wgpu = []                          # wgpu is unconditionally pulled today; flag retained for symmetry
heif = []                              # libheif-rs gated, native-only; off by default
