name: API tests

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  api-typecheck:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install API deps
        working-directory: src/api
        run: bun install --frozen-lockfile
      - name: Typecheck API source and tests
        working-directory: src/api
        run: bun run typecheck

  api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install API deps
        working-directory: src/api
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: api-native-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: Install nasm (AV1 encoder x86_64 assembly, #6165)
        run: bash tools/install-nasm.sh
      # The paired white-balance regression calls the real native decoder.
      # Build it before tests so a clean runner cannot pass by skipping FFI.
      - name: Build native RAW library for API integration tests
        run: bash src/api/scripts/build-raw-ffi.sh
      # Fetch here so a slow download is this step, not a timed-out 120 s test hook (#6041).
      - name: Fetch the Temporal test server
        working-directory: src/api
        timeout-minutes: 10
        run: bun scripts/prewarm-temporal.ts
      - name: Run API tests
        working-directory: src/api
        # The suite takes minutes; a hung test process must not hold the runner
        # for the 6 h job default (#5701).
        timeout-minutes: 30
        env:
          MAPLE_JWT_SECRET: ci-test-secret-not-for-production-only
        run: bun test --timeout 30000
      # Capability-registry evidence check (#2430): the #2431 sidecar
      # transaction contract (already part of the full `bun test` above) is
      # re-run through tools/qualification/record.sh --check, which compares
      # its executed / failed / skipped counts against the committed record
      # in test-fixtures/qualification/sidecar_contract_api.json — the file
      # the capability registry cites as this surface's persistence
      # evidence. A test added or removed without re-recording fails here.
      # The Rust toolchain used above also builds the record stamper
      # (src/raw-pipeline/codegen/src/qualification_record.rs), which is
      # what knows the current pipeline + schema version and corpus hash.
      - name: Sidecar contract evidence check
        env:
          MAPLE_JWT_SECRET: ci-test-secret-not-for-production-only
        run: bash tools/qualification/record.sh --check sidecar_contract_api bun -- bash -c 'cd src/api && bun test src/routes/xmp.sidecar-contract.test.ts --timeout 30000'

  perf-gate-listing:
    name: perf-gate-listing (folder listing against its target)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install API deps
        working-directory: src/api
        run: bun install --frozen-lockfile
      - name: Folder listing against the 100 ms target and the runner budget (#6147)
        run: >-
          python3 src/scripts/perf_scorecard.py --targets listing --regressions-only
          --machine-class "linux-x64 GitHub-hosted ubuntu-24.04"

  perf-gate-core:
    name: perf-gate-core (1280 px preview and default export against their budgets)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: perf-gate-core-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: Install nasm (AV1 encoder x86_64 assembly, #6165)
        run: bash tools/install-nasm.sh
      - name: Build the benchmark binaries (release)
        working-directory: src/raw-pipeline
        run: |
          cargo build --release --locked -p raw-ffi --example ffi-perf
          cargo build --release --locked -p raw-core --features test-support --example perf-audit-dng
      - name: Scorecard unit tests
        run: python3 src/scripts/perf_scorecard_test.py
      - name: Preview and export against the runner budgets (#6147)
        run: >-
          python3 src/scripts/perf_scorecard.py --targets preview,export --regressions-only
          --machine-class "linux-x64 GitHub-hosted ubuntu-24.04"

  result:
    name: API result
    needs: [changes, api-typecheck, api-tests, perf-gate-listing, perf-gate-core]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: >-
          python3 tools/ci_result.py api-typecheck=api api-tests=api perf-gate-listing=api
          perf-gate-core=api
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
