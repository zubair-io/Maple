<div class="mx-auto flex max-w-[640px] flex-col gap-6 p-6 md:p-8">
  <header class="flex flex-col gap-1">
    <a routerLink="/" class="w-fit text-[12px] text-text-muted hover:text-text-main">
      ← Back to Browse
    </a>
    <h1 class="text-[22px] font-semibold tracking-tight text-text-main">Account</h1>
  </header>

  @if (user(); as u) {
    <section class="flex flex-col gap-3 rounded border border-border bg-surface p-4">
      <div class="text-[11px] font-semibold tracking-wide text-text-muted uppercase">Identity</div>
      <dl class="grid grid-cols-[100px_1fr] gap-x-4 gap-y-2 text-[13px]">
        <dt class="text-text-muted">Email</dt>
        <dd class="font-mono text-text-main">{{ u.email }}</dd>
        <dt class="text-text-muted">Role</dt>
        <dd class="flex items-center gap-2 text-text-main">
          {{ u.role[0].toUpperCase() + u.role.slice(1) }}
          @if (isOwner()) {
            <span
              class="rounded bg-surface-hover px-1.5 py-0.5 font-mono text-[9px] tracking-wide text-text-muted"
            >
              OWNER
            </span>
          }
        </dd>
      </dl>
    </section>

    <section class="flex flex-col gap-3 rounded border border-border bg-surface p-4">
      <div class="text-[11px] font-semibold tracking-wide text-text-muted uppercase">Session</div>
      <button
        type="button"
        class="w-fit rounded border border-border px-3 py-1.5 text-[12px] text-text-main transition-colors hover:bg-surface-hover"
        (click)="signOut()"
      >
        Sign out
      </button>
    </section>
  } @else {
    <section class="rounded border border-border bg-surface p-4">
      <p class="text-[12.5px] text-text-muted italic">Not signed in.</p>
    </section>
  }
</div>
