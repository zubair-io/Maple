<div class="mui-crop-toolbar">
  <mui-chip-row
    class="presets"
    [chips]="aspectChips()"
    mode="select"
    [selectedId]="aspect()"
    (selectedIdChange)="onAspectChange($event)"
  />
  <mui-drag-bar
    class="straighten"
    label="Straighten"
    [value]="angle()"
    (valueChange)="onAngleChange($event)"
    [min]="-45"
    [max]="45"
    [step]="0.1"
    [testId]="straightenTestId()"
    (dragStart)="straightenDragStart.emit()"
    (dragEnd)="straightenDragEnd.emit()"
  />
  <mui-button
    variant="ghost"
    [iconLeading]="'revert'"
    ariaLabel="Reset crop"
    [disabled]="resetDisabled()"
    [testId]="resetTestId()"
    (pressed)="onReset()"
  >
    Reset
  </mui-button>
</div>
