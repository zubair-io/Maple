<div
  class="flex items-center gap-3 border-b-[0.5px] border-border px-3 py-2 last:border-b-0"
  role="listitem"
>
  <div class="flex min-w-0 flex-1 flex-col gap-0.5">
    <span
      class="overflow-hidden text-[12px] font-medium text-ellipsis whitespace-nowrap text-text-main"
      >{{ item().filename }}</span
    >
    <span class="overflow-hidden text-[10.5px] text-ellipsis whitespace-nowrap text-text-muted">{{
      item().originalRelativePath
    }}</span>
  </div>
  <span class="min-w-[56px] shrink-0 text-right font-mono text-[10px] text-text-muted"
    >{{ item().size / 1024 / 1024 | number: '1.1-1' }} MB</span
  >
  @if (item().reason === 'reaped') {
    <span
      class="shrink-0 rounded-[5px] border-[0.5px] border-border px-2 py-[3px] text-[10.5px] whitespace-nowrap text-text-muted"
      title="The file disappeared from disk; the record is kept until the trash retention window expires and restores itself if the file returns."
    >
      Removed from disk
    </span>
  } @else {
    <div class="flex shrink-0 gap-1.5">
      <mui-button
        variant="secondary"
        size="sm"
        [disabled]="busy()"
        [ariaLabel]="'Restore ' + item().filename"
        (pressed)="restore.emit()"
      >
        Restore
      </mui-button>
      <mui-button
        variant="destructive"
        size="sm"
        [disabled]="busy()"
        [ariaLabel]="'Delete ' + item().filename + ' permanently'"
        (pressed)="deletePermanently.emit()"
      >
        Delete Permanently
      </mui-button>
    </div>
  }
</div>
