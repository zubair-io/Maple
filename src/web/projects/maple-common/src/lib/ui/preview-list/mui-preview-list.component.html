<div class="mui-preview-list">
  @for (item of items(); track item.id) {
    <mui-list-row [label]="item.before" (pressed)="pressed.emit(item.id)">
      <mui-text trailing variant="chip-label" color="muted" [truncate]="true">
        {{ item.after }}
      </mui-text>
    </mui-list-row>
  }
</div>
