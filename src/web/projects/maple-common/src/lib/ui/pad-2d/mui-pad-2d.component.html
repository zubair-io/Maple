<div
  #padEl
  class="mui-pad-2d relative rounded-lg border border-border touch-none cursor-crosshair outline-offset-4 focus-visible:outline-2 focus-visible:outline-text-main"
  [class.is-disabled]="disabled()"
  [class.opacity-45]="disabled()"
  [class.pointer-events-none]="disabled()"
  [class.is-dragging]="dragging()"
  [class.outline-2]="dragging()"
  [class.outline-text-main]="dragging()"
  [class.is-fill]="fill()"
  [class.w-full]="fill()"
  [style.width.px]="fill() ? null : size()"
  [style.height.px]="fill() ? null : size()"
  [style.aspect-ratio]="fill() ? aspectRatio() : null"
  [style.background]="gradient()"
  role="slider"
  tabindex="0"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-valuetext]="valueText() ?? 'x ' + value().x.toFixed(2) + ', y ' + value().y.toFixed(2)"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (keydown)="onKeydown($event)"
>
  <!-- Projected fill (e.g. the WB pad's two-layer temp/tint gradient, which
       needs `mix-blend-mode` between its own layers — not expressible as
       this control's single `gradient` background string). Absolute-fill,
       behind the crosshair/puck, so it paints the pad without intercepting
       its own pointer/keyboard events. -->
  <div class="fill-slot absolute inset-0 overflow-hidden rounded-[inherit] pointer-events-none">
    <ng-content />
  </div>
  @if (crosshair()) {
    <div
      class="crosshair-h absolute inset-x-0 h-px pointer-events-none bg-[color-mix(in_srgb,var(--color-surface)_70%,transparent)]"
      [style.top.%]="puckPos().top"
    ></div>
    <div
      class="crosshair-v absolute inset-y-0 w-px pointer-events-none bg-[color-mix(in_srgb,var(--color-surface)_70%,transparent)]"
      [style.left.%]="puckPos().left"
    ></div>
  }
  <div
    class="puck absolute w-[10px] h-[10px] rounded-full bg-white border-2 border-text-main -translate-x-1/2 -translate-y-1/2 pointer-events-none shadow-[0_1px_3px_rgba(0,0,0,0.4)]"
    [style.left.%]="puckPos().left"
    [style.top.%]="puckPos().top"
  ></div>
</div>
