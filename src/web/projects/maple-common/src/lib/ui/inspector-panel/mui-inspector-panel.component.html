<div class="mui-inspector-panel flex h-full flex-col gap-2">
  <mui-page-header
    [title]="title()"
    [showBack]="showBack()"
    [showMore]="showMore()"
    (back)="back.emit()"
    (more)="more.emit()"
  />
  <mui-tabs [tabs]="tabs()" [(activeId)]="activeTabId" />
  <div class="body min-h-0 flex-1 overflow-auto p-4">
    <ng-content />
  </div>
</div>
