@let f = folder();
<div
  class="folder-tile group relative flex h-full w-full cursor-pointer flex-row items-center gap-2.5 overflow-hidden rounded-sm bg-surface px-3.5 text-text-main outline-none hover:bg-bg-hover"
  role="button"
  tabindex="0"
  [class.selected]="selected()"
  [attr.aria-pressed]="selected()"
  (click)="folderClick.emit($event)"
  (dblclick)="folderDblClick.emit($event)"
  (keydown)="onKeydown($event)"
>
  <mui-icon name="folder" size="md" color="var(--color-primary)" class="shrink-0" />
  <mui-text variant="body" color="main" [truncate]="true" [block]="true" class="min-w-0 flex-1">{{
    f.name
  }}</mui-text>
  <div
    class="folder-ring pointer-events-none absolute inset-0 rounded-sm border-2 border-transparent transition-[border-color] duration-[80ms] group-[.selected]:border-primary group-focus-visible:border-primary"
    aria-hidden="true"
  ></div>
</div>
