<div
  class="mui-image relative h-full w-full overflow-hidden bg-surface-alt"
  [class]="radiusClass()"
  [style.aspect-ratio]="aspectRatio()"
>
  @if (!src() && placeholderBackground()) {
    <div
      class="pixels gradient-placeholder is-loaded block h-full w-full bg-cover bg-center bg-no-repeat opacity-100 transition-opacity duration-200 ease-in-out"
      [style.background-image]="placeholderBackground()"
      aria-hidden="true"
    ></div>
  } @else if (!broken()) {
    <img
      class="pixels block h-full w-full transition-opacity duration-200 ease-in-out"
      [class]="pixelsClass()"
      [src]="src()"
      [alt]="alt()"
      loading="lazy"
      (error)="onError()"
      (load)="onLoad()"
    />
  } @else {
    <div
      class="placeholder flex h-full w-full items-center justify-center text-text-muted"
      role="img"
      [attr.aria-label]="alt()"
    >
      <mui-icon name="photos" size="lg" />
    </div>
  }
</div>
