<div class="search" data-testid="search-root">
  <div class="bar-row">
    <app-search-bar
      [query]="query()"
      (queryChange)="onQueryChange($event)"
      (clear)="onClear()"
      (submit)="onSubmit()"
    />
    @if (showFilters()) {
      <button
        type="button"
        class="filters-btn"
        data-testid="search-filters"
        (click)="onFilters()"
        aria-label="Open filters"
      >
        Filters
      </button>
    }
  </div>
  <app-search-scope-chips [scope]="scope()" (scopeChange)="onScopeChange($event)" />

  @if (showRecents()) {
    <app-recent-queries [recent]="recent()" (recentTap)="onRecentTap($event)" />
  } @else {
    <app-top-hits-section [hits]="topHits()" [query]="query()" (hitTap)="onTopHitTap($event)" />
    <app-photo-results-section
      [results]="results()"
      [total]="total()"
      [isStale]="isStale()"
      [hasQuery]="hasQuery() && !isStale()"
      [query]="query()"
      [isLoadingMore]="isLoadingMore()"
      (resultTap)="onPhotoTap($event)"
      (loadMore)="onLoadMore()"
    />
  }
</div>
