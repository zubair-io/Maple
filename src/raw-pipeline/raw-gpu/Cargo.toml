[package]
name = "raw-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# All GPU code (epic #925) lives here behind one crate boundary. This crate is
# only ever pulled in by the `gpu` feature of raw-core / raw-wasm, so its mere
# presence in the dependency tree is already gated — it needs no `gpu` feature of
# its own. Default raw-core / raw-wasm builds never reference it, so wgpu stays
# absent from the default tree. Headless only (P1a / #987): no display surface,
# no platform deps — that is P1b (#988) / P1c (#989).
[dependencies]
# wgpu 23 (pinned by P0). naga (WGSL→MSL/SPIR-V) is bundled inside wgpu.
wgpu = "23"
bytemuck.workspace = true
futures-channel = "0.3"

# pollster (native block_on) is meaningless on wasm32, where callers await the
# async core directly via wasm-bindgen-futures. Keep it off the wasm tree.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

# Web present proof (P1c / #989). wasm-only: the canvas surface path needs the
# `web_sys::HtmlCanvasElement` handle to hand wgpu, and the display-p3 re-tag pokes
# the canvas's WebGPU context through `js_sys` (Reflect/Object/Function) on untyped
# values. We deliberately do NOT enable any `web_sys::Gpu*` feature: wgpu-23 vendors
# its OWN private WebGPU bindings, so pulling the public ones too would make
# wasm-bindgen reject the build (`duplicate string enums` for `GpuCanvasAlphaMode`
# etc). `HtmlCanvasElement` is a DOM type wgpu does not redefine, so it's safe — and
# it's all we need. These are already in the wasm tree transitively (wgpu pulls
# web-sys + js-sys + wasm-bindgen on wasm32); declaring them here just makes the
# `HtmlCanvasElement` feature reachable from raw-gpu. The host + default `raw-ffi`
# builds never see them (no wgpu, no web-sys), so the shipping path stays
# wgpu/web-sys-free.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

# Test-only: parity-gate WGSL stage kernels DIRECTLY against their raw-core Rust
# stage (epic #925 P2 / #990) — the ticket's contract is "parity vs its Rust
# stage," not "vs a hand-copied oracle." `default-features = false` keeps the
# `gpu` feature OFF, so this is acyclic: raw-core references raw-gpu only through
# its optional `gpu` feature, which stays disabled here. Dev-deps don't enter the
# normal build graph, so raw-core / raw-wasm default + `gpu` trees are unchanged.
[dev-dependencies]
raw-core = { path = "../raw-core", default-features = false }
