name: Maple package types

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: maple-types-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  maple-typecheck:
    needs: changes
    if: needs.changes.outputs.maple == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The API lock pins the package's TypeScript and Bun/Node type tooling.
      # Typechecking needs neither platform binaries nor image fixtures.
      - name: Install frozen development dependencies
        working-directory: src/api
        run: bun install --frozen-lockfile
      - name: Typecheck package source and every test
        working-directory: src/maple
        run: |
          ln -s ../api/node_modules node_modules
          bun run typecheck

  result:
    name: Maple types result
    needs: [changes, maple-typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci_result.py maple-typecheck=maple
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
