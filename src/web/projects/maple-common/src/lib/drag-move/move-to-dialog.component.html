<div
  class="mtd-backdrop"
  role="dialog"
  aria-modal="true"
  aria-label="Move to…"
  (click)="onBackdropClick()"
  (keydown.escape)="onCancel()"
>
  <div class="mtd-card" (click)="$event.stopPropagation()">
    <div class="mtd-header">
      <span class="mtd-title">Move to…</span>
      <button type="button" class="mtd-close" aria-label="Close" (click)="onCancel()">✕</button>
    </div>

    <div class="mtd-body">
      <div class="mtd-tree" role="tree">
        <app-move-to-tree-picker
          [nodes]="rootFolders()"
          [selectedId]="selectedNodeId()"
          [sourceFolderId]="sourceFolderId()"
          (select)="onNodeSelected($event)"
        />
      </div>
    </div>

    <div class="mtd-footer">
      <button type="button" class="mtd-btn mtd-btn-ghost" (click)="onCancel()">Cancel</button>
      <button
        type="button"
        class="mtd-btn mtd-btn-primary"
        [disabled]="!canConfirm()"
        (click)="onConfirm()"
      >
        Move
      </button>
    </div>
  </div>
</div>
