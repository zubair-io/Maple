<div class="flex gap-2 border-b-[0.5px] border-border px-4 py-2.5">
  <mui-button
    variant="secondary"
    size="sm"
    [disabled]="disabledReason() !== null"
    [title]="disabledReason()"
    [ariaDescribedby]="disabledReason() ? 'tt-disabled-reason' : null"
    (pressed)="restoreAll.emit()"
  >
    Restore All
  </mui-button>
  <mui-button
    variant="destructive"
    size="sm"
    [disabled]="disabledReason() !== null"
    [title]="disabledReason()"
    [ariaDescribedby]="disabledReason() ? 'tt-disabled-reason' : null"
    (pressed)="emptyTrash.emit()"
  >
    Empty Trash
  </mui-button>
  @if (disabledReason(); as reason) {
    <span id="tt-disabled-reason" class="sr-only">{{ reason }}</span>
  }
</div>
