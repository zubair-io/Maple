<div
  class="mui-map-surface relative overflow-hidden rounded-lg border border-border bg-bg"
  [style.width.px]="viewportWidth()"
  [style.height.px]="viewportHeight()"
>
  <div
    class="backdrop absolute inset-0 cursor-grab touch-none opacity-60 active:cursor-grabbing"
    [style.backgroundPosition]="pan().x + 'px ' + pan().y + 'px'"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
  ></div>

  @if (heatmapVisible()) {
    <div class="heatmap-overlay pointer-events-none absolute inset-0 opacity-70">
      <mui-heatmap-layer
        [grid]="heatmapGrid()"
        [width]="viewportWidth()"
        [height]="viewportHeight()"
      />
    </div>
  }

  @if (annotations().length === 0) {
    <div class="empty-overlay absolute inset-0 flex items-center justify-center">
      <mui-empty-state
        icon="map-pin"
        title="No locations yet"
        message="Nothing has been placed on the map."
      />
    </div>
  } @else {
    @for (pin of clusters(); track pin.id) {
      <button
        type="button"
        class="pin absolute -translate-x-1/2 -translate-y-full cursor-pointer border-none bg-none p-0 leading-none"
        [style.left.px]="pin.screenX"
        [style.top.px]="pin.screenY"
        [attr.aria-label]="pin.count ? pin.count + ' photos' : (pin.label ?? 'Photo')"
        (click)="selectPin(pin)"
      >
        <mui-map-annotation [src]="pin.thumbnailUrl" [label]="pin.label" [count]="pin.count" />
      </button>
    }
  }

  <mui-button
    class="heatmap-toggle absolute top-2 right-2"
    variant="secondary"
    size="sm"
    iconLeading="droplet"
    (pressed)="toggleHeatmap()"
  >
    {{ heatmapVisible() ? 'Hide heatmap' : 'Show heatmap' }}
  </mui-button>
</div>
