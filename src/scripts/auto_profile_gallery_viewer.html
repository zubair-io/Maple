<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto / JPEG comparison viewer</title>
  <style>
    :root {
      color-scheme: dark;
      font:
        14px system-ui,
        -apple-system,
        sans-serif;
      background: #151719;
      color: #eee;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
    }
    button,
    select,
    a.control {
      font: inherit;
      color: inherit;
      background: #292d31;
      border: 1px solid #464b50;
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover,
    a.control:hover {
      background: #3a4045;
    }
    button:focus-visible,
    a:focus-visible,
    select:focus-visible {
      outline: 2px solid #8bc1ff;
      outline-offset: 2px;
    }
    button[aria-pressed='true'] {
      background: #e3e7eb;
      color: #17191b;
      border-color: #e3e7eb;
    }
    header {
      padding: 12px 16px;
      display: flex;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid #35393d;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 15px;
      margin: 0;
      white-space: nowrap;
    }
    .source {
      font-size: 12px;
      color: #afb7bf;
      max-width: 620px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .group {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .spacer {
      flex: 1;
    }
    #fixture {
      max-width: 220px;
    }
    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #stage {
      flex: 1;
      position: relative;
      min-height: 100px;
      overflow: hidden;
      background: #0c0e10;
      cursor: grab;
      touch-action: none;
      outline: none;
    }
    #stage.dragging {
      cursor: grabbing;
    }
    #scene {
      position: absolute;
      pointer-events: none;
    }
    #scene img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      visibility: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }
    #scene img.active {
      visibility: visible;
    }
    #badge {
      position: absolute;
      left: 18px;
      top: 16px;
      background: #181b20e6;
      border: 1px solid #69727b;
      border-radius: 6px;
      padding: 7px 11px;
      font-weight: 600;
      pointer-events: none;
    }
    #help {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: #d1d6db;
      background: #171a1ddd;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
    }
    #zoom {
      font-variant-numeric: tabular-nums;
      min-width: 52px;
      text-align: center;
    }
    footer {
      background: #1b1e21;
      border-top: 1px solid #35393d;
      padding: 8px 16px;
      display: flex;
      gap: 14px;
      justify-content: space-between;
      font-size: 12px;
      color: #b6bec6;
    }
    #filmstrip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      padding: 8px 12px;
      height: 93px;
      background: #202327;
    }
    #filmstrip button {
      width: 100px;
      min-width: 100px;
      padding: 3px 5px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    #filmstrip img {
      width: 84px;
      height: 48px;
      object-fit: contain;
    }
    #filmstrip button[aria-current='true'] {
      outline: 2px solid #b8cbe0;
      outline-offset: -2px;
      background: #39434c;
    }
    #filmstrip span {
      white-space: nowrap;
    }
    #result {
      white-space: nowrap;
    }
    .fail {
      color: #ffb4a2;
    }
    .pass {
      color: #aae0b0;
    }
    #load {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 60vw;
    }
    .error {
      color: #ffb4a2;
    }
    .hint {
      color: #aeb7c0;
      font-size: 12px;
    }
    @media (max-width: 950px) {
      header {
        gap: 8px;
        padding: 8px;
      }
      header .source {
        max-width: 75vw;
      }
      .spacer {
        display: none;
      }
      #help {
        white-space: normal;
        text-align: center;
        max-width: 90%;
        width: max-content;
      }
      footer {
        padding: 7px 10px;
      }
      #filmstrip {
        height: 87px;
      }
    }
  </style>
  <div id="app">
    <header>
      <div>
        <h1>Auto / embedded JPEG</h1>
        <div class="source" id="checkpoint"></div>
      </div>
      <div class="group">
        <button id="previous" aria-label="Previous image">‹</button
        ><select id="fixture" aria-label="Choose test image"></select
        ><button id="next" aria-label="Next image">›</button>
      </div>
      <div class="group" id="variants">
        <button data-view="before" aria-pressed="false">1 · Before</button
        ><button data-view="after" aria-pressed="true">2 · After</button
        ><button data-view="reference" aria-pressed="false">3 · JPEG</button
        ><button id="swap" title="Space: toggle After and your last comparison">A/B ␣</button>
      </div>
      <div class="spacer"></div>
      <div class="group">
        <button id="fit" title="F: fit image">Fit</button
        ><button id="native" title="0: one render pixel per CSS pixel">100%</button
        ><button id="minus" aria-label="Zoom out">−</button><span id="zoom">Fit</span
        ><button id="plus" aria-label="Zoom in">+</button
        ><button id="fullscreen" title="Enter or leave full screen" aria-label="Full screen">
          ⛶
        </button>
      </div>
    </header>
    <div
      id="stage"
      tabindex="0"
      aria-label="Image comparison. Drag to pan; scroll to zoom. Press 1, 2, 3 to change image."
    >
      <div id="scene">
        <img id="before" alt="Before render" /><img id="after" alt="After render" /><img
          id="reference"
          alt="Camera embedded JPEG"
        />
      </div>
      <div id="badge">After</div>
      <div id="help">
        1 Before · 2 After · 3 JPEG · Space swap · ← → image · scroll zoom · drag pan · double-click
        100% / Fit
      </div>
    </div>
    <footer>
      <span id="load" role="status">Loading…</span><span id="result"></span
      ><a id="original" href="#" class="hint" target="_blank" rel="noopener">Open original file ↗</a
      ><a href="overview.html" class="hint">Overview</a>
    </footer>
    <nav id="filmstrip" aria-label="Test images"></nav>
  </div>
  <script type="application/json" id="gallery-data">
    __GALLERY_DATA__
  </script>
  <script>
    __GALLERY_SCRIPT__;
  </script>
</html>
