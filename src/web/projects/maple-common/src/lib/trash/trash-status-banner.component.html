@if (toast(); as message) {
  <div class="dlg-toast tsb-toast" role="status">
    <span>{{ message }}</span>
    <button
      type="button"
      class="dlg-toast-dismiss"
      (click)="dismissToast.emit()"
      aria-label="Dismiss"
    >
      ✕
    </button>
  </div>
}

@if (loadError(); as error) {
  <div class="tsb-error" role="alert">{{ error }}</div>
}
