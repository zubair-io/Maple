<section class="flex flex-col gap-2">
  <h3 class="mui-chrome-option-eyebrow">{{ title() }}</h3>
  @if (rows().length === 0) {
    <p class="mui-chrome-option-none">{{ emptyLabel() }}</p>
  }
  <ul class="mui-chrome-option-rows">
    @for (r of rows(); track r.value) {
      <li>
        <button
          type="button"
          class="mui-chrome-option-row border-l-2 border-l-transparent"
          [class.selected]="r.selected"
          [class.border-l-primary]="r.selected"
          [attr.aria-pressed]="r.selected"
          [attr.data-testid]="'filter-' + kind() + '-' + r.value"
          (click)="rowToggle.emit(r.value)"
        >
          @if (kind() === 'person') {
            <span class="mui-chrome-option-avatar">{{ initial(r.value) }}</span>
          } @else {
            <span class="mui-chrome-option-avatar">
              <maple-icon name="search-chip-place" [size]="13" aria-hidden="true" />
            </span>
          }
          <span class="mui-chrome-option-name">{{ r.value }}</span>
          <span class="mui-chrome-option-count">{{ r.count }}</span>
          @if (r.selected) {
            <maple-icon
              name="search-check"
              [size]="14"
              class="mui-chrome-option-check"
              aria-hidden="true"
            />
          }
        </button>
      </li>
    }
  </ul>
</section>
