# T10 — cross-origin-isolated threading for the WASM build.
#
# These rustflags are only applied to the wasm32-unknown-unknown target, so
# `cargo build -p raw-core` on aarch64-apple-darwin (and every other host
# target) is unaffected.
#
# - atomics         → SharedArrayBuffer + shared linear memory
# - bulk-memory     → memcpy/memset lowered to memory.copy / memory.fill,
#                     required by wasm-bindgen-rayon
# - mutable-globals → TLS support in rayon's worker threads
#
# These features only become runtime-usable when the page is
# crossOriginIsolated (COOP: same-origin + COEP: require-corp). Without
# those headers the JS wrapper skips `initThreadPool` and the pipeline
# continues to run single-threaded.
[target.wasm32-unknown-unknown]
# - atomics/bulk-memory/mutable-globals: see above.
# - --max-memory=4GiB: the pipeline allocates hundreds of megabytes of
#   zero-initialized f32 buffers while demosaic + DCP + tone + dehaze +
#   sharpen + NR run in sequence. With the default 2 GiB cap a ~22 MP RAW
#   triggers `handle_alloc_error` → `abort_internal`, which lowers to an
#   unreachable WASM trap. 4 GiB is the wasm32 hard ceiling — there is no
#   further headroom — and even it does NOT fit a full-native-res develop of
#   large sensors (#2661: 5.8 GB measured peak at 50 MP, 9.2 GB at 100 MP).
#   `src/cpu_budget.rs` clamps every CPU render entry so a develop stays
#   inside this ceiling; re-derive its constants with the
#   `raw-core mem-probe` example when the stage set changes.
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
    "-C", "link-arg=--max-memory=4294967296",
]
