[package]
name = "raw-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rawler.workspace = true
image.workspace = true
png.workspace = true
miniz_oxide.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
exr = { version = "1.73", optional = true }
# GPU resource core (epic #925), feature-gated and OFF by default. All GPU code
# (wgpu/WGSL/runner) lives in the `raw-gpu` crate; raw-core only pulls it in when
# the `gpu` feature is enabled, so default + CI-without-GPU builds stay unchanged
# and wgpu is absent from the default dependency tree.
raw-gpu = { path = "../raw-gpu", optional = true }
rayon = { workspace = true }
blake3 = "1"
sha1 = "0.10"
# Used by `types::local_adjustment` for the Slice 1 XMP wire format (compact
# JSON in a single `papp:LocalAdjustments` attribute). When that converts to
# canonical `crs:GradientBasedCorrections` nested-RDF in a follow-up, this
# dep can move back to `[dev-dependencies]` or drop entirely.
serde_json.workspace = true

[dev-dependencies]
serde.workspace = true
tempfile = "3"
clap = { workspace = true }

[features]
# Opt-in integration tests that shell out to compare_images.py.
golden = []
high-quality-demosaic = []
# Test-only DNG synthesis helpers. NEVER enable in shipping artifacts.
test-support = []
# Gates fixture-dependent tests under `test-fixtures/{raws,references}/`
# (repo-root, gitignored). WITHOUT the feature those tests are visibly
# `ignored`; WITH `--features fixtures` they run and a MISSING fixture
# panics (fail-closed, #1082 — see `test_support::fixtures`). Enable on
# fixture-provisioned machines only. Build-time only; no runtime impact.
fixtures = []
# When enabled, raw-core writes one OpenEXR file per pipeline stage to the
# directory named by the MAPLE_STAGE_DUMP env var (no-op when the env var is
# unset). Used by src/scripts/stage_diff.py to localize divergence to a
# specific stage. Adds ~2 MB to the binary; do NOT enable in shipping
# artifacts.
stage-dump = ["dep:exr"]
# Epic #925: pull in the headless GPU resource core (`raw-gpu`). OFF by default
# — enable with `--features gpu`. Build-time only; no default impact.
gpu = ["dep:raw-gpu"]
# Pulls in the `image` crate's AVIF codec (pure-Rust `ravif`/`rav1e`, no C
# toolchain) for the thumbnail encoder. OFF by default so raw-wasm — which
# only ever needs raw-core's JPEG/decode path — never pulls ravif/rav1e into
# the wasm32 build; raw-ffi and maple-pano opt in explicitly since they're
# the only real consumers of `raw_core::avif::encode`.
avif = ["image/avif"]

[[example]]
name = "synth-grey"
required-features = ["test-support"]

[[example]]
name = "synth-chart"
required-features = ["test-support"]

[[example]]
name = "extract-dcp"
required-features = ["test-support"]
