<div class="mx-auto max-w-[960px] px-8 pt-6 pb-12">
  <header class="mb-6 flex items-center gap-4">
    <a
      class="text-[12px] text-text-muted no-underline hover:text-text-main hover:underline"
      routerLink="/browse"
      >&larr; Back to Browse</a
    >
    <h2 class="m-0 flex-1 text-[22px] font-semibold tracking-[-0.01em]">Settings</h2>
  </header>

  <p class="mb-6 text-[13px] leading-relaxed text-text-muted">
    Configure your account, the library indexer, and the enrichment workers
    that geocode, caption, and tag your photos.
  </p>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    @for (card of cards(); track card.link) {
      <a
        [routerLink]="card.link"
        class="group flex flex-col rounded-lg border border-border bg-surface p-5 no-underline transition-colors duration-[120ms] hover:border-text-muted hover:bg-surface-hover"
      >
        <div class="mb-3 flex items-start justify-between gap-2">
          <maple-material-icon
            [name]="card.icon"
            [size]="32"
            color="var(--color-text-main)"
          />
          @if (card.ownerOnly) {
            <span
              class="rounded-full bg-surface-hover px-2 py-0.5 text-[10px] font-medium uppercase tracking-wide text-text-muted"
            >Owner</span>
          }
        </div>
        <h3 class="mb-1 text-[14px] font-semibold text-text-main">{{ card.title }}</h3>
        <p class="m-0 text-[12px] leading-relaxed text-text-muted">{{ card.description }}</p>
      </a>
    }
  </div>
</div>
