<div
  class="flex h-full w-6 flex-shrink-0 flex-col items-stretch overflow-hidden border-l-[0.5px] border-border bg-surface py-2"
>
  @for (c of cells(); track trackCell($index, c)) {
    @if (c.newYearStart) {
      <div class="my-1 mx-1 h-px bg-border"></div>
    }
    <button
      type="button"
      class="scrubber-cell relative my-px mx-1 cursor-pointer rounded-sm bg-surface-hover transition-colors duration-[120ms] hover:bg-primary"
      [style.height.px]="c.size"
      [attr.aria-label]="monthLabel(c.month) + ' ' + c.year + ', ' + c.count + ' photos'"
      [title]="monthLabel(c.month) + ' ' + c.year + ' · ' + c.count + ' photos'"
      (click)="onClick(c)"
    ></button>
  }
</div>
