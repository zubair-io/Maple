<div class="mui-film-panel">
  @if (categories().length > 0) {
    <mui-chip-row [chips]="categories()" mode="select" [(selectedId)]="activeCategoryId" />
  }
  @if (looks().length === 0) {
    <mui-empty-state icon="photos" title="No looks available" />
  } @else {
    <div class="grid">
      @for (look of visibleLooks(); track look.id) {
        <div
          class="look-cell"
          [class.is-selected]="selectedLookId() === look.id"
          (dblclick)="applyLook(look.id)"
        >
          <mui-card
            [src]="look.src"
            [alt]="look.name"
            [title]="look.name"
            (pressed)="selectLook(look.id)"
          />
        </div>
      }
    </div>
    @if (selectedLookId()) {
      <mui-living-slider
        label="Strength"
        [(value)]="strength"
        [min]="0"
        [max]="100"
        unit="%"
        (resetRequest)="strength.set(100)"
      />
    }
  }
</div>
