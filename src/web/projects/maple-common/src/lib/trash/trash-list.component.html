<app-trash-status-banner
  [toast]="toast()"
  [loadError]="loadError()"
  (dismissToast)="dismissToast.emit()"
/>

<div class="min-h-[80px] flex-1 overflow-y-auto" role="list">
  @if (!loading() && items().length === 0 && !loadError()) {
    <div class="p-[32px_16px] text-center text-[12px] text-text-muted">Trash is empty.</div>
  }
  @for (item of items(); track item.assetId) {
    <app-trash-item-row
      [item]="item"
      [busy]="isRowBusy(item.assetId)"
      (restore)="restore.emit(item)"
      (deletePermanently)="deletePermanently.emit(item)"
    />
  }
</div>

@if (loading()) {
  <div class="p-[12px_16px] text-center text-[11px] text-text-muted" role="status">Loading…</div>
}
@if (nextCursor() && !loading()) {
  <mui-button
    variant="secondary"
    size="sm"
    (pressed)="loadMore.emit()"
    class="mx-4 mt-2 mb-3 self-center"
  >
    Load more
  </mui-button>
}
