[package]
name = "raw-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rawler.workspace = true
image.workspace = true
png.workspace = true
miniz_oxide.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
exr = { version = "1.73", optional = true }
# GPU spike (epic #925), feature-gated and OFF by default. Pulls in wgpu only
# when the `gpu` feature is enabled, so default + CI-without-GPU builds are
# unchanged. naga (WGSL→MSL/SPIR-V) is bundled inside wgpu.
wgpu = { version = "23", optional = true }
pollster = { version = "0.4", optional = true }
futures-channel = { version = "0.3", optional = true }
rayon = { workspace = true }
blake3 = "1"
sha1 = "0.10"
# Used by `types::local_adjustment` for the Slice 1 XMP wire format (compact
# JSON in a single `papp:LocalAdjustments` attribute). When that converts to
# canonical `crs:GradientBasedCorrections` nested-RDF in a follow-up, this
# dep can move back to `[dev-dependencies]` or drop entirely.
serde_json.workspace = true

[dev-dependencies]
serde.workspace = true
tempfile = "3"
clap = { workspace = true }

[features]
# Opt-in integration tests that shell out to compare_images.py.
golden = []
high-quality-demosaic = []
# Test-only DNG synthesis helpers. NEVER enable in shipping artifacts.
test-support = []
# Gates fixture-dependent tests under `test-fixtures/raws/` (repo-root). The
# RAWs are gitignored, so the gated tests skip-pass in environments without
# them. Enable with `--features fixtures` when fixtures are present locally.
# Build-time only; no runtime impact.
fixtures = []
# When enabled, raw-core writes one OpenEXR file per pipeline stage to the
# directory named by the MAPLE_STAGE_DUMP env var (no-op when the env var is
# unset). Used by src/scripts/stage_diff.py to localize divergence to a
# specific stage. Adds ~2 MB to the binary; do NOT enable in shipping
# artifacts.
stage-dump = ["dep:exr"]
# Epic #925 P0 spike: WGSL exposure kernel + native wgpu parity test. OFF by
# default — enable with `--features gpu`. Build-time only; no default impact.
gpu = ["dep:wgpu", "dep:pollster", "dep:futures-channel"]

[[example]]
name = "synth-grey"
required-features = ["test-support"]

[[example]]
name = "extract-dcp"
required-features = ["test-support"]
