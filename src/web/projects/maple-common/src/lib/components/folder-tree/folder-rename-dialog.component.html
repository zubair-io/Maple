<div
  class="dlg-backdrop"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'Rename ' + currentName()"
  (click)="onBackdropClick()"
  (keydown.escape)="onCancel()"
>
  <div class="dlg-card frn-card max-w-[360px]" (click)="$event.stopPropagation()">
    <div class="dlg-header">
      <span class="dlg-title">Rename Folder</span>
    </div>

    <div class="flex flex-col gap-2 p-4">
      <input
        #nameInput
        type="text"
        class="dlg-input frn-input"
        placeholder="Name"
        [value]="name()"
        [attr.aria-label]="'Folder name'"
        (input)="onNameInput($any($event.target).value)"
        (keydown.enter)="onSubmit()"
        [attr.aria-invalid]="!isValid() ? 'true' : null"
      />
      @if (validationMessage(); as msg) {
        <p class="frn-error m-0 text-[11px] text-error-text">{{ msg }}</p>
      }
      @if (serverError(); as err) {
        <p class="frn-error m-0 text-[11px] text-error-text">{{ err }}</p>
      }
    </div>

    <div class="flex justify-end gap-2 border-t-[0.5px] border-border px-4 py-3">
      <mui-button variant="ghost" [disabled]="busy()" (pressed)="onCancel()">Cancel</mui-button>
      <mui-button variant="primary" [disabled]="!isValid() || busy()" (pressed)="onSubmit()">
        {{ busy() ? 'Renaming…' : 'Rename' }}
      </mui-button>
    </div>
  </div>
</div>
