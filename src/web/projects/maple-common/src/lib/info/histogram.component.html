@if (polylines(); as p) {
  <!-- Live histogram — three overlaid line plots, one per channel. -->
  <svg
    class="curves live"
    viewBox="0 0 256 100"
    preserveAspectRatio="none"
    aria-label="RGB histogram"
    role="img"
  >
    <polyline [attr.points]="p.r" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.7" />
    <polyline [attr.points]="p.g" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.7" />
    <polyline [attr.points]="p.b" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.7" />
  </svg>
} @else {
  <div class="placeholder" aria-label="Histogram preview unavailable">
    <svg class="curves" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
      <!--
        Decorative Gaussian bumps shown during the fetch + on error so
        the layout reserves the same vertical space the live curves
        will occupy. Replaced wholesale once the histogram arrives.
      -->
      <path d="M0,40 Q20,8 40,40 Z" fill="#ef4444" />
      <path d="M0,40 Q50,4 100,40 Z" fill="#22c55e" />
      <path d="M0,40 Q80,16 100,40 Z" fill="#3b82f6" />
    </svg>
    <span class="label">Histogram</span>
  </div>
}
