# .github/workflows/raw-pipeline.yml
#
# Color-parity gate for the Rust raw pipeline. Per CLAUDE.md §
# "Objective color testing — no eyeballing": every color-pipeline
# change must pass src/scripts/test_color_pipeline.sh against the
# committed test-fixtures/budgets.json (which is a one-way ratchet).
#
# This workflow exists because the rule was previously enforced only
# on the local laptop of whoever ran the harness before merging — see
# test-fixtures/BUDGETS_DRIFT.md for the resulting drift on main.
#
# Fixtures: test-fixtures/raws/ and test-fixtures/references/ are
# gitignored (6.5 GB). The harness skip-passes at preflight when its
# manifest or budgets file is missing (src/scripts/test_color_pipeline.sh
# preflight section); a missing raws/ directory is *not* checked by the
# script directly — with manifest + budgets present but RAWs absent the
# script now FAILS CLOSED via its compared==0 gate (#1082) rather than
# green-no-opping. To keep the workflow robust against partial-fixture
# states, the probe below treats raws/ AND manifest as load-bearing, and
# the skip-pass branch points the script at a synthetic non-existent
# manifest so it unconditionally takes its preflight exit. The job is
# therefore a no-op on stock runners; it becomes meaningful on a
# self-hosted runner (or any environment) where fixtures have been
# provisioned. Fixture provisioning is tracked separately.

name: raw-pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/raw-pipeline/**'
      - 'test-fixtures/budgets.json'
      - 'test-fixtures/pano-budgets.json'
      - 'src/scripts/test_color_pipeline.sh'
      - 'src/scripts/compare_images.py'
      - 'src/scripts/test_pano_pipeline.sh'
      - 'src/scripts/pano_metrics.py'
      - 'src/scripts/test_synthetic_grey.sh'
      - 'src/scripts/test_synthetic_color_chart.sh'
      - 'src/scripts/test_grey_adjustments.sh'
      - 'src/scripts/test_grey_dcp.sh'
      - 'src/scripts/test_banding.sh'
      - 'src/scripts/banding_check.py'
      - 'src/scripts/banding_check_test.py'
      - 'test-fixtures/banding_budgets.json'
      - '.github/workflows/raw-pipeline.yml'
  pull_request:
    paths:
      - 'src/raw-pipeline/**'
      - 'test-fixtures/budgets.json'
      - 'test-fixtures/pano-budgets.json'
      - 'src/scripts/test_color_pipeline.sh'
      - 'src/scripts/compare_images.py'
      - 'src/scripts/test_pano_pipeline.sh'
      - 'src/scripts/pano_metrics.py'
      - 'src/scripts/test_synthetic_grey.sh'
      - 'src/scripts/test_synthetic_color_chart.sh'
      - 'src/scripts/test_grey_adjustments.sh'
      - 'src/scripts/test_grey_dcp.sh'
      - 'src/scripts/test_banding.sh'
      - 'src/scripts/banding_check.py'
      - 'src/scripts/banding_check_test.py'
      - 'test-fixtures/banding_budgets.json'
      - '.github/workflows/raw-pipeline.yml'

concurrency:
  group: raw-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap, unconditional compile gate for the Apple FFI crate. This does NOT
  # need fixtures or the color harness — it exists to catch the "raw-ffi
  # doesn't compile against raw-core" failure class (e.g. an unresolved
  # import after a raw-core API change), which is one of the two ways #876's
  # device build broke. It runs on the host target on a Linux runner; that's
  # sufficient because a compile error in raw-ffi is platform-independent.
  #
  # NOTE: this CANNOT catch per-slice symbol *staleness* in the committed
  # xcframework — that requires building the Apple target slices, which needs
  # a macOS runner (this repo's CI is Linux-only). That class is guarded
  # locally instead: build-xcframework.sh runs a symbol-consistency check
  # after assembling the xcframework (see src/apple/scripts/build-xcframework.sh).
  build-raw-ffi:
    name: build-raw-ffi (host compile gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-ffi-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: cargo build -p raw-ffi
        working-directory: src/raw-pipeline
        run: cargo build -p raw-ffi
      # Scoped fmt gate (#1247): raw-ffi files are now rustfmt-canonical; this
      # step ensures they stay that way so future `cargo fmt` runs are no-ops
      # and don't bloat files or trip the file-budget gate again. NOT a
      # workspace-wide check — raw-core and other crates remain non-canonical.
      - name: cargo fmt --check -p raw-ffi
        working-directory: src/raw-pipeline
        run: cargo fmt --check -p raw-ffi
      # Pano feature compile gate (#1259): `--features pano` pulls maple-pano
      # with its ML stack; this is the only always-on CI step that compiles
      # maple-cli with that feature. The gate is compile-only — no tests, no
      # fixtures. It prevents the class of breakage that occurred in #1253
      # (StitchOptions field added without updating the maple-cli construction
      # site), which was invisible to CI until #1258 fixed it.
      - name: cargo build --bin maple-cli --features pano (compile gate)
        working-directory: src/raw-pipeline
        run: cargo build --bin maple-cli --features pano

  # Fixture-free Rust test gate (#1082). Before this job, NO CI executed
  # `cargo test` anywhere — the ~750 raw-core lib tests ran only on laptops.
  # Everything here runs on a stock Linux runner with no fixtures:
  #   * `cargo test -p raw-core --features test-support` — lib + integration
  #     targets. Fixture-dependent tests are `#[cfg_attr(not(feature =
  #     "fixtures"), ignore)]`, so they are *visibly* ignored here (and fail
  #     closed — panic on a missing fixture — when `--features fixtures` is
  #     enabled on a fixture-provisioned machine).
  #   * The three grey gates (synthetic in-memory DNGs, never skip):
  #     test_synthetic_grey.sh, test_grey_adjustments.sh, test_grey_dcp.sh.
  #     They re-run their `--test` targets with `--nocapture` so the
  #     per-predictor tables land in the CI log; the compile cache is shared
  #     with the cargo-test step, so the duplication costs seconds.
  rust-tests:
    name: rust-tests (cargo test -p raw-core + grey gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # banding_check.py (#1627) needs numpy + an EXR reader (OpenEXR
      # preferred, imageio fallback) — a strict subset of
      # src/scripts/requirements.txt, installed here rather than the full
      # file so this job doesn't pick up colour-science/scipy/tifffile it
      # doesn't use.
      - name: Install Python deps for the banding gate
        run: pip install 'numpy>=1.26' 'OpenEXR>=3.2' 'imageio>=2.34'
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: rust-tests-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: cargo test -p raw-core (fixture-free)
        working-directory: src/raw-pipeline
        run: cargo test -p raw-core --features test-support
      - name: Synthetic grey gate (test_synthetic_grey.sh)
        run: bash src/scripts/test_synthetic_grey.sh
      - name: Synthetic color-chart gate (test_synthetic_color_chart.sh)
        run: bash src/scripts/test_synthetic_color_chart.sh
      - name: Grey adjustments gate (test_grey_adjustments.sh)
        run: bash src/scripts/test_grey_adjustments.sh
      - name: Grey DCP gate (test_grey_dcp.sh)
        run: bash src/scripts/test_grey_dcp.sh
      - name: banding_check.py unit tests
        run: python3 src/scripts/banding_check_test.py
      - name: Banding second-difference gate (test_banding.sh, #1627/#1733)
        run: bash src/scripts/test_banding.sh

  color-pipeline:
    name: color-pipeline (test_color_pipeline.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Probe for fixtures up front so the rest of the job (Rust
      # toolchain install, cargo build) can be skipped on stock
      # runners. The harness itself also skip-passes, but doing the
      # check here saves ~3 minutes of toolchain setup per PR.
      - name: Probe fixtures
        id: probe
        run: |
          if [ -d test-fixtures/raws ] && [ -f test-fixtures/references/manifest.json ]; then
            echo "have_fixtures=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_fixtures=false" >> "$GITHUB_OUTPUT"
            echo "::notice::test-fixtures/raws or references/manifest.json not present — color-pipeline gate is a no-op on this runner. See test-fixtures/BUDGETS_DRIFT.md."
          fi

      - uses: actions/setup-python@v5
        if: steps.probe.outputs.have_fixtures == 'true'
        with:
          python-version: '3.12'

      - name: Install Python diff deps
        if: steps.probe.outputs.have_fixtures == 'true'
        run: pip install -r src/scripts/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.have_fixtures == 'true'

      - name: Cache cargo registry + raw-pipeline target
        if: steps.probe.outputs.have_fixtures == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-pipeline-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Run color-pipeline harness
        if: steps.probe.outputs.have_fixtures == 'true'
        run: bash src/scripts/test_color_pipeline.sh

      # Soft-pass branch: still invoke the script so its own skip-pass
      # message lands in the log (helps a self-hosted-runner debugger
      # confirm the path the gate took). We override MANIFEST to a path
      # that cannot exist so the script unconditionally takes its
      # manifest-missing preflight exit — guarding against the
      # partial-fixture case where references/manifest.json is present
      # but raws/ isn't, which would otherwise let the script proceed
      # into cargo build with no Rust toolchain installed.
      - name: Run color-pipeline harness (skip-pass)
        if: steps.probe.outputs.have_fixtures == 'false'
        env:
          MANIFEST: /nonexistent/test-fixtures-not-provisioned.json
        run: bash src/scripts/test_color_pipeline.sh

  # Pano regression harness (Maple Pano M0b, #1120). Mirrors the
  # color-pipeline job: fixture probe up front, the harness itself
  # skip-passes without the gitignored corpus (test-fixtures/raws/pano_*/
  # + references/<set>/<set>.png), and the per-set ceilings in the tracked
  # test-fixtures/pano-budgets.json are a one-way ratchet.
  #
  # Two deliberate differences from the color job:
  #   * Python deps (numpy + Pillow) install on BOTH branches because the
  #     harness's always-on validation — pano_metrics.py --self-test — runs
  #     procedurally even without fixtures, so this job gates the metric
  #     implementation on every PR that touches it.
  #   * The Rust toolchain is only provisioned when fixtures exist: that is
  #     the only path on which the harness builds maple-cli (to probe for
  #     the `pano stitch` candidate generator, which does not exist yet —
  #     the harness prints "candidate generator not available" and exits 0
  #     until Maple Pano M1+ lands the subcommand).
  pano-pipeline:
    name: pano-pipeline (test_pano_pipeline.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe fixtures
        id: probe
        run: |
          if ls -d test-fixtures/raws/pano_*/ >/dev/null 2>&1; then
            echo "have_fixtures=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_fixtures=false" >> "$GITHUB_OUTPUT"
            echo "::notice::test-fixtures/raws/pano_* not present — pano candidate gates are a no-op on this runner; the metrics self-test still runs."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The pano metric tool deliberately needs only numpy + Pillow (a
      # subset of src/scripts/requirements.txt) — keep this install tight
      # so the fixture-less self-test branch stays fast.
      - name: Install Python metric deps
        run: pip install 'numpy>=1.26' 'Pillow>=10'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.have_fixtures == 'true'

      - name: Cache cargo registry + raw-pipeline target
        if: steps.probe.outputs.have_fixtures == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-pipeline-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      # One step for both branches: the harness's own discovery decides
      # whether the candidate phase runs (no fixtures → self-test + budgets
      # validation, then an explicit skip-pass with exit 0).
      - name: Run pano-pipeline harness
        run: bash src/scripts/test_pano_pipeline.sh
