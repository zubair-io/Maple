# .github/workflows/release.yml
#
# Signed release binaries for the Mac and Windows apps.
#
# Deliberately NOT wired to pushes on main: merging is not releasing. A
# release happens when a `v*` tag is pushed (e.g. `git tag v0.1.0 && git
# push origin v0.1.0`), which builds, signs, and publishes to a GitHub
# Release. `workflow_dispatch` runs the same build for a dry run —
# artifacts land on the workflow run, but no Release is created.
#
# macOS job re-enabled (#3332). The ~27-minute silent Archive death was
# root-caused on a real Mac: the archive itself is fine (an unsigned
# archive of the same scheme succeeds in 17m41s, peak swift-frontend RSS
# 2.04 GB), and a SIGNED archive fails in 36 seconds inside
# MapleFileProvider because its provisioning profile does not carry the
# Push Notifications capability that #3240's aps-environment entitlement
# requires (#3244). Provisioning runs concurrently with compilation, so
# the last log line before the death is whatever was compiling, not what
# failed. This job stays red until both File Provider App IDs carry that
# capability in the developer portal — an owner action.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Keep in sync with apple.yml / src/apple/ci_scripts/ci_post_clone.sh.
env:
  CBINDGEN_VERSION: '0.29.2'

jobs:
  macos-app:
    name: macOS (build, sign, notarize)
    # Disabled — see the header comment and #3332 for why and how to
    # re-enable once the ~27-minute Archive death is root-caused on a
    # real Mac.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Signing material first, before the ~40-minute Rust cross-build: a
      # missing/bad secret fails the job in seconds, not after the expensive
      # part (macOS runner minutes bill at 10x). Every secret the later
      # steps consume is validated here, not just the ones this step uses.
      - name: Validate macOS signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for v in APPLE_TEAM_ID MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD \
                   APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — cannot sign/notarize. See the header comment in release.yml."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          # openssl rather than base64(1): flag spelling for decode differs
          # across BSD/GNU base64 builds, openssl is invariant.
          printf '%s' "$MACOS_CERT_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Stage App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Select newest Xcode
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "XCODE_APP=$XCODE_APP" >> "$GITHUB_ENV"

      # A universal (x86_64 + arm64) archive of the full app + extensions,
      # on top of the four-slice xcframework built two steps down, is a lot
      # of DerivedData/module-cache. GitHub's macOS image ships several
      # Xcode versions (several GB each); freeing every one but the version
      # we actually use reclaims real headroom without touching anything
      # the build depends on.
      # NOTE: do NOT delete other /Applications/Xcode_*.app bundles here.
      # Proven to break the build (2026-09-04): GitHub's macOS image shares
      # SDK content across its bundled Xcode versions, and removing the
      # "other" ones broke `xcrun --sdk iphoneos` for the one we kept —
      # this xcframework build compiles iOS slices too, not just macOS
      # (see build-xcframework.sh's target list).
      #
      # The Android SDK GitHub preinstalls is unrelated to anything here
      # and safe to drop. Beyond that, don't guess again: these df -h
      # checkpoints (plus the one before Archive, further down) are the
      # data the next iteration should act on instead of another blind
      # deletion.
      - name: Reclaim disk (Android SDK) + usage checkpoint
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Android/sdk
          df -h /
          du -sh /Library/Developer/CoreSimulator 2>/dev/null || true

      - name: Install Rust toolchain (Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/raw-pipeline -> target

      - name: Cache cbindgen binary
        id: cbindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ env.CBINDGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --locked --version "$CBINDGEN_VERSION"

      # Same recipe as Xcode Cloud's ci_post_clone.sh: real static libs for
      # every slice (the ORT iOS dep is vendored in-repo, so this is
      # self-contained). Release profile is the script default.
      - name: Build RawPipeline.xcframework (release)
        run: ./src/apple/scripts/build-xcframework.sh

      - name: Disk usage before archive
        run: df -h /

      # Confirmed 2026-09-04 via a vm_stat sampler: a single-invocation
      # universal (arm64+x86_64) archive was dying from real memory
      # exhaustion (~138MB free at death, on a runner with ~6-7GB total
      # RAM) — not disk (ruled out, 53GB free right before Archive) and
      # not a normal build failure (no compiler error, no
      # "** ARCHIVE FAILED **" banner). Two architectures' worth of
      # compiling+linking a large dependency tree (GRDB, swift-otel,
      # NIO/gRPC) in one process exceeded the runner's memory regardless
      # of Swift compilation mode (#3326's SWIFT_COMPILATION_MODE=
      # singlefile override reduced compile-time pressure but the build
      # still died at almost exactly the same elapsed time, pointing at
      # a resource cost that override doesn't touch).
      #
      # Fix: archive each architecture separately (half the memory
      # footprint each time, at the project's normal wholemodule
      # optimization — no need for the singlefile tradeoff once only one
      # arch is in play), then lipo-merge the two into one universal
      # .xcarchive. merge-universal-archive.sh deliberately does no
      # re-signing — the "Export with Developer ID" step below already
      # performs a full codesigning pass over the merged tree.
      - name: Archive (arm64)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          (while true; do
            { date; vm_stat | grep -E "Pages free|Pages occupied by compressor";
              ps -Ao rss,comm | sort -rn | head -4; echo; } >> "$RUNNER_TEMP/memlog-arm64.txt"
            sleep 5
          done) &
          MEMLOG_PID=$!

          set +e
          xcodebuild -project src/apple/Maple.xcodeproj \
            -scheme "Maple Exposure" \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Maple-arm64.xcarchive" \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -jobs 1 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=singlefile
          STATUS=$?
          kill "$MEMLOG_PID" 2>/dev/null
          exit $STATUS

      - name: Archive (x86_64)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          (while true; do
            { date; vm_stat | grep -E "Pages free|Pages occupied by compressor";
              ps -Ao rss,comm | sort -rn | head -4; echo; } >> "$RUNNER_TEMP/memlog-x86_64.txt"
            sleep 5
          done) &
          MEMLOG_PID=$!

          set +e
          xcodebuild -project src/apple/Maple.xcodeproj \
            -scheme "Maple Exposure" \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Maple-x86_64.xcarchive" \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            -jobs 1 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=singlefile
          STATUS=$?
          kill "$MEMLOG_PID" 2>/dev/null
          exit $STATUS

      - name: Merge into universal archive
        run: |
          ./src/apple/scripts/merge-universal-archive.sh \
            "$RUNNER_TEMP/Maple-arm64.xcarchive" \
            "$RUNNER_TEMP/Maple-x86_64.xcarchive" \
            "$RUNNER_TEMP/Maple.xcarchive"

      - name: Upload memory logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-memlogs
          path: |
            ${{ runner.temp }}/memlog-arm64.txt
            ${{ runner.temp }}/memlog-x86_64.txt
          if-no-files-found: ignore

      # developer-id export re-signs the archive with the Developer ID
      # Application identity imported above; -allowProvisioningUpdates lets
      # Xcode mint Developer ID provisioning profiles for the app +
      # embedded extensions (File Provider, QuickLook).
      - name: Export with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Maple.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Notarize and staple
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.app' | head -1)"
          echo "Notarizing $APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPSTORE_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::8}"
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/out/Maple-macOS-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error

  windows-app:
    name: Windows x64 (build, sign)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/raw-pipeline -> target

      # No --target flag: the csproj bundles raw_ffi.dll + maple-cli.exe
      # from target/release/ (not the triple-suffixed dir).
      - name: Build native core (raw_ffi.dll + maple-cli.exe)
        run: |
          cargo build --release --manifest-path src/raw-pipeline/Cargo.toml -p raw-ffi --features gpu
          cargo build --release --manifest-path src/raw-pipeline/Cargo.toml -p maple-cli --features pano

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish WinUI app (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/windows/Maple.WinUI/Maple.WinUI.csproj `
            -c Release -r win-x64 --self-contained `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      # Stage only OUR binaries for signing — the runtime/framework DLLs in
      # the publish folder are already Microsoft-signed, and Trusted Signing
      # signs a whole folder.
      - name: Stage binaries for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory signing | Out-Null
          foreach ($f in 'Maple.WinUI.exe', 'raw_ffi.dll', 'maple-cli.exe') {
            if (-not (Test-Path "publish\$f")) { throw "$f missing from publish output" }
            Copy-Item "publish\$f" signing\
          }

      - name: Sign binaries (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\signing
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Fold signed binaries back into publish
        shell: pwsh
        run: |
          Copy-Item signing\* publish\ -Force
          $sig = Get-AuthenticodeSignature publish\Maple.WinUI.exe
          if ($sig.Status -ne 'Valid') { throw "Maple.WinUI.exe signature is $($sig.Status)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DPublishDir="$env:GITHUB_WORKSPACE\publish" `
            /DOutputDir="$env:GITHUB_WORKSPACE\installer-out" `
            src\windows\installer\maple.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Sign installer (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\installer-out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Portable zip alongside the installer, from the same signed payload
      # (the shim rides along so PATH-less use still has bin\maple.cmd).
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item installer-out\*.exe out\
          New-Item -ItemType Directory publish\bin -Force | Out-Null
          Copy-Item src\windows\installer\maple.cmd publish\bin\maple.cmd
          Compress-Archive -Path publish\* -DestinationPath "out\Maple-Windows-x64-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: out/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    # Dry runs (workflow_dispatch) stop at artifacts — no Release.
    # needs windows-app only while macos-app is disabled (see header
    # comment) — a skipped job in `needs` would otherwise skip this too.
    if: github.ref_type == 'tag'
    needs: [macos-app, windows-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE_FLAG="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Maple $GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG \
            dist/*
