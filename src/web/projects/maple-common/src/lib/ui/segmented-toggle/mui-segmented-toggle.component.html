<div [class]="trackClasses()">
  <div
    class="indicator absolute top-[3px] bottom-[3px] left-[3px] rounded-sm bg-surface-hover shadow-[0_1px_2px_rgba(0,0,0,0.24)] transition-[transform_120ms_ease-in-out]"
    [style.width.%]="100 / options().length"
    [style.transform]="'translateX(' + selectedIndex() * 100 + '%)'"
  ></div>
  @for (option of options(); track option.value) {
    <button
      type="button"
      [class]="segmentClasses(option.value)"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [disabled]="disabled()"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
