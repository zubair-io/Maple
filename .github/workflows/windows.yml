name: windows

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-build-and-test:
    name: windows-x64 (MSVC build + rust tests + color parity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/raw-pipeline -> target
            src/windows -> target

      - name: Build raw-core & raw-ffi on Windows
        # raw-ffi is a real release build, not a check: the cdylib it
        # produces (src/raw-pipeline/target/release/raw_ffi.dll — the path
        # Maple.WinUI.csproj bundles from) is what the WinUI test suite's
        # struct-layout gate (#3221, RawFfiLayoutTests) loads below.
        run: |
          cargo check --manifest-path src/raw-pipeline/Cargo.toml --target x86_64-pc-windows-msvc -p raw-core
          cargo build --manifest-path src/raw-pipeline/Cargo.toml --release -p raw-ffi --features gpu

      - name: Run raw-core Unit Tests on Windows
        run: |
          cargo test --manifest-path src/raw-pipeline/Cargo.toml -p raw-core --lib

      - name: Build Windows Native App
        run: |
          cargo build --manifest-path src/windows/Cargo.toml --release

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build WinUI 3 Native C# Application
        run: |
          dotnet build src/windows/Maple.WinUI/Maple.WinUI.csproj -c Release -r win-x64

      - name: Run WinUI XMP Sidecar Tests + raw-ffi struct-layout gate
        # MAPLE_RAW_FFI_DLL arms RawFfiLayoutTests (#3221): every C# mirror
        # of a raw-ffi #[repr(C)] struct is checked field-for-field against
        # the DLL built above. Unset, those tests skip-pass (local dev
        # without a Rust build); set and missing, they FAIL.
        env:
          MAPLE_RAW_FFI_DLL: ${{ github.workspace }}\src\raw-pipeline\target\release\raw_ffi.dll
        run: |
          dotnet test src/windows/Maple.WinUI.Tests/Maple.WinUI.Tests.csproj -c Release

      - name: Verify Codegen Execution on Windows
        shell: bash
        run: |
          ./tools/codegen.sh
