# Jules PR Review
#
# `paths-ignore` (#2313): the reviewer's prompt-injection rule fires on
# first-party instruction files, because their whole purpose is text addressed
# to an agent. It blocked #2267 three times over one added bullet in CLAUDE.md —
# first for directive phrasing, then for two clauses about how much weight to
# give automated checks, and finally for the PR description's explanation that
# the earlier flag was a false positive. That last one leaves no in-band way to
# contest a bad verdict, since the reviewer only re-reviews on a new head SHA.
#
# Scope it off the files that are agent-directed by construction. This skips the
# review only when a PR touches NOTHING ELSE — a PR mixing CLAUDE.md with code
# still gets reviewed in full, so the false positive is narrowed, not closed.
# The real fix belongs upstream in the action's rule set.
name: Jules PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'CLAUDE.md'
      - 'AGENTS.md'

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 80
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify and build reviewer
        working-directory: .github/actions/jules-review
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build

      - name: Run Jules Reviewer
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: ./.github/actions/jules-review
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Large diffs (~120 KB+) routinely exceed the 30-minute default and fail
          # the required check with "did not return a review in time".
          timeout_minutes: 60
