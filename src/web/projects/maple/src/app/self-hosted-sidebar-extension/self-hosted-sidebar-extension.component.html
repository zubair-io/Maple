<button
  class="absolute -top-[27px] right-3 flex h-6 w-6 cursor-pointer items-center justify-center rounded-md border-none bg-transparent p-0 text-[18px] leading-none text-text-muted transition-[background,color] duration-[120ms] hover:bg-bg-hover hover:text-text-main"
  type="button"
  title="Add a folder to your library"
  (click)="state.openLibraryPicker()"
  aria-label="Add folder"
>
  +
</button>

<button
  type="button"
  class="tree-row mx-2 flex h-7 w-[calc(100%_-_16px)] cursor-pointer appearance-none items-center gap-1.5 rounded-md border-none bg-transparent pl-2 pr-3 text-left text-text-muted"
  [class.selected]="state.viewMode() === 'timeline'"
  (click)="state.setViewMode('timeline')"
>
  <maple-icon
    name="history"
    [size]="12"
    [color]="state.viewMode() === 'timeline' ? 'var(--color-primary)' : 'var(--color-text-muted)'"
  />
  <span class="flex-1 text-[10px] font-semibold uppercase tracking-[0.06em]">Timeline</span>
</button>
