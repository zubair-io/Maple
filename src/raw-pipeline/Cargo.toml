[workspace]
resolver = "2"
members = [
    "raw-core",
    "raw-gpu",
    "maple-cli",
    "maple-pano",
    "raw-ffi",
    "raw-wasm",
    "codegen",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "Proprietary"

[workspace.dependencies]
rawler = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
png = "0.17"
quick-xml = "0.37"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
# DEFLATE (zlib) for the v3 split DCP bundle's per-entry HSM compression
# (profile_loader::writer / parser). Pure-Rust, WASM-safe; 0.8.x is already
# in the lockfile transitively via `png`.
miniz_oxide = "0.8"
rayon = "1"
