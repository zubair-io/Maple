[workspace]
resolver = "2"
members = ["raw-core", "maple-cli", "raw-ffi", "raw-wasm", "pano-core"]

# bitarray 0.2.6 (published 2020) uses `#![feature(min_const_generics)]` which
# became stable in Rust 1.51 and is now an E0554 error on stable.  The vendored
# copy is byte-for-byte identical except that one attribute line is removed.
[patch.crates-io]
bitarray = { path = "vendor/bitarray" }

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "Proprietary"

[workspace.dependencies]
rawler = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
png = "0.17"
quick-xml = "0.37"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
