[package]
name = "raw-wasm-canvas"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Literal for the same wasm-pack manifest reason as raw-wasm (#984).
license = "Proprietary"

# The web main thread's canvas zoom module (#5714): raw-core's `canvas` source
# plus scalar wasm-bindgen exports, built without atomics so it carries none
# of the pipeline bundle's dependencies, size or shared memory.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
