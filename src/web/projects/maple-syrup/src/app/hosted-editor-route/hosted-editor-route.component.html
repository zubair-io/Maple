<editor-shell />
@if (notice(); as notice) {
  <mui-toast
    class="absolute top-[66px] left-1/2 z-[12] w-[min(520px,calc(100vw-24px))] -translate-x-1/2"
    surface="glass"
    variant="warning"
    [dismissible]="false"
    [autoDismissMs]="null"
    [ariaLabel]="notice.ariaLabel"
    [message]="notice.message"
    actionLabel="Download XMP"
    (actionPressed)="downloadXmp()"
  />
}
