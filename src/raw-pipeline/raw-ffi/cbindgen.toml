# cbindgen configuration for raw-ffi → RawPipeline.h.
#
# As of #1064 the Apple xcframework is always-gpu: scripts/build-xcframework.sh
# builds raw-ffi with `--features gpu` by default, so every slice's static lib
# contains the GPU FFI surface (`maple_gpu_*`, src/gpu.rs + src/gpu_live.rs).
# cbindgen therefore declares those symbols UNCONDITIONALLY — there is no longer a
# `feature = gpu` → `MAPLE_GPU` mapping wrapping them in `#if defined(MAPLE_GPU)`.
# (cbindgen parses source text regardless of the active Cargo feature set, so the
# symbols appear in the header either way; the prior [defines] entry only existed
# to hide them from the wgpu-free default build, which no longer exists.)
#
# The Apple-only present entries (`maple_gpu_present_chain` /
# `maple_gpu_present_test_pattern`) are `#[cfg(target_vendor = "apple")]` in Rust,
# so cbindgen wraps them in `#if defined(__APPLE__)` via the map below. __APPLE__
# is auto-defined by Clang on every Apple target (all xcframework slices + the
# macOS host), so the Clang module importer always sees them — the wrap just keeps
# the header honest about the Rust cfg.
language = "C"

[defines]
"target_vendor = apple" = "__APPLE__"
# Maps Rust `#[cfg(target_os = "ios")]` → `#if defined(TARGET_OS_IOS)` in the
# generated header. Used by `maple_pano_ort_selftest` (M6 #1244) so the iOS
# smoke-test FFI entry is declared only in the iOS-target header (not macOS).
# On macOS builds the preprocessor constant is undefined, so the declaration
# is excluded and no link error occurs.
"target_os = ios" = "TARGET_OS_IOS"
# Maps Rust `#[cfg(target_os = "windows")]` → `#if defined(_WIN32)` in the
# generated header. Used by `maple_gpu_present_chain_winui`
# (`gpu_live/present_winui.rs`, `mod present_winui;` in gpu_live.rs) so the
# WinUI3 swapchain-present FFI entry is declared only under a Windows
# toolchain. `_WIN32` is defined by MSVC/Windows Clang and is never defined by
# Apple Clang, so every Apple slice's view of the header excludes the
# declaration — this fixes #2678 (symbol guard failing because the header
# declared the symbol unconditionally with no Apple-side definition).
"target_os = windows" = "_WIN32"
