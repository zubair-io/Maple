<div class="knobs">
  <label>
    Collections per day
    <mui-input
      variant="numeric"
      [min]="1"
      [max]="12"
      [value]="numberToString(draft().collections_per_day)"
      ariaLabel="Collections per day"
      (committed)="patchNumber('collections_per_day', $event)"
    />
  </label>
  <label>
    Minimum photos
    <mui-input
      variant="numeric"
      [min]="1"
      [max]="1000"
      [value]="numberToString(draft().min_results)"
      ariaLabel="Minimum photos"
      (committed)="patchNumber('min_results', $event)"
    />
  </label>
  <label>
    Retry rounds
    <mui-input
      variant="numeric"
      [min]="1"
      [max]="10"
      [value]="numberToString(draft().max_rounds)"
      ariaLabel="Retry rounds"
      (committed)="patchNumber('max_rounds', $event)"
    />
  </label>
  <label>
    Keep for (days)
    <mui-input
      variant="numeric"
      [min]="1"
      [max]="365"
      [value]="numberToString(draft().retention_days)"
      ariaLabel="Keep for (days)"
      (committed)="patchNumber('retention_days', $event)"
    />
  </label>
  <label class="wide">
    Model
    <mui-input
      placeholder="inherit from describe stage"
      [value]="draft().model"
      ariaLabel="Model"
      (committed)="patch('model', $event)"
    />
  </label>
  <div class="toggle wide">
    <mui-checkbox
      label="Dry run — log what it would save, write nothing"
      [checked]="draft().dry_run"
      (checkedChange)="patch('dry_run', $event)"
    />
  </div>
</div>

<mui-button variant="primary" [loading]="saving()" (pressed)="save.emit()"> Save </mui-button>
