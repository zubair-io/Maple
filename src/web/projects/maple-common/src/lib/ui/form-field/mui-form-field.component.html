<div
  class="mui-form-field flex flex-col gap-1"
  [class.is-disabled]="disabled()"
  [class.opacity-60]="disabled()"
>
  <mui-text variant="tool-label" color="muted" [block]="true" class="label font-semibold">
    {{ label() }}{{ required() ? ' *' : '' }}
  </mui-text>
  <mui-input
    [variant]="variant()"
    [value]="value()"
    (valueChange)="value.set($event)"
    [placeholder]="placeholder()"
    [error]="error()"
    [disabled]="disabled()"
    [ariaLabel]="label()"
    (committed)="committed.emit($event)"
  />
  @if (help() && !error()) {
    <mui-text variant="body" color="muted" [block]="true" class="help">{{ help() }}</mui-text>
  }
</div>
