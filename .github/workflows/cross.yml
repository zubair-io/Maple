# .github/workflows/cross.yml
#
# Cross-cutting CI that runs on every PR and push to `main`. Per #114.
#
# Jobs:
#   * format-check          — Prettier --check on the tracked source tree.
#   * oxlint-api             — oxlint over src/api (correctness + fs-import guardrail).
#   * file-budget           — bash tools/check-file-budget.sh (LOC ceiling).
#   * budget-headroom       — PR-only; fails if the PR GROWS a changed source
#                             file past 570 LOC, so the cost of consuming the
#                             headroom below the 600 ceiling lands on the PR
#                             that spends it rather than the next one. Per #2311.
#   * allowlist-shrinks-only — PR-only; fails if tools/budget-allowlist.txt grows
#                             for a file extension that already had allowlist
#                             entries at the merge base (per-extension, not a
#                             flat count — #2747: a language gated for the
#                             first time is allowed to seed its day-0
#                             violators in one PR, same as every other
#                             language's entries were before this job existed;
#                             an already-gated extension stays fully
#                             append-forbidden).
#   * codegen-drift         — fails if generated cross-platform constants are stale.
#   * fallow-audit-web      — fallow audit (dead code / complexity / dupes) over
#                             src/web, scoped to files changed vs the merge base.
#                             Per #1829.
#   * fallow-audit-api      — same, over src/api (Bun/Elysia backend). Per #1829.
#   * gitleaks              — installed direct from GitHub releases; scans only
#                             the commits this PR/push introduces (#839).
#   * maple-ui-contracts    — component-contract docs have all required sections filled.
#
# Per-subsystem workflows (rust / swift / web / api) land **with** the first
# refactor commit of each subsystem, not preemptively — see #114.

name: cross

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on non-main refs (PRs, feature branches). Pushes to
# main always run to completion so the protected-branch signal stays accurate.
concurrency:
  group: cross-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format-check:
    name: format-check (prettier)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the merge base (PR) or previous push SHA so
          # we can diff to compute the changed-files list. Cheap on GH runners.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Scope prettier to files changed in this push / PR. The gate's purpose
      # is "don't regress formatting in new code" — whole-repo reformat is a
      # separate concern, tracked elsewhere.
      - name: Compute changed files
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # checkout@v4 above used fetch-depth: 0, so all history is local.
            # The explicit fetch makes sure refs/remotes/origin/<base> exists
            # (checkout fetches commits, not always named branch refs).
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            MERGE_BASE="$(git merge-base "origin/${BASE_REF}" HEAD)"
            git diff --name-only --diff-filter=ACMR "${MERGE_BASE}" HEAD > /tmp/changed.txt
          else
            # push to main: format only files touched in that push. Fall back
            # to HEAD~1..HEAD if `before` is unavailable (e.g. force-push,
            # branch-create, or initial commit where `before` is all-zeros).
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${BEFORE_SHA}" 2>/dev/null; then
              git diff --name-only --diff-filter=ACMR "${BEFORE_SHA}" "${AFTER_SHA}" > /tmp/changed.txt
            else
              git diff --name-only --diff-filter=ACMR HEAD~1 HEAD > /tmp/changed.txt
            fi
          fi
          # Filter to prettier-eligible extensions.
          grep -E '\.(ts|tsx|js|jsx|json|html|scss|css|md|yml|yaml)$' /tmp/changed.txt > /tmp/changed-pretty.txt || true
          # Exclude paths governed by other tooling / vendored.
          # src/raw-pipeline/vendor/ is `cargo vendor` output (upstream crate
          # sources, not our code) — same rationale as node_modules/.
          grep -v -E '^(test-fixtures/|node_modules/|.*/node_modules/|.*/dist/|src/raw-pipeline/vendor/)' /tmp/changed-pretty.txt > /tmp/check.txt || true
          count="$(wc -l < /tmp/check.txt | tr -d ' ')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "files to check (${count}):"
          cat /tmp/check.txt || true

      - name: Install web devDeps (provides prettier)
        if: steps.changed.outputs.count != '0'
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Prettier --check (changed files only)
        if: steps.changed.outputs.count != '0'
        run: |
          # NUL-delimit the list so paths with spaces/'&' (e.g. Xcode asset
          # catalogs under "Maple TV/…/App Icon & Top Shelf Image.brandassets")
          # reach prettier as single args instead of being word-split — matches
          # the local mirror in src/web/scripts/format.sh.
          tr '\n' '\0' < /tmp/check.txt \
            | xargs -0 ./src/web/node_modules/.bin/prettier --check \
              --config src/web/.prettierrc

  oxlint-api:
    name: oxlint-api (correctness + fs-import guardrail)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install API devDeps (provides oxlint)
        working-directory: src/api
        run: HOME=/tmp/xbun bun install --frozen-lockfile

      - name: oxlint src/api
        working-directory: src/api
        run: HOME=/tmp/xbun bunx oxlint src

  file-budget:
    name: file-budget (400 soft / 600 hard LOC)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # The script + allowlist land in #205. Until that merges, skip-pass so
      # cross.yml stays green on main. Once #205 lands the guard is a no-op.
      - name: Check budget script presence
        id: probe
        run: |
          # Probe with -f (file exists) rather than -x (executable). The script
          # is invoked via `bash tools/check-file-budget.sh` below, so it only
          # needs to be readable. Requiring +x here meant a file committed
          # without the executable bit would silently skip the job forever.
          if [ -f tools/check-file-budget.sh ] && [ -f tools/budget-allowlist.txt ]; then
            echo "have_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_script=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/check-file-budget.sh not present yet (waiting on #205) — skipping."
          fi

      - name: Run file-budget
        if: steps.probe.outputs.have_script == 'true'
        run: bash tools/check-file-budget.sh

  budget-headroom:
    name: budget-headroom (changed files may not grow past 570 LOC)
    # Only meaningful on PRs — needs a merge base to diff against. On a push to
    # main there are no "changed files" relative to main, so nothing to gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the merge base of the PR.
          fetch-depth: 0

      - name: Self-test the checker
        run: bash tools/check-budget-headroom.sh --self-test

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # checkout@v4 with fetch-depth: 0 fetches all branches' commits but
          # not always the named ref — be explicit, same as the ratchet jobs.
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Check headroom on changed files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash tools/check-budget-headroom.sh "origin/${BASE_REF}"

  allowlist-shrinks-only:
    name: allowlist-shrinks-only
    # Only meaningful on PRs — needs a merge base to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the merge base of the PR.
          fetch-depth: 0

      - name: Probe allowlist
        id: probe
        run: |
          if [ -f tools/budget-allowlist.txt ]; then
            echo "have_allowlist=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_allowlist=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/budget-allowlist.txt not present yet (waiting on #205) — skipping."
          fi

      - name: Compute merge base
        if: steps.probe.outputs.have_allowlist == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Fetch the base branch tip so `git merge-base` can find the true
          # fork point. checkout@v4 with fetch-depth: 0 fetches all branches'
          # commits, but not always the named ref — be explicit.
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "MERGE_BASE=${merge_base}" >> "$GITHUB_ENV"
          echo "merge base: ${merge_base}"

      - name: Compare allowlist length against merge base
        if: steps.probe.outputs.have_allowlist == 'true'
        run: |
          set -euo pipefail

          # Judge growth PER FILE EXTENSION, not as one flat count (#2747).
          # The append-forbidden rule exists to stop a new violator sneaking
          # into a language this gate ALREADY covers. It was never meant to
          # block a PR that brings a whole new language under the
          # file-budget gate for the first time (tools/check-file-budget.sh
          # gaining `*.cs`, here) — that necessarily seeds the language's
          # day-0 violators in one shot, exactly like every currently-gated
          # language's entries were seeded before this job existed. An
          # extension that already had ANY entries at the merge base is
          # unaffected by this: it stays fully append-forbidden, entry for
          # entry, same as before.

          # Non-comment, non-blank lines with the inline `# comment` and
          # trailing whitespace stripped, so what's left is the bare path.
          # `[[:space:]]`, not `\s`: the latter is a GNU regex extension,
          # not a POSIX ERE class, so it's not something to rely on in a
          # script whose whole point is a portable text-processing pattern.
          # `|| true`: under `set -o pipefail`, a `grep` that matches
          # nothing (an empty or all-comments file — the allowlist itself
          # right after #113, or a $base_tmp that's empty because the file
          # didn't exist yet at the merge base) exits 1, which becomes the
          # whole pipeline's exit status and would abort the script under
          # `set -e` the moment it's used in `$(...)` — the same trap
          # `check-budget-headroom.sh` already warns about for
          # `is_allowlisted ... && continue`.
          extract_paths() {
            grep -Ev '^[[:space:]]*(#|$)' "$1" | sed -E 's/[[:space:]]*#.*$//; s/[[:space:]]+$//' || true
          }

          # Bare paths -> "ext count" pairs, one extension per line.
          count_by_ext() {
            extract_paths "$1" | sed -E 's/^.*\.([A-Za-z0-9]+)$/\1/' | sort | uniq -c | \
              awk '{print $2, $1}'
          }

          # Whether `.$1` was already a gated extension in
          # check-file-budget.sh AT THE MERGE BASE — the actual signal for
          # "is this the PR onboarding the extension," and more robust than
          # asking whether the allowlist currently has zero entries for it
          # (an already-gated language that has fully paid off its
          # allowlist debt also reads zero entries at the merge base: a
          # flat zero-count check would treat that as a fresh onboarding
          # and silently let one new violator back in with only a notice,
          # no error). The trailing `([^A-Za-z0-9_]|$)` is an explicit
          # non-word-character (or end-of-line) boundary rather than `\b`
          # — `\b` is a GNU regex extension, not a POSIX ERE token — so
          # matching `.ts` doesn't also match inside `.tsx`.
          extension_already_gated() {
            git show "${MERGE_BASE}:tools/check-file-budget.sh" 2>/dev/null | \
              grep -Eq -- "\*\.$1([^A-Za-z0-9_]|\$)"
          }

          head_total="$(extract_paths tools/budget-allowlist.txt | wc -l | tr -d ' ')"

          # Diff against the actual PR fork point, not `base.sha` (the base
          # tip at event time). If the base branch's allowlist shrinks after
          # the PR branched, `base.sha` would make any unchanged PR look like
          # it grew the file.
          base_tmp="$(mktemp)"
          if git cat-file -e "${MERGE_BASE}:tools/budget-allowlist.txt" 2>/dev/null; then
            git show "${MERGE_BASE}:tools/budget-allowlist.txt" > "$base_tmp"
          fi
          base_total="$(extract_paths "$base_tmp" | wc -l | tr -d ' ')"

          echo "base entries (at merge-base): ${base_total}"
          echo "head entries: ${head_total}"

          # Per-extension base counts, looked up with awk rather than a bash
          # associative array — this mirrors check-file-budget.sh's own
          # "Bash 3.2 on macOS doesn't support associative arrays
          # consistently" note, so the block stays testable by copy-pasting
          # it into a local shell, not just on the ubuntu-latest runner.
          base_ext_counts="$(mktemp)"
          count_by_ext "$base_tmp" > "$base_ext_counts"
          rm -f "$base_tmp"

          failed=0
          while read -r ext count; do
            [ -n "$ext" ] || continue
            base_n="$(awk -v e="$ext" '$1==e {print $2}' "$base_ext_counts")"
            base_n="${base_n:-0}"
            if extension_already_gated "$ext"; then
              if [ "$count" -gt "$base_n" ]; then
                echo "::error::budget-allowlist.txt's .${ext} entries grew from ${base_n} to ${count} — that extension was already gated at the merge base and the allowlist is append-forbidden for it. Split the offending file instead of allowlisting it."
                failed=1
              fi
            elif [ "$count" -gt 0 ]; then
              echo "::notice::.${ext} entries (${count}) are new in this PR — allowed once as day-0 seeding for a language newly brought under the file-budget gate. Growth of .${ext} beyond this is append-forbidden starting now."
            fi
          done < <(count_by_ext tools/budget-allowlist.txt)
          rm -f "$base_ext_counts"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "OK — no already-gated extension grew (day-0 seeding of a newly-gated extension is allowed once)."

  budgets-ratchet-shrinks-only:
    name: budgets-ratchet-shrinks-only
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the merge base of the PR (same rationale as
          # allowlist-shrinks-only above). Harmless on push.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Always validate the checker's own logic (no fixtures / no merge base
      # needed) so a regression in the gate itself is caught. Mirrors how
      # rust-tests runs banding_check_test.py and pano_metrics.py --self-test.
      - name: check_budget_ratchet self-test
        run: python3 tools/check_budget_ratchet.py --self-test

      # The ratchet diff is only meaningful on PRs (needs a merge base). On
      # push to main there is no "base branch" to ratchet against — the
      # self-test above still runs.
      - name: Compute merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Fetch the base branch tip so `git merge-base` can find the true
          # fork point (checkout@v4 with fetch-depth: 0 fetches commits, not
          # always the named ref — be explicit).
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "MERGE_BASE=${merge_base}" >> "$GITHUB_ENV"
          echo "merge base: ${merge_base}"

      - name: Enforce budgets.json one-way ratchet vs merge base
        if: github.event_name == 'pull_request'
        env:
          # Written to a file with printf below, never interpolated into a
          # command — PR bodies are attacker-controlled text.
          PR_BODY: ${{ github.event.pull_request.body }}
          # On pull_request runs HEAD is the synthetic merge commit, whose message is
          # "Merge <sha> into <sha>" — read the PR head commit instead (Copilot, #3114).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # If budgets.json didn't exist at the merge base (brand-new file),
          # there is nothing to ratchet against — pass.
          if ! git cat-file -e "${MERGE_BASE}:test-fixtures/budgets.json" 2>/dev/null; then
            echo "::notice::test-fixtures/budgets.json did not exist at the merge base — nothing to ratchet, skipping."
            exit 0
          fi
          base="$(mktemp)"
          git show "${MERGE_BASE}:test-fixtures/budgets.json" > "$base"
          # RE-BASELINE markers (#2335): an audited, per-cell escape hatch for
          # a legitimate re-baseline. check_budget_ratchet.py looks for
          # `RE-BASELINE: <fixture>/<case>.<metric>: <justification>` lines in
          # the PR body and/or the head commit message — either location is
          # fine, and the commit message is what survives "Rebase and merge"
          # into main's history, since the PR body itself does not.
          marker="$(mktemp)"
          printf '%s\n' "$PR_BODY" > "$marker"
          git log -1 --format=%B "${HEAD_SHA:-HEAD}" >> "$marker"
          # The script fails (exit 1) if any existing budget cell was raised
          # (without a matching marker) or removed vs the base branch. New
          # cells (added coverage) pass.
          python3 tools/check_budget_ratchet.py --base "$base" --head test-fixtures/budgets.json --marker-file "$marker"
          rm -f "$base" "$marker"

  codegen-drift:
    name: codegen-drift (regenerated outputs are committed)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Probe codegen script presence
        id: probe
        run: |
          if [ -f tools/codegen.sh ]; then
            echo "have_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_script=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/codegen.sh not present — skipping."
          fi

      - name: Regenerate codegen outputs
        if: steps.probe.outputs.have_script == 'true'
        run: bash tools/codegen.sh

      - name: Verify no drift
        if: steps.probe.outputs.have_script == 'true'
        run: |
          # `git add -N` ensures newly-emitted (untracked) files show up in
          # `git diff` — without it, a generator that adds a new output file
          # would slip past the gate.
          git add -N .
          if ! git diff --exit-code; then
            echo "::error::codegen outputs are out of date. Run 'bash tools/codegen.sh' and commit the result."
            exit 1
          fi

  maple-ui-contracts:
    name: maple-ui-contracts (component-contract docs are complete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run contract linter self-test
        run: bash tools/check-maple-ui-contracts.test.sh

      - name: Check component-contract docs
        run: bash tools/check-maple-ui-contracts.sh

  fallow-audit-web:
    name: fallow-audit-web (dead code / complexity / dupes, changed files)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the merge base so fallow can scope its
          # audit to files changed in this PR/push (same rationale as
          # format-check above).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Install web devDeps (provides fallow)
        working-directory: src/web
        run: bun install --frozen-lockfile

      # `fallow audit` scopes dead-code/complexity/dupes analysis to files
      # changed vs the merge base and gates (exit 1) only on findings the
      # changeset itself introduces — pre-existing issues are reported but
      # don't fail the build. See #1829.
      - name: fallow audit (changed files only)
        working-directory: src/web
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: ./node_modules/.bin/fallow audit --base "origin/${BASE_REF}"

  fallow-audit-api:
    name: fallow-audit-api (dead code / complexity / dupes, changed files)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the merge base so fallow can scope its
          # audit to files changed in this PR/push (same rationale as
          # format-check above).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Install API devDeps (provides fallow)
        working-directory: src/api
        run: HOME=/tmp/xbun bun install --frozen-lockfile

      # `fallow audit` scopes dead-code/complexity/dupes analysis to files
      # changed vs the merge base and gates (exit 1) only on findings the
      # changeset itself introduces — pre-existing issues are reported but
      # don't fail the build. src/api/.fallowrc.json declares the Bun
      # child-process entry points (worker-main.ts, *.child.ts, etc.) that
      # Bun.spawn wires up via dynamic string paths — invisible to static
      # analysis without them. See #1829.
      - name: fallow audit (changed files only)
        working-directory: src/api
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: HOME=/tmp/xbun ./node_modules/.bin/fallow audit --base "origin/${BASE_REF}"

  gitleaks:
    name: gitleaks (PR commits)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can resolve the merge-base / pushed range below.
          # The scan itself is bounded to this PR/push's own commits via
          # --log-opts (see "gitleaks detect"), not via shallow checkout — so a
          # deep fetch never re-flags ancient history (#839).
          fetch-depth: 0

      # Install direct from GitHub releases — the official gitleaks-action
      # requires a paid license key for orgs, so we don't use it.
      #
      # Both the version and the tarball SHA-256 are pinned. The hash is
      # verified locally before extraction, so a malicious upstream tag
      # rewrite (or a MITM on the release CDN) can't slip a tampered
      # binary in. To bump: download the new release's
      # gitleaks_<version>_checksums.txt, copy the linux_x64 SHA, update
      # both env vars in lockstep.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.21.2'
          GITLEAKS_LINUX_X64_SHA256: '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSL -o "/tmp/${tarball}" "${base_url}/${tarball}"
          curl -fsSL -o /tmp/gitleaks_checksums.txt \
            "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # 1. Verify the tarball against the upstream checksums file
          #    (defends against tarball corruption / partial CDN swap).
          ( cd /tmp && grep " ${tarball}\$" gitleaks_checksums.txt | sha256sum -c - )

          # 2. Verify the tarball against the SHA we pinned in this
          #    workflow (defends against an upstream tag rewrite that
          #    re-publishes both the tarball *and* the checksums file).
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/${tarball}" | sha256sum -c -

          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan only the commits this PR/push introduces — never the full repo
      # history. This still catches any secret a change *introduces* (the
      # security value), but won't re-flag pre-existing deep-history findings
      # that are out of this change's scope (#839). The range is passed to the
      # underlying `git log` via --log-opts; --source still defaults to ".".
      - name: gitleaks detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # checkout@v4 above used fetch-depth: 0, so all history is local.
            # The explicit fetch makes sure refs/remotes/origin/<base> exists
            # (checkout fetches commits, not always named branch refs).
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            # origin/<base>..HEAD selects commits reachable from HEAD but not
            # from the base ref — i.e. this PR's own new commits.
            RANGE="origin/${BASE_REF}..HEAD"
          else
            # push: scan the pushed range. Fall back to HEAD~1..HEAD if `before`
            # is unavailable (force-push, branch-create, or the all-zeros
            # sentinel on an initial push).
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${BEFORE_SHA}" 2>/dev/null; then
              RANGE="${BEFORE_SHA}..${AFTER_SHA}"
            else
              RANGE="HEAD~1..HEAD"
            fi
          fi
          echo "Scanning commit range: ${RANGE}"
          gitleaks detect --no-banner --redact --log-opts="${RANGE}"
