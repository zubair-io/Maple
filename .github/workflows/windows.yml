name: windows

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  windows-wrapper-contract:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows build wrapper contracts
        run: python3 src/windows/scripts/test_build_windows.py

  windows-build-and-test:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: windows-x64 (MSVC build + rust tests + color parity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/raw-pipeline -> target
            src/windows -> target

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows application through the supported wrapper
        shell: bash
        run: bash src/windows/scripts/build-windows.sh

      - name: Run raw-core Unit Tests on Windows
        run: |
          cargo test --manifest-path src/raw-pipeline/Cargo.toml -p raw-core --lib

      - name: Run WinUI XMP Sidecar Tests + raw-ffi struct-layout gate
        # MAPLE_RAW_FFI_DLL arms RawFfiLayoutTests (#3221): every C# mirror
        # of a raw-ffi #[repr(C)] struct is checked field-for-field against
        # the DLL built above. Unset, those tests skip-pass (local dev
        # without a Rust build); set and missing, they FAIL.
        env:
          MAPLE_RAW_FFI_DLL: ${{ github.workspace }}\src\raw-pipeline\target\x86_64-pc-windows-msvc\release\raw_ffi.dll
        run: |
          dotnet test src/windows/Maple.WinUI.Tests/Maple.WinUI.Tests.csproj -c Release

      - name: Prepare runner desktop for both required layout sizes
        shell: pwsh
        run: ./src/windows/scripts/prepare-ci-desktop.ps1

      - name: Real WinUI open-render-close lifecycle smoke
        shell: pwsh
        run: ./src/windows/scripts/test-window-lifecycle.ps1

      - name: Upload WinUI lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui-lifecycle
          path: ${{ runner.temp }}/maple-window-lifecycle
          if-no-files-found: error

  result:
    name: Windows result
    needs: [changes, windows-wrapper-contract, windows-build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci_result.py windows-wrapper-contract=windows windows-build-and-test=windows
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
