<div class="flex h-full w-full flex-row">
  <div class="preview-main relative min-w-0 flex-1">
    <div
      class="preview-top-bar absolute top-[14px] left-1/2 z-10 flex h-11 max-w-[calc(100vw-32px)] -translate-x-1/2 items-center gap-2 rounded-[var(--pro-glass-radius-bar)] border-[0.5px] border-[color:var(--pro-glass-border)] bg-[color:var(--pro-glass-bg)] px-2 [backdrop-filter:var(--pro-glass-blur)]"
    >
      <mui-button
        class="shrink-0 [&_button]:h-11 [&_button]:w-11"
        variant="ghost"
        [iconOnly]="true"
        iconLeading="back"
        ariaLabel="Back"
        title="Back"
        (pressed)="goBack()"
      />
      <span
        data-testid="preview-filename"
        class="max-w-[min(200px,40vw)] shrink overflow-hidden text-[12px] text-ellipsis whitespace-nowrap text-[color:var(--pro-text)]"
        >{{ assetName() }}</span
      >
      <div class="preview-top-actions ml-auto flex items-center gap-1">
        <mui-button
          class="[&_button]:h-11 [&_button]:w-11"
          variant="ghost"
          [iconOnly]="true"
          iconLeading="flag"
          ariaLabel="Flag"
          [ariaExpanded]="flagOpen()"
          ariaControls="preview-flag-popover"
          (pressed)="flagOpen.set(!flagOpen())"
        />
        <mui-button
          class="preview-top-edit [&_button]:h-11 [&_button]:w-11"
          variant="ghost"
          [iconOnly]="true"
          iconLeading="edit"
          ariaLabel="Edit"
          (pressed)="edit()"
        />
        <mui-button
          class="preview-top-info [&_button]:h-11 [&_button]:w-11"
          variant="ghost"
          [iconOnly]="true"
          iconLeading="info"
          ariaLabel="Info"
          [ariaPressed]="infoOpen()"
          [toggled]="infoOpen()"
          (pressed)="toggleInfo()"
        />
      </div>
    </div>

    <div
      class="absolute inset-0 grid place-items-center select-none [touch-action:pan-y_pinch-zoom]"
      data-testid="preview-surface"
      (pointerdown)="onImagePointerDown($event)"
    >
      @if (videoUrl(); as video) {
        <video
          class="h-full w-full bg-black object-contain"
          [src]="video"
          [poster]="previewUrl() ?? thumbUrl()"
          controls
          playsinline
          preload="metadata"
          aria-label="Video playback"
          (pointerdown)="$event.stopPropagation()"
          (pointerup)="$event.stopPropagation()"
        ></video>
      } @else {
        @if (thumbUrl(); as t) {
          <img
            draggable="false"
            class="absolute max-h-full max-w-full object-contain"
            [src]="t"
            alt=""
            data-preview-stage="thumbnail"
            [attr.data-preview-resolved]="previewUrl() === t ? 'true' : null"
          />
        }
        @if (previewUrl(); as p) {
          <!-- subscribePreviewUrl() may fall through to the thumbnail URL (a
             Self-Hosted legacy fs: id has no richer preview source), in which
             case previewUrl() equals thumbUrl() — skip the redundant stacked
             <img> (and its decode/paint cost) and let the thumb crossfade stand
             alone. When it resolves a genuinely richer still (a Self-Hosted
             network preview, or a Hosted embedded-preview extraction), p differs
             and the full still stacks over the thumb. -->
          @if (p !== thumbUrl()) {
            <img
              draggable="false"
              class="absolute max-h-full max-w-full animate-[preview-fade_160ms_ease-out] object-contain"
              data-preview-stage="preview"
              data-preview-resolved="true"
              [src]="p"
              alt=""
            />
          }
        }
      }
    </div>

    <div
      class="preview-filmstrip-rail absolute top-[74px] bottom-[82px] left-3 z-10 overflow-hidden rounded-[var(--pro-glass-radius-bar)] border-[0.5px] border-[color:var(--pro-glass-border)] bg-[color:var(--pro-glass-bg-heavy)] pointer-events-auto shadow-[var(--pro-glass-shadow)] [backdrop-filter:var(--pro-glass-blur-heavy)]"
      [class.w-[110px]]="!filmstripCollapsed()"
      [class.w-[30px]]="filmstripCollapsed()"
    >
      <editor-filmstrip routeMode="view" [(collapsed)]="filmstripCollapsed" />
    </div>

    <div
      class="preview-action-bar action-bar absolute bottom-[14px] left-1/2 z-10 flex h-[52px] -translate-x-1/2 items-center gap-1 rounded-[var(--pro-glass-radius-bar)] border-[0.5px] border-[color:var(--pro-glass-border)] bg-[color:var(--pro-glass-bg)] px-2 [backdrop-filter:var(--pro-glass-blur)]"
      role="toolbar"
      aria-label="Preview actions"
    >
      <mui-action-button
        class="[&_button]:min-h-11 [&_button]:min-w-14"
        icon="flag"
        label="Flag"
        orientation="stacked"
        [selected]="null"
        [ariaExpanded]="flagOpen()"
        ariaControls="preview-flag-popover"
        (pressed)="flagOpen.set(!flagOpen())"
      />
      <mui-action-button
        class="[&_button]:min-h-11 [&_button]:min-w-14"
        icon="edit"
        label="Edit"
        orientation="stacked"
        [selected]="null"
        (pressed)="edit()"
      />
      <mui-action-button
        class="[&_button]:min-h-11 [&_button]:min-w-14"
        icon="info"
        label="Info"
        orientation="stacked"
        [selected]="infoOpen()"
        (pressed)="toggleInfo()"
      />
    </div>

    @if (flagOpen()) {
      <div
        id="preview-flag-popover"
        class="flag-popover absolute bottom-[74px] left-1/2 z-[11] -translate-x-1/2 rounded-[var(--pro-glass-radius-bar)] border-[0.5px] border-[color:var(--pro-glass-border)] bg-[color:var(--pro-glass-bg)] px-3 py-2 [backdrop-filter:var(--pro-glass-blur)]"
      >
        <mui-rating-flags
          variant="pills"
          [rating]="flagPopoverRating()"
          (ratingChange)="onFlagPopoverRatingChange($event)"
          [flag]="flagPopoverFlag()"
          (flagChange)="onFlagPopoverFlagChange($event)"
          [disabled]="flagPopoverDisabled()"
        />
      </div>
    }
  </div>

  @if (isTabletPlus()) {
    @if (infoOpen()) {
      <div
        class="info-pane w-[min(340px,30vw)] shrink-0 overflow-y-auto border-l-[0.5px] border-[color:var(--pro-border)]"
      >
        <app-info-panel
          [asset]="state.focusedAsset()"
          [insideSheet]="false"
          (close)="setInfoOpen(false)"
        />
      </div>
    }
  } @else {
    <mui-sheet-shell [open]="infoOpen()" [detents]="[0.74]" (dismissed)="infoOpen.set(false)">
      <app-info-panel
        [asset]="state.focusedAsset()"
        [insideSheet]="true"
        (close)="infoOpen.set(false)"
      />
    </mui-sheet-shell>
  }
</div>
