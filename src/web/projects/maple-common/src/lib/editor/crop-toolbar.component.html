<div class="flex items-center gap-3 px-3 py-2" data-testid="crop-toolbar">
  <mui-crop-toolbar
    class="min-w-0 flex-1"
    [aspectChips]="aspectChips()"
    [aspect]="activeAspect()"
    (aspectChanged)="onAspectChange($event)"
    [angle]="angle()"
    (angleChanged)="onStraighten($event)"
    straightenTestId="crop-straighten"
    (straightenDragStart)="onStraightenStart()"
    resetTestId="crop-reset"
    [resetDisabled]="!canReset()"
    (resetRequested)="reset()"
  />
  <mui-button
    variant="primary"
    size="sm"
    class="shrink-0"
    ariaLabel="Done cropping"
    testId="crop-done"
    (pressed)="done()"
  >
    Done
  </mui-button>
</div>
