<div
  class="strip-title flex items-center justify-between shrink-0 border-b-[0.5px] border-border pl-2.5 pr-1.5 pt-2 pb-1.5 text-[9px] font-semibold uppercase tracking-[0.08em] text-text-muted"
>
  <span>FILMSTRIP</span>
  <button
    type="button"
    class="strip-toggle -m-0.5 inline-flex cursor-pointer items-center justify-center rounded p-0.5 text-text-muted transition-colors duration-[120ms] ease-out hover:bg-white/8"
    (click)="collapsed.set(!collapsed())"
    [attr.aria-expanded]="!collapsed()"
    [attr.aria-label]="collapsed() ? 'Show filmstrip' : 'Hide filmstrip'"
    [title]="collapsed() ? 'Show filmstrip' : 'Hide filmstrip'"
  >
    <maple-icon
      name="back"
      [size]="11"
      color="var(--color-text-muted)"
      class="block transition-transform duration-[160ms] ease-out"
      [class.rotate-180]="collapsed()"
    />
  </button>
</div>

@if (!collapsed()) {
  <div
    class="strip-scroll overflow-y-auto p-1 flex flex-col gap-[3px] max-h-[calc(100dvh-56px)]"
    #scrollContainer
  >
    @for (asset of state.assetsInSelectedFolder(); track asset.id) {
      @let isFocused = state.focusedAssetId() === asset.id;
      <div class="shrink-0" [style.height.px]="thumbH(asset)" [attr.data-id]="asset.id">
        <maple-asset-thumb [asset]="asset" [focused]="isFocused" (thumbClick)="select(asset)" />
      </div>
    }
  </div>
}
