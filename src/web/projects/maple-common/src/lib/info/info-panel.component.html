@if (insideSheet()) {
  <header class="info-panel-header">
    <h2 class="title">Info</h2>
    <button
      type="button"
      class="close"
      data-testid="info-panel-close"
      (click)="onClose()"
      aria-label="Close"
    >
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path
          d="M3 3l8 8M11 3l-8 8"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </header>
}

<div class="sections">
  <app-rating-flags-row [asset]="asset()" />
  <app-info-histogram [asset]="asset()" [allowServerFallback]="allowServerHistogramFallback()" />
  <app-camera-location-grid [asset]="asset()" />
  <app-keyword-chips-row [asset]="asset()" />
  @if (extension; as extensionComponent) {
    <ng-container *ngComponentOutlet="extensionComponent" />
  }
</div>
