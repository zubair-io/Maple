# .github/workflows/apple.yml
#
# Swift compile and executable regression gates for Apple (#2789, #3363).
#
# No cloud CI built Swift, so a change that broke the MapleCore compile
# merged green and main went red until a human built locally or an Xcode
# Cloud archive failed (#2653, #2488, #2785 — the recurring class is a
# codegen-added enum case landing beside an exhaustive switch that never
# gained an arm: neither PR touches the other's lines, git merges both
# cleanly, and nothing re-compiles until the TestFlight archive).
#
# The swift-build job keeps its COMPILE-only scope. The separate regression
# job links a real host-only Rust archive and executes the selected tests.
# Compiling only needs the cbindgen-generated header plus a stub archive,
# because SwiftPM validates that the binary target's .a EXISTS but never
# links a static library into a library target — linking happens in the
# app/test executables, which this job doesn't build.
#
# The job runs on Apple- and raw-pipeline-scoped changes: every incident
# class either edits src/apple/** directly (committed generated Swift,
# hand-written Swift) or changes the raw-ffi surface the header is
# generated from (src/raw-pipeline/**).

name: apple

on:
  push:
    branches: [main]
    paths:
      - 'src/apple/**'
      - 'src/raw-pipeline/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'src/apple/**'
      - 'src/raw-pipeline/**'
      - '.github/workflows/apple.yml'

# Cancel in-progress runs on non-main refs (PRs, feature branches). Pushes to
# main always run to completion so the protected-branch signal stays accurate.
concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Keep in sync with src/apple/ci_scripts/ci_post_clone.sh (Xcode Cloud pins
# the same version so generated headers can't drift between the two CIs).
env:
  CBINDGEN_VERSION: '0.29.2'

jobs:
  swift-build:
    name: swift-build (MapleCore compile gate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The package is swift-tools-version 6.1; the image's default Xcode can
      # lag the newest installed one, so select the highest deterministically.
      - name: Select newest Xcode
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          swift --version

      # cbindgen parses the raw-ffi crate to emit RawPipeline.h. It needs a
      # Rust toolchain on PATH for `cargo metadata`, but never compiles the
      # crate — no cross targets, no cargo build.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cbindgen binary
        id: cbindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ env.CBINDGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --locked --version "$CBINDGEN_VERSION"

      # Stage the compile-only skeleton of RawPipeline.xcframework: the
      # generated header everywhere a modulemap references it, plus an empty
      # stub archive so SwiftPM's input validation passes. Compile-only —
      # nothing links the archive (see the header comment).
      - name: Stage RawPipeline header + stub archive
        run: |
          set -euo pipefail
          FFI_DIR=src/raw-pipeline/raw-ffi
          FRAMEWORK=src/apple/Frameworks/RawPipeline.xcframework
          INCLUDE_DIR=src/apple/Packages/MapleCore/Sources/MapleCore/include

          (cd "$FFI_DIR" && cbindgen --config cbindgen.toml --lang C \
              --output /tmp/RawPipeline.h --crate raw-ffi)

          cp /tmp/RawPipeline.h "$INCLUDE_DIR/RawPipeline.h"
          for slice in ios-arm64 ios-arm64-simulator macos-arm64_x86_64; do
            cp /tmp/RawPipeline.h "$FRAMEWORK/$slice/Headers/RawPipeline.h"
          done

          # macOS `ar` refuses an empty archive, so feed it one empty object.
          echo 'static int _maple_compile_gate_stub;' \
            | clang -x c -c - -o /tmp/maple_stub.o
          ar -rc "$FRAMEWORK/macos-arm64_x86_64/libraw_ffi.a" /tmp/maple_stub.o

      - name: Cache SwiftPM build directory
        uses: actions/cache@v4
        with:
          path: |
            src/apple/Packages/MapleCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('src/apple/Packages/MapleCore/Package.resolved', '.github/workflows/apple.yml') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: swift build
        working-directory: src/apple/Packages/MapleCore
        run: swift build

  swift-regressions:
    name: swift-regressions (MapleCore execution gate)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      MAPLE_GPU_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        id: xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(python3 -c 'import glob, re; print(max(glob.glob("/Applications/Xcode_*.app"), key=lambda p: tuple(map(int, re.findall(r"\d+", p)))))')"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/maple-apple-native" >> "$GITHUB_ENV"
          echo "MAPLE_SWIFT_TEST_ROOT=$RUNNER_TEMP/maple-swift-regressions" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"
          swift --version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cbindgen binary
        id: cbindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ env.CBINDGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --locked --version "$CBINDGEN_VERSION"
      - name: Cache host Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: apple-test-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('src/raw-pipeline/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: Build real host archive
        working-directory: src/raw-pipeline
        # pano supplies maple_pano_stitch, referenced by the linked package
        # even when no panorama test runs. Host ORT is dynamically loaded;
        # this does not download iOS ORT or build any cross-target slice.
        run: cargo build --locked --release -p raw-ffi --features gpu,pano
      - name: Stage isolated Swift package and host framework
        run: |
          set -euo pipefail
          NATIVE_LIB="$CARGO_TARGET_DIR/release/libraw_ffi.a"
          HEADERS="$MAPLE_SWIFT_TEST_ROOT/Headers"
          mkdir -p "$HEADERS" "$MAPLE_SWIFT_TEST_ROOT/Packages" "$MAPLE_SWIFT_TEST_ROOT/Frameworks"
          (cd src/raw-pipeline/raw-ffi && cbindgen --config cbindgen.toml --lang C \
            --output "$HEADERS/RawPipeline.h" --crate raw-ffi)
          cp src/apple/Frameworks/RawPipeline.xcframework/macos-arm64_x86_64/Headers/module.modulemap "$HEADERS/"
          # Compare the host-visible header declarations with real exports.
          # Preprocessing excludes guarded Windows-only symbols.
          xcrun clang -E -P -x c "$HEADERS/RawPipeline.h" -o "$HEADERS/host.h"
          python3 - "$HEADERS" "$NATIVE_LIB" <<'PYCODE'
          from pathlib import Path
          import platform, re, subprocess, sys
          headers = Path(sys.argv[1])
          expected = set(re.findall(r'\b(maple_[a-z0-9_]+)\s*\(', (headers / 'host.h').read_text()))
          # cbindgen leaves this iOS-only ORT declaration unguarded; match
          # build-xcframework.sh's macOS exclusion (M6 #1244).
          expected -= {'maple_pano_ort_selftest'}
          # As in build-xcframework.sh, Apple nm can reject newer Rust std
          # bitcode while still emitting native exports. Require every FFI
          # symbol; the subsequent executable link validates the full archive.
          symbols = subprocess.run(['xcrun', 'nm', '-arch', platform.machine(), '-gU', sys.argv[2]],
                                   capture_output=True, text=True)
          exported = set(re.findall(r'\b_(maple_[a-z0-9_]+)\b', symbols.stdout))
          missing = expected - exported
          if not expected or missing:
              raise SystemExit(f'Invalid native archive; missing symbols: {sorted(missing)}\n{symbols.stderr}')
          print(f'Verified {len(expected)} host FFI symbols')
          PYCODE
          rm "$HEADERS/host.h"
          xcodebuild -create-xcframework -library "$NATIVE_LIB" -headers "$HEADERS" \
            -output "$MAPLE_SWIFT_TEST_ROOT/Frameworks/RawPipeline.xcframework"
          # Keep the checkout's local framework untouched. Preserve package
          # relative paths, including the tiny committed synthetic RAW.
          for package in MapleCore MapleBackup; do
            rsync -a --exclude=.build --exclude=.swiftpm \
              "src/apple/Packages/$package" "$MAPLE_SWIFT_TEST_ROOT/Packages/"
          done
          cp "$HEADERS/RawPipeline.h" "$MAPLE_SWIFT_TEST_ROOT/Packages/MapleCore/Sources/MapleCore/include/"
          mkdir -p "$MAPLE_SWIFT_TEST_ROOT/MapleUITests/Fixtures"
          cp -R src/apple/MapleUITests/Fixtures/synthetic "$MAPLE_SWIFT_TEST_ROOT/MapleUITests/Fixtures/"
      - name: Cache SwiftPM regression build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.MAPLE_SWIFT_TEST_ROOT }}/Packages/MapleCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: apple-test-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('src/apple/Packages/MapleCore/Package.resolved', 'src/apple/Packages/MapleBackup/Package.resolved', '.github/workflows/apple.yml') }}
      - name: Execute scheduling, cache, geometry, XMP and Metal regressions
        run: |
          set -euo pipefail
          classes=(RenderSchedulingBackpressureTests RenderRequestIdentityTests RenderActivityTests
            NativeDetailCancellationTests DecodedCacheAutosaveTests RenderedPreviewCacheWriteTests
            RawRenderSourceTests EditSessionNativeSizeSeedTests EditSessionPreviewCeilingTests
            CanvasMathTests GpuPrescaledExtentTests GpuReadbackFreshnessTests GpuExitPreviewCacheTests
            GpuPresentationOutcomeTests GpuSessionReplacementTests LocalAdjustmentXMPTests)
          FILTER="MapleCoreTests\.($(IFS='|'; echo "${classes[*]}"))/"
          test_status=0
          swift test --package-path "$MAPLE_SWIFT_TEST_ROOT/Packages/MapleCore" \
            --configuration release -Xswiftc -enable-testing --no-parallel --filter "$FILTER" \
            2>&1 | tee "$MAPLE_SWIFT_TEST_ROOT/tests.log" || test_status=$?
          # Serial SwiftPM does not emit XCTest xUnit (only Swift Testing).
          # Validate actual XCTest records, then derive the artifact from them.
          python3 - "$MAPLE_SWIFT_TEST_ROOT" "${classes[@]}" <<'PYCODE'
          from pathlib import Path
          import re, sys, xml.etree.ElementTree as ET
          root = Path(sys.argv[1])
          log = (root / 'tests.log').read_text()
          events = re.findall(r"Test Case '-\[MapleCoreTests\.(\w+) (\w+)\]' (started|passed|failed|skipped)(?: \(([\d.]+) seconds\))?\.", log)
          starts = [(cls, name) for cls, name, status, _ in events if status == 'started']
          results = [(cls, name, status, duration) for cls, name, status, duration in events if status != 'started']
          completed = [(cls, name) for cls, name, _, _ in results]
          actual = {cls for cls, _, _, _ in results}
          summaries = re.findall(r'Executed (\d+) tests?, with (\d+) failures? \((\d+) unexpected\)', log)
          valid = (len(results) >= 67 and actual == set(sys.argv[2:])
                   and len(starts) == len(set(starts)) == len(completed) == len(set(completed))
                   and set(starts) == set(completed)
                   and all(status == 'passed' for _, _, status, _ in results)
                   and "Test Suite 'Selected tests' passed" in log
                   and summaries and tuple(map(int, summaries[-1])) == (len(results), 0, 0))
          failure_message = f'Incomplete regression gate: {len(results)} cases; classes={sorted(actual)}; summary={summaries[-1:]}; see tests.log'
          suite = ET.Element('testsuite', name='MapleCore serial XCTest',
                             tests=str(len(results) + (not valid)),
                             failures=str(sum(status == 'failed' for _, _, status, _ in results) + (not valid)),
                             skipped=str(sum(status == 'skipped' for _, _, status, _ in results)))
          properties = ET.SubElement(suite, 'properties')
          ET.SubElement(properties, 'property', name='source', value='Serial XCTest records in tests.log')
          for cls, name, status, duration in results:
              case = ET.SubElement(suite, 'testcase', classname=f'MapleCoreTests.{cls}', name=name, time=duration or '0')
              if status == 'failed':
                  ET.SubElement(case, 'failure', message='XCTest failed; see tests.log')
              elif status == 'skipped':
                  ET.SubElement(case, 'skipped')
          if not valid:
              case = ET.SubElement(suite, 'testcase', classname='RegressionGate', name='complete_execution')
              ET.SubElement(case, 'failure', message=failure_message)
          ET.ElementTree(suite).write(root / 'results.xml', encoding='utf-8', xml_declaration=True)
          if not valid:
              raise SystemExit(failure_message)
          print(f'Passed {len(results)} regression cases; no failures or skips')
          PYCODE
          exit "$test_status"
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-swift-regressions
          path: |
            ${{ env.MAPLE_SWIFT_TEST_ROOT }}/results.xml
            ${{ env.MAPLE_SWIFT_TEST_ROOT }}/tests.log
