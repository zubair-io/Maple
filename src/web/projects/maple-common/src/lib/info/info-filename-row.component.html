@let a = asset();
@if (a) {
  <!-- Trigger button lives outside the @defer block so it's always visible
       — only <app-inline-rename-field> code-splits into a lazy chunk on
       first interaction (#2706 web-build bundle-size fix; see
       asset-thumb.component.html's matching comment for the full "why").
       Stays clickable even when `disabledReason()` is set — the service's
       `startEditing` itself no-ops when disabled, so this only dims the
       affordance rather than gating the click (see info-filename-row.
       component.ts's doc comment). -->
  <mui-button
    #renameTrigger
    variant="ghost"
    [fullWidth]="true"
    class="mb-1"
    [class.hidden]="isEditing()"
    [class.opacity-70]="disabledReason() !== null"
    [ariaLabel]="'Rename ' + a.filename"
    [attr.title]="disabledReason()"
    (dblclick)="onDblClick()"
  >
    <span class="block w-full min-w-0 truncate text-left text-[13px] font-medium text-text-main">{{
      a.filename
    }}</span>
  </mui-button>
  @defer (on interaction(renameTrigger)) {
    @if (isEditing()) {
      <div class="mb-1 py-0.5">
        <app-inline-rename-field
          [filename]="a.filename"
          [error]="renameSvc.error()"
          [busy]="renameSvc.busy()"
          [collision]="isCollision()"
          (committed)="onCommit($event)"
          (cancelled)="renameSvc.cancel()"
          (collisionResolved)="onCollisionResolved($event)"
        />
      </div>
    }
  }
}
