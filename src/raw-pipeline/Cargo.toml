[workspace]
resolver = "2"
members = [
    "raw-core",
    "raw-gpu",
    "maple-cli",
    "maple-pano",
    "raw-ffi",
    "raw-wasm",
    "codegen",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "Proprietary"

[workspace.dependencies]
rawler = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
png = "0.17"
quick-xml = "0.37"
thiserror = "2"
# IEEE 754 binary16 (f16) storage type. Already in the lockfile transitively
# via `exr`/`tiff`; promoted to a direct workspace dep for raw-core's
# `.mlut` film-LUT codec (#2683), which stores the grid payload as f16.
half = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
# DEFLATE (zlib) for the v3 split DCP bundle's per-entry HSM compression
# (profile_loader::writer / parser). Pure-Rust, WASM-safe; 0.8.x is already
# in the lockfile transitively via `png`.
miniz_oxide = "0.8"
rayon = "1"
# ONNX Runtime bindings for the maple-pano ML stack (ALIKED + LightGlue,
# #1139). Pinned to exactly 2.0.0-rc.10 — the rc.10/rc.12 line has a history
# of compile breaks in the VitisAI execution-provider glue (the failure that
# blocked the earlier pano-core ML attempt, see PR #17's Cargo.toml), so any
# bump is its own PR gated on the pano regression run.
#
# ONNX Runtime bindings (single workspace entry, M6 #1244 redesign).
#
# `default-features = false`, NO features by default. Features are activated
# per-consumer:
#
# macOS / host (`ml` feature in maple-pano):
#   maple-pano adds `features = ["ort/load-dynamic"]` via its `ml` feature.
#   The dylib is dlopen'd at runtime from `ORT_DYLIB_PATH`.
#
# iOS / static (`ml-static` feature in maple-pano, M6 #1244):
#   maple-pano does NOT add `load-dynamic`. ort-sys sees `ORT_LIB_LOCATION`
#   pointing at the official iOS static xcframework and emits
#   `cargo:rustc-link-lib=static=onnxruntime`. The iOS sandbox blocks
#   dlopen; static linking is the only correct path.
#
# `--all-features` (host CI): both `ml` and `ml-static` active. Cargo
# unifies features → `load-dynamic` wins (union). The `ml` preflight path
# (`ort::init_from`) is selected by the `#[cfg(feature = "ml")]` guard
# in OrtRuntime::preflight (checked first), so host tests pass normally.
# The `ml-static` path (calling `ort::init()`) is only reached on iOS
# cross-compilation where `ml` is absent. No behavior regression.
ort = { version = "=2.0.0-rc.10", default-features = false }
# Pre-flight dlopen check for the onnxruntime dylib (maple-pano ml feature):
# `ort` with `load-dynamic` *panics* when the dylib is missing/unloadable, so
# the loader probes with libloading first and returns a typed error instead.
# 0.8 matches the version ort-sys already pulls — no second copy in the tree.
libloading = "0.8"
# SHA-256 verification of the ALIKED/LightGlue ONNX files against the pinned
# digests in maple-pano/models.toml (models are downloaded, never committed).
sha2 = "0.10"
# maple-pano/models.toml manifest parsing. 0.8 is already in the lockfile
# (and vendored) via cbindgen's dependency tree.
toml = "0.8"
