<!-- ToolDock — vertical glass column, 8 icons -->
<nav class="dock" role="navigation" aria-label="Editor tools">
  @for (entry of entries; track entry.id) {
    <button
      class="dock-btn"
      [class.dock-btn--active]="isActive(entry)"
      [class.dock-btn--disabled]="entry.disabled"
      [disabled]="entry.disabled"
      [title]="entry.disabled ? entry.label + ' — coming in ' + entry.ticket : entry.label"
      [attr.aria-label]="entry.label"
      [attr.aria-current]="isActive(entry) ? 'page' : null"
      (click)="onEntryClick(entry)"
    >
      <maple-icon
        [name]="$any(entry.icon)"
        [size]="18"
        [color]="
          isActive(entry)
            ? 'var(--pro-accent)'
            : entry.disabled
              ? 'var(--pro-text-dim)'
              : 'var(--pro-text-muted)'
        "
      />
    </button>
  }
</nav>
