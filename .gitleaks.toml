# Repo-level gitleaks config for the Maple monorepo.
# - Inherits the default rule set bundled with gitleaks (see https://github.com/gitleaks/gitleaks).
# - Adds a path-based allowlist for known false-positives so we don't need
#   commit-SHA-pinned fingerprints in .gitleaksignore (which break on rebase).

[extend]
useDefault = true

[allowlist]
description = "Maple monorepo allowlist"
paths = [
    # Vendored upstream crate sources (`cargo vendor` output under
    # src/raw-pipeline/vendor/). Third-party crates ship test vectors and
    # example keys that trip the generic rules; they are not Maple secrets
    # and aren't ours to scan.
    '''src/raw-pipeline/vendor/.*''',
    # Cache-GC test fixture: a 16-char hex placeholder mimicking the
    # legacy sha256_prefix16 cache basename. Looks like an API key to
    # the generic-api-key rule but is intentionally not a secret.
    # Used to verify the orphan-thumb sweep deletes files keyed under
    # the legacy basename-hash format.
    '''src/api/src/workers/cache-gc\.test\.ts''',
]
# Targeted string allowlist for known false-positives, matched against the
# detected secret. Preferred over path exemptions so the surrounding files
# stay fully scanned for anything that ISN'T one of these exact strings.
regexes = [
    # Apple CryptoKit type name used throughout the Maple TV pairing code
    # (`Curve25519.KeyAgreement.PrivateKey`). The generic-api-key rule reads
    # the `privateKey:` binding as a credential; it is a public type name.
    '''Curve25519\.KeyAgreement\.PrivateKey''',
    # Hard-coded fake pairing token in the pairing-protocol unit tests
    # (PairingProtocolTests.swift). A deliberately unrealistic literal used
    # to assert the QR payload round-trips the token field; not a real secret.
    '''tok_abc123XYZ''',
]
