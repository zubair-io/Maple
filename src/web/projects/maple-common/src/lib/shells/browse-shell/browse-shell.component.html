<div class="window">
  <!-- Toolbar -->
  <div class="titlebar">
    <!-- Sidebar toggle -->
    <div
      class="chrome-btn"
      [class.active]="state.sidebarVisible()"
      [title]="(state.sidebarVisible() ? 'Hide' : 'Show') + ' sidebar  ⌥⌘S'"
      (click)="state.toggleSidebar()"
    >
      <maple-icon
        name="sidebar"
        [size]="13"
        [color]="state.sidebarVisible() ? 'var(--maple-text-main)' : 'var(--maple-text-muted)'"
      />
    </div>

    <!-- Search chrome btn -->
    <div class="chrome-btn">
      <maple-icon name="search" [size]="12" color="var(--maple-text-muted)" />
    </div>

    <div class="toolbar-spacer"></div>

    <!-- Export -->
    <div
      class="export-btn"
      [class.has-selection]="state.selectedCount() > 0"
      [class.no-selection]="state.selectedCount() === 0"
    >
      <maple-icon name="export" [size]="11" />
      <span>Export{{ state.selectedCount() > 1 ? ' (' + state.selectedCount() + ')' : '' }}</span>
    </div>

    <!-- Inspector toggle -->
    <div
      class="chrome-btn"
      [class.active]="state.inspectorVisible()"
      [title]="(state.inspectorVisible() ? 'Hide' : 'Show') + ' inspector  ⌥⌘D'"
      (click)="state.toggleInspector()"
    >
      <maple-icon
        name="inspector"
        [size]="13"
        [color]="state.inspectorVisible() ? 'var(--maple-text-main)' : 'var(--maple-text-muted)'"
      />
    </div>
  </div>

  <!-- Body -->
  <div class="body">
    <!-- Left: folder tree -->
    <div class="panel-left" [style.width]="state.sidebarVisible() ? '220px' : '0px'">
      <app-folder-tree />
    </div>

    <!-- Center: asset grid + drop-zone import bar -->
    <div class="panel-center">
      @if (state.backend === 'self-hosted') {
        @if (state.backendLoading()) {
          <app-loading-banner label="Loading folders…" />
        }
        @if (state.backendError(); as err) {
          <app-error-banner [message]="err" (retry)="onRetryLoad()" />
        }
        @if (state.backendEmpty() && !state.backendLoading() && !state.backendError()) {
          <app-library-picker (pick)="state.addLibraryFolder($event)" />
        }
      } @else {
        <app-drop-zone />
      }
      <app-asset-grid />
    </div>

    <!-- Right: detail panel -->
    <div
      class="panel-right"
      [class.hidden]="!state.inspectorVisible()"
      [style.width]="state.inspectorVisible() ? '280px' : '0px'"
    >
      <app-detail-panel />
    </div>
  </div>
</div>

<app-library-picker-modal />
