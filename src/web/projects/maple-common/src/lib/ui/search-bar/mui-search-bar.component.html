<div class="flex items-center gap-2">
  <mui-input
    variant="search"
    class="min-w-0 flex-1"
    [value]="value()"
    (valueChange)="value.set($event)"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [ariaLabel]="placeholder()"
    (committed)="committed.emit($event)"
  />
  @if (actionLabel()) {
    <mui-button
      variant="ghost"
      size="sm"
      [iconLeading]="actionIcon()"
      [disabled]="disabled()"
      (pressed)="actionPressed.emit()"
    >
      {{ actionLabel() }}
    </mui-button>
  }
</div>
