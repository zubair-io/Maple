<maple-collapsible
  label="Capture Sharpening"
  storageKey="dev-capture-sharpen"
  [padInner]="false"
  [defaultOpen]="false"
>
  @if (assetId()) {
    <editor-slider
      label="Amount"
      [value]="adj().captureSharpeningAmount"
      [min]="0"
      [max]="100"
      (valueChange)="patch('captureSharpeningAmount', $event)"
    />
    <!--
      #320: the Rust pipeline now runs a true separable Gaussian PSF
      parameterised by an f32 sigma (`stages::capture_sharpening` +
      `stages::blur::gaussian_blur_plane_sigma`, no integer-radius
      rounding anywhere in `capture_sharpening_params_from_model`), so the
      slider is restored to the model's declared [0.5, 2.0] range at
      step=0.1 fractional precision. Bind to `captureSharpeningSigma` —
      `captureSharpeningRadius` is a deprecated back-compat XMP-parse
      alias that no code reads after parse (see
      `adjustment-model.generated.ts`); binding to it here silently
      dropped every edit before this fix.
    -->
    <editor-slider
      label="Sigma"
      [value]="adj().captureSharpeningSigma"
      [min]="0.5"
      [max]="2.0"
      [step]="0.1"
      (valueChange)="patch('captureSharpeningSigma', $event)"
    />
  }
</maple-collapsible>
