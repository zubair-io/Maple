<div class="panel" data-testid="presets-panel">
  <h2 class="title">Presets</h2>

  <!-- Save current edits as a new preset -->
  <div class="save-row">
    <input
      type="text"
      class="name-input"
      placeholder="Preset name"
      [value]="draftName()"
      (input)="onDraftNameInput($event)"
      (keydown.enter)="canSave() && save()"
      aria-label="New preset name"
      data-testid="preset-name-input"
    />
    <mui-button
      variant="primary"
      size="sm"
      class="save-button"
      [disabled]="!canSave()"
      testId="preset-save"
      (pressed)="save()"
    >
      Save
    </mui-button>
  </div>
  <p class="save-hint" data-testid="preset-save-hint">
    @if (capturedCount() === 0) {
      No edited settings to save — adjust something first.
    } @else {
      Saves {{ capturedCount() }} edited {{ capturedCount() === 1 ? 'setting' : 'settings' }}.
    }
  </p>

  @if (presets.error(); as err) {
    <p class="error" role="alert" data-testid="presets-error">{{ err }}</p>
  }

  <div class="lists">
    <h3 class="section">Built-in</h3>
    <mui-presets-panel
      [presets]="builtinItems()"
      [showSaveTrigger]="false"
      [showDeleteAction]="false"
      (applied)="onApplied($event)"
    />

    <h3 class="section">Saved</h3>
    <mui-presets-panel
      [presets]="userItems()"
      [loading]="!presets.loaded()"
      [showSaveTrigger]="false"
      confirmMode="inline"
      (applied)="onApplied($event)"
      (deleted)="onDeleted($event)"
    />
  </div>
</div>
