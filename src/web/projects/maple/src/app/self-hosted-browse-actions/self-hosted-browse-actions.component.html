<app-browse-action-button
  [enabled]="canEditMetadata()"
  label="Edit Metadata…"
  [count]="state.selectedCount()"
  buttonTitle="Edit metadata for selected photos"
  ariaLabel="Edit metadata"
  (clicked)="controller.openMetadata()"
/>

<app-browse-action-button
  [enabled]="canMergePano()"
  label="Merge to panorama…"
  [count]="state.selectedCount()"
  buttonTitle="Stitch selected images into a panorama"
  ariaLabel="Merge to panorama"
  (clicked)="controller.openPano()"
/>

<app-browse-action-button
  [enabled]="canBatchRename()"
  label="Batch Rename…"
  [count]="state.selectedCount()"
  buttonTitle="Rename selected photos with a template"
  ariaLabel="Batch rename"
  (clicked)="controller.openBatchRename()"
/>

<app-browse-action-button
  [enabled]="canMoveTo()"
  label="Move to…"
  [count]="state.selectedCount()"
  buttonTitle="Move selected photos into a different folder"
  ariaLabel="Move to"
  (clicked)="controller.openMoveTo()"
/>
