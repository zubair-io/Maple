<div class="mui-avatar-group flex items-center">
  @for (avatar of visible(); track avatar.name; let i = $index) {
    <div
      class="slot flex rounded-full shadow-[0_0_0_2px_var(--color-bg)]"
      [class.stacked]="i > 0"
      [class.-ml-2]="i > 0"
    >
      <mui-avatar [name]="avatar.name" [src]="avatar.src ?? null" [size]="size()" />
    </div>
  }
  @if (overflowCount() > 0) {
    <div
      class="slot stacked -ml-2 flex rounded-full shadow-[0_0_0_2px_var(--color-bg)] items-center"
    >
      <mui-badge
        variant="count"
        [value]="'+' + overflowCount()"
        [label]="overflowCount() + ' more'"
      />
    </div>
  }
</div>
