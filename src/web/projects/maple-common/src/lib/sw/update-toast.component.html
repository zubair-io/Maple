@if (show()) {
  <div
    class="fixed left-1/2 bottom-4 z-[1000] -translate-x-1/2 flex items-center gap-3 px-4 py-2.5 rounded-lg border border-border bg-surface-alt text-text-main text-sm shadow-lg max-w-[calc(100vw-2rem)]"
    role="status"
    aria-live="polite"
  >
    <span class="flex-1 whitespace-nowrap overflow-hidden text-ellipsis"
      >A new version of Maple is ready.</span
    >
    <button
      type="button"
      class="appearance-none border-0 bg-primary text-bg font-medium text-[13px] px-3 py-[5px] rounded cursor-pointer hover:opacity-90"
      (click)="install()"
      aria-label="Install the new version of Maple now"
    >
      Install
    </button>
    <button
      type="button"
      class="appearance-none border border-border bg-transparent text-text-muted text-[13px] px-2.5 py-[5px] rounded cursor-pointer hover:bg-white/[0.06]"
      (click)="dismiss()"
      aria-label="Dismiss the update notification"
    >
      Later
    </button>
  </div>
}
