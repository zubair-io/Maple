# maple-pano — panorama stitching core (epic #1094).
#
# M0a (#1119) ships the geometry foundation (projection / camera model) and
# the synthetic ground-truth renderer `pano-gt-render` that feeds the §7
# acceptance gates ("recovered rotations within 0.1°; warp RMSE < 0.5% of
# full scale"). Later milestones (M1 geometry solve, M2 compositing, …) land
# in this crate per the eng design spec
# (docs/superpowers/specs/2026-06-10-maple-pano-eng-design-spec.md §3).
[package]
name = "maple-pano"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Synthetic-correspondence generation for geometry gates (M1a, #1138).
# A public feature (not a dev-only module) so later milestones (BA) and
# sibling crates can reuse the generator; the crate's own gate tests
# enable it via `required-features` below. Adds no dependencies.
testkit = []
# Same contract as raw-core's `fixtures` feature (#1082): fixture-backed
# tests (tests/ingest_gates.rs) are `ignored` without it, and fail closed
# (panic on a missing fixture) with it. Enable on fixture-provisioned
# machines only.
fixtures = []
# ALIKED + LightGlue detector/matcher via ONNX Runtime (#1139, spec §5.2).
# Native-only: `ort` has no wasm story here — the web delivery path
# (WebGPU/WASM EP, lazy model fetch) is a later milestone per the eng
# design spec §7. Off by default so the geometry/test surface builds
# without the ONNX dependency tree.
#
# Two variants sharing the same `dep:ort` (M6 #1244 redesign):
#
#   `ml`        — `ort` WITH `ort/load-dynamic` (macOS / host). The dylib
#                 is dlopen'd at runtime from `ORT_DYLIB_PATH`. Includes
#                 a `libloading` preflight probe so ORT's panic-on-missing-
#                 dylib is turned into a typed MlError.
#
#   `ml-static` — `ort` WITHOUT `load-dynamic` (iOS, M6 #1244). ort-sys
#                 sees `ORT_LIB_LOCATION` pointing at the official iOS
#                 static xcframework and links statically.
#                 `OrtRuntime::preflight` calls `ort::init()` directly —
#                 no dlopen, no libloading probe. Includes `ort/std` so
#                 `commit_from_file` compiles (it's gated #[cfg(feature="std")]
#                 in ort; `load-dynamic` implies it on the `ml` path but
#                 `ml-static` must add it explicitly).
#
# When both are active (`--all-features` on host CI), Cargo unifies
# features → `ort/load-dynamic` wins. The `#[cfg(feature = "ml")]` guard
# in `OrtRuntime::preflight` selects the `ort::init_from` path first, so
# host tests pass normally. The `ml-static` path is only reached in iOS
# cross-compilation where `ml` is absent.
ml = ["dep:ort", "ort/load-dynamic", "dep:libloading", "dep:sha2", "dep:toml"]
# `ort/std` is required for `commit_from_file` (which is #[cfg(feature = "std")]
# in ort). `load-dynamic` implies `std`, so the `ml` path gets it transitively;
# `ml-static` must add it explicitly since we omit `load-dynamic`.
ml-static = ["dep:ort", "ort/std", "dep:sha2", "dep:toml"]

[[bin]]
name = "pano-gt-render"
path = "src/bin/pano-gt-render.rs"

# Ingest sanity probe (#1156): decodes real pano frames via
# `raw_core::decode_for_pano`, prints per-channel stats + the EXIF/gimbal
# priors table. Fixture-gated at runtime (takes a directory argument).
[[bin]]
name = "pano-ingest-probe"
path = "src/bin/pano-ingest-probe.rs"

# pano_02 synthetic rotation fixture generator (#1256): deterministic DNG
# writer producing 6 frames from a 180° partial ring for the canvas-tiling
# RSS measurement. The DNGs are gitignored (test-fixtures/raws/pano_02/);
# CI regenerates them via src/scripts/gen_pano_02.sh.
[[bin]]
name = "pano-gen-fixture"
path = "src/bin/pano-gen-fixture/main.rs"


# M1a gate tests need the testkit; `cargo test -p maple-pano` (no
# features) skips them, `--all-features` runs them. Other test targets
# under tests/ remain auto-discovered.
[[test]]
name = "twoview_gates"
path = "tests/twoview_gates.rs"
required-features = ["testkit"]

[[test]]
name = "graph_gates"
path = "tests/graph_gates.rs"
required-features = ["testkit"]

[dependencies]
clap.workspace = true
# `image` reads the optional equirect source PNG (8/16-bit, gray/RGB(A)).
# Its f32 conversion is a pure normalization — no sRGB transfer decode —
# which is exactly the "input is treated as linear" contract documented on
# the renderer.
image.workspace = true
# `png` writes the 16-bit RGB output frames (explicit BitDepth::Sixteen).
png.workspace = true
# RAW decode + scene-linear normalization for the ingest stage (#1156):
# `raw_core::decode_for_pano` is the single pixel source for real frames.
# `avif` on: `stitch/io.rs::write_display_sidecars` writes the pano's own
# `.maple/thumbs/` sidecar directly via `raw_core::avif::encode`.
raw-core = { path = "../raw-core", features = ["avif"] }
# Namespace-aware XMP parsing for the DJI gimbal prior (the two known DJI
# `drone-dji` namespace URI variants force prefix resolution, not string
# matching). Already a workspace dependency via raw-core's sidecar layer.
quick-xml.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# --- `ml` / `ml-static` features (see [features] above) ----------------
# Single `ort` dep for both variants. `ml` adds `ort/load-dynamic` to
# enable dlopen; `ml-static` leaves it off so ort-sys static-links
# (controlled by `ORT_LIB_LOCATION` in the xcframework build script).
ort = { workspace = true, optional = true }
# dlopen pre-flight for the onnxruntime dylib (`ml` path only).
# `ort` with `load-dynamic` panics when the dylib is missing/unloadable;
# the loader probes with libloading first and returns a typed MlError.
# Not needed for `ml-static` — no dlopen occurs.
libloading = { workspace = true, optional = true }
# SHA-256 verification of model files against models.toml.
sha2 = { workspace = true, optional = true }
# models.toml manifest parsing.
toml = { workspace = true, optional = true }

[[test]]
name = "ba_gates"
path = "tests/ba_gates.rs"
required-features = ["testkit"]

# Stage F local alignment integration tests (#1218).
[[test]]
name = "local_align_gates"
path = "tests/local_align_gates.rs"
required-features = ["testkit"]

[[test]]
name = "ml_glue"
path = "tests/ml_glue.rs"
required-features = ["ml"]
