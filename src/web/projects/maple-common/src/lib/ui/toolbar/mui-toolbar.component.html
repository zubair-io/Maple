<div class="mui-toolbar flex items-center gap-1" role="toolbar">
  @for (entry of split().visible; track $index) {
    @if (asItem(entry); as item) {
      <mui-action-button
        [icon]="item.icon"
        [label]="item.label"
        size="sm"
        [disabled]="item.disabled ?? false"
        (pressed)="press(item)"
      />
    } @else {
      <mui-divider orientation="vertical" />
    }
  }
  @if (split().overflow.length > 0) {
    <div class="overflow-anchor relative flex">
      <mui-action-button
        icon="ellipsis-horizontal"
        label="More"
        size="sm"
        (pressed)="overflowOpen.set(!overflowOpen())"
      />
      <mui-popover
        [open]="overflowOpen()"
        placement="bottom"
        (closeRequested)="overflowOpen.set(false)"
      >
        <div class="overflow-menu flex flex-col gap-[2px] p-1 min-w-[160px]">
          @for (item of split().overflow; track item.id) {
            <button
              type="button"
              class="overflow-item mui-chrome-menu-item-base enabled:hover:bg-bg-hover disabled:cursor-not-allowed disabled:opacity-45"
              [disabled]="item.disabled ?? false"
              (click)="selectOverflow(item)"
            >
              <mui-icon [name]="item.icon" size="sm" />
              <mui-text variant="body">{{ item.label }}</mui-text>
            </button>
          }
        </div>
      </mui-popover>
    </div>
  }
</div>
