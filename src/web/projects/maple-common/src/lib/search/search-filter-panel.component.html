<div class="panel" data-testid="filter-panel">
  @if (asSheet()) {
    <div class="grab" aria-hidden="true"></div>
  }
  <header class="head">
    <h2 class="title">Filters</h2>
    @if (asSheet()) {
      <button
        type="button"
        class="close"
        aria-label="Close filters"
        data-testid="filter-close"
        (click)="dismiss.emit()"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path
            d="M3.5 3.5l7 7M10.5 3.5l-7 7"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
    }
  </header>

  <div class="body">
    <section class="section">
      <h3 class="eyebrow">Date range</h3>
      <div class="preset-row">
        @for (p of presets; track p.id) {
          <button
            type="button"
            class="preset"
            [class.active]="filters().datePreset === p.id"
            [attr.aria-pressed]="filters().datePreset === p.id"
            [attr.data-testid]="'filter-preset-' + p.id"
            (click)="onPreset(p.id)"
          >
            {{ p.label }}
          </button>
        }
      </div>
      <div class="range-row">
        <input
          type="date"
          class="date"
          aria-label="From date"
          data-testid="filter-date-from"
          [value]="filters().from ?? ''"
          (change)="onFrom($event)"
        />
        <input
          type="date"
          class="date"
          aria-label="To date"
          data-testid="filter-date-to"
          [value]="filters().to ?? ''"
          (change)="onTo($event)"
        />
      </div>
    </section>

    <app-search-facet-section
      title="People"
      kind="person"
      [rows]="peopleRows()"
      emptyLabel="No named people yet"
      (rowToggle)="onPerson($event)"
    />
    <app-search-facet-section
      title="Places"
      kind="place"
      [rows]="placeRows()"
      emptyLabel="No geocoded places yet"
      (rowToggle)="onPlace($event)"
    />
  </div>

  <footer class="foot">
    <button
      type="button"
      class="btn secondary"
      data-testid="filter-clear-all"
      (click)="clearAll.emit()"
    >
      Clear all
    </button>
    <button type="button" class="btn primary" data-testid="filter-apply" (click)="dismiss.emit()">
      {{ showLabel() }}
    </button>
  </footer>
</div>
