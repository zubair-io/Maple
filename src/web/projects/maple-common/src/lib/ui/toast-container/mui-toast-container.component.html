<div class="mui-toast-container" [class]="'position-' + position()" [class.is-inline]="inline()">
  @for (toast of toasts(); track toast.id; let i = $index) {
    <div class="slot" [style.transition-delay.ms]="i * exitStaggerMs">
      <mui-toast
        [variant]="toast.variant"
        [message]="toast.message"
        [actionLabel]="toast.actionLabel ?? null"
        [autoDismissMs]="toast.autoDismissMs ?? null"
        (actionPressed)="actionPressed.emit(toast.id)"
        (dismissed)="dismissed.emit(toast.id)"
      />
    </div>
  }
</div>
