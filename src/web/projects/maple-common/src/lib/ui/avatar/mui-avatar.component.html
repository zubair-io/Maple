<div
  class="mui-avatar relative flex-none rounded-full overflow-visible"
  [class]="'size-' + size() + ' ' + sizeClasses()"
>
  @if (showImage()) {
    <img
      class="photo block w-full h-full rounded-full object-cover"
      [src]="src()!"
      [alt]="name()"
      (error)="onError()"
    />
  } @else {
    <div
      class="fallback flex items-center justify-center w-full h-full rounded-full font-semibold"
      [style.background]="fallbackColor().bg"
      [style.color]="fallbackColor().fg"
      role="img"
      [attr.aria-label]="name()"
    >
      {{ initials() }}
    </div>
  }
  @if (presence()) {
    <span
      class="presence absolute right-0 bottom-0 w-[30%] h-[30%] min-w-2 min-h-2 rounded-full border-2 border-bg"
      [class]="'presence-' + presence() + ' ' + presenceClasses()"
      [attr.aria-label]="presence()"
    ></span>
  }
</div>
