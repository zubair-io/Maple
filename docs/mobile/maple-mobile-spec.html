    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const loading = document.getElementById('__bundler_loading');
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          'error',
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById('__bundler_err') ||
              p.appendChild(document.createElement('div'));
            d.id = '__bundler_err';
            d.style.cssText =
              'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
              '[bundle] ' +
              (e.message || e.type) +
              (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
          },
          true,
        );

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
          const templateEl = document.querySelector('script[type="__bundler/template"]');
          if (!manifestEl || !templateEl) {
            setStatus('Error: missing bundle data');
            console.error(
              '[bundler] Missing script tags — manifestEl:',
              !!manifestEl,
              'templateEl:',
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus('Unpacking ' + uuids.length + ' assets...');

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('gzip');
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      'DecompressionStream not available, asset ' + uuid + ' may not render',
                    );
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
              } catch (err) {
                console.error('Failed to decode asset ' + uuid + ':', err);
                blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
              }
            }),
          );

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus('Rendering...');
          for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, '')
            .replace(/\s+crossorigin="[^"]*"/gi, '');

          const resourceScript =
            '<script>window.__resources = ' +
            JSON.stringify(resourceMap)
              .split('</' + 'script>')
              .join('<\\/' + 'script>') +
            ';</' +
            'script>';
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template = template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, 'text/html');
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement('script');
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute('src');
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus('Error unpacking: ' + err.message);
          console.error('Bundle unpack error:', err);
        }
      });
    </script>

 U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Merriweather';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"5c6dd2c6-7a85-4e65-9f4f-534486176051\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Merriweather';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"274a5148-df64-4f42-af25-ab6e4c4a1a1c\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Merriweather';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"af5e2940-a03c-4b47-bd57-ee057f733f20\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Merriweather';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"ced9a446-1285-4078-b17b-b85c54f76b02\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Merriweather';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"a7fc74ae-ec72-4bc7-9088-a3635dc55ed6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Merriweather';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"5c6dd2c6-7a85-4e65-9f4f-534486176051\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --bg: #faf8f5;\n    --ink: #1a1815;\n    --ink-2: #3d3a36;\n    --muted: #6f6a64;\n    --rule: #d8d3cb;\n    --rule-strong: #a8a29e;\n    --accent: #c4493a;\n    --accent-dim: #f5e4e0;\n    --chip-bg: #efeae2;\n    --code-bg: #f1ece4;\n    --warn: #a65a1a;\n    --ok: #2f7a4f;\n    --serif: \"Merriweather\", \"Iowan Old Style\", \"Charter\", \"Georgia\", serif;\n    --sans: \"Lato\", -apple-system, BlinkMacSystemFont, \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    --mono: \"JetBrains Mono\", \"SF Mono\", ui-monospace, Menlo, monospace;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }\n  body {\n    font-family: var(--serif);\n    font-size: 14.5px;\n    line-height: 1.65;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  .page {\n    max-width: 820px;\n    margin: 0 auto;\n    padding: 72px 72px 120px;\n  }\n\n  /* Header */\n  .doc-header {\n    display: flex; align-items: flex-end; justify-content: space-between;\n    gap: 24px; padding-bottom: 20px; margin-bottom: 40px;\n    border-bottom: 0.5px solid var(--rule-strong);\n  }\n  .doc-title {\n    font-family: var(--sans);\n    font-size: 32px; font-weight: 900; letter-spacing: -0.01em;\n    margin: 0 0 4px;\n  }\n  .doc-sub { color: var(--muted); font-size: 13px; margin: 0; }\n  .meta {\n    font-family: var(--mono); font-size: 11px; color: var(--muted);\n    text-align: right; line-height: 1.7;\n    white-space: nowrap;\n  }\n  .meta b { color: var(--ink); font-weight: 500; }\n\n  /* Callouts */\n  .tldr {\n    background: var(--accent-dim);\n    border-left: 2px solid var(--accent);\n    padding: 14px 18px;\n    margin: 0 0 36px;\n    font-size: 14px;\n  }\n  .tldr h3 {\n    font-family: var(--sans); font-size: 10px; font-weight: 700;\n    letter-spacing: 0.14em; text-transform: uppercase;\n    color: var(--accent); margin: 0 0 6px;\n  }\n\n  /* Typography */\n  h1, h2, h3, h4 { font-family: var(--sans); color: var(--ink); }\n  h2 {\n    font-size: 12px; font-weight: 700;\n    letter-spacing: 0.16em; text-transform: uppercase;\n    color: var(--accent);\n    margin: 48px 0 14px;\n    padding-bottom: 6px;\n    border-bottom: 0.5px solid var(--rule);\n  }\n  h2 .num {\n    font-family: var(--mono); color: var(--muted);\n    font-weight: 400; margin-right: 8px;\n  }\n  h3 {\n    font-size: 18px; font-weight: 700; letter-spacing: -0.005em;\n    margin: 28px 0 8px;\n  }\n  h4 {\n    font-size: 13px; font-weight: 700;\n    margin: 18px 0 4px; color: var(--ink-2);\n  }\n  p { margin: 0 0 10px; color: var(--ink-2); }\n\n  /* Lists */\n  ul, ol { margin: 0 0 14px; padding-left: 22px; color: var(--ink-2); }\n  li { margin-bottom: 4px; }\n  li::marker { color: var(--rule-strong); }\n\n  /* Definition-style rows */\n  .defs { margin: 6px 0 18px; }\n  .defs div { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 5px 0; border-bottom: 0.5px dotted var(--rule); }\n  .defs dt { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }\n  .defs dd { margin: 0; color: var(--ink-2); font-size: 13.5px; }\n\n  /* Key/chip/label tokens */\n  .k {\n    display: inline-block;\n    font-family: var(--mono); font-size: 11px;\n    padding: 1px 6px; border-radius: 3px;\n    background: #fff; border: 0.5px solid var(--rule-strong);\n    box-shadow: 0 1px 0 var(--rule);\n    color: var(--ink); white-space: nowrap;\n    margin: 0 1px;\n  }\n  .tag {\n    display: inline-block;\n    font-family: var(--mono); font-size: 10.5px;\n    padding: 1px 5px; border-radius: 3px;\n    background: var(--chip-bg); color: var(--ink-2);\n  }\n  .tag.accent { background: var(--accent-dim); color: var(--accent); }\n  .tag.warn   { background: #fbe8d8; color: var(--warn); }\n  .tag.ok     { background: #dcece2; color: var(--ok); }\n  code {\n    font-family: var(--mono); font-size: 12.5px;\n    background: var(--code-bg); padding: 1px 5px;\n    border-radius: 3px; color: var(--ink);\n  }\n\n  /* Tables */\n  table {\n    width: 100%; border-collapse: collapse;\n    margin: 8px 0 18px;\n    font-size: 13px;\n  }\n  th, td {\n    padding: 7px 10px; text-align: left; vertical-align: top;\n    border-bottom: 0.5px solid var(--rule);\n  }\n  th {\n    font-family: var(--sans); font-size: 10.5px; font-weight: 700;\n    letter-spacing: 0.08em; text-transform: uppercase;\n    color: var(--muted); border-bottom: 0.5px solid var(--rule-strong);\n  }\n  td.mono, th.mono, table.mono td { font-family: var(--mono); font-size: 12px; }\n  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }\n\n  /* Note boxes */\n  .note {\n    border: 0.5px solid var(--rule);\n    padding: 10px 14px; margin: 10px 0 16px;\n    background: #fff;\n    font-size: 13px; color: var(--ink-2);\n  }\n  .note b { color: var(--ink); }\n\n  /* ASCII diagram */\n  .ascii {\n    font-family: var(--mono); font-size: 11.5px; line-height: 1.45;\n    background: #fff; padding: 16px 18px;\n    border: 0.5px solid var(--rule);\n    white-space: pre;\n    overflow-x: auto;\n    color: var(--ink);\n    margin: 6px 0 20px;\n  }\n\n  /* Footer */\n  .footer {\n    margin-top: 64px; padding-top: 18px;\n    border-top: 0.5px solid var(--rule);\n    font-family: var(--mono); font-size: 10.5px;\n    color: var(--muted);\n    display: flex; justify-content: space-between;\n  }\n\n  /* TOC */\n  .toc {\n    font-family: var(--sans);\n    font-size: 13px; margin: 0 0 28px;\n    columns: 2; column-gap: 32px;\n    color: var(--ink-2);\n  }\n  .toc a {\n    color: var(--ink-2); text-decoration: none;\n    display: block; padding: 2px 0;\n    border-bottom: 0.5px dotted transparent;\n  }\n  .toc a:hover { color: var(--accent); }\n  .toc .num { font-family: var(--mono); color: var(--muted); margin-right: 8px; }\n\n  /* Print */\n  @media print {\n    body { background: #fff; }\n    .page { padding: 0; max-width: none; }\n    h2 { page-break-after: avoid; }\n    h3, h4 { page-break-after: avoid; }\n    table, .ascii, .note, .tldr { page-break-inside: avoid; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\">\n\n<header class=\"doc-header\">\n  <div>\n    <p class=\"doc-sub\">Maple · Mobile Interaction Specification<\u002Fp>\n    <h1 class=\"doc-title\">Mobile Library &amp; Editor<\u002Fh1>\n  <\u002Fdiv>\n  <div class=\"meta\">\n    <div>version <b>0.1 (draft)<\u002Fb><\u002Fdiv>\n    <div>owner <b>Design<\u002Fb><\u002Fdiv>\n    <div>audience <b>Eng<\u002Fb><\u002Fdiv>\n    <div>status <b>for review<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section class=\"tldr\">\n  <h3>TL;DR<\u002Fh3>\n  <p style=\"margin:0\">The Maple mobile app is a touch-first companion to the desktop. It has two flows: <b>Library<\u002Fb> (square photo grid → loupe; folder menu in a left drawer; search) and <b>Editor<\u002Fb> (loupe → group-tabbed tool row → single drag bar, with an info bottom sheet for EXIF + rating). There is no bottom tab bar; navigation is hierarchical (drawer / push / sheet). This spec defines screen anatomy, gestures, transitions, state, and the touch-target contract.<\u002Fp>\n<\u002Fsection>\n\n<nav class=\"toc\">\n  <a href=\"#s-1\"><span class=\"num\">01<\u002Fspan>Form factor &amp; scope<\u002Fa>\n  <a href=\"#s-2\"><span class=\"num\">02<\u002Fspan>Information architecture<\u002Fa>\n  <a href=\"#s-3\"><span class=\"num\">03<\u002Fspan>Library — Grid<\u002Fa>\n  <a href=\"#s-4\"><span class=\"num\">04<\u002Fspan>Library — Folder menu<\u002Fa>\n  <a href=\"#s-5\"><span class=\"num\">05<\u002Fspan>Library — Search<\u002Fa>\n  <a href=\"#s-6\"><span class=\"num\">06<\u002Fspan>Library — Full image<\u002Fa>\n  <a href=\"#s-7\"><span class=\"num\">07<\u002Fspan>Editor — Anatomy<\u002Fa>\n  <a href=\"#s-8\"><span class=\"num\">08<\u002Fspan>Editor — Tool model<\u002Fa>\n  <a href=\"#s-9\"><span class=\"num\">09<\u002Fspan>Editor — Drag bar &amp; values<\u002Fa>\n  <a href=\"#s-10\"><span class=\"num\">10<\u002Fspan>Info sheet<\u002Fa>\n  <a href=\"#s-11\"><span class=\"num\">11<\u002Fspan>Gestures &amp; haptics<\u002Fa>\n  <a href=\"#s-12\"><span class=\"num\">12<\u002Fspan>Persistence &amp; deep links<\u002Fa>\n  <a href=\"#s-13\"><span class=\"num\">13<\u002Fspan>Motion &amp; visual tokens<\u002Fa>\n<\u002Fnav>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-1\"><span class=\"num\">01<\u002Fspan>Form factor &amp; scope<\u002Fh2>\n\n<h3>Devices<\u002Fh3>\n<p>iPhone (iOS 17+) and Android (Pixel-class, API 33+). Designed at 402×874 logical points (iPhone 16 baseline); layouts must work down to 360pt wide and up to 430pt. Tablet is explicitly out of scope for v0.1 — tablets get the desktop layout in a future release.<\u002Fp>\n\n<h3>Orientations<\u002Fh3>\n<p>Portrait only. Landscape is allowed for the Library Full-image view (loupe goes full-bleed) but is disabled in the Editor — rotating the device while editing keeps the UI portrait.<\u002Fp>\n\n<h3>Theme<\u002Fh3>\n<p>Dark UI on photo content, all surfaces. No light mode in v0.1 — pickers and split views are designed exclusively against the dark token set in §13.<\u002Fp>\n\n<h3>Out of scope (v0.1)<\u002Fh3>\n<ul>\n  <li>Importing photos from camera roll, iCloud, or USB.<\u002Fli>\n  <li>Sharing / export sheets — the export icon in the editor header is a stub.<\u002Fli>\n  <li>Multi-select on the grid (no batch flag / rate / delete).<\u002Fli>\n  <li>Cropping, healing, masks, AI tools.<\u002Fli>\n  <li>Background sync / offline thumb caching is governed by the desktop pipeline; the mobile client just renders what the server returns.<\u002Fli>\n<\u002Ful>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-2\"><span class=\"num\">02<\u002Fspan>Information architecture<\u002Fh2>\n\n<p>There is <b>no bottom tab bar<\u002Fb>. Navigation is hierarchical. The Library is the root; everything else is a push or a modal sheet/drawer over it.<\u002Fp>\n\n<div class=\"ascii\">Library (grid)                       ← root\n├─ Folder menu        (left drawer; modal)\n├─ Search             (push; replaces grid)\n├─ Full image         (push; loupe)\n└─ Editor             (push from Full)\n   └─ Info sheet      (bottom sheet)<\u002Fdiv>\n\n<table>\n  <tbody><tr><th style=\"width:140px\">Surface<\u002Fth><th>How it opens<\u002Fth><th>How it dismisses<\u002Fth><\u002Ftr>\n  <tr><td>Folder menu<\u002Ftd><td>Hamburger in Library header; edge-swipe from left<\u002Ftd><td>X button; scrim tap; swipe-left<\u002Ftd><\u002Ftr>\n  <tr><td>Search<\u002Ftd><td>Search field tap inside Folder menu, or search icon in source-row context<\u002Ftd><td>Cancel; back swipe<\u002Ftd><\u002Ftr>\n  <tr><td>Full image<\u002Ftd><td>Tap a grid tile<\u002Ftd><td>Back chevron; swipe-down<\u002Ftd><\u002Ftr>\n  <tr><td>Editor<\u002Ftd><td>Tap an edit affordance inside Full image (or open from a \"pick\" notification)<\u002Ftd><td>Back; <span class=\"k\">Save<\u002Fspan> commits and pops<\u002Ftd><\u002Ftr>\n  <tr><td>Info sheet<\u002Ftd><td><code>i<\u002Fcode> icon in editor header<\u002Ftd><td>X; swipe-down; grab-handle drag<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<div class=\"note\"><b>Why no tab bar:<\u002Fb> Library, Picks, Albums, and You all collapse into the Folder menu. The grid is the workhorse — keeping it edge-to-edge buys ~70pt of vertical photo area on every screen and removes a global persistent surface that would compete with the editor's tool row.<\u002Fdiv>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-3\"><span class=\"num\">03<\u002Fspan>Library — Grid<\u002Fh2>\n\n<h3>Anatomy<\u002Fh3>\n<div class=\"ascii\">┌────────────────── status bar (54pt) ──────────────────┐\n│ ☰   MAPLE                                       ⋯     │  ← header (36pt)\n│ France trip                                           │  ← title (28pt, 700)\n│ ┌─All─┐ ┌Picks┐ ┌4+ stars┐ ┌Edited┐                   │  ← chips\n├───────────────────────────────────────────────────────┤\n│ ▦▦▦                                                   │\n│ ▦▦▦                                                   │  ← 3-col square grid\n│ ▦▦▦                                                   │     2pt gaps, edge-bleed\n│ ▦▦▦                                                   │\n└───────────────────────────────────────────────────────┘<\u002Fdiv>\n\n<h3>Grid layout<\u002Fh3>\n<ul>\n  <li>3 columns, <code>aspect-ratio: 1 / 1<\u002Fcode> (square crops, center-cover).<\u002Fli>\n  <li>2pt gap between cells, 2pt outer padding only on left/right — top/bottom of the grid runs to the edge.<\u002Fli>\n  <li>The grid is the only vertically scrollable region. The header (hamburger, title, chips) scrolls with content; it does <i>not<\u002Fi> stick.<\u002Fli>\n<\u002Ful>\n\n<h3>Cell badges<\u002Fh3>\n<table>\n  <tbody><tr><th style=\"width:120px\">Badge<\u002Fth><th>Visual<\u002Fth><th>Position<\u002Fth><\u002Ftr>\n  <tr><td>Pick<\u002Ftd><td>6pt green dot<\u002Ftd><td>top-left, 4pt inset<\u002Ftd><\u002Ftr>\n  <tr><td>Stars (≥4)<\u002Ftd><td>row of 6pt star glyphs<\u002Ftd><td>bottom-left, 4pt inset<\u002Ftd><\u002Ftr>\n  <tr><td>Reject<\u002Ftd><td><i>v0.2<\u002Fi><\u002Ftd><td>—<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Chips<\u002Fh3>\n<p>Single-select. <code>All / Picks / 4+ stars / Edited<\u002Fcode>. Active chip uses <code>${accent}22<\u002Fcode> fill + accent border + accent text. Tap target ≥ 28pt tall (chip itself is 22pt, padded with a transparent hit area).<\u002Fp>\n\n<h3>Interactions<\u002Fh3>\n<table>\n  <tbody><tr><th>Gesture<\u002Fth><th>Target<\u002Fth><th>Effect<\u002Fth><\u002Ftr>\n  <tr><td>Tap<\u002Ftd><td>cell<\u002Ftd><td>Push Full image with the tapped <code>id<\u002Fcode>.<\u002Ftd><\u002Ftr>\n  <tr><td>Long-press<\u002Ftd><td>cell<\u002Ftd><td><i>v0.2<\u002Fi> — context menu (pick / rate / open in editor / share).<\u002Ftd><\u002Ftr>\n  <tr><td>Tap<\u002Ftd><td>chip<\u002Ftd><td>Set filter. Selection state is not preserved across filters.<\u002Ftd><\u002Ftr>\n  <tr><td>Tap<\u002Ftd><td>hamburger<\u002Ftd><td>Open Folder menu drawer.<\u002Ftd><\u002Ftr>\n  <tr><td>Tap<\u002Ftd><td>⋯<\u002Ftd><td>Source-level overflow menu (sort, view options).<\u002Ftd><\u002Ftr>\n  <tr><td>Edge swipe<\u002Ftd><td>left edge<\u002Ftd><td>Open Folder menu drawer.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-4\"><span class=\"num\">04<\u002Fspan>Library — Folder menu<\u002Fh2>\n\n<p>A left-anchored modal drawer over a dimmed Library grid. 326pt wide on a 402pt screen (leaves 76pt of the dim grid visible on the right so the user knows it's modal). Rounded corners on the trailing edge; <code>borderTopRightRadius / borderBottomRightRadius: 18pt<\u002Fcode>; <code>12px 0 40px rgba(0,0,0,0.5)<\u002Fcode> shadow trails to the right.<\u002Fp>\n\n<h3>Anatomy<\u002Fh3>\n<table>\n  <tbody><tr><th style=\"width:140px\">Region<\u002Fth><th>Contents<\u002Fth><\u002Ftr>\n  <tr><td>Header<\u002Ftd><td><code>LIBRARY<\u002Fcode> eyebrow, close X (right). Connection identity (e.g. <code>maple.lawrence.io<\u002Fcode>) + chevron — taps open a Maple-instance switcher (out of scope v0.1). Tertiary line: total photos + last sync.<\u002Ftd><\u002Ftr>\n  <tr><td>Search<\u002Ftd><td>Pill input. Tap opens the Search screen with the field focused; the drawer dismisses underneath.<\u002Ftd><\u002Ftr>\n  <tr><td>Folders<\u002Ftd><td>SOURCE_HEADER (\"Folders\") + nested rows. Each row is 38pt tall with a chevron, label, and a tabular-nums count.<\u002Ftd><\u002Ftr>\n  <tr><td>Photos Library<\u002Ftd><td>Smart sources: All / Favorites / Picks / Rejects.<\u002Ftd><\u002Ftr>\n  <tr><td>Albums<\u002Ftd><td>User-named albums with a trailing <code>＋<\u002Fcode> on the header to add.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Drawer behavior<\u002Fh3>\n<ul>\n  <li>Opens in 240ms with a translate-X + scrim-fade (no spring; iOS-style ease out).<\u002Fli>\n  <li>Dismiss: X, scrim tap, or pan-left ≥ 30% of drawer width.<\u002Fli>\n  <li>While the drawer is open, the underlying grid is non-interactive and dim (45% scrim).<\u002Fli>\n  <li>Tapping any source row closes the drawer and updates the grid's title + content. There is no separate \"Apply\" affordance — selection commits on tap.<\u002Fli>\n<\u002Ful>\n\n<div class=\"note\"><b>Source switching:<\u002Fb> Switching sources is fast — no transition on the grid itself; the new content fades-cross-fade in 120ms while the chips reset to <code>All<\u002Fcode>.<\u002Fdiv>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-5\"><span class=\"num\">05<\u002Fspan>Library — Search<\u002Fh2>\n\n<p>A full-screen push from the Folder menu's search field (the drawer drops away on push so the user lands directly on Search results).<\u002Fp>\n\n<h3>Anatomy<\u002Fh3>\n<div class=\"ascii\">┌── status (54pt) ──────────────────────────────────────┐\n│ ┌ 🔍 paris│                                  Cancel   │  ← search bar (38pt) + Cancel\n│ ┌All─┐┌Photos┐┌Places┐┌People┐┌Albums┐                │  ← scope chips\n├───────────────────────────────────────────────────────┤\n│ TOP HITS                                              │\n│ ┌─┐  Paris, FR              482 photos · 2024-2026 …  │\n│ ┌─┐  Paris                  128 photos · shared    …  │\n│ ┌─┐  paris                  1,204 photos           …  │\n├───────────────────────────────────────────────────────┤\n│ PHOTOS · 1,204                          See all       │\n│ ▦▦▦                                                   │  ← 3x3 preview\n│ ▦▦▦                                                   │\n│ ▦▦▦                                                   │\n├───────────────────────────────────────────────────────┤\n│ RECENT                                                │\n│ 🔍 maui   🔍 golden hour   🔍 Sumac   🔍 film scans … │\n└───────────────────────────────────────────────────────┘<\u002Fdiv>\n\n<h3>Search bar<\u002Fh3>\n<ul>\n  <li>Auto-focuses on entry; the keyboard slides up.<\u002Fli>\n  <li>Caret is the accent color, 1.5pt wide, blink interval 500ms.<\u002Fli>\n  <li>Trailing clear-circle (✕) appears once the query has ≥1 char.<\u002Fli>\n  <li>Cancel is text-only, accent-colored; tapping it pops the screen and discards the query.<\u002Fli>\n<\u002Ful>\n\n<h3>Scopes<\u002Fh3>\n<p>Single-select. <code>All / Photos / Places / People / Albums<\u002Fcode>. Default <code>All<\u002Fcode>. Changing a scope refilters both Top Hits and the photo grid in-place without re-fetching the query.<\u002Fp>\n\n<h3>Sections<\u002Fh3>\n<table>\n  <tbody><tr><th style=\"width:130px\">Section<\u002Fth><th>Content<\u002Fth><\u002Ftr>\n  <tr><td>Top Hits<\u002Ftd><td>Up to 3 mixed-kind hits — Place, Album, Keyword, Person. Each row: 36pt rounded thumb (or icon for non-photo hits), label with the query token wrapped in <code>&lt;span style=\"color:accent;font-weight:600\"&gt;<\u002Fcode>, sub label, kind tag.<\u002Ftd><\u002Ftr>\n  <tr><td>Photos<\u002Ftd><td>Section header with count + \"See all\". 3-col square grid, 9-tile preview.<\u002Ftd><\u002Ftr>\n  <tr><td>Recent<\u002Ftd><td>Chip row of last 10 queries. Tap → repeats the query.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>States<\u002Fh3>\n<ul>\n  <li><b>Empty query.<\u002Fb> Skip Top Hits and Photos; show Recent only.<\u002Fli>\n  <li><b>No results.<\u002Fb> Replace the Top Hits / Photos sections with a single centered muted line: <code>No matches for \"{q}\"<\u002Fcode>.<\u002Fli>\n  <li><b>Stale.<\u002Fb> While typing, the grid is dimmed at 60% opacity until results arrive; no spinner.<\u002Fli>\n<\u002Ful>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-6\"><span class=\"num\">06<\u002Fspan>Library — Full image<\u002Fh2>\n\n<p>The loupe view. Pushed from a grid tap. Image is letterboxed against <code>imageCanvas<\u002Fcode> (#141210). Status bar is the only top chrome; everything else is transient.<\u002Fp>\n\n<h3>Top transient chrome<\u002Fh3>\n<p>Header overlay appears on tap; auto-hides after 2.5s of inactivity. Contents (L→R): Back chevron · filename (mono, 12pt) · share icon · \"Edit\" pill (accent fill) · info (i) icon.<\u002Fp>\n\n<h3>Filmstrip (optional)<\u002Fh3>\n<p>Bottom-anchored row of 44×44 thumbs, 4pt gaps, scroll-snap to center. The active thumb has a 1.5pt accent outline (inset). Tweak: <code>filmstrip<\u002Fcode> toggle hides/shows it.<\u002Fp>\n\n<h3>Gestures<\u002Fh3>\n<table>\n  <tbody><tr><th>Gesture<\u002Fth><th>Effect<\u002Fth><\u002Ftr>\n  <tr><td>Single tap<\u002Ftd><td>Toggle chrome (header + filmstrip).<\u002Ftd><\u002Ftr>\n  <tr><td>Double tap<\u002Ftd><td>Zoom toggle (1× ↔ 2.5× centered on the tap point).<\u002Ftd><\u002Ftr>\n  <tr><td>Pinch<\u002Ftd><td>Free zoom <code>[1, 6]<\u002Fcode>. Pan applies above 1×.<\u002Ftd><\u002Ftr>\n  <tr><td>Swipe horizontal<\u002Ftd><td>Previous / next image in the filtered list. Snaps; no carousel preview.<\u002Ftd><\u002Ftr>\n  <tr><td>Swipe down<\u002Ftd><td>Dismiss to grid. Velocity ≥ 1200 px/s, or distance ≥ 25% screen height. Image scales toward its origin grid cell.<\u002Ftd><\u002Ftr>\n  <tr><td>Long press<\u002Ftd><td><i>v0.2<\u002Fi> — quick-look context menu.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-7\"><span class=\"num\">07<\u002Fspan>Editor — Anatomy<\u002Fh2>\n\n<p>The editor is the only screen with edit-state semantics. Every adjustment is non-destructive; the only commit point is <span class=\"k\">Save<\u002Fspan>, which writes to the XMP sidecar (per the desktop spec §07). Back without Save discards in-session adjustments and returns to Full image.<\u002Fp>\n\n<h3>Layout<\u002Fh3>\n<div class=\"ascii\">┌── status bar (54pt) ──────────────────────────────────┐\n│ ‹   IMG_1044.CR3                  ↺   ⇪   i           │  ← header (44pt)\n├───────────────────────────────────────────────────────┤\n│         ┌─ Light · Exposure  +25 ─┐                   │  ← value chip\n│                                                       │\n│            ███████████████████                        │\n│            █                  █                       │  ← image canvas\n│            █                  █                          (88% width, 3:2 cap)\n│            █                  █\n│            ███████████████████\n│\n├───── filmstrip (optional, 48pt) ──────────────────────┤\n│ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ ▭ │\n├───────────────────────────────────────────────────────┤\n│              ──── tick scale w/ marker ────           │  ← drag bar (30pt)\n├───────────────────────────────────────────────────────┤\n│  Light │ Color │ Effects │ Detail                     │  ← group tabs (32pt)\n│ ┌──┐  ┌──┐  ┌──┐  ┌──┐  ┌──┐  ┌──┐                    │  ← tool pills (40pt)\n│ Exp   Con   Hi    Sh    Wh    Bl                      │  ← labels (10pt)\n└───────────────────────────────────────────────────────┘<\u002Fdiv>\n\n<h3>Header<\u002Fh3>\n<table>\n  <tbody><tr><th style=\"width:130px\">Control<\u002Fth><th>Behavior<\u002Fth><\u002Ftr>\n  <tr><td>Back ‹<\u002Ftd><td>Pops to Full image. Discards in-session edits with no confirmation in v0.1 (see §14).<\u002Ftd><\u002Ftr>\n  <tr><td>Filename<\u002Ftd><td>Mono, 12pt, ellipsised. Single-line; never wraps.<\u002Ftd><\u002Ftr>\n  <tr><td>Undo ↺<\u002Ftd><td>Per-edit undo (tap), redo (long-press). 32 step ring buffer.<\u002Ftd><\u002Ftr>\n  <tr><td>Share ⇪<\u002Ftd><td><i>Stub v0.1<\u002Fi>.<\u002Ftd><\u002Ftr>\n  <tr><td>Info <i>i<\u002Fi><\u002Ftd><td>Opens the Info bottom sheet (§10).<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Value chip (canvas overlay)<\u002Fh3>\n<p>Top-center, 14pt above the canvas. Rounded pill, <code>rgba(15,13,11,0.6)<\u002Fcode> fill, <code>backdrop-filter: blur(6px)<\u002Fcode>. Contents:<\u002Fp>\n<ul>\n  <li>Mono uppercase group (\"LIGHT\") in muted color.<\u002Fli>\n  <li>1pt vertical rule.<\u002Fli>\n  <li>Mono uppercase tool name (\"EXPOSURE\") in muted color.<\u002Fli>\n  <li>Mono signed value (\"+25\") in accent color, tabular-nums.<\u002Fli>\n<\u002Ful>\n<p>The chip is always rendered — even at value 0 — so the user always sees what's currently armed.<\u002Fp>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-8\"><span class=\"num\">08<\u002Fspan>Editor — Tool model<\u002Fh2>\n\n<h3>Two-level: group tabs + tool row<\u002Fh3>\n<p>Tools are organized into 4 groups. The selected group's tools render as a single horizontal row of pills below the tabs. Both rows are always visible — there is no carousel and no horizontal scrolling among tools.<\u002Fp>\n\n<table>\n  <tbody><tr><th>Group<\u002Fth><th>Tools<\u002Fth><\u002Ftr>\n  <tr><td>Light<\u002Ftd><td>Exposure · Contrast · Highlights · Shadows · Whites · Blacks<\u002Ftd><\u002Ftr>\n  <tr><td>Color<\u002Ftd><td>Temp · Tint · Vibrance · Saturation · HSL<\u002Ftd><\u002Ftr>\n  <tr><td>Effects<\u002Ftd><td>Clarity · Texture · Dehaze · Vignette · Grain · Split tone<\u002Ftd><\u002Ftr>\n  <tr><td>Detail<\u002Ftd><td>Sharpen · Noise · Color NR · Crop · Presets<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Group tabs<\u002Fh3>\n<p>Equal-width, 4 across. 32pt tall. Selected tab gets accent-colored 600-weight label and a 1.5pt accent underline. Tap to switch groups; the tool row swaps in 120ms with a cross-fade — no horizontal slide.<\u002Fp>\n\n<h3>Tool pills<\u002Fh3>\n<p>Each tool: a 40pt circular icon button stacked over a 10pt label. Layout is <code>flex: 1<\u002Fcode> — the row fills the width and tool count drives spacing.<\u002Fp>\n<ul>\n  <li><b>Default.<\u002Fb> 40pt circle, <code>surface2<\u002Fcode> fill, 0.5pt border, icon in default ink.<\u002Fli>\n  <li><b>Selected.<\u002Fb> Circle fill <code>${accent}26<\u002Fcode>, accent border, icon recolored to accent. Label is accent + 600.<\u002Fli>\n  <li><b>Modified indicator.<\u002Fb> A 6pt dot at bottom-right of the icon circle if the tool's current value is non-zero. Dot color: accent for positive, muted for negative.<\u002Fli>\n<\u002Ful>\n\n<h3>Selection<\u002Fh3>\n<p>Tap a tool to arm it for the drag bar (§09). The previously-armed tool's value is committed but not lost; switching tools never resets values. Switching groups preserves the armed tool within the previous group; re-opening that group re-arms it.<\u002Fp>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-9\"><span class=\"num\">09<\u002Fspan>Editor — Drag bar &amp; values<\u002Fh2>\n\n<p>One single horizontal drag bar 30pt tall, padded 24pt on each side. Owns the active tool's value.<\u002Fp>\n\n<h3>Anatomy<\u002Fh3>\n<ul>\n  <li>1pt baseline rule running the full width.<\u002Fli>\n  <li>21 tick marks at 5% increments. Center tick (50%) is 14pt tall and uses <code>borderHi<\u002Fcode>; others are 6pt and <code>border<\u002Fcode>.<\u002Fli>\n  <li>A 2pt × 22pt accent marker positioned at <code>50 + value/2<\u002Fcode>% (mapping <code>[−100, +100]<\u002Fcode> linearly).<\u002Fli>\n<\u002Ful>\n\n<h3>Drag behavior<\u002Fh3>\n<ul>\n  <li>Drag anywhere on the canvas <i>or<\u002Fi> the bar — both regions are hit-test active. Dragging on the bar gives a 1:1 mapping; dragging on the canvas gives a 0.5:1 mapping for finer control.<\u002Fli>\n  <li>Vertical drag is ignored (no axis lock affordance needed — only horizontal moves the value).<\u002Fli>\n  <li>Double-tap the bar to reset to <code>0<\u002Fcode>.<\u002Fli>\n  <li>Long-press on the marker to enter \"fine mode\" — the next drag uses a 0.25:1 mapping. Releases out of fine mode.<\u002Fli>\n<\u002Ful>\n\n<h3>Value ranges<\u002Fh3>\n<p>All sliders normalize to a <code>[−100, +100]<\u002Fcode> internal range for the bar geometry. Display values are remapped per-tool to match the desktop adj struct (§07 of the desktop spec). Exposure displays as <code>EV ±4.0<\u002Fcode> (step 0.05); Temp as Kelvin (2000–12000, step 50); everything else as integer <code>±100<\u002Fcode>.<\u002Fp>\n\n<h3>Haptics<\u002Fh3>\n<table>\n  <tbody><tr><th>Event<\u002Fth><th>Haptic<\u002Fth><\u002Ftr>\n  <tr><td>Cross zero<\u002Ftd><td>Light impact<\u002Ftd><\u002Ftr>\n  <tr><td>Hit ±100<\u002Ftd><td>Medium impact<\u002Ftd><\u002Ftr>\n  <tr><td>Reset (double-tap)<\u002Ftd><td>Selection<\u002Ftd><\u002Ftr>\n  <tr><td>Switch tool / group<\u002Ftd><td>Selection<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-10\"><span class=\"num\">10<\u002Fspan>Info sheet<\u002Fh2>\n\n<p>Bottom-anchored sheet over the editor. Background is dimmed (35% opacity, no interaction). Sheet height is 74% of the viewport. Rounded top corners (<code>18pt<\u002Fcode>). Shadow: <code>0 -8px 30px rgba(0,0,0,0.6)<\u002Fcode>.<\u002Fp>\n\n<h3>Anatomy<\u002Fh3>\n<ul>\n  <li>Grab handle (38×4pt, <code>borderHi<\u002Fcode>) centered at the top, 8pt below the sheet edge.<\u002Fli>\n  <li>Header row: <b>Info<\u002Fb> title (17pt, 600) on the left, close X on the right.<\u002Fli>\n  <li>Sections (top to bottom): Rating &amp; flags · Histogram · Camera · Location · Keywords.<\u002Fli>\n<\u002Ful>\n\n<h3>Rating &amp; flags row<\u002Fh3>\n<p>Left cluster of 3 pill-circles (24pt diameter): Pick (green P), Unflagged (—), Reject (✕). Right: 5-star row.<\u002Fp>\n\n<h3>Histogram<\u002Fh3>\n<p>56pt block — same renderer as desktop (RGB curves, <code>position: tl<\u002Fcode> aligned). Border <code>0.5pt<\u002Fcode>, radius 6pt, surface <code>bg<\u002Fcode>.<\u002Fp>\n\n<h3>Camera / Location key-value rows<\u002Fh3>\n<p>2-col grid. Label (12pt, muted) on the left; mono value (11.5pt, ink) on the right. Each row separated by a 0.5pt rule.<\u002Fp>\n\n<h3>Keywords<\u002Fh3>\n<p>Wrap of 11pt rounded chips on <code>surface2<\u002Fcode> with 0.5pt borders. Final chip is an outlined <code>+ add<\u002Fcode> dashed chip; tap opens the iOS keyboard with a one-line text input docked above it.<\u002Fp>\n\n<h3>Dismissal<\u002Fh3>\n<ul>\n  <li>Tap close X.<\u002Fli>\n  <li>Tap scrim above the sheet.<\u002Fli>\n  <li>Drag grab-handle down. Threshold: ≥ 25% of sheet height, or velocity ≥ 1000 px/s.<\u002Fli>\n<\u002Ful>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-11\"><span class=\"num\">11<\u002Fspan>Gestures &amp; haptics<\u002Fh2>\n\n<h3>Global rules<\u002Fh3>\n<ul>\n  <li><b>Tap targets ≥ 44pt.<\u002Fb> Visible chrome may be smaller (chips, icons), but their hit area is padded transparently up to 44pt.<\u002Fli>\n  <li><b>Back swipe.<\u002Fb> Standard iOS interactive back gesture is enabled on every pushed screen (Search, Full, Editor). Drawer and sheet have their own dismiss gestures (see §04, §10).<\u002Fli>\n  <li><b>Long-press<\u002Fb> is reserved for context menus only; never the primary action.<\u002Fli>\n  <li><b>Hover<\u002Fb> states don't exist on touch — never design states that require a hover.<\u002Fli>\n<\u002Ful>\n\n<h3>Reserved haptics<\u002Fh3>\n<table>\n  <tbody><tr><th>Event<\u002Fth><th>Haptic<\u002Fth><\u002Ftr>\n  <tr><td>Photo selected from grid (open Full)<\u002Ftd><td>Selection<\u002Ftd><\u002Ftr>\n  <tr><td>Drawer open / close<\u002Ftd><td>Light impact<\u002Ftd><\u002Ftr>\n  <tr><td>Filter chip change<\u002Ftd><td>Selection<\u002Ftd><\u002Ftr>\n  <tr><td>Pick toggle (in Info sheet)<\u002Ftd><td>Light impact<\u002Ftd><\u002Ftr>\n  <tr><td>Rating change<\u002Ftd><td>Selection<\u002Ftd><\u002Ftr>\n  <tr><td>Slider zero / extreme<\u002Ftd><td>see §09<\u002Ftd><\u002Ftr>\n  <tr><td>Save<\u002Ftd><td>Success notification<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-12\"><span class=\"num\">12<\u002Fspan>Persistence &amp; deep links<\u002Fh2>\n\n<h3>Per-device state<\u002Fh3>\n<table class=\"mono\">\n  <tbody><tr><th>Key<\u002Fth><th>Value<\u002Fth><th>Notes<\u002Fth><\u002Ftr>\n  <tr><td>cm.m.source<\u002Ftd><td>source id<\u002Ftd><td>Last-viewed source. Falls back to <code>all<\u002Fcode>.<\u002Ftd><\u002Ftr>\n  <tr><td>cm.m.filter<\u002Ftd><td>chip id<\u002Ftd><td>Library grid chip.<\u002Ftd><\u002Ftr>\n  <tr><td>cm.m.full.id<\u002Ftd><td>image id<\u002Ftd><td>Last-viewed Full image (for restore-on-launch).<\u002Ftd><\u002Ftr>\n  <tr><td>cm.m.editor.armed<\u002Ftd><td><code>{group, tool}<\u002Fcode><\u002Ftd><td>Last-armed editor tool per image. Memo'd in a Map keyed by image id.<\u002Ftd><\u002Ftr>\n  <tr><td>cm.m.filmstrip<\u002Ftd><td>bool<\u002Ftd><td>User preference for the editor filmstrip.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Per-image edit state<\u002Fh3>\n<p>All adjustments and rating/flag changes are persisted to the same XMP sidecar as the desktop. The mobile client is a thin renderer; it writes through the server with the same debounce window (500ms after last edit). Local-only changes during offline are queued and replayed on reconnect.<\u002Fp>\n\n<h3>Deep links<\u002Fh3>\n<ul>\n  <li><code>maple://source/{id}<\u002Fcode> — opens Library grid for that source.<\u002Fli>\n  <li><code>maple://image/{id}<\u002Fcode> — opens Full image. If the id isn't in any current source, opens it in a synthetic \"Single image\" source.<\u002Fli>\n  <li><code>maple://image/{id}/edit<\u002Fcode> — opens directly into the editor.<\u002Fli>\n<\u002Ful>\n\n<!-- ────────────────────────────────────────────── -->\n<h2 id=\"s-13\"><span class=\"num\">13<\u002Fspan>Motion &amp; visual tokens<\u002Fh2>\n\n<h3>Motion<\u002Fh3>\n<table>\n  <tbody><tr><th>Transition<\u002Fth><th>Duration<\u002Fth><th>Easing<\u002Fth><\u002Ftr>\n  <tr><td>Drawer open / close<\u002Ftd><td>240ms<\u002Ftd><td><code>cubic-bezier(0.22, 1, 0.36, 1)<\u002Fcode><\u002Ftd><\u002Ftr>\n  <tr><td>Push (Search, Full, Editor)<\u002Ftd><td>320ms<\u002Ftd><td>iOS system<\u002Ftd><\u002Ftr>\n  <tr><td>Bottom sheet present<\u002Ftd><td>320ms<\u002Ftd><td>iOS system<\u002Ftd><\u002Ftr>\n  <tr><td>Bottom sheet dismiss<\u002Ftd><td>280ms<\u002Ftd><td>iOS system<\u002Ftd><\u002Ftr>\n  <tr><td>Group tab swap (tool row)<\u002Ftd><td>120ms<\u002Ftd><td><code>ease<\u002Fcode><\u002Ftd><\u002Ftr>\n  <tr><td>Chrome auto-hide (Full)<\u002Ftd><td>180ms fade<\u002Ftd><td><code>ease-out<\u002Fcode><\u002Ftd><\u002Ftr>\n  <tr><td>Grid filter change<\u002Ftd><td>120ms cross-fade<\u002Ftd><td>linear<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Tokens (Maple mobile dark)<\u002Fh3>\n<p>Mirrors the desktop dark token set with adjusted contrast for touch-distance viewing. The token registry lives at <code>mobile/primitives.jsx<\u002Fcode> as <code>M<\u002Fcode>.<\u002Fp>\n<table class=\"mono\">\n  <tbody><tr><th>Token<\u002Fth><th>Value<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n  <tr><td>bg<\u002Ftd><td>#0f0d0b<\u002Ftd><td>Page background / image canvas<\u002Ftd><\u002Ftr>\n  <tr><td>surface<\u002Ftd><td>#1c1917<\u002Ftd><td>Sheets, drawer, info panel<\u002Ftd><\u002Ftr>\n  <tr><td>surface2<\u002Ftd><td>#262524<\u002Ftd><td>Tool pills, chips, kv rows<\u002Ftd><\u002Ftr>\n  <tr><td>surface3<\u002Ftd><td>#2e2c2a<\u002Ftd><td>Sliders, dividers under tools<\u002Ftd><\u002Ftr>\n  <tr><td>border<\u002Ftd><td>#3a3633<\u002Ftd><td>Default border<\u002Ftd><\u002Ftr>\n  <tr><td>borderHi<\u002Ftd><td>#4d4744<\u002Ftd><td>Active tick marks, grab handles<\u002Ftd><\u002Ftr>\n  <tr><td>text<\u002Ftd><td>#f5f4f2<\u002Ftd><td>Primary ink<\u002Ftd><\u002Ftr>\n  <tr><td>textMuted<\u002Ftd><td>#a8a29e<\u002Ftd><td>Secondary<\u002Ftd><\u002Ftr>\n  <tr><td>accent<\u002Ftd><td>#c4493a<\u002Ftd><td>Selection, markers, taps<\u002Ftd><\u002Ftr>\n  <tr><td>ok<\u002Ftd><td>#4ade80<\u002Ftd><td>Pick dot<\u002Ftd><\u002Ftr>\n  <tr><td>warn<\u002Ftd><td>#fbbf24<\u002Ftd><td>Low-confidence indicators (People)<\u002Ftd><\u002Ftr>\n  <tr><td>star<\u002Ftd><td>#EF9F27<\u002Ftd><td>Rating glyphs<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Typography<\u002Fh3>\n<p>Mobile Maple uses the Maple type system: <b>Lato<\u002Fb> for all UI text and <b>Merriweather<\u002Fb> for editorial titles (source names, sheet titles). Numeric and code-like values use the system mono.<\u002Fp>\n<table>\n  <tbody><tr><th>Use<\u002Fth><th>Family / size<\u002Fth><\u002Ftr>\n  <tr><td>Source titles (\"France trip\")<\u002Ftd><td>Merriweather 28pt / 700 / −0.5 tracking<\u002Ftd><\u002Ftr>\n  <tr><td>Sheet titles (\"Info\")<\u002Ftd><td>Merriweather 17pt / 700<\u002Ftd><\u002Ftr>\n  <tr><td>Body / row labels<\u002Ftd><td>Lato 13–14pt / 400<\u002Ftd><\u002Ftr>\n  <tr><td>Tool labels, chips, buttons<\u002Ftd><td>Lato 10–12pt / 400–700<\u002Ftd><\u002Ftr>\n  <tr><td>Section eyebrows<\u002Ftd><td>Lato 9–10pt / 700 / 0.14em uppercase / muted<\u002Ftd><\u002Ftr>\n  <tr><td>Numeric values (sliders, EXIF)<\u002Ftd><td>SF Mono / JetBrains Mono 11–12pt / tabular-nums<\u002Ftd><\u002Ftr>\n  <tr><td>Filename, group/tool overlay<\u002Ftd><td>SF Mono 10–12pt / 0.3–0.5 tracking / uppercase for labels<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<p>Font stack: <code>\"Lato\", -apple-system, system-ui, sans-serif<\u002Fcode> and <code>\"Merriweather\", \"Iowan Old Style\", Georgia, serif<\u002Fcode>. Both ship in the app bundle (Lato 400/700, Merriweather 700) so first paint never falls back. Italic Merriweather is reserved for empty-state copy.<\u002Fp>\n\n<h3>Iconography<\u002Fh3>\n<p>Custom 16×16 SVG set rendered with <code>strokeWidth: 1.6<\u002Fcode>, <code>strokeLinecap: round<\u002Fcode>, <code>strokeLinejoin: round<\u002Fcode>. The set is intentionally lightweight (≈40 glyphs) — anything not in the set should be added to <code>mobile/primitives.jsx<\u002Fcode> rather than ad-hoc'd inline.<\u002Fp>\n\n<!-- ────────────────────────────────────────────── -->\n<footer class=\"footer\">\n  <span>Maple · Mobile Spec v0.1<\u002Fspan>\n  <span>Draft · for Eng review<\u002Fspan>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
