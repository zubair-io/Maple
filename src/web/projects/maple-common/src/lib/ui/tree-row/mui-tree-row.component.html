<div
  class="mui-tree-row"
  role="treeitem"
  tabindex="0"
  [style.padding-left.px]="indentPx()"
  [class.is-active]="active()"
  [class.is-disabled]="disabled()"
  [attr.aria-expanded]="expandable() ? expanded() : null"
  [attr.aria-current]="active() ? 'true' : null"
  [attr.aria-haspopup]="ariaHasPopup()"
  [attr.aria-label]="ariaLabel()"
  (click)="onRowClick()"
  (keydown)="onKeydown($event)"
>
  <mui-tree-row-chevron
    [expandable]="expandable()"
    [expanded]="expanded()"
    [busy]="expandBusy()"
    [error]="expandError()"
    [errorTitle]="errorTitle()"
    (toggle)="toggle($event)"
  />
  <mui-icon [name]="icon()" size="sm" class="row-icon" [class.row-icon-muted]="isIconMuted()" />
  <mui-text variant="row-label" [truncate]="true" class="row-label">{{ label() }}</mui-text>
  @if (loading()) {
    <mui-spinner size="sm" placement="inline" />
  } @else if (count() !== null) {
    <mui-badge variant="count" [value]="count()!" />
  }
</div>
