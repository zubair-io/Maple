<div
  class="flex h-8 flex-shrink-0 items-center gap-3 border-b-[0.5px] border-border bg-surface px-3"
>
  <!-- Rating pills -->
  <div class="flex items-center gap-1" role="group" aria-label="Minimum rating">
    @for (i of STAR_INDICES; track i) {
      <button
        type="button"
        class="filter-pill flex h-6 w-6 items-center justify-center rounded border-[0.5px] border-transparent bg-transparent transition-colors duration-[120ms] hover:bg-surface-hover hover:border-border"
        [class.is-active]="state.minRating() >= i"
        [attr.aria-label]="i + ' stars or more'"
        [attr.aria-pressed]="state.minRating() === i"
        (click)="onRatingClick(i)"
      >
        <maple-icon
          [name]="state.minRating() >= i ? 'star-filled' : 'star'"
          [size]="11"
          [color]="state.minRating() >= i ? 'var(--color-star)' : 'var(--color-text-muted)'"
        />
      </button>
    }
  </div>

  <div class="h-5 w-px bg-border"></div>

  <!-- Flag pills -->
  <div class="flex items-center gap-1" role="group" aria-label="Flag filter">
    @for (f of FLAG_OPTIONS; track f.value) {
      <button
        type="button"
        class="filter-pill h-6 cursor-pointer rounded border-[0.5px] border-transparent bg-transparent px-2 text-[11px] text-text-muted transition-colors duration-[120ms] hover:bg-surface-hover hover:border-border hover:text-text-main"
        [class.is-active]="state.flag() === f.value"
        [attr.aria-pressed]="state.flag() === f.value"
        (click)="onFlagClick(f.value)"
      >
        {{ f.label }}
      </button>
    }
  </div>

  <div class="h-5 w-px bg-border"></div>

  <!-- Color swatches -->
  <div class="flex items-center gap-1" role="group" aria-label="Color label filter">
    @for (c of COLOR_OPTIONS; track c.value) {
      <button
        type="button"
        class="color-swatch flex h-5 w-5 cursor-pointer items-center justify-center rounded-full border-[0.5px] border-border transition-[transform,border-color] duration-[120ms] hover:scale-110"
        [class.is-active]="state.color() === c.value"
        [style.background]="c.swatch === 'transparent' ? 'var(--color-input-bg)' : c.swatch"
        [attr.aria-label]="c.label"
        [attr.aria-pressed]="state.color() === c.value"
        (click)="onColorClick(c.value)"
      >
        @if (c.value === '') {
          <maple-icon name="x" [size]="9" color="var(--color-text-muted)" />
        }
      </button>
    }
  </div>

  <div class="h-5 w-px bg-border"></div>

  <!-- Hidden filter -->
  <div class="flex items-center gap-1" role="group" aria-label="Hidden images filter">
    @for (h of HIDDEN_OPTIONS; track h.value) {
      <button
        type="button"
        class="filter-pill h-6 cursor-pointer rounded border-[0.5px] border-transparent bg-transparent px-2 text-[11px] text-text-muted transition-colors duration-[120ms] hover:bg-surface-hover hover:border-border hover:text-text-main"
        [class.is-active]="state.hiddenFilter() === h.value"
        [attr.aria-pressed]="state.hiddenFilter() === h.value"
        (click)="onHiddenClick(h.value)"
      >
        {{ h.label }}
      </button>
    }
  </div>

  <div class="h-5 w-px bg-border"></div>

  <!-- Date range -->
  <div class="flex items-center gap-1.5">
    <input
      type="date"
      class="h-6 min-w-0 rounded border-[0.5px] border-border bg-input-bg px-1.5 text-[11px] text-text-main outline-0"
      aria-label="Captured from"
      [value]="state.from()"
      (input)="onFromInput($event)"
    />
    <span class="text-[11px] text-text-muted">to</span>
    <input
      type="date"
      class="h-6 min-w-0 rounded border-[0.5px] border-border bg-input-bg px-1.5 text-[11px] text-text-main outline-0"
      aria-label="Captured to"
      [value]="state.to()"
      (input)="onToInput($event)"
    />
  </div>

  <div class="flex-1"></div>

  <!-- Clear -->
  <button
    type="button"
    class="h-6 cursor-pointer rounded border-[0.5px] border-transparent bg-transparent px-2 text-[11px] text-text-muted transition-colors duration-[120ms] hover:bg-surface-hover hover:border-border hover:text-text-main"
    (click)="onClear()"
  >
    Clear
  </button>
</div>
