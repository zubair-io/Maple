[package]
name = "maple-linux"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

[workspace]

[dependencies]
raw-gpu = { path = "../raw-pipeline/raw-gpu" }
raw-core = { path = "../raw-pipeline/raw-core", features = ["avif", "gpu"] }
eframe = { version = "=0.30.0", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts"] }
rfd = "0.15"
roxmltree = "0.20"
tempfile = "3"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }
webbrowser = "1"
dirs = "6"

# Keep the shared workspace's decoder safety patches in every native host.
[patch.crates-io]
rav1d = { path = "../raw-pipeline/third_party/rav1d" }
zune-jpeg = { path = "../raw-pipeline/third_party/zune-jpeg" }
avif-parse = { path = "../raw-pipeline/third_party/avif-parse" }
ravif = { path = "../raw-pipeline/third_party/ravif" }
avif-serialize = { path = "../raw-pipeline/third_party/avif-serialize" }
