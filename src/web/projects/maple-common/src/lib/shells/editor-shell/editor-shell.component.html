<!-- EditorShell — canvas-first layered layout (#1535) -->
<!-- Chrome opacity controlled by chromeState signal -->
<div class="shell" [class.shell--desktop]="isDesktop()">
  <!-- ── Full-bleed canvas (back layer) ──────────────────────────────── -->
  <div #canvasWrap class="canvas-layer" (pointerdown)="onCanvasPointerDown($event)">
    <editor-image-canvas [hideToolbar]="true" />
  </div>

  <!-- ── Chrome layers (float above canvas) ──────────────────────────── -->

  <!-- Chrome opacity wrapper — transitions on recede/scrub -->
  <div
    class="chrome-layer"
    [class.chrome--receded]="chromeState() === 'receded'"
    [class.chrome--scrubbing]="chromeState() === 'scrubbing'"
  >
    <!-- ── Top bar ────────────────────────────────────────────────── -->
    <div class="top-bar">
      <!-- Back button -->
      <button
        class="top-btn"
        title="Back to Library (Esc)"
        aria-label="Back to Library"
        (click)="goBack()"
      >
        <maple-icon name="back" [size]="14" color="var(--pro-text-muted)" />
      </button>

      <!-- Asset name -->
      <span class="top-name">{{ assetName() }}</span>

      <!-- Center spacer -->
      <div class="top-spacer"></div>

      <!-- Histogram (tablet/desktop) -->
      @if (isTabletPlus() && currentAdj()) {
        <div class="top-histogram">
          <editor-histogram [adjustment]="currentAdj()!" />
        </div>
      }

      <!-- Before/After split toggle -->
      <button
        class="top-icon-btn"
        [class.top-icon-btn--active]="canvasSvc.showBeforeAfter()"
        title="Before/After (\)"
        aria-label="Toggle before/after"
        (click)="canvasSvc.toggleBeforeAfter()"
      >
        <maple-icon name="split" [size]="16" color="var(--pro-text-muted)" />
      </button>

      <!-- Export -->
      <button
        class="export-btn"
        [class.export-btn--enabled]="state.focusedAssetId() !== null"
        [disabled]="state.focusedAssetId() === null"
        title="Export"
        aria-label="Export"
      >
        <maple-icon name="export" [size]="14" color="currentColor" />
      </button>
    </div>

    <!-- ── Left filmstrip rail (tablet/desktop) ──────────────────── -->
    @if (isTabletPlus() && hasMultiplePhotos()) {
      <div class="filmstrip-anchor">
        <editor-filmstrip />
      </div>
    }

    <!-- ── Right tool dock (tablet/desktop only) ─────────────────── -->
    @if (isTabletPlus()) {
      <div class="tool-dock-anchor">
        <pro-tool-dock
          [activeGroup]="activeGroup()"
          [activeTool]="activeTool()"
          [curveOpen]="curveOpen()"
          [presetsOpen]="presetsOpen()"
          (groupChange)="onGroupChange($event)"
          (toolChange)="onToolChange($event)"
          (curvePanelToggle)="onCurvePanelToggle()"
          (presetsPanelToggle)="onPresetsPanelToggle()"
        />

        <!-- Curve panel (tone curve + WB pad) — glass card, tablet/desktop only -->
        @if (curveOpen()) {
          <div class="curve-panel">
            <pro-tone-curve />
            <div class="curve-panel-divider"></div>
            <pro-wb-pad />
          </div>
        }

        <!-- Crop panel (#1813) — glass card hosting the shared crop toolbar
             (aspect presets + straighten + reset/done). The interactive crop
             rectangle itself is the shared `editor-crop-overlay`, already
             mounted inside `editor-image-canvas` and gated on the same
             `CropSessionService.active` this panel's visibility mirrors. -->
        @if (cropArmed()) {
          <div class="crop-panel">
            <app-crop-toolbar />
          </div>
        }

        <!-- Presets panel (#1815) — glass card hosting the shared
             `app-presets-panel` (list/save/apply/delete). Applying a preset
             routes through the identical `PresetsService`/
             `EditorStateService.applyPreset` path the S5 editor uses. -->
        @if (presetsOpen()) {
          <div class="presets-panel">
            <app-presets-panel (applied)="presetsOpen.set(false)" />
          </div>
        }
      </div>
    }

    <!-- ── Bottom control card ────────────────────────────────────── -->
    <!-- Hidden while cropping: its living sliders are for the `detail` group
         (sharpen/noise/colorNR), which armGroup('detail') via armTool('crop')
         would otherwise show alongside — the crop toolbar (in the dock-side
         panel above) is the only control surface while armed, matching the
         S5 editor swapping its drag-bar area for the crop toolbar. -->
    @if (!cropArmed()) {
      <div class="control-card-anchor">
        <pro-control-card [activeGroup]="activeGroup()" (groupChange)="onGroupChange($event)" />
      </div>
    }

    <!-- Phone Curve trigger + sheet deferred to #1569 (no phone affordance opens curveOpen yet) -->
  </div>

  <!-- ── Value HUD (always visible layer, fades with its own signal) ── -->
  <div class="hud-layer">
    <pro-value-hud
      [visible]="hudVisible()"
      [eyebrow]="hudEyebrow()"
      [valueText]="hudValueText()"
      [progress]="hudProgress()"
    />
  </div>
</div>
