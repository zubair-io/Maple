<mui-overlay-shell
  [open]="open()"
  size="lg"
  ariaLabel="Panorama Merge"
  (dismissed)="dismissed.emit()"
>
  <div slot="header" class="mui-panorama-merge-modal-header border-b border-border px-6 py-4">
    <mui-text variant="sheet-title" [block]="true">Panorama Merge</mui-text>
  </div>

  <div class="mui-panorama-merge-modal-body flex flex-col gap-4">
    <div
      class="frames sticky -top-6 z-10 -mx-6 -mt-6 flex flex-nowrap gap-1 overflow-x-auto bg-surface px-6 pt-6 pb-2"
    >
      @for (frame of frames(); track frame.id) {
        <mui-media-cell class="frame w-24 shrink-0" [src]="frame.src" [alt]="frame.alt" size="sm" />
      }
    </div>

    <div class="field flex flex-col gap-1">
      <mui-text variant="tool-label" color="muted" [block]="true">Projection</mui-text>
      <mui-segmented-toggle
        [options]="projectionOptions"
        [value]="projection()"
        (valueChange)="projection.set($event)"
        ariaLabel="Projection type"
        [disabled]="stitching()"
      />
    </div>

    <div class="field flex flex-col gap-1">
      <mui-text variant="tool-label" color="muted" [block]="true">Blend mode</mui-text>
      <mui-segmented-toggle
        [options]="blendModeOptions"
        [value]="blendMode()"
        (valueChange)="blendMode.set($event)"
        ariaLabel="Blend mode"
        [disabled]="stitching()"
      />
    </div>

    <mui-panorama-edges
      [(boundaryWarp)]="boundaryWarp"
      [(autoCrop)]="autoCrop"
      [reason]="boundaryWarpReason()"
      [disabled]="stitching()"
      (warpCommit)="boundaryWarpCommitted.emit($event)"
    />

    @if (stitching()) {
      <mui-progress shape="bar" [value]="progress()" label="Stitching…" />
    }
  </div>

  <div
    slot="footer"
    class="mui-panorama-merge-modal-footer flex justify-end gap-1 border-t border-border px-6 py-4"
  >
    <mui-button variant="ghost" (pressed)="dismissed.emit()">Cancel</mui-button>
    <mui-button
      variant="primary"
      [disabled]="stitching() || frames().length < 2"
      (pressed)="confirmMerge()"
    >
      Merge
    </mui-button>
  </div>
</mui-overlay-shell>
