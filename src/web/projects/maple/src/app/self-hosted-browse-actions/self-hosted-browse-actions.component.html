<button
  type="button"
  class="export-btn flex items-center gap-1.5 h-8 px-3.5 rounded-md text-[11px] font-medium cursor-pointer transition-colors duration-[120ms] border-[0.5px]"
  [class.has-selection]="canEditMetadata()"
  [class.no-selection]="!canEditMetadata()"
  [class.bg-primary-dim]="canEditMetadata()"
  [class.text-primary]="canEditMetadata()"
  [class.border-primary]="canEditMetadata()"
  [class.bg-input-bg]="!canEditMetadata()"
  [class.text-text-muted]="!canEditMetadata()"
  [class.border-border]="!canEditMetadata()"
  [class.opacity-50]="!canEditMetadata()"
  [disabled]="!canEditMetadata()"
  title="Edit metadata for selected photos"
  aria-label="Edit metadata"
  (click)="controller.openMetadata()"
>
  <span>Edit Metadata…{{ canEditMetadata() ? ' (' + state.selectedCount() + ')' : '' }}</span>
</button>
