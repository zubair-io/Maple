<div class="mui-hsl-panel">
  <mui-chip-row
    [chips]="bands()"
    mode="select"
    [selectedId]="activeBandId()"
    (selectedIdChange)="selectBand($event)"
  />
  <div class="sliders">
    <mui-living-slider
      label="Hue"
      [value]="activeValue().hue"
      (valueChange)="emitChange('hue', $event)"
      (resetRequest)="resetField('hue')"
      [min]="-100"
      [max]="100"
      [bipolar]="true"
    />
    <mui-living-slider
      label="Saturation"
      [value]="activeValue().saturation"
      (valueChange)="emitChange('saturation', $event)"
      (resetRequest)="resetField('saturation')"
      [min]="-100"
      [max]="100"
      [bipolar]="true"
    />
    <mui-living-slider
      label="Luminance"
      [value]="activeValue().luminance"
      (valueChange)="emitChange('luminance', $event)"
      (resetRequest)="resetField('luminance')"
      [min]="-100"
      [max]="100"
      [bipolar]="true"
    />
  </div>
</div>
