<div
  class="dlg-backdrop"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'New Folder in ' + parentLabel()"
  (click)="onBackdropClick()"
  (keydown.escape)="onCancel()"
>
  <div class="dlg-card fnf-card max-w-[360px]" (click)="$event.stopPropagation()">
    <div class="dlg-header">
      <span class="dlg-title">New Folder</span>
    </div>

    <div class="flex flex-col gap-2 p-4">
      <p class="m-0 text-[12px] text-text-muted">
        Creates a new folder inside "{{ parentLabel() }}".
      </p>
      <input
        #nameInput
        type="text"
        class="dlg-input fnf-input"
        placeholder="Name"
        [value]="name()"
        [attr.aria-label]="'Folder name'"
        (input)="onNameInput($any($event.target).value)"
        (keydown.enter)="onSubmit()"
        [attr.aria-invalid]="!isValid() && name().length > 0 ? 'true' : null"
      />
      @if (name().length > 0 && validationMessage(); as msg) {
        <p class="fnf-error m-0 text-[11px] text-error-text">{{ msg }}</p>
      }
      @if (serverError(); as err) {
        <p class="fnf-error m-0 text-[11px] text-error-text">{{ err }}</p>
      }
    </div>

    <div class="flex justify-end gap-2 border-t-[0.5px] border-border px-4 py-3">
      <mui-button variant="ghost" [disabled]="busy()" (pressed)="onCancel()">Cancel</mui-button>
      <mui-button variant="primary" [disabled]="!isValid() || busy()" (pressed)="onSubmit()">
        {{ busy() ? 'Creating…' : 'Create' }}
      </mui-button>
    </div>
  </div>
</div>
