<mui-popover [open]="open()" [placement]="placement()" (closeRequested)="closeRequested.emit()">
  <div
    class="mui-command-menu flex min-w-[260px] max-h-[280px] flex-col"
    (keydown)="onKeydown($event)"
  >
    <div class="search-row border-b border-border p-2">
      <mui-input
        variant="search"
        [value]="query()"
        (valueChange)="setQuery($event)"
        [placeholder]="placeholder()"
        ariaLabel="Command search"
      />
    </div>
    <div class="results flex flex-col gap-[2px] overflow-y-auto p-1" role="listbox">
      @if (filtered().length === 0) {
        <mui-text variant="body" color="muted" [block]="true" class="empty p-2">
          No matching commands
        </mui-text>
      }
      @for (command of filtered(); track command.id; let i = $index) {
        <button
          type="button"
          role="option"
          class="item mui-chrome-menu-item-base hover:bg-bg-hover"
          [class.active]="clampedActiveIndex() === i"
          [class.bg-bg-hover]="clampedActiveIndex() === i"
          [attr.aria-selected]="clampedActiveIndex() === i"
          (click)="selectItem(command)"
          (mouseenter)="activeIndex.set(i)"
        >
          @if (command.icon) {
            <mui-icon [name]="command.icon" size="sm" />
          }
          <mui-text variant="body">{{ command.label }}</mui-text>
          @if (command.shortcut) {
            <span class="shortcut ml-auto text-[11px] text-text-muted">{{ command.shortcut }}</span>
          }
        </button>
      }
    </div>
  </div>
</mui-popover>
