# .github/workflows/web.yml
#
# Web gates. Three jobs:
#
#   web-build        — compiles the Angular app the way a release does
#                      (`bun run build` == `ng build maple`); fails on any TS /
#                      template compile error. Closes the gap that let #749 ship.
#                      Also builds the Hosted app (`ng build maple-syrup`) in
#                      the same job, so a Hosted-only compile break fails CI
#                      too (#2283).
#   web-test         — RUNS the `maple` app unit tests (`ng test maple`, the
#                      @angular/build:unit-test / vitest runner). A build gate
#                      catches type/template errors but NOT logic regressions,
#                      broken HTTP mocks, or assertion drift — exactly what
#                      slipped onto `main` in #748 (an unflushed poll failed 19
#                      specs) and a stale `MOCK_STATUS` assertion. See #767.
#   web-test-common  — RUNS the `Maple-common` library unit tests
#                      (`ng test Maple-common`). The shared library holds most
#                      cross-cutting specs (observability, xmp, raw-pipeline,
#                      api, state, components), but `ng test maple` never runs
#                      them — so breaks like the #794 observability spec slipped
#                      onto `main`. A separate sibling job (not a step appended
#                      to web-test) so it runs in parallel and still fires even
#                      when the `maple` suite is red. See #845.
#
# All three jobs need the Rust -> WASM `pkg/` built first (the app and library
# both import it), so they share the same toolchain provisioning + cargo cache
# key; on a cache hit that shared cache makes each later job's WASM build a fast
# restore rather than another full `-Z build-std` recompile. On a cold cache
# there's nothing to restore, so each job builds the WASM once.
#
# Why this job is heavier than the other cross-cutting jobs:
#
#   The web build has a hard dependency on the Rust -> WASM `pkg/`. The
#   pipeline consumer imports it directly —
#     projects/maple-common/.../raw-pipeline/raw-wasm-init.ts:
#       import init, { install_panic_hook, initThreadPool } from './pkg/raw_wasm';
#   — and that synced `pkg/` is gitignored (built artifact). `ng build`
#   therefore fails at module resolution unless the WASM is built first.
#   `bun run build`'s `prebuild` lifecycle hook builds it via
#   `raw-wasm/build.sh` -> `wasm-pack build --features gpu,parallel
#   -Z build-std=panic_abort,std`, which needs nightly Rust + rust-src +
#   the wasm32 target + wasm-pack. `initThreadPool` only exists with
#   `--features parallel` (wasm-bindgen-rayon) and the WebGPU live entry
#   (`render_bytes_gpu` / `WebLiveSession`) only with `--features gpu`
#   (#1059), so a plain `wasm-pack build` is not enough — the canonical
#   build (one bundle, both features) is required.
#
#   So this gate provisions a Rust + wasm toolchain (unlike the lightweight
#   cross.yml jobs) and builds the WASM explicitly before `ng build`. We run
#   `bun run raw-wasm` ourselves first so it builds + syncs + writes the
#   build stamp; the subsequent `prebuild` hook then no-ops off that stamp
#   (no double build) and correctness doesn't depend on whether bun fires
#   the lifecycle hook.
#
# Trigger: every push to `main` and every PR, with NO path filter. The web
# app imports types from `src/api`, so an API type change can break the web
# build without touching `src/web` — narrowing the filter would let that
# class of break through, which is the opposite of this gate's purpose.

name: web

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-build:
    name: web-build (ng build maple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned to match raw-wasm/rust-toolchain.toml. rustup would resolve
      # the toolchain file automatically when wasm-pack runs from raw-wasm/,
      # but installing it explicitly makes the version visible and lets the
      # components/target install happen once, up front.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      # Prebuilt binary — `cargo install wasm-pack` would add a ~2-minute
      # compile to every run.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # `-Z build-std` rebuilds the standard library, which is slow uncached.
      # Mirror raw-pipeline.yml's cache step.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Shared brand contract
        working-directory: src/web
        run: bun run brand:check

      # Build + sync the WASM pkg/ explicitly. Writes the build stamp so the
      # `prebuild` hook fired by `bun run build` below no-ops (no double
      # build), and the WASM is built even if bun skips the lifecycle hook.
      - name: Build raw-wasm (pkg/)
        working-directory: src/web
        run: bun run raw-wasm

      # The real gate. `ng build maple` exits non-zero on any TS / template
      # compile error; a plain `run:` step propagates that exit code.
      - name: Production web build (ng build maple)
        working-directory: src/web
        run: bun run build

      # Same gate for the Hosted app (`maple-syrup`) — it shares the WASM
      # `pkg/` built above but has its own routes/app.config, so a Hosted-only
      # compile break (e.g. #2283's `/settings` route) wouldn't otherwise fail
      # CI. Same job as `ng build maple` so a Hosted build break fails the
      # same gate.
      - name: Production Hosted web build (ng build maple-syrup)
        working-directory: src/web
        run: bunx ng build maple-syrup

      - name: Hosted artifact contract
        working-directory: src/web
        run: bun run check:hosted-artifact

      - name: Hosted capability boundary
        working-directory: src/web
        run: bun run check:hosted-capabilities

      # MW1 (#3020) adoption ratchet — fails if a raw <button> or a
      # btn-primary/btn-ghost class re-enters a migrated Settings directory.
      - name: Maple UI adoption check
        working-directory: src/web
        run: bun run maple-ui:adoption-check

      - name: Install Google Chrome for production artifact tests
        working-directory: src/web
        run: bun x playwright install --with-deps chrome

      - name: Production artifacts in installed Google Chrome
        working-directory: src/web
        run: bun run e2e:production-artifacts

      # #2746: a failure here (e.g. welcome-intake.spec.ts's browser-audit
      # assertion) previously left CI showing only the audit's pass/fail
      # verdict — the underlying console/page errors, failed requests, and
      # error responses it attached via `testInfo.attach('production-
      # browser-audit.json', …)` (e2e/support/production-test.ts) were
      # captured by Playwright but never left the runner. Upload the whole
      # Playwright output (per-test attachments under `test-results/`, plus
      # the browsable HTML report) so a red run has the actual browser
      # errors to diagnose instead of "re-run and hope it passes".
      - name: Upload production e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-artifacts
          path: |
            src/web/test-results/production-chrome/
            src/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web-test:
    name: web-test (ng test maple)
    runs-on: ubuntu-latest
    # Single-run on CI (the @angular/build:unit-test builder is non-watch in a
    # non-interactive env). `timeout-minutes` is a backstop against any
    # accidental watch-mode hang burning the full job budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same toolchain as web-build — `ng test` transforms the app, which
      # imports the WASM `pkg/`, so it must be built first.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Same cache key as web-build, so the `-Z build-std` WASM compile is a
      # restore here rather than a second full build.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Build raw-wasm (pkg/)
        working-directory: src/web
        run: bun run raw-wasm

      # The gate. `ng test maple` runs the unit suite and exits non-zero on any
      # failing spec; a plain `run:` step propagates that exit code.
      - name: Run web unit tests (ng test maple)
        working-directory: src/web
        run: bun x ng test maple

  web-test-common:
    name: web-test (ng test Maple-common)
    runs-on: ubuntu-latest
    # Single-run on CI (the @angular/build:unit-test builder is non-watch in a
    # non-interactive env). `timeout-minutes` is a backstop against any
    # accidental watch-mode hang burning the full job budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same toolchain as web-build — `ng test` transforms the library, which
      # imports the WASM `pkg/`, so it must be built first.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Same cache key as web-build, so on a cache hit the `-Z build-std` WASM
      # compile is a restore here rather than a third full build; on a cold
      # cache this job builds the WASM once.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Build raw-wasm (pkg/)
        working-directory: src/web
        run: bun run raw-wasm

      # The gate. `ng test Maple-common` runs the shared-library unit suite and
      # exits non-zero on any failing spec; a plain `run:` step propagates that
      # exit code. Capital-M `Maple-common` is the angular.json project name.
      - name: Run web unit tests (ng test Maple-common)
        working-directory: src/web
        run: bun x ng test Maple-common

  # Browser-WebGPU smoke (#2315). raw-pipeline.yml's `raw-gpu` job proves
  # raw-core↔WGSL agreement on lavapipe (SPIR-V); it says nothing about a
  # BROWSER's own WGSL compiler and WebGPU implementation, which is what the
  # web live path (`WebLiveSession` / `render_bytes_gpu`) actually ships
  # against. That surface had zero CI coverage before this job — only a human
  # opening the app locally.
  #
  # Reuses the two existing dev-server e2e specs that already drive the real
  # WASM/WebGPU render path end to end, rather than writing a new one:
  #   * e2e/raw-open.spec.ts — opens a real RAW, asserts the WASM decode
  #     completes with no `unreachable` trap (the #OOM regression class).
  #   * e2e/slider-tick-render.perf.spec.ts — opens the live editor, which
  #     opens a real GPU/WASM live session (WebGPU present when the adapter
  #     resolves, WASM-CPU fallback otherwise), and drives the Exposure
  #     slider through real per-tick renders. Its own `test.use({
  #     launchOptions: { args: ['--enable-unsafe-webgpu', ...] } })` is what
  #     makes a WebGPU adapter resolve at all in headless Chromium — measured
  #     null without the flag, non-null with it (see that file's own header).
  #     `MAPLE_PERF=1` un-skips it below.
  # Both specs already skip-pass on their own (existsSync fixture guard, in
  # the same style as the shell harnesses) rather than needing a probe step
  # here — `test-fixtures/raws/test_0006.DNG` is gitignored, so on a stock
  # runner the two SPECS report skipped. Unlike raw-pipeline.yml's
  # color-pipeline job, which probes for fixtures before provisioning any
  # toolchain and exits in seconds on a miss, this job pays the full setup
  # cost (Rust/wasm-pack, the raw-wasm build, the Chromium install) every
  # run regardless of fixtures — the skip only saves the e2e run itself. That
  # is the deliberate trade for reusing the existing dev-server specs as-is
  # rather than adding a fixture-probe step ahead of the WASM toolchain this
  # job needs either way (web-build/web-test/web-test-common already pay the
  # same cost unconditionally).
  #
  # Non-required for now (see raw-pipeline.yml's raw-gpu-metal job for the
  # same reasoning) — `continue-on-error` is the mechanism, since this repo
  # has no server-side required-checks list to omit a new job from.
  web-webgpu-smoke:
    name: web-webgpu-smoke (raw-open + slider-tick-render in headless Chrome)
    runs-on: ubuntu-latest
    continue-on-error: true
    # At least as generous as web-test/web-test-common (20m), which pay the
    # same toolchain + WASM-build cost this job does, plus this job's own
    # Chromium install + e2e run on top — 15m under-budgeted that (Copilot
    # review on this PR).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same toolchain as web-build/web-test — the app under test imports the
      # WASM `pkg/`, so it must be built first.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Same cache key as the other web jobs, so a cache hit here is a
      # restore rather than a fourth full `-Z build-std` compile.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Build raw-wasm (pkg/)
        working-directory: src/web
        run: bun run raw-wasm

      # playwright.config.ts's default project is bundled Chromium (no
      # `channel: 'chrome'`, unlike playwright.production.config.ts) — install
      # that browser specifically, matching what the specs below actually run
      # against.
      - name: Install Playwright Chromium
        working-directory: src/web
        run: bun x playwright install --with-deps chromium

      # MAPLE_PERF=1 un-skips slider-tick-render.perf.spec.ts; raw-open.spec.ts
      # has no such gate. Both still skip individually without the RAW
      # fixture — see the job comment above.
      - name: Browser WebGPU smoke (raw-open + slider-tick-render)
        working-directory: src/web
        env:
          MAPLE_PERF: '1'
        run: bun x playwright test e2e/raw-open.spec.ts e2e/slider-tick-render.perf.spec.ts

      # playwright.config.ts has no HTML reporter (`reporter: [['list']]`), so
      # the artifact worth keeping on a failure is the trace
      # (`trace: 'retain-on-failure'`) under test-results/, not a report dir.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-webgpu-smoke-traces
          path: src/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
