<div
  class="dlg-backdrop"
  role="dialog"
  aria-modal="true"
  aria-label="Move to…"
  (click)="onBackdropClick()"
  (keydown.escape)="onCancel()"
>
  <div class="dlg-card max-w-[420px] max-h-[70vh]" (click)="$event.stopPropagation()">
    <div class="dlg-header flex items-center justify-between">
      <span class="dlg-title">Move to…</span>
      <mui-button
        variant="ghost"
        size="sm"
        [iconOnly]="true"
        iconLeading="x"
        ariaLabel="Close"
        (pressed)="onCancel()"
      />
    </div>

    <div class="min-h-[120px] overflow-y-auto p-2">
      <div class="flex flex-col" role="tree">
        <app-move-to-tree-picker
          [nodes]="rootFolders()"
          [selectedId]="selectedNodeId()"
          [sourceFolderId]="sourceFolderId()"
          (select)="onNodeSelected($event)"
        />
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t-[0.5px] border-border px-4 py-3">
      <mui-button variant="ghost" (pressed)="onCancel()">Cancel</mui-button>
      <mui-button variant="primary" [disabled]="!canConfirm()" (pressed)="onConfirm()">
        Move
      </mui-button>
    </div>
  </div>
</div>
