<div class="editor" data-testid="editor-view">
  <app-editor-header
    [filename]="currentFilename()"
    (back)="dismiss.emit()"
    (share)="share.emit()"
    (info)="info.emit()"
  ></app-editor-header>

  <div class="canvas-region" data-testid="editor-canvas-region">
    <editor-image-canvas></editor-image-canvas>
    <div class="chip-anchor">
      <app-value-chip></app-value-chip>
    </div>
  </div>

  <app-drag-bar></app-drag-bar>
  <app-group-tabs></app-group-tabs>
  <app-tool-pill-row></app-tool-pill-row>
</div>
