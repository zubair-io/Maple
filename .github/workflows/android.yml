name: Android
on:
  pull_request:
    paths:
      [
        'src/android/**',
        'src/raw-pipeline/**',
        'resources/film-luts/**',
        '.github/workflows/android.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'src/android/**',
        'src/raw-pipeline/**',
        'resources/film-luts/**',
        '.github/workflows/android.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build native APK and test XMP contracts
        working-directory: src/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: maple-android-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
