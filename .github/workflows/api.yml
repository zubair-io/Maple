name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  api-typecheck:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install API deps
        working-directory: src/api
        run: bun install --frozen-lockfile
      - name: Typecheck API source and tests
        working-directory: src/api
        run: bun run typecheck

  api-tests:
    # Historical Fallow environment reproduction for #4051; never a landing branch.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install API deps
        working-directory: src/api
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: api-native-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      # The paired white-balance regression calls the real native decoder.
      # Build it before tests so a clean runner cannot pass by skipping FFI.
      - name: Build native RAW library for API integration tests
        run: bash src/api/scripts/build-raw-ffi.sh
      # Temporary, ticket-scoped diagnostic branch for the real Linux #4051 race.
      # This workflow is not a production fix or a waived merge gate.
      - name: Retain reproduction source and native identities
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-race-4051"
          git rev-parse HEAD > "$RUNNER_TEMP/workflow-race-4051/commit.txt"
          printf "%s\n" b507b0b2e5dd138d89cc6635106c19f1f8f11f12 > "$RUNNER_TEMP/workflow-race-4051/historical-base.txt"
          bun --version > "$RUNNER_TEMP/workflow-race-4051/bun-version.txt"
          uname -a > "$RUNNER_TEMP/workflow-race-4051/kernel.txt"
          git ls-files -z src/raw-pipeline src/api src/maple | xargs -0 sha256sum > "$RUNNER_TEMP/workflow-race-4051/source-before.sha256"
          find src/api/native -maxdepth 1 -type f -print0 | xargs -0 sha256sum > "$RUNNER_TEMP/workflow-race-4051/native-before.sha256"
      - name: Reproduce actual Linux Istanbul API ordering, at most three historical attempts
        working-directory: src/api
        env:
          MAPLE_JWT_SECRET: ci-test-secret-not-for-production-only
        run: |
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/workflow-race-4051/coverage-$attempt.log"
            if bun run test:coverage > "$log" 2>&1; then
              tail -n 14 "$log"
            else
              tail -n 200 "$log"
              exit 1
            fi
          done
      - name: Verify reproduction inputs stayed unchanged
        if: always()
        run: |
          sha256sum -c "$RUNNER_TEMP/workflow-race-4051/source-before.sha256" > "$RUNNER_TEMP/workflow-race-4051/source-after.log"
          sha256sum -c "$RUNNER_TEMP/workflow-race-4051/native-before.sha256" > "$RUNNER_TEMP/workflow-race-4051/native-after.log"
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/workflow-race-4051/tracked-status-after.txt"
          test ! -s "$RUNNER_TEMP/workflow-race-4051/tracked-status-after.txt"
      - name: Preserve actual reproduction receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-race-4051-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow-race-4051
          if-no-files-found: error

  result:
    name: API result
    needs: [changes, api-typecheck, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci_result.py api-typecheck=api api-tests=api
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
