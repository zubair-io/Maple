<div class="mui-empty-state">
  <mui-icon [name]="icon()" size="xl" class="icon" [decorative]="true" />
  <mui-text variant="row-label" [block]="true" class="title">{{ title() }}</mui-text>
  @if (message()) {
    <mui-text variant="body" color="muted" [block]="true" class="message">
      {{ message() }}
    </mui-text>
  }
  @if (actionLabel()) {
    <mui-button variant="secondary" size="sm" (pressed)="actionPressed.emit()">
      {{ actionLabel() }}
    </mui-button>
  }
</div>
