@if (variant() === 'pills') {
  <div class="pills flex items-center gap-[2px]" role="group" aria-label="Flag">
    <button
      type="button"
      [class]="pillClasses('pick')"
      aria-label="Pick"
      [attr.aria-pressed]="flag() === 'pick'"
      [disabled]="disabled()"
      (click)="setFlagState('pick')"
    >
      <mui-icon
        name="flag"
        size="sm"
        [color]="flag() === 'pick' ? 'var(--color-success-text)' : 'currentColor'"
      />
    </button>
    <button
      type="button"
      [class]="pillClasses('none')"
      aria-label="Unflagged"
      [attr.aria-pressed]="flag() === 'none'"
      [disabled]="disabled()"
      (click)="setFlagState('none')"
    >
      <mui-icon name="dot" size="sm" color="currentColor" />
    </button>
    <button
      type="button"
      [class]="pillClasses('reject')"
      aria-label="Reject"
      [attr.aria-pressed]="flag() === 'reject'"
      [disabled]="disabled()"
      (click)="setFlagState('reject')"
    >
      <mui-icon
        name="x"
        size="sm"
        [color]="flag() === 'reject' ? 'var(--color-error-text)' : 'currentColor'"
      />
    </button>
  </div>
} @else {
  <button
    type="button"
    class="flag inline-flex cursor-pointer items-center justify-center border-none bg-transparent p-[2px] leading-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    [attr.aria-label]="'Flag: ' + flag()"
    [attr.aria-pressed]="flag() !== 'none'"
    (click)="cycleFlag()"
  >
    <mui-icon name="flag" size="sm" [color]="flagIconColor()" />
  </button>
}
