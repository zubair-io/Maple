<div
  class="dlg-backdrop"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'Trash — ' + libraryLabel()"
  (keydown.escape)="onClose()"
>
  <div class="dlg-card max-w-[560px] max-h-[70vh]">
    <div class="dlg-header flex items-center justify-between">
      <span class="dlg-title">Trash — {{ libraryLabel() }}</span>
      <mui-button
        variant="ghost"
        size="sm"
        ariaLabel="Close Trash"
        (pressed)="onClose()"
        [iconOnly]="true"
        iconLeading="x"
      ></mui-button>
    </div>

    <app-trash-toolbar
      [disabledReason]="toolbarDisabledReason()"
      (restoreAll)="onRestoreAll()"
      (emptyTrash)="requestDeleteAll()"
    />

    <app-trash-list
      [items]="items()"
      [busyKey]="busyKey()"
      [loading]="loading()"
      [loadError]="loadError()"
      [nextCursor]="nextCursor()"
      [toast]="toast()"
      (restore)="onRestoreItem($event)"
      (deletePermanently)="requestDeleteItem($event)"
      (loadMore)="loadMore()"
      (dismissToast)="dismissToast()"
    />
  </div>
</div>

@if (confirmTarget(); as target) {
  <app-trash-delete-confirm-dialog
    [targetLabel]="confirmLabel()"
    [busy]="confirmBusy()"
    [serverError]="confirmError()"
    (confirmDelete)="onConfirmDelete()"
    (dismiss)="dismissConfirm()"
  />
}
