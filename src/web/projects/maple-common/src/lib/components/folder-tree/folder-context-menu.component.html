<div
  #menuRoot
  class="fixed z-[1000] flex min-w-[180px] flex-col rounded-lg border-[0.5px] border-border bg-surface p-1 shadow-[0_8px_24px_rgba(0,0,0,0.35)]"
  role="menu"
  [attr.aria-label]="menuLabel()"
  tabindex="-1"
  [style.left.px]="x()"
  [style.top.px]="y()"
  (keydown)="onKeydown($event)"
>
  @for (item of items(); track item.id) {
    <button
      type="button"
      role="menuitem"
      class="flex h-[30px] cursor-pointer items-center gap-2 rounded-[5px] border-none bg-transparent px-2.5 text-left text-[12px] text-text-main enabled:hover:bg-bg-hover enabled:hover:outline-none enabled:focus-visible:bg-bg-hover enabled:focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
      [class.text-error-text]="item.destructive"
      [disabled]="item.disabled || null"
      [attr.aria-disabled]="item.disabled ? 'true' : null"
      [title]="item.disabled ? (item.disabledReason ?? null) : null"
      (click)="onItemClick(item)"
    >
      <maple-icon [name]="item.icon" [size]="13" color="currentColor" />
      <span>{{ item.label }}</span>
    </button>
  }
</div>
