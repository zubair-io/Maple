<div class="editor" data-testid="editor-view">
  <app-editor-header
    [filename]="currentFilename()"
    (back)="dismiss.emit()"
    (share)="share.emit()"
    (info)="info.emit()"
  ></app-editor-header>

  <div class="canvas-region" data-testid="editor-canvas-region">
    <editor-image-canvas></editor-image-canvas>
    <div class="chip-anchor">
      <app-value-chip></app-value-chip>
    </div>
  </div>

  <!-- Crop tool (#638): the interactive overlay lives on the canvas; the crop
       toolbar (aspect presets + straighten + reset/done) replaces the drag bar
       while Crop is armed. Otherwise the normal value pipe shows. -->
  @if (state.armedTool() === 'crop') {
    <app-crop-toolbar></app-crop-toolbar>
  } @else {
    <!-- Sub-param chips (#1108): rendered only while a multi-param tool is
         armed — single-param tools keep the pre-#1108 layout exactly. -->
    <app-sub-param-row></app-sub-param-row>
    <app-drag-bar></app-drag-bar>
  }
  <app-group-tabs></app-group-tabs>
  <app-tool-pill-row (presetsTap)="presetsOpen.set(true)"></app-tool-pill-row>

  <!-- Presets pill UI (#1115): popover card on desktop, S1c sheet otherwise. -->
  @if (presetsAsPopover()) {
    @if (presetsOpen()) {
      <div
        class="presets-popover-scrim"
        (click)="presetsOpen.set(false)"
        role="presentation"
        data-testid="presets-popover-scrim"
      ></div>
      <div class="presets-popover" role="dialog" aria-label="Presets" data-testid="presets-popover">
        <app-presets-panel (applied)="presetsOpen.set(false)"></app-presets-panel>
      </div>
    }
  } @else {
    <app-bottom-sheet [(isOpen)]="presetsOpen">
      @if (presetsOpen()) {
        <app-presets-panel (applied)="presetsOpen.set(false)"></app-presets-panel>
      }
    </app-bottom-sheet>
  }
</div>
