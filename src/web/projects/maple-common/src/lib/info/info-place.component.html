@let d = detail();
<maple-collapsible label="Place" storageKey="info-place">
  <div class="px-4 py-[5px]">
    @if (editing()) {
      <label class="block">
        <span class="mb-0.5 block text-[10px] text-text-muted">Display name</span>
        <input
          class="box-border h-6 w-full rounded-[3px] border-[0.5px] border-border bg-input-bg px-1.5 text-[11px] text-text-main outline-none focus:border-primary"
          [value]="draft()"
          (input)="onDraftInput($event)"
          placeholder="Display name"
        />
      </label>
      <div class="mt-1.5 flex justify-end gap-1.5">
        <button
          class="text-[10px] text-text-muted hover:text-text-main"
          type="button"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
        <button
          class="text-[10px] font-medium text-primary hover:underline"
          type="button"
          (click)="saveEdit()"
        >
          Save
        </button>
      </div>
    } @else {
      @if (d.place) {
        <div class="text-[11px] font-medium text-text-main">
          {{ formatRollups(d.place.rollups) }}
        </div>
        <div class="mt-0.5 text-[10px] text-text-muted overflow-hidden text-ellipsis">
          {{ d.place.display_name ?? '(no display name)' }}
        </div>
      } @else {
        <div class="text-[11px] text-text-muted">No place set</div>
      }
      <div class="mt-1.5 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <app-enrichment-status-badge [status]="status()" [pausedHref]="WORKERS_SETTINGS_URL" />
        </div>
        <div class="flex gap-2">
          <button
            class="text-[10px] text-text-muted hover:text-text-main"
            type="button"
            (click)="startEdit()"
          >
            Edit
          </button>
          <button
            class="text-[10px] text-text-muted hover:text-text-main"
            type="button"
            (click)="onRequeue()"
          >
            ↻ Re-geocode
          </button>
        </div>
      </div>
      @if (errorMessage()) {
        <div class="mt-1 text-[10px] text-error-text">{{ errorMessage() }}</div>
      } @else if (stale()) {
        <div class="mt-1 text-[10px] text-text-muted">
          Still pending — check
          <a [routerLink]="WORKERS_SETTINGS_URL" class="underline hover:text-text-main"
            >worker status</a
          >.
        </div>
      }
    }
  </div>
</maple-collapsible>
