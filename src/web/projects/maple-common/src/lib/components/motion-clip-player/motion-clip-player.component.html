<video
  class="h-full w-full bg-black object-contain"
  data-testid="motion-clip-player"
  [src]="src()"
  [poster]="poster()"
  [attr.aria-label]="label()"
  autoplay
  controls
  playsinline
  preload="auto"
  (ended)="finished.emit()"
  (error)="finished.emit()"
  (pointerdown)="$event.stopPropagation()"
  (pointerup)="$event.stopPropagation()"
></video>
