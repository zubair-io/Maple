<div class="mui-video-player flex flex-col gap-1">
  <video
    #video
    class="video block w-full rounded-lg bg-image-canvas"
    [src]="src()"
    [poster]="poster() ?? undefined"
    (play)="onPlay()"
    (pause)="onPause()"
    (ended)="onEnded()"
    (loadedmetadata)="onLoadedMetadata()"
    (timeupdate)="onTimeUpdate()"
  ></video>
  <div class="controls flex items-center gap-2">
    <mui-button
      variant="ghost"
      size="sm"
      class="transport mui-chrome-transport-button"
      [ariaLabel]="playing() ? 'Pause' : 'Play'"
      (pressed)="togglePlay()"
    >
      {{ playing() ? '❚❚' : '▶' }}
    </mui-button>
    <div class="scrubber mui-chrome-scrubber-track" (click)="seek($event)">
      <mui-progress shape="bar" size="sm" [value]="progressPercent()" />
    </div>
    <span class="time mui-chrome-time-readout"
      >{{ formatDuration(currentTime()) }} / {{ formatDuration(duration()) }}</span
    >
  </div>
</div>
