<!-- ControlCard — floating glass flyout panel, FlyoutSliderPanel parity (#1535) -->
<!-- Phone (#1807): header still shows a close button; `closed` hides the card -->
@if (!phone() || !closed()) {
  <div class="card">
    <div class="card-header">
      <maple-icon [name]="$any(groupIcon(activeGroup()))" [size]="12" color="var(--pro-accent)" />
      <span class="group-title">{{ groupLabel(activeGroup()).toUpperCase() }}</span>

      <button
        class="reset-btn"
        title="Reset {{ groupLabel(activeGroup()) }}"
        aria-label="Reset {{ groupLabel(activeGroup()) }} adjustments"
        (click)="resetGroup()"
      >
        <maple-icon name="revert" [size]="11" color="var(--pro-text-muted)" />
      </button>

      @if (phone()) {
        <!-- Close button — collapses the flyout back to just the dock. -->
        <button
          class="close-btn"
          title="Close panel"
          aria-label="Close panel"
          (click)="onCloseClick()"
        >
          <maple-icon name="clear-circle-fill" [size]="16" color="var(--pro-text-muted)" />
        </button>
      }
    </div>

    <div class="slider-grid">
      @for (tool of slidersFor(activeGroup()); track tool) {
        <pro-living-slider
          [attr.aria-label]="labelFor(tool)"
          [label]="labelFor(tool)"
          [value]="valueFor(tool)"
          [min]="minFor(tool)"
          [max]="maxFor(tool)"
          [step]="stepFor(tool)"
          [gradient]="gradientFor(tool)"
          [bipolar]="bipolarFor(tool)"
          [defaultValue]="defaultFor(tool)"
          (dragStart)="onSliderDragStart(tool)"
          (valueChange)="onSliderChange(tool, $event)"
          (resetRequest)="onSliderReset(tool)"
        />
      }
    </div>
  </div>
}
