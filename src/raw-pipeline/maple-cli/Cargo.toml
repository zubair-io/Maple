[package]
name = "maple-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "maple-cli"
path = "src/main.rs"

[features]
stage-dump = ["raw-core/stage-dump"]
# Same contract as raw-core's `fixtures` feature (#1082): fixture-backed
# integration tests are `ignored` without it, and fail closed (panic on a
# missing fixture) with it. Enable on fixture-provisioned machines only.
fixtures = []
# Panorama stitching (#1182): pulls the maple-pano library with its ML
# detector/matcher stack. Off by default — the pano subcommand is the
# operator surface for `test_pano_pipeline.sh`'s candidate gates.
pano = ["dep:maple-pano", "maple-pano/ml"]
# Enables the `fit-acr` subcommand (requires raw-core's `test-support` feature).
test-support = ["raw-core/test-support", "dep:png"]

[dependencies]
raw-core = { path = "../raw-core" }
maple-pano = { path = "../maple-pano", optional = true }
bytemuck.workspace = true
clap.workspace = true
png = { workspace = true, optional = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
