@if (canExpand()) {
  <div class="flex w-3 flex-shrink-0 items-center justify-center" (click)="onClick($event)">
    @if (isLoading()) {
      <div
        class="chevron-spinner h-2 w-2 rounded-full border-[1.5px] border-border"
        aria-label="Loading"
      ></div>
    } @else if (hasError()) {
      <span class="text-[11px] leading-none text-error-text" [title]="errorTitle()">!</span>
    } @else {
      <maple-icon
        [name]="isOpen() ? 'chevron-down' : 'chevron-right'"
        [size]="10"
        color="var(--color-text-muted)"
        [strokeWidth]="2"
      />
    }
  </div>
} @else {
  <div class="w-3 flex-shrink-0"></div>
}
