@if (open()) {
  <div
    class="mui-drawer-shell-scrim inset-0 z-[200] pointer-events-auto bg-[rgba(0,0,0,0.45)]"
    [class]="scrimClass()"
    [class.contained]="contained()"
    (click)="onScrimClick()"
  ></div>
  <div
    #panelEl
    class="mui-drawer-shell top-0 bottom-0 z-[201] touch-pan-y overflow-auto bg-sidebar text-text-main outline-none"
    [class]="panelClass()"
    [class.right]="edge() === 'right'"
    [class.contained]="contained()"
    [class.dragging]="dragDx() !== null"
    [style.width.px]="width()"
    [style.transform]="'translateX(' + (dragDx() ?? 0) + 'px)'"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel($event)"
  >
    <ng-content />
  </div>
}
