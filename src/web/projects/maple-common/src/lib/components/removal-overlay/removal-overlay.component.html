<div
  class="absolute inset-0"
  role="img"
  aria-label="Paint to select objects; the highlighted regions are selected or protected"
  [attr.aria-disabled]="!session.paintReady() || !session.canPaint()"
>
  <canvas
    #overlay
    class="absolute inset-0 pointer-events-none w-full h-full"
    aria-hidden="true"
  ></canvas>
  <svg class="absolute inset-0 w-full h-full pointer-events-none" aria-hidden="true">
    <path
      [attr.d]="path()"
      stroke="var(--color-primary)"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />
  </svg>
</div>
