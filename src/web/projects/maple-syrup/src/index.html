<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maple</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Theme color matches MapleTokens.bg (#1c1917) — see
         docs/design/responsive-program/pwa-polish.md §1.3 / §3. -->
    <meta name="theme-color" content="#1c1917" />
    <!-- iOS PWA install — dark status bar over the dark app background. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maple" />
    <link rel="apple-touch-icon" href="assets/brand/icon-192.png" />
    <style>
      /* Boot splash — static markup inside app-root's light DOM, shown
         before any JS runs. Angular clears this and renders its own view
         into app-root once bootstrap completes, so no teardown is needed. */
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1917;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash">
        <img src="assets/brand/maple-mark.png" width="96" height="96" alt="" />
      </div>
    </app-root>
  </body>
</html>
