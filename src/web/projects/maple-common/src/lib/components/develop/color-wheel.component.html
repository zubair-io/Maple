<!-- ColorWheelComponent — one colour-grading wheel (#275) -->
<div class="flex flex-col items-center gap-1.5">
  <div
    #wheelEl
    class="wheel relative aspect-square w-full cursor-crosshair touch-none rounded-full border-[0.5px] border-[color:var(--pro-border,rgb(255_255_255_/_12%))] outline-none focus-visible:shadow-[0_0_0_2px_var(--pro-accent,#4a9fc4)]"
    role="application"
    tabindex="0"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-valuetext]="valueLabel()"
    [attr.data-testid]="'color-wheel-' + label().toLowerCase()"
    (pointerdown)="onPointerDown($event)"
    (dblclick)="onDoubleClick()"
    (keydown)="onKeyDown($event)"
  >
    <!-- Hue ring under a centre-out desaturation fade. -->
    <div class="wheel-hue absolute inset-0" aria-hidden="true"></div>
    <div class="wheel-fade absolute inset-0" aria-hidden="true"></div>

    <div
      class="pointer-events-none absolute h-3 w-3 -m-1.5 rounded-full border-2 border-white bg-transparent shadow-[0_0_0_1px_rgb(0_0_0_/_55%),0_1px_3px_rgb(0_0_0_/_45%)]"
      [style.left.%]="puckPos().x * 100"
      [style.top.%]="(1 - puckPos().y) * 100"
      aria-hidden="true"
    ></div>
  </div>

  <div class="flex select-none flex-col items-center gap-px">
    <span class="text-[11px] text-[color:var(--pro-text,#f2efe9)]">{{ label() }}</span>
    <span
      class="font-[var(--font-mono,monospace)] text-[10px] text-[color:var(--pro-text-muted,#a8a097)] [font-variant-numeric:tabular-nums]"
      >{{ valueLabel() }}</span
    >
  </div>
</div>
