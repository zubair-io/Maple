@if (open()) {
  <div class="mui-dialog-scrim" (click)="onScrimClick()">
    <div
      #panel
      class="mui-dialog"
      [attr.role]="role()"
      aria-modal="true"
      [attr.aria-label]="resolvedAriaLabel()"
      tabindex="-1"
      (click)="$event.stopPropagation()"
    >
      <mui-text variant="row-label" [block]="true">{{ title() }}</mui-text>
      @if (message()) {
        <mui-text variant="body" color="muted" [block]="true" class="message">
          {{ message() }}
        </mui-text>
      }
      @if (errorMessage()) {
        <mui-text variant="body" color="error" [block]="true" class="error-message">
          {{ errorMessage() }}
        </mui-text>
      }
      @if (variant() === 'prompt') {
        <mui-input
          [value]="promptValue()"
          (valueChange)="promptValue.set($event)"
          [placeholder]="promptPlaceholder()"
          [ariaLabel]="title()"
          (committed)="promptValue.set($event)"
        />
      }
      <div class="actions">
        <mui-button #cancelBtn variant="ghost" [disabled]="busy()" (pressed)="cancel()">
          {{ cancelLabel() }}
        </mui-button>
        <mui-button
          [variant]="destructive() ? 'destructive' : 'primary'"
          [disabled]="busy()"
          (pressed)="confirm()"
        >
          {{ confirmLabel() }}
        </mui-button>
      </div>
    </div>
  </div>
}
