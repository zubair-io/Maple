<div class="mui-typing-indicator">
  <mui-avatar [name]="name()" size="xs" />
  <mui-text variant="chip-label" color="muted">{{ name() }} is typing</mui-text>
  <span class="dots" aria-hidden="true">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </span>
</div>
