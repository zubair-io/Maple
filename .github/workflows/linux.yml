name: linux

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'src/linux/**'
      - 'tools/qualification/linux-native/**'
      - 'src/raw-pipeline/**'
      - 'resources/film-luts/**'
      - 'test-fixtures/batch-transfer/**'
      - 'test-fixtures/jpeg-tiff/**'
      - 'src/apple/MapleUITests/Fixtures/synthetic/**'
      - 'src/apple/Maple/Assets.xcassets/AppIcon.appiconset/maple512.png'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'src/linux/**'
      - 'tools/qualification/linux-native/**'
      - 'src/raw-pipeline/**'
      - 'resources/film-luts/**'
      - 'test-fixtures/batch-transfer/**'
      - 'test-fixtures/jpeg-tiff/**'
      - 'src/apple/MapleUITests/Fixtures/synthetic/**'
      - 'src/apple/Maple/Assets.xcassets/AppIcon.appiconset/maple512.png'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  support-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test the support matrix checker
        run: python3 -m unittest discover -s src/linux/packaging -p 'test_*.py'
      - name: README support table matches support-matrix.json
        run: python3 src/linux/packaging/support_matrix.py
      - id: matrix
        name: Container smoke jobs claimed by the matrix
        run: |
          smoke=$(python3 src/linux/packaging/support_matrix.py --ci-matrix)
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  native-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      XDG_RUNTIME_DIR: /tmp/maple-linux-runtime
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/linux -> target
      - name: Install native and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb1 \
            libxcursor1 libxi6 libxrandr2 xvfb xauth x11-utils weston \
            python3-dbus dbus-daemon at-spi2-core \
            dpkg-dev squashfs-tools shared-mime-info \
            flatpak flatpak-builder appstream
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: Require and report a Vulkan adapter
        run: |
          vulkaninfo --summary | tee "$RUNNER_TEMP/maple-vulkan.txt"
          grep -q deviceName "$RUNNER_TEMP/maple-vulkan.txt"
      - name: Check all native targets
        run: cargo clippy --locked --manifest-path src/linux/Cargo.toml --all-targets --no-deps -- -D warnings
      - name: Run native library and integration tests
        # Mesa concurrency restriction #2336 also applies to native GPU tests.
        # These use committed small fixtures, not the absent 100MP/ACR corpus.
        run: cargo test --locked --manifest-path src/linux/Cargo.toml --all-targets -- --test-threads=1
      - name: Build release application
        run: cargo build --locked --release --manifest-path src/linux/Cargo.toml --bin maple-linux
      - name: Validate the AppStream metadata
        run: appstreamcli validate --no-net src/linux/packaging/app.justmaple.aperture.metainfo.xml
      - name: Build .deb, AppImage and Flatpak bundle
        run: |
          mkdir "$RUNNER_TEMP/maple-packages"
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          python3 src/linux/packaging/package.py deb --output-dir "$RUNNER_TEMP/maple-packages"
          python3 src/linux/packaging/package.py appimage \
            --runtime "$RUNNER_TEMP/runtime-x86_64" --output-dir "$RUNNER_TEMP/maple-packages"
          python3 src/linux/packaging/package.py flatpak --output-dir "$RUNNER_TEMP/maple-packages"
          cd "$RUNNER_TEMP/maple-packages"
          sha256sum -c ./*.sha256
      - name: Launch extracted release outside checkout
        run: |
          dpkg-deb -x "$RUNNER_TEMP"/maple-packages/maple_*.deb "$RUNNER_TEMP/maple-unpacked"
          xvfb-run -a -s '-screen 0 1280x800x24' python3 src/linux/packaging/smoke.py \
            "$RUNNER_TEMP/maple-unpacked/usr/bin/maple-linux"
      - name: Launch extracted release on Wayland
        run: dbus-run-session -- python3 src/linux/packaging/weston_smoke.py --accessibility "$RUNNER_TEMP/maple-unpacked/usr/bin/maple-linux"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: maple-linux-packages
          path: ${{ runner.temp }}/maple-packages
          if-no-files-found: error

  package-smoke:
    name: package-smoke (${{ matrix.package }}, ${{ matrix.container }})
    needs: [support-matrix, native-build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ matrix.container }}
      # Flatpak's bubblewrap sandbox creates mount and PID namespaces, which
      # Docker's default seccomp and capability set forbid. The container is
      # disposable, so it runs privileged for the Flatpak rows only.
      options: ${{ matrix.package == 'flatpak' && '--privileged' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.support-matrix.outputs.smoke) }}
    steps:
      - name: Install the smoke harness prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates python3 shared-mime-info desktop-file-utils libglib2.0-bin
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: maple-linux-packages
          path: packages
      - name: Verify package checksums
        run: |
          cd packages
          sha256sum -c ./*.sha256
      - name: Install, launch, update and remove in a clean container
        run: |
          case '${{ matrix.package }}' in
            deb) artifact=$(ls packages/*.deb) ;;
            appimage) artifact=$(ls packages/*.AppImage) ;;
            flatpak) artifact=$(ls packages/*.flatpak) ;;
          esac
          python3 src/linux/packaging/install_smoke.py '${{ matrix.package }}' "$artifact" \
            --sessions '${{ matrix.sessions }}'
