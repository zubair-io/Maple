<mui-dialog
  title="Move to Trash"
  [ariaLabel]="'Move ' + folderLabel() + ' to Trash'"
  [message]="message()"
  [errorMessage]="serverError()"
  [open]="true"
  [busy]="busy()"
  [destructive]="true"
  [confirmLabel]="confirmLabel()"
  cancelLabel="Cancel"
  (confirmed)="onConfirm()"
  (dismissed)="onDismiss()"
/>
