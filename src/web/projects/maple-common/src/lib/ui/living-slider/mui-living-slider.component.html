<div
  class="mui-living-slider mui-chrome-control-column"
  [class.is-disabled]="disabled()"
  [class.mui-chrome-control-disabled]="disabled()"
>
  <div class="row mui-chrome-control-row">
    <mui-text variant="tool-label" color="muted" class="label">{{ label() }}</mui-text>
    <mui-text variant="value-chip" color="main" class="readout mui-chrome-control-readout">{{
      valueLabel()
    }}</mui-text>
  </div>
  <div
    #trackEl
    class="track relative h-1.5 cursor-pointer touch-none rounded-sm outline-offset-4 focus-visible:outline-2 focus-visible:outline-primary"
    [class]="dragging() ? 'is-dragging outline-2 outline-primary' : ''"
    role="slider"
    tabindex="0"
    [attr.aria-label]="ariaLabel() ?? label()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="value()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [style.background]="gradient()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (keydown)="onKeydown($event)"
  >
    @if (bipolar()) {
      <div
        class="zero-notch absolute top-[-2px] left-1/2 h-2.5 w-[1.5px] -translate-x-1/2 bg-white"
      ></div>
    }
    <div
      class="thumb pointer-events-none absolute top-1/2 h-3.5 w-3.5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-text-main bg-white shadow-[0_0_0_2px_var(--color-primary)]"
      [style.left.%]="thumbPct()"
    ></div>
  </div>
</div>
