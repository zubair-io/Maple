[package]
name = "raw-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# NOTE: literal (not `license.workspace = true`) — wasm-pack's manifest parser
# rejects a workspace-inherited `license`, which aborts the WASM build before it
# starts. Keep in sync with `[workspace.package] license` in ../Cargo.toml (#984).
license = "Proprietary"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raw-core = { path = "../raw-core" }
# Headless GPU resource core (epic #925). Gated by the `gpu` feature; absent from
# default builds. wgpu (WebGPU on wasm) is pulled in transitively through here.
raw-gpu = { path = "../raw-gpu", optional = true }
wasm-bindgen = "0.2"
thiserror.workspace = true

# uuid (pulled in transitively by rawler) needs the `js` feature on
# wasm32-unknown-unknown to get randomness from WebCrypto.
# getrandom also needs `wasm_js` for its own WASM entropy source.
#
# wasm-bindgen-rayon + rayon + console_error_panic_hook are gated behind the
# `parallel` feature. They are only relevant for wasm32-unknown-unknown and
# require the atomics/bulk-memory target features at build time. JS callers
# check `crossOriginIsolated` (COOP: same-origin + COEP: require-corp) and
# only invoke `initThreadPool` when it's true — single-threaded fallback
# continues to work everywhere.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
# `js_sys::Function` for the BM3D deep-denoise progress callback (#1153):
# raw-core pushes stage progress into JS, which the render worker
# re-broadcasts to the editor. Already in the tree transitively via
# wasm-bindgen-futures / web-sys; this makes it nameable.
js-sys = "0.3"
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.10", optional = true }
# Unconditional: we always want panic messages forwarded to the JS console so
# WASM traps don't show up as opaque `RuntimeError: unreachable` in production.
console_error_panic_hook = { version = "0.1" }
# Future↔Promise glue for the exported async WebGPU parity binding. wasm-only;
# optional + gated by `gpu`. (wgpu itself now comes via the `raw-gpu` dep.)
wasm-bindgen-futures = { version = "0.4", optional = true }
# Canvas handle for the P1c (#989) web present binding: the exported
# `present_gpu(canvas)` takes a `web_sys::HtmlCanvasElement` to hand to
# `raw_gpu::present_test_pattern_web`; `WebLiveSession::open(.., canvas)` takes a
# `web_sys::OffscreenCanvas` (the live editor canvas is transferred to the worker
# via `transferControlToOffscreen`, P4b-web / #1038). wasm-only; optional + gated
# by `gpu` so default + host builds never pull web-sys. (web-sys is already in the
# wasm tree transitively via wgpu; this turns on the feature gates.) NO `Gpu*`
# feature — wgpu-23 vendors its own WebGPU bindings (`duplicate string enums`).
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas"], optional = true }

[features]
default = []
# Enable the parallel (rayon + wasm-bindgen-rayon) thread-pool entry points.
# The WASM build turns this on via `wasm-pack build -- --features parallel`.
parallel = ["dep:wasm-bindgen-rayon", "dep:rayon"]
# Epic #925: WebGPU exposure parity binding + web present proof (P1c / #989),
# backed by the `raw-gpu` resource core. OFF by default.
gpu = ["dep:raw-gpu", "dep:wasm-bindgen-futures", "dep:web-sys"]

# Native-host test deps for the `render_bytes_gpu` parity gate (#1029). wgpu +
# pollster drive the GPU core on Metal in `gpu_render/tests.rs`; both are already
# in the tree transitively via `raw-gpu` when `gpu` is on. Non-wasm only — the
# wasm test target awaits the browser and never block_ons. These are dev-only, so
# they don't affect the shipped wasm bundle or the default (gpu-off) build.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"
wgpu = "23"
# Decodes the files `export_bytes` produces so the export-vs-canvas parity gate
# (#943) can diff real pixels rather than trusting the encoder. Dev-only and
# non-wasm-only, so the shipped bundle is unaffected — raw-core already carries
# the same crate for its encoders.
image.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
