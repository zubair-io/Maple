# Tag the committed version, then open the next development-version PR.
name: version-sync

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Next development version (blank = patch increment)'
        required: false
        type: string
      advance_only:
        description: 'Migration: only advance an already-tagged version; do not release'
        default: false
        type: boolean
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  release-readiness:
    name: Release readiness
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/next-v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Wait for the complete release CI suite
        run: |
          set -euo pipefail

          if ! [[ "$HEAD_BRANCH" =~ ^release/next-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable release PR; release readiness does not apply."
            exit 0
          fi

          deadline=$((SECONDS + 7200))

          while (( SECONDS < deadline )); do
            runs="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"
            if python3 tools/release_ci.py <<<"$runs"; then
              exit 0
            else
              result=$?
              if [ "$result" -ne 2 ]; then exit "$result"; fi
            fi
            sleep 30
          done

          echo "::error::Timed out waiting for release workflows for $HEAD_SHA."
          exit 1

  validate-apple:
    name: Validate pinned Apple revision
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/apple.yml

  validate-packages:
    name: Validate pinned native packages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-package.yml
    permissions:
      contents: read
      id-token: write
    with:
      dry_run: true

  create-release:
    name: Tag current version and open next-version PR
    needs: [validate-apple, validate-packages]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: release-handoff
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.VERSION_SYNC_TOKEN }}
      GH_STATUS_TOKEN: ${{ github.token }}
      NEXT_VERSION: ${{ inputs.next_version }}
      ADVANCE_ONLY: ${{ inputs.advance_only }}
      RELEASE_SHA: ${{ github.sha }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      VALIDATED_APPLE_SHA: ${{ needs.validate-apple.outputs.validated_sha }}
      VALIDATED_PACKAGES_SHA: ${{ needs.validate-packages.outputs.validated_sha }}
    steps:
      - name: Require a downstream-triggering token
        run: |
          test -n "$GH_TOKEN" || { echo "::error::VERSION_SYNC_TOKEN is required in the release environment"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.VERSION_SYNC_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Create release handoff
        run: |
          set -euo pipefail
          user_json=$(gh api "users/$REPOSITORY_OWNER")
          owner_name=$(jq -r '.name // .login' <<<"$user_json")
          owner_id=$(jq -r '.id' <<<"$user_json")
          git config user.name "$owner_name"
          git config user.email "${owner_id}+${REPOSITORY_OWNER}@users.noreply.github.com"
          command=release
          if [ "$ADVANCE_ONLY" = true ]; then command=advance; fi
          python3 tools/release_control.py "$command" --next-version "$NEXT_VERSION" --release-sha "$RELEASE_SHA"
