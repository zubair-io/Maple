<mui-settings-row
  [customSummary]="true"
  label="Generated search"
  [open]="expanded()"
  (openChange)="toggleExpanded()"
  [showDivider]="false"
  data-testid="generated-search-row"
>
  <div class="wrow-summary" summary data-testid="generated-search-row-summary">
    <span class="wrow-id">
      <span class="mono">generated-search</span>
    </span>
    <span class="status-pill">
      <span class="status-dot" [style.background]="statusColor()"></span>
      <span class="status-label" data-testid="gs-status">
        {{ statusLabel() }}
      </span>
    </span>
    <span class="wrow-readout" data-testid="gs-summary">{{ summaryLine() }}</span>
    <span class="wrow-spacer"></span>
    <mui-button
      variant="ghost"
      size="sm"
      data-testid="gs-run-now"
      [loading]="running()"
      (pressed)="runNow()"
    >
      Run now
    </mui-button>
  </div>

  <div class="panel">
    @if (loading()) {
      <p class="muted">Loading…</p>
    } @else {
      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }

      <!-- Master switch first: everything below is inert while paused. -->
      <div class="row">
        <mui-checkbox
          label="Run daily"
          [checked]="enabled()"
          [disabled]="saving()"
          (checkedChange)="toggleEnabled()"
        />
        @if (saved()) {
          <span class="saved">Saved</span>
        }
      </div>

      @if (draft(); as d) {
        <maple-generated-search-knobs
          [draft]="d"
          [saving]="saving()"
          (changed)="draft.set($event)"
          (save)="save()"
        />
      }

      <maple-generated-search-collections
        [cards]="cards()"
        [requested]="config()?.collections_per_day ?? null"
      />
    }
  </div>
</mui-settings-row>
