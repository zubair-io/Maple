<mui-drag-bar
  data-testid="editor-drag-bar"
  dragMode="relative"
  [value]="internalValue()"
  (valueChange)="onValueChange($event)"
  [min]="valueMin"
  [max]="valueMax"
  [disabled]="!state.armedToolAcceptsValueEdits()"
  [ariaLabel]="ariaLabel()"
  (dragStart)="onDragStart()"
  (dragEnd)="onDragEnd()"
  (fineModeEngaged)="onFineModeEngaged()"
  (crossedZero)="onCrossedZero()"
  (reachedExtreme)="onReachedExtreme()"
/>
