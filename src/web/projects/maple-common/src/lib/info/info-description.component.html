@let d = detail();
<maple-collapsible label="Description" storageKey="info-description">
  <div class="px-4 py-[5px]">
    @if (editing()) {
      <textarea
        aria-label="Description caption"
        rows="3"
        class="box-border w-full rounded-[3px] border-[0.5px] border-border bg-input-bg px-1.5 py-1 text-[11px] text-text-main outline-none focus:border-primary resize-y"
        [value]="draft()"
        (input)="onDraftInput($event)"
        placeholder="Caption…"
      ></textarea>
      <div class="mt-1.5 flex justify-end gap-1.5">
        <button
          class="text-[10px] text-text-muted hover:text-text-main"
          type="button"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
        <button
          class="text-[10px] font-medium text-primary hover:underline"
          type="button"
          (click)="saveEdit()"
        >
          Save
        </button>
      </div>
    } @else {
      <div class="text-[11px] leading-relaxed text-text-main whitespace-pre-wrap break-words">
        @if (d.description) {
          {{ d.description }}
        } @else {
          <span class="text-text-muted">No description yet</span>
        }
      </div>
      <div class="mt-1.5 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <app-enrichment-status-badge [status]="status()" [pausedHref]="WORKERS_SETTINGS_URL" />
        </div>
        <div class="flex gap-2">
          <button
            class="text-[10px] text-text-muted hover:text-text-main"
            type="button"
            (click)="startEdit()"
          >
            Edit
          </button>
          <button
            class="text-[10px] text-text-muted hover:text-text-main"
            type="button"
            (click)="onRequeue()"
          >
            ↻ Re-describe
          </button>
        </div>
      </div>
      @if (errorMessage()) {
        <div class="mt-1 text-[10px] text-error-text">{{ errorMessage() }}</div>
      } @else if (stale()) {
        <div class="mt-1 text-[10px] text-text-muted">
          Still pending — check
          <a [routerLink]="WORKERS_SETTINGS_URL" class="underline hover:text-text-main"
            >worker status</a
          >.
        </div>
      }
    }
  </div>
</maple-collapsible>
