<div
  class="mui-tree-row"
  role="treeitem"
  tabindex="0"
  [style.padding-left.px]="indentPx()"
  [class.is-active]="active()"
  [class.is-disabled]="disabled()"
  [attr.aria-expanded]="expandable() ? expanded() : null"
  [attr.aria-current]="active() ? 'true' : null"
  (click)="onRowClick()"
>
  @if (expandable()) {
    <button
      type="button"
      class="chevron"
      [class.is-expanded]="expanded()"
      [attr.aria-label]="expanded() ? 'Collapse' : 'Expand'"
      (click)="toggle($event)"
    >
      <mui-icon name="chevron-right" size="sm" />
    </button>
  } @else {
    <span class="chevron-spacer"></span>
  }
  <mui-icon [name]="icon()" size="sm" class="row-icon" />
  <mui-text variant="row-label" [truncate]="true" class="row-label">{{ label() }}</mui-text>
  @if (loading()) {
    <mui-spinner size="sm" placement="inline" />
  } @else if (count() !== null) {
    <mui-badge variant="count" [value]="count()!" />
  }
</div>
