<header class="header">
  <button
    type="button"
    class="icon-btn"
    aria-label="Back"
    data-testid="editor-back"
    (click)="back.emit()"
  >
    <maple-icon name="chevron-left" [size]="20" [strokeWidth]="1.6"></maple-icon>
  </button>

  <h1 class="filename" data-testid="editor-filename">{{ filename() }}</h1>

  <div class="spacer"></div>

  <button
    type="button"
    class="icon-btn"
    aria-label="Undo"
    data-testid="editor-undo"
    [disabled]="!state.canUndo()"
    (pointerdown)="onUndoPointerDown()"
    (pointerup)="onUndoPointerUp()"
    (pointercancel)="onUndoPointerCancel()"
  >
    <maple-icon name="undo-uturn" [size]="18" [strokeWidth]="1.6"></maple-icon>
  </button>

  <button
    type="button"
    class="icon-btn"
    aria-label="Share"
    data-testid="editor-share"
    (click)="share.emit()"
  >
    <maple-icon name="share-up-square" [size]="18" [strokeWidth]="1.6"></maple-icon>
  </button>

  <button
    type="button"
    class="icon-btn"
    aria-label="Info"
    data-testid="editor-info"
    (click)="info.emit()"
  >
    <maple-icon name="info" [size]="18" [strokeWidth]="1.6"></maple-icon>
  </button>
</header>
