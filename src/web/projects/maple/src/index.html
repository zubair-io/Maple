<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maple</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Theme color matches MapleTokens.bg (#1c1917) — see
         docs/design/responsive-program/pwa-polish.md §1.3 / §3. -->
    <meta name="theme-color" content="#1c1917" />
    <!-- iOS PWA install — dark status bar over the dark app background. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maple" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
    />
    <style>
      /* Boot splash — static markup inside app-root's light DOM, shown
         before any JS runs. Angular clears this and renders its own view
         into app-root once bootstrap completes, so no teardown is needed. */
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1917;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash">
        <svg viewBox="0 0 200 200" width="96" height="96" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="94" fill="#fff" />
          <path
            d="M106.9,104.0 L178.0,100.0 A78,78 0 0 1 154.7,155.6 L102.0,107.7 Z"
            fill="#4b5320"
          />
          <path
            d="M101.2,107.9 L148.6,161.0 A78,78 0 0 1 90.7,177.4 L95.2,106.4 Z"
            fill="#b8a06a"
          />
          <path d="M94.6,105.9 L82.6,176.0 A78,78 0 0 1 33.6,141.0 L92.0,100.2 Z" fill="#8a6d3b" />
          <path d="M92.0,99.4 L29.7,133.8 A78,78 0 0 1 26.6,73.7 L94.8,93.9 Z" fill="#4b5320" />
          <path d="M95.5,93.4 L29.7,66.2 A78,78 0 0 1 74.8,26.2 L101.5,92.2 Z" fill="#b8a06a" />
          <path d="M102.4,92.4 L82.6,24.0 A78,78 0 0 1 142.0,34.3 L107.1,96.3 Z" fill="#8a6d3b" />
          <path d="M107.4,97.1 L148.6,39.0 A78,78 0 0 1 177.6,91.8 L107.3,103.3 Z" fill="#4b5320" />
          <circle cx="100" cy="100" r="89.5" fill="none" stroke="#4b5320" stroke-width="9" />
        </svg>
      </div>
    </app-root>
  </body>
</html>
