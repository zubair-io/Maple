<div class="mui-crop-toolbar flex flex-wrap items-center gap-4 rounded-lg bg-surface py-2 px-4">
  <mui-chip-row
    class="presets flex-none"
    [chips]="aspectChips()"
    mode="select"
    [selectedId]="aspect()"
    (selectedIdChange)="onAspectChange($event)"
  />
  <mui-drag-bar
    class="straighten min-w-[120px] flex-[1_1_160px]"
    label="Straighten"
    [value]="angle()"
    (valueChange)="onAngleChange($event)"
    [min]="-45"
    [max]="45"
    [step]="0.1"
    [testId]="straightenTestId()"
    (dragStart)="straightenDragStart.emit()"
    (dragEnd)="straightenDragEnd.emit()"
  />
  <mui-button
    variant="ghost"
    [iconLeading]="'revert'"
    ariaLabel="Reset crop"
    [disabled]="resetDisabled()"
    [testId]="resetTestId()"
    (pressed)="onReset()"
  >
    Reset
  </mui-button>
</div>
