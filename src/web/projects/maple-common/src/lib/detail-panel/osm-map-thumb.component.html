<a
    [href]="mapUrl()"
    target="_blank"
    rel="noopener noreferrer"
    [title]="title()"
    class="relative block h-[86px] cursor-pointer overflow-hidden rounded border-[0.5px] border-border bg-surface-alt"
>
    <img
        [src]="tileUrl()"
        [alt]="alt()"
        class="absolute inset-0 h-full w-full object-cover"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        loading="lazy"
    />
    <div
        class="absolute h-2 w-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary shadow-[0_0_0_3px_rgba(196,73,58,0.25)]"
        [style.left]="pin().left"
        [style.top]="pin().top"
    ></div>
    <div
        class="absolute bottom-1.5 left-2 rounded-[3px] bg-surface/80 px-1 py-[1px] font-mono text-[9px] text-text-main"
    >
        Open in Maps ›
    </div>
</a>
