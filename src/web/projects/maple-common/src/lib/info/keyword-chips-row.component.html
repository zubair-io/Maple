<h3 class="eyebrow">Keywords</h3>

<div class="chips">
  @for (k of keywords(); track k) {
    <button
      type="button"
      class="chip chip-remove"
      [attr.data-testid]="'info-keyword-' + k"
      [attr.aria-label]="'Keyword: ' + k + '. Click to remove.'"
      (click)="removeKeyword(k)"
    >
      {{ k }}
    </button>
  }
  @if (isEditing()) {
    <span class="chip chip-add chip-input-wrap">
      <input
        #addInput
        type="text"
        class="chip-input"
        data-testid="info-keyword-input"
        placeholder="New keyword"
        aria-label="New keyword"
        [value]="draft()"
        (input)="onDraftInput($event)"
        (keydown.enter)="commitDraft()"
        (keydown.escape)="cancelDraft()"
        (blur)="commitDraft()"
      />
    </span>
  } @else {
    <button
      type="button"
      class="chip chip-add"
      data-testid="info-keyword-add"
      aria-label="Add keyword"
      (click)="openAddDraft()"
    >
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <span>Add</span>
    </button>
  }
</div>
