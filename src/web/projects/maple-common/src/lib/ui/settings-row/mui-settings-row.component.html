<!-- The `<ng-content />` for the body must appear exactly once in this
     template — Angular's projection distribution assigns the unselected
     bucket to a single `<ng-content>` slot, and a second occurrence (even in
     an inactive @else branch) silently discards it instead of falling
     through. One `<ng-template>`, reused via `ngTemplateOutlet` from both
     branches, keeps a single occurrence while still varying the header. -->
<ng-template #bodyContent>
  @if (description()) {
    <mui-text variant="body" color="muted" [block]="true">{{ description() }}</mui-text>
  }
  <ng-content />
</ng-template>

<div class="mui-settings-row flex flex-col py-2">
  <div class="row-header flex items-start gap-2">
    @if (customSummary()) {
      <div class="custom-summary flex-1 min-w-0">
        <!-- Not a `role="button"` wrapper — the projected [summary] slot
             routinely contains real interactive controls (e.g. a "Run now"
             button), and nesting interactive elements inside an ARIA
             `role="button"` is invalid: assistive tech flattens the subtree
             and the nested controls become unreachable. The click handler
             here is pointer-only convenience (guarded so a click that lands
             on a nested control activates that control, not the row); the
             keyboard/AT path is exclusively the real `<button>` below. -->
        <div
          class="header flex w-full items-center gap-2 cursor-pointer"
          (click)="onSummaryClick($event)"
        >
          <button
            type="button"
            class="chevron-toggle inline-flex items-center flex-none border-0 bg-transparent p-0 font-[inherit] text-inherit cursor-pointer"
            [attr.aria-expanded]="open() ? 'true' : 'false'"
            [attr.aria-label]="label()"
            [attr.aria-controls]="contentId"
            (click)="toggle()"
          >
            <mui-icon name="chevron-right" size="sm" [class]="chevronClass()" [decorative]="true" />
          </button>
          <div class="summary-content flex-1 min-w-0"><ng-content select="[summary]" /></div>
        </div>
        <div [class]="wrapperClass()" [id]="contentId">
          <div class="content-inner overflow-hidden min-h-0">
            <div class="body flex flex-col gap-1 pt-1">
              <ng-container [ngTemplateOutlet]="bodyContent" />
            </div>
          </div>
        </div>
      </div>
    } @else {
      @if (icon()) {
        <mui-icon
          [name]="icon()!"
          size="sm"
          class="leading-icon flex-none text-text-muted mt-[2px]"
        />
      }
      <mui-collapsible [label]="label()" [(open)]="open" class="collapsible flex-1 min-w-0">
        <div class="body flex flex-col gap-1 pt-1">
          <ng-container [ngTemplateOutlet]="bodyContent" />
        </div>
      </mui-collapsible>
    }
  </div>
  @if (showDivider()) {
    <mui-divider />
  }
</div>
