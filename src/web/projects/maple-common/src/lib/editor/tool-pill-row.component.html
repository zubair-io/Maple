<div class="row" data-testid="editor-tool-row">
  @for (tool of tools(); track tool) {
    <button
      type="button"
      class="pill"
      [class.selected]="isSelected(tool)"
      [attr.aria-pressed]="isSelected(tool)"
      [attr.aria-label]="displayName[tool]"
      [attr.data-testid]="'editor-tool-' + tool"
      (click)="select(tool)"
    >
      <span class="circle">
        <maple-icon [name]="iconFor(tool)" [size]="20" [strokeWidth]="1.6"></maple-icon>
        @if (isModified(tool)) {
          <span class="dot" aria-hidden="true"></span>
        }
      </span>
      <span class="label">{{ displayName[tool] }}</span>
    </button>
  }
</div>
