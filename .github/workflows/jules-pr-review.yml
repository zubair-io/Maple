# Jules PR Review
#
# `paths-ignore` (#2313): the reviewer's prompt-injection rule fires on
# first-party instruction files, because their whole purpose is text addressed
# to an agent. It blocked #2267 three times over one added bullet in CLAUDE.md —
# first for directive phrasing, then for two clauses about how much weight to
# give automated checks, and finally for the PR description's explanation that
# the earlier flag was a false positive. That last one leaves no in-band way to
# contest a bad verdict, since the reviewer only re-reviews on a new head SHA.
#
# Scope it off the files that are agent-directed by construction. This skips the
# review only when a PR touches NOTHING ELSE — a PR mixing CLAUDE.md with code
# still gets reviewed in full, so the false positive is narrowed, not closed.
# The real fix belongs upstream in the action's rule set.
name: Jules PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'docs/superpowers/plans/**'
      - 'docs/superpowers/specs/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Jules Reviewer
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: sanjay3290/jules-pr-reviewer@432e901b3bc32353e7c75503421c64df4ffccc8b # v1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag AI Agents for Review
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'opened'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@claude[agent] @codex[agent] Please review this PR.'
            })
