<div
  class="mui-toast"
  [class]="'variant-' + variant() + ' surface-' + surface()"
  [class.is-entered]="entered()"
  [class.is-leaving]="leaving()"
>
  <mui-icon [name]="icon()" size="sm" [color]="iconColor()" />
  <span class="message">{{ message() }}</span>
  @if (actionLabel()) {
    <button type="button" class="action" (click)="onActionClick()">{{ actionLabel() }}</button>
  }
  @if (dismissible()) {
    <button type="button" class="close" aria-label="Dismiss" (click)="dismiss()">
      <mui-icon name="x" size="xs" />
    </button>
  }
</div>
