<div class="flex flex-col gap-1">
  <div class="flex items-center gap-2">
    <span [class]="indexClasses()">{{ status() === 'done' ? '✓' : index() }}</span>
    <mui-text variant="row-label">{{ label() }}</mui-text>
  </div>
  <mui-progress shape="bar" size="sm" [value]="progressValue()" />
  @if (status() === 'active') {
    <mui-button size="sm" variant="primary" (pressed)="continued.emit()">
      {{ continueLabel() }}
    </mui-button>
  }
</div>
