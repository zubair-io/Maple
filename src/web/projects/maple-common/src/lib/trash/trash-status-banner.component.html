@if (toast(); as message) {
  <mui-toast
    class="mt-2 mx-4"
    [message]="message"
    [variant]="toastVariant()"
    [autoDismissMs]="null"
    (dismissed)="dismissToast.emit()"
  />
}

@if (loadError(); as error) {
  <div class="mt-2 mx-4 text-[11px] text-error-text" role="alert">{{ error }}</div>
}
