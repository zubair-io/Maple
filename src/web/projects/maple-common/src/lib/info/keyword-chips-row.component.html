<h3 class="eyebrow">Keywords</h3>

<div class="chips">
  @for (k of keywords(); track k) {
    <button
      type="button"
      class="chip"
      [attr.data-testid]="'info-keyword-' + k"
      [attr.aria-label]="'Keyword: ' + k + '. Tap to remove.'"
      (click)="removeKeyword(k)"
    >
      {{ k }}
    </button>
  }
  <button
    type="button"
    class="chip chip-add"
    data-testid="info-keyword-add"
    aria-label="Add keyword"
    (click)="openAddDraft()"
  >
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
      <path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <span>Add</span>
  </button>
</div>

@if (showStubHint()) {
  <div class="stub-hint" data-testid="info-keyword-stub">
    <span>Keyword editing coming soon.</span>
    <button type="button" class="dismiss" (click)="dismissStubHint()" aria-label="Dismiss">
      OK
    </button>
  </div>
}
