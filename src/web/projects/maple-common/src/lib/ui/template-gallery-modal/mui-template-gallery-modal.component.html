<mui-overlay-shell [open]="open()" size="lg" ariaLabel="Templates" (dismissed)="onDismiss()">
  <div slot="header" class="mui-chrome-modal-header">
    <span class="mui-chrome-modal-title">Templates</span>
    <mui-button
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      iconLeading="x"
      ariaLabel="Close"
      (pressed)="onDismiss()"
    />
  </div>

  <div class="mui-chrome-modal-body-stack mui-chrome-modal-body-stack-gap-md">
    <mui-search-bar
      [value]="search()"
      (valueChange)="search.set($event)"
      placeholder="Search templates"
    />

    @if (filteredTemplates().length === 0) {
      <mui-empty-state
        icon="search"
        title="No templates found"
        message="Try a different search term."
      />
    } @else {
      <div class="grid grid-cols-[repeat(auto-fill,minmax(160px,1fr))] gap-4">
        @for (template of filteredTemplates(); track template.id) {
          <mui-card
            [src]="template.thumbnailUrl"
            [alt]="template.name"
            [title]="template.name"
            [subtitle]="template.description ?? null"
            [badgeLabel]="template.category ?? null"
            (pressed)="apply(template)"
          />
        }
      </div>
    }
  </div>
</mui-overlay-shell>
