<div class="relative h-full w-full">
  <mui-image
    #img
    [src]="src()"
    [alt]="alt()"
    [fit]="fit()"
    [radius]="radius()"
    [aspectRatio]="aspectRatio()"
  />
  @if (!img.loaded() && !img.broken()) {
    <div class="overlay absolute inset-0 flex items-center justify-center">
      <mui-spinner placement="centered" />
    </div>
  }
</div>
