<!-- LensCorrectionsPanelComponent — master toggle + three DNG-correction
     sliders (#2231). Structural twin of Apple's LensCorrectionsSection.
     #3182: the whole panel dims + disables when the open RAW carries no
     OpcodeList3 (panelDisabled()); the CA slider ALSO dims on its own
     (caInertOnly()) when the panel is active but its WarpRectilinear opcode
     has no per-plane divergence — see the .ts file banner for why the two
     dims don't compound. -->
@defer (on immediate) {
  <lens-profile-import />
}
<div
  class="flex min-h-0 flex-col gap-2.5 p-2.5"
  [class]="panelDisabled() ? 'opacity-[0.45]' : ''"
  data-testid="lens-corrections-panel"
>
  <button
    type="button"
    class="group flex w-full items-center gap-2.5 border-none bg-none px-0 font-[inherit] text-[color:var(--pro-text)] enabled:cursor-pointer disabled:cursor-default"
    role="switch"
    [attr.aria-checked]="enabled()"
    [attr.aria-disabled]="panelDisabled() ? true : null"
    [disabled]="panelDisabled()"
    aria-label="Lens Profile Corrections"
    data-testid="lens-corrections-toggle"
    (click)="toggleEnabled()"
  >
    <span
      class="relative h-[20px] w-[34px] shrink-0 rounded-[10px] bg-[color:var(--pro-glass-border)] transition-[background] duration-150 ease-out group-aria-checked:bg-[color:var(--pro-accent)]"
    >
      <span
        class="absolute top-[2px] left-[2px] h-4 w-4 rounded-full bg-[color:var(--pro-text)] transition-transform duration-150 ease-out group-aria-checked:translate-x-[14px] group-aria-checked:bg-white"
      ></span>
    </span>
    <span class="text-[13px] font-medium">Lens Profile Corrections</span>
  </button>

  <div class="flex w-full flex-col gap-2.5" data-testid="lens-corrections-sliders">
    <mui-living-slider
      label="Distortion"
      [value]="distortion()"
      [min]="distortionMin"
      [max]="distortionMax"
      [disabled]="distortionDisabled()"
      (valueChange)="onDistortionChange($event)"
      (dragEnd)="onDistortionDragEnd()"
      (resetRequest)="onDistortionReset()"
    />
    <div [class]="caInertOnly() ? 'opacity-[0.45]' : ''" data-testid="lens-corrections-ca-wrap">
      <mui-living-slider
        label="Chromatic Aberration"
        [value]="ca()"
        [min]="caMin"
        [max]="caMax"
        [disabled]="caDisabled()"
        (valueChange)="onCaChange($event)"
        (dragEnd)="onCaDragEnd()"
        (resetRequest)="onCaReset()"
      />
    </div>
    <mui-living-slider
      label="Vignetting"
      [value]="vignetting()"
      [min]="vignettingMin"
      [max]="vignettingMax"
      [disabled]="vignettingDisabled()"
      (valueChange)="onVignettingChange($event)"
      (dragEnd)="onVignettingDragEnd()"
      (resetRequest)="onVignettingReset()"
    />
  </div>
</div>

@if (!imported()) {
  @if (lensSupport(); as support) {
    <section
      aria-label="Lens support"
      data-testid="lens-support"
      class="flex flex-col gap-1 px-2.5 pb-2.5"
    >
      <mui-text variant="row-label">{{ support.lensLabel }}</mui-text>
      <mui-text color="muted" [block]="true">{{ support.lensExplanation }}</mui-text>
    </section>
  }
}
<geometry-panel />
