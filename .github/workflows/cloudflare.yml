# .github/workflows/cloudflare.yml
#
# CI for the Cloudflare thumbnail-cache Worker (src/cloudflare/,
# #1757/#1760). This is a standalone deploy unit with no shared imports
# into src/api or src/web (the R2 key scheme and JWT verification are
# independently re-implemented — see src/cloudflare/src/r2.ts and auth.ts),
# so unlike web.yml this gate is safely path-scoped: a change elsewhere in
# the repo cannot break this Worker.
#
# Uses Node/npm, not Bun (every other subproject's convention) — see
# src/cloudflare/README.md "Why Node, not Bun": @cloudflare/vitest-pool-workers
# bridges the test runner and the worker isolate over a WebSocket, and Bun's
# WebSocket implementation doesn't fire the `upgrade` event that bridge
# needs, so `bun run test` hangs indefinitely under this package specifically.
#
# Three jobs, one per standalone Worker in this directory:
#   cloudflare-test     — the thumbnail-cache Worker (src/cloudflare/).
#   cloudflare-ssr-test — the Hosted production SSR Worker
#                         (src/cloudflare/ssr/, #2474) that fronts the Azure
#                         Blob origin for mapleaperture.com.
#   cloudflare-drive-connect-test — callback-only Google Drive relay
#                                   (src/cloudflare/drive-connect/, #4230).
# All run typecheck + vitest on every push/PR that touches src/cloudflare/
# or this workflow. The relay uses @cloudflare/vitest-plugin.
#
# No auto-deploy job for these Workers. wrangler.jsonc is gitignored in the
# thumbnail-cache and SSR packages
# (it holds per-operator values — origin URL, R2 bucket name, route/zone —
# not project source; see each directory's wrangler.jsonc.example), so CI
# has no real config to deploy with. Each operator (including this
# project's own Cloudflare account) deploys manually from their machine:
# `npm run deploy` in the relevant directory, using their own local
# wrangler.jsonc.
# The callback relay has committed narrow routes and a protected, manually
# dispatched deploy-drive-connect.yml workflow; production secrets stay external.
#
# The thumbnail-cache and SSR test jobs generate throwaway wrangler.jsonc from
# wrangler.jsonc.example — fine for typecheck/tests, which only need a
# structurally valid config, not real account values.

name: cloudflare

on:
  push:
    branches: [main]
    paths: ['src/cloudflare/**', '.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['src/cloudflare/**', '.github/workflows/cloudflare.yml']

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cloudflare-test:
    name: cloudflare-test (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker deps
        working-directory: src/cloudflare
        run: npm ci

      # wrangler.jsonc is gitignored (per-operator config) — CI needs a
      # structurally valid one to typecheck/test against, so it copies the
      # committed placeholder template. Never deployed anywhere.
      - name: Generate a throwaway wrangler.jsonc from the example
        working-directory: src/cloudflare
        run: cp wrangler.jsonc.example wrangler.jsonc

      # worker-configuration.d.ts (Env type, ~14k lines of Cloudflare's own
      # runtime declarations) is gitignored — regenerate it from
      # wrangler.jsonc before typechecking.
      - name: Generate Worker types
        working-directory: src/cloudflare
        run: npm run cf-typegen

      - name: Typecheck
        working-directory: src/cloudflare
        run: npm run typecheck

      - name: Run Worker tests
        working-directory: src/cloudflare
        run: npm test

  cloudflare-ssr-test:
    name: cloudflare-ssr-test (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker deps
        working-directory: src/cloudflare/ssr
        run: npm ci

      - name: Generate a throwaway wrangler.jsonc from the example
        working-directory: src/cloudflare/ssr
        run: cp wrangler.jsonc.example wrangler.jsonc

      - name: Generate Worker types
        working-directory: src/cloudflare/ssr
        run: npm run cf-typegen

      - name: Typecheck
        working-directory: src/cloudflare/ssr
        run: npm run typecheck

      - name: Run Worker tests
        working-directory: src/cloudflare/ssr
        run: npm test

  cloudflare-drive-connect-test:
    name: cloudflare-drive-connect-test (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install relay deps
        working-directory: src/cloudflare/drive-connect
        run: npm ci
      - name: Configure local test signing key
        working-directory: src/cloudflare/drive-connect
        run: cp .dev.vars.example .dev.vars
      - name: Generate Worker types
        working-directory: src/cloudflare/drive-connect
        run: npm run cf-typegen
      - name: Typecheck
        working-directory: src/cloudflare/drive-connect
        run: npm run typecheck
      - name: Run relay tests
        working-directory: src/cloudflare/drive-connect
        run: npm test
