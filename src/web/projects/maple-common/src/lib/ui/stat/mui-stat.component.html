<div [class]="rootClass()">
  <div [class]="valueClass()">{{ value() }}</div>
  <div class="label text-text-muted text-[12px]">{{ label() }}</div>
  @if (delta() !== null) {
    <div [class]="deltaClass()">
      @if (trend()) {
        <span class="trend-glyph" aria-hidden="true">{{ trendGlyph() }}</span>
      }
      <span>{{ delta() }}</span>
    </div>
  }
</div>
