<section class="max-w-[640px] mx-auto p-6">
  <h2 class="mb-4">Account</h2>
  @if (auth.user(); as u) {
    <dl class="grid grid-cols-[max-content_1fr] gap-x-4 gap-y-1 m-0">
      <dt class="font-semibold opacity-70">Email</dt>
      <dd class="m-0">{{ u.email }}</dd>
      <dt class="font-semibold opacity-70">Role</dt>
      <dd class="m-0">{{ u.role }}</dd>
    </dl>
  }

  <h3 class="mt-6 mb-2">Passkeys</h3>
  <ul class="list-none p-0 m-0">
    @for (c of credentials(); track c.id) {
      <li
        class="flex items-center gap-3 py-2 border-b border-[rgba(255,255,255,0.08)]"
      >
        <span class="font-medium">{{ c.device_label }}</span>
        <span class="flex-1 opacity-60 text-xs">added {{ c.created_at }}</span>
        <button
          type="button"
          [disabled]="busy()"
          (click)="deleteDevice(c.id)"
        >
          Delete
        </button>
      </li>
    } @empty {
      <li class="opacity-60 italic">No passkeys registered.</li>
    }
  </ul>

  <div class="flex gap-2 mt-4">
    <button type="button" [disabled]="busy()" (click)="addDevice()">
      Add device
    </button>
    <button type="button" class="ml-auto" (click)="signOut()">Sign out</button>
  </div>

  @if (error(); as e) {
    <p class="text-[#ff6b6b] mt-3">{{ e }}</p>
  }
</section>
