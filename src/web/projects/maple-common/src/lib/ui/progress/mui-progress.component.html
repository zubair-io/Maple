<div
  class="mui-progress"
  [class]="'shape-' + shape() + ' size-' + size()"
  role="progressbar"
  [attr.aria-valuenow]="clampedValue()"
  [attr.aria-valuemin]="isIndeterminate() ? null : 0"
  [attr.aria-valuemax]="isIndeterminate() ? null : 100"
  [attr.aria-label]="label()"
>
  @if (shape() === 'bar') {
    <div class="bar-track">
      @if (isIndeterminate()) {
        <div class="bar-fill indeterminate"></div>
      } @else {
        <div class="bar-fill" [style.width.%]="clampedValue()"></div>
      }
    </div>
  } @else {
    <svg class="ring" [class.indeterminate]="isIndeterminate()" viewBox="0 0 36 36">
      <circle class="ring-track" cx="18" cy="18" [attr.r]="ringRadius" />
      <circle
        class="ring-fill"
        cx="18"
        cy="18"
        [attr.r]="ringRadius"
        [attr.stroke-dasharray]="ringCircumference"
        [attr.stroke-dashoffset]="isIndeterminate() ? ringCircumference * 0.75 : ringOffset()"
      />
    </svg>
  }
  @if (label()) {
    <span class="label">{{ label() }}</span>
  }
</div>
