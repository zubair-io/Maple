name: Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  android-build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/android/native -> target
          cache-on-failure: true
      - name: Install pinned Android SDK (bounded download recovery)
        run: bash src/android/scripts/install-ci-sdk.sh
      - name: Build arm64 and emulator APKs, JVM contracts and lint
        working-directory: src/android
        run: ./gradlew --no-daemon -PmapleAbis=arm64-v8a,x86_64 assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Install software Vulkan for native parity
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Gate Android native CPU/GPU parity
        working-directory: src/android
        env:
          XDG_RUNTIME_DIR: /tmp/maple-android-runtime
          # Keep host test symbols/incremental objects from crowding out the AVD.
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/src/android/native/target
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" ci-artifacts
          chmod 700 "$XDG_RUNTIME_DIR"
          # Select the installed lavapipe ICD; Mesa package filenames vary.
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#drivers[@]}" -eq 1 && test -r "${drivers[0]}"
          export VK_DRIVER_FILES="${drivers[0]}"
          vulkaninfo --summary 2>&1 | tee ci-artifacts/vulkaninfo.txt
          grep -q deviceName ci-artifacts/vulkaninfo.txt
          cargo test --locked --manifest-path native/Cargo.toml --lib 2>&1 | tee ci-artifacts/native-tests.txt
          cargo test --locked --manifest-path ../raw-pipeline/Cargo.toml -p raw-gpu --lib present_chain_pipeline::tests -- --test-threads=1 2>&1 | tee ci-artifacts/presentation-tests.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          # Wait for the permission rule before checking emulator access.
          sudo udevadm trigger --settle --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run all device regressions on an API 36 wide tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4G
          disable-animations: true
          # SwiftShader supplies Vulkan as well as GLES. Do not disable Vulkan.
          emulator-options: -no-window -no-snapshot -gpu swiftshader -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash src/android/scripts/test-device-ci.sh x86_64 arm64-v8a,x86_64
      - name: Require complete device and JVM reports
        run: python3 tools/android_test_reports.py
      - name: Publish Android test reports and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maple-android-test-reports
          path: |
            src/android/app/build/reports/
            src/android/app/build/outputs/androidTest-results/
            src/android/app/build/test-results/
            src/android/ci-artifacts/
          if-no-files-found: error
      - name: Publish native APK
        uses: actions/upload-artifact@v4
        with:
          name: maple-android-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  result:
    name: Android result
    needs: [changes, android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci_result.py android-build=android
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
