<button
  type="button"
  class="tree-row mx-2 flex h-7 w-[calc(100%_-_16px)] cursor-pointer appearance-none items-center gap-1.5 rounded-md border-none bg-transparent pl-2 pr-3 text-left text-text-muted"
  [class.selected]="state.viewMode() === 'timeline'"
  (click)="state.setViewMode('timeline')"
>
  <maple-icon
    name="history"
    [size]="12"
    [color]="state.viewMode() === 'timeline' ? 'var(--color-primary)' : 'var(--color-text-muted)'"
  />
  <span class="flex-1 text-[10px] font-semibold uppercase tracking-[0.06em]">Timeline</span>
</button>
