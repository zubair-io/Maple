@if (hits().length > 0) {
  <section class="section" data-testid="top-hits-section">
    <h3 class="eyebrow">TOP HITS</h3>
    <ul class="list">
      @for (row of hitRows(); track trackHit($index, row)) {
        <li>
          <button
            type="button"
            class="hit"
            (click)="onTap(row.hit)"
            [attr.data-testid]="'top-hit-' + row.hit.id"
          >
            <span class="thumb" [class.no-thumb]="!row.hit.thumbUrl">
              @if (row.hit.thumbUrl) {
                <img [src]="row.hit.thumbUrl" alt="" loading="lazy" decoding="async" />
              } @else {
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M4 4h8v8H4z" fill="none" stroke="currentColor" stroke-width="1.2" />
                </svg>
              }
            </span>
            <span class="labels">
              <span class="label">
                @for (seg of row.segments; track $index) {
                  @if (seg.highlight) {
                    <span class="hl">{{ seg.text }}</span>
                  } @else {
                    {{ seg.text }}
                  }
                }
              </span>
              @if (row.hit.subLabel) {
                <span class="sublabel">{{ row.hit.subLabel }}</span>
              }
            </span>
            @if (kindTag(row.hit.kind); as tag) {
              <span class="kind-tag">{{ tag }}</span>
            }
          </button>
        </li>
      }
    </ul>
  </section>
}
