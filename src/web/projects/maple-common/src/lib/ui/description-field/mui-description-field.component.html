<div class="mui-description-field flex flex-col gap-1">
  @if (editing()) {
    <mui-input
      [value]="draft()"
      (valueChange)="draft.set($event)"
      ariaLabel="Description"
      (keydown)="onKeydown($event)"
      (focusout)="commit()"
    />
  } @else {
    <button
      type="button"
      class="display -mx-2 -my-1 block w-full cursor-text rounded-md border border-transparent bg-transparent px-2 py-1 text-left hover:border-border hover:bg-surface-hover"
      (click)="startEditing()"
    >
      <mui-text variant="body" color="muted" [block]="true">
        {{ value() || placeholder() }}
      </mui-text>
    </button>
  }
  <mui-button
    class="regenerate self-start"
    variant="ghost"
    size="sm"
    iconLeading="smart-source-wand"
    [loading]="regenerating()"
    (pressed)="onRegenerateClick()"
  >
    Regenerate
  </mui-button>
</div>
