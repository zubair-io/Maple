[package]
name = "raw-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Epic #925: compile the GPU FFI surface (`src/gpu.rs` + `src/gpu_live.rs`),
# which calls `raw_gpu` directly. Build-time only, and OFF by default at the
# Cargo level — a bare `cargo build -p raw-ffi` stays wgpu-free (the CI
# `build-raw-ffi` gate depends on this). The Apple xcframework build is the one
# consumer that turns it ON: as of #1064 `build-xcframework.sh` passes
# `--features gpu` unconditionally (the Apple build is always-gpu), so every
# slice contains `maple_gpu_*`. The host GPU validation tests also enable it.
#
# `dep:raw-gpu` is required because raw-core's own `gpu` feature only pulls
# raw-gpu into the dependency *tree* — it does not re-export the crate, so the
# FFI needs a direct (optional) path dep to name `raw_gpu::`. We also flip
# `raw-core/gpu` so both crates resolve to the same `raw-gpu` build (mirrors
# raw-wasm's `gpu = ["dep:raw-gpu", ...]`).
gpu = ["dep:raw-gpu", "raw-core/gpu"]

[dependencies]
raw-core = { path = "../raw-core" }
# Headless GPU resource core (epic #925). Gated by the `gpu` feature; absent
# from default builds. wgpu is pulled in transitively through here.
raw-gpu = { path = "../raw-gpu", optional = true }
rawler.workspace = true
image.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Enable raw-core's synthetic-DNG writer for thumbnail tests that need a
# RAW with no embedded JPEG preview (exercises the rc=8 fall-through).
raw-core = { path = "../raw-core", features = ["test-support"] }
tempfile = "3"
