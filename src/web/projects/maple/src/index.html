<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maple</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Theme color matches MapleTokens.bg (#1c1917) — see
         docs/design/responsive-program/pwa-polish.md §1.3 / §3. -->
    <meta name="theme-color" content="#1c1917" />
    <!-- iOS PWA install — dark status bar over the dark app background. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maple" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
