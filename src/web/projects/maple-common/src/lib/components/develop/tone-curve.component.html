<!-- ToneCurveComponent — point curves + parametric regions (#367, #2232) -->
<div class="flex flex-col gap-1.5 px-2.5 pt-2 pb-2.5" data-testid="tone-curve-panel">
  <!-- Family selector: scene-linear (pre-AgX, #365) vs display-referred
       (post-AgX, #2232 — Adobe's crs:ToneCurvePV2012*). -->
  <div class="flex gap-1" role="tablist" aria-label="Tone curve family">
    @for (tab of vm.familyTabs; track tab.id) {
      <button
        type="button"
        class="flex-1 cursor-pointer appearance-none rounded-md border-[0.5px] py-[3px] text-[10px] outline-none transition-[background,color,border-color] duration-100 ease-out focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-[color:var(--pro-accent)]"
        [class]="channelTabClass(isActiveFamily(tab.id))"
        role="tab"
        [attr.aria-selected]="isActiveFamily(tab.id)"
        [attr.aria-label]="tab.label + ' tone curve family'"
        [attr.data-testid]="'tone-curve-family-' + tab.id"
        (click)="selectFamily(tab)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <!-- Channel selector -->
  <div class="flex gap-1" role="tablist" aria-label="Tone curve channel">
    @for (tab of vm.tabs(); track tab.id) {
      <button
        type="button"
        class="flex-1 cursor-pointer appearance-none rounded-md border-[0.5px] py-[3px] text-[10px] outline-none transition-[background,color,border-color] duration-100 ease-out focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-[color:var(--pro-accent)]"
        [class]="channelTabClass(isActiveChannel(tab.id))"
        role="tab"
        [attr.aria-selected]="isActiveChannel(tab.id)"
        [attr.aria-label]="tab.label + ' tone curve'"
        [attr.data-testid]="'tone-curve-channel-' + tab.id"
        (click)="selectChannel(tab)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <!-- Curve plot. Drag a knot to move it, click empty space to add one,
       double-click or press Delete on a knot to remove it. -->
  <svg
    #plot
    class="curve-plot block aspect-square w-full rounded-md border-[0.5px] border-[color:var(--pro-border)] bg-[color:var(--pro-canvas-alt)]"
    [attr.viewBox]="'0 0 ' + vm.plotSize + ' ' + vm.plotSize"
    preserveAspectRatio="none"
    role="application"
    [attr.aria-label]="
      vm.activeTab().label +
      ' tone curve, ' +
      vm.knots().length +
      ' control points. Drag a point to move it, click the plot to add one.'
    "
    data-testid="tone-curve-plot"
    (pointerdown)="onPlotPointerDown($event)"
  >
    <!-- Luma histogram behind everything -->
    @if (vm.histogramPath(); as hist) {
      <path class="hist" [attr.d]="hist" />
    }

    <!-- Quarter grid -->
    @for (g of vm.gridLines; track g) {
      <line class="grid" [attr.x1]="g" y1="0" [attr.x2]="g" [attr.y2]="vm.plotSize" />
      <line class="grid" x1="0" [attr.y1]="g" [attr.x2]="vm.plotSize" [attr.y2]="g" />
    }

    <!-- Identity diagonal -->
    <line class="identity" x1="0" [attr.y1]="vm.plotSize" [attr.x2]="vm.plotSize" y2="0" />

    <!-- The curve itself -->
    <path class="curve" [attr.d]="vm.curvePath()" [attr.stroke]="vm.activeTab().stroke" />

    <!-- Control points -->
    @for (knot of vm.knots(); track knot.index) {
      <circle
        class="knot"
        [class.knot--pinned]="knot.pinned"
        [attr.cx]="knot.cx"
        [attr.cy]="knot.cy"
        r="2.6"
        tabindex="0"
        role="slider"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="knot.valueNow"
        [attr.aria-valuetext]="knot.valueText"
        [attr.aria-label]="
          vm.activeTab().label +
          ' curve point ' +
          (knot.index + 1) +
          ' of ' +
          vm.knots().length +
          (knot.pinned ? ', endpoint' : '')
        "
        [attr.data-testid]="'tone-curve-knot-' + knot.index"
        (dblclick)="onKnotDoubleClick(knot, $event)"
        (keydown)="onKnotKeyDown(knot, $event)"
      />
    }
  </svg>

  <div class="flex items-center justify-between gap-1.5">
    <span class="text-[9px] text-[color:var(--pro-text-dim)] select-none" aria-hidden="true"
      >Shadows</span
    >
    <button
      type="button"
      class="cursor-pointer appearance-none rounded-md border-[0.5px] border-[color:var(--pro-border)] bg-transparent px-2 py-0.5 text-[9px] text-[color:var(--pro-text-muted)] focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-[color:var(--pro-accent)] disabled:cursor-default disabled:opacity-[0.32]"
      [disabled]="vm.isIdentity()"
      [attr.aria-label]="'Reset ' + vm.activeTab().label + ' curve'"
      data-testid="tone-curve-reset-channel"
      (click)="resetChannel()"
    >
      Reset curve
    </button>
    <span class="text-[9px] text-[color:var(--pro-text-dim)] select-none" aria-hidden="true"
      >Highlights</span
    >
  </div>

  <!-- Parametric region sliders — scene-linear only (#2232): PV2012's
       basic-panel curve has no region-slider decomposition on the model,
       only the point curve, so this section hides for the display family. -->
  @if (vm.showParametric()) {
    <div class="flex flex-col gap-2 pt-1" data-testid="tone-curve-parametric">
      @for (slider of vm.sliders; track slider.field) {
        <mui-living-slider
          [attr.data-testid]="'tone-curve-' + slider.field"
          [label]="slider.label"
          [value]="parametricValue(slider)"
          [min]="vm.parametricMin"
          [max]="vm.parametricMax"
          [bipolar]="true"
          (valueChange)="onParametricChange(slider, $event)"
          (resetRequest)="onParametricReset(slider)"
        />
      }
    </div>
  }
</div>
