# maple-pano ML model manifest (#1139).
#
# The ONNX files themselves are NOT committed — the loader
# (`maple_pano::models::ModelDir::resolve`) reads them from the directory
# named by `MAPLE_PANO_MODELS` (or an explicit path argument) and verifies
# each file's size and SHA-256 against the digests pinned here before any
# session is created. A digest mismatch is a hard error, never a fallback.
#
# Provenance — recorded because the spec'd source did not exist:
# the stitching spec §5.2 calls for ALIKED-t16, and ticket #1139 expected to
# pin hashes from the local DronePano prototype's model files. The prototype
# at ~/Projects/Maple Pano is the OpenCV/SIFT-era build — it contains no
# ONNX models and no `ort` dependency — and no public ALIKED-t16 ONNX export
# exists (kornia publishes t16 weights as PyTorch .pth only). The nearest
# published, working ALIKED + LightGlue ONNX pairing is the
# ikeboo/ALIKED-LightGlue-ONNX export set (MIT), built on
# ajuric/aliked-tensorrt's exporter from the official Shiaoming/ALIKED
# weights (BSD-3-Clause) and the official cvg/LightGlue weights
# (Apache-2.0). Swapping in a t16 export later is a models.toml + re-pin
# change only — the Rust side reads keypoint count and descriptor width
# from the tensor shapes at runtime.

schema = 1

[aliked]
file = "aliked-n16rot-top2k-1280.onnx"
sha256 = "e3caf45d4ffcae936b10772ca2466365bfc863f7e119a8d19bc55529beace7d4"
size = 13021915
source = "https://raw.githubusercontent.com/ikeboo/ALIKED-LightGlue-ONNX/77f70ddb0ee16690b674b76e7e0f5fb7c1c0e70a/onnx/aliked-n16rot-top2k-1280.onnx"
license = "MIT (export) / BSD-3-Clause (ALIKED weights, Shiaoming/ALIKED)"
notes = "ALIKED-N16rot detector+descriptor (128-D), static 1280x1280 letterbox input `image` [1,3,1280,1280] RGB in [0,1], top-2000 keypoints baked into the graph (DKD top-k mode, NMS radius 2). Outputs `keypoints` [N,2] normalized to [-1,1] over (S-1), `descriptors` [N,128], `scores` [N]. n16rot stands in for the spec'd t16 until a t16 ONNX export exists; the rot variant's rotation-robust training also suits yawed drone sweeps."

[lightglue]
file = "lightglue_for_aliked.onnx"
sha256 = "33fffedd24f39f25b139fb66f9090481d276799cef7b0ea56eb6bc0986987c38"
size = 45844463
source = "https://raw.githubusercontent.com/ikeboo/ALIKED-LightGlue-ONNX/77f70ddb0ee16690b674b76e7e0f5fb7c1c0e70a/onnx/lightglue_for_aliked.onnx"
license = "MIT (export) / Apache-2.0 (LightGlue weights, cvg/LightGlue)"
notes = "LightGlue matcher head paired with ALIKED descriptors. Inputs `kpts0`/`kpts1` [1,N,2] (the detector's [-1,1]-normalized coordinates, passed through unchanged) and `desc0`/`desc1` [1,N,128]. Outputs `matches0` [K,2] int64 index pairs into the two keypoint lists and `mscores0` [K] f32 confidences."
