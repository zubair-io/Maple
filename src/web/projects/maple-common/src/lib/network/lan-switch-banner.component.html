@if (phase() !== 'hidden') {
  <div
    class="fixed left-1/2 bottom-4 z-[1000] -translate-x-1/2 flex items-center gap-3 px-4 py-2.5 rounded-lg border border-border bg-surface-alt text-text-main text-sm shadow-lg max-w-[calc(100vw-2rem)]"
    role="status"
    aria-live="polite"
  >
    <span class="flex-1 whitespace-nowrap overflow-hidden text-ellipsis"
      >Faster on this network — switch to a local connection?</span
    >
    <button
      type="button"
      class="appearance-none border-0 bg-primary text-bg font-medium text-[13px] px-3 py-[5px] rounded cursor-pointer hover:opacity-90 disabled:opacity-60"
      [disabled]="phase() === 'switching'"
      (click)="switchNow()"
      aria-label="Switch to a local connection"
    >
      {{ phase() === 'switching' ? 'Switching…' : 'Switch' }}
    </button>
    <button
      type="button"
      class="appearance-none border border-border bg-transparent text-text-muted text-[13px] px-2.5 py-[5px] rounded cursor-pointer hover:bg-white/[0.06] disabled:opacity-60"
      [disabled]="phase() === 'switching'"
      (click)="dismiss()"
      aria-label="Dismiss"
    >
      Not now
    </button>
  </div>
}
