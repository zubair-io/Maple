<div class="mui-value-hud">
  <mui-text variant="eyebrow" color="muted" [block]="true" class="label">{{ label() }}</mui-text>
  <mui-text variant="sheet-title" color="main" [block]="true" class="value">{{ value() }}</mui-text>
  @if (progressPct() !== null) {
    <mui-progress [value]="progressPct()" size="sm" class="track" />
  }
</div>
