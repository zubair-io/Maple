@if (hasQuery() && results().length === 0) {
  @if (query().length > 0) {
    <p class="empty" data-testid="search-no-results">No matches for &ldquo;{{ query() }}&rdquo;</p>
  } @else {
    <p class="empty" data-testid="search-no-results">No matches for the current filters</p>
  }
} @else if (results().length > 0) {
  <section class="section" data-testid="photo-results-section">
    <ul class="grid" [class.stale]="isStale()">
      @for (r of results(); track trackResult($index, r)) {
        <li>
          <button
            type="button"
            class="tile"
            (click)="onTileClick(r)"
            [attr.aria-label]="r.filename"
            [attr.data-testid]="'search-tile-' + r.id"
          >
            @if (thumbs().get(r.id); as url) {
              <img class="tile-img" [src]="url" [alt]="r.filename" loading="lazy" />
            } @else {
              <span class="tile-fallback">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="1" />
                  <circle cx="9" cy="11" r="1.5" fill="currentColor" />
                  <path d="M5 17l5-5 4 4 3-3 2 2v2H5z" fill="currentColor" />
                </svg>
              </span>
            }
          </button>
        </li>
      }
    </ul>
    @if (isLoadingMore()) {
      <p class="loading-more" data-testid="search-loading-more" aria-live="polite">Loading…</p>
    }
    <div #loadMoreSentinel class="load-more-sentinel" aria-hidden="true"></div>
  </section>
}
