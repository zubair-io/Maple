<div
  class="mui-slider mui-chrome-control-column"
  [class.is-disabled]="disabled()"
  [class.mui-chrome-control-disabled]="disabled()"
>
  <div class="row mui-chrome-control-row">
    <mui-text variant="tool-label" color="muted" class="label">{{ label() }}</mui-text>
    <mui-text variant="value-chip" color="main" class="readout mui-chrome-control-readout">{{
      valueLabel()
    }}</mui-text>
  </div>
  <input
    type="range"
    class="track w-full h-1 appearance-none rounded-sm outline-offset-4 bg-[linear-gradient(to_right,var(--color-primary)_0%,var(--color-primary)_var(--mui-slider-fill,0%),var(--color-border)_var(--mui-slider-fill,0%),var(--color-border)_100%)]"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-label]="label()"
    [style.--mui-slider-fill.%]="trackPct()"
    (input)="onInput($any($event.target).value)"
  />
</div>
