<div class="mui-filmstrip-row flex items-center gap-1 overflow-x-auto p-1" role="list">
  @for (item of items(); track item.id) {
    <mui-media-cell
      class="cell flex-none"
      role="listitem"
      size="sm"
      [src]="item.src"
      [alt]="item.alt"
      [selected]="activeId() === item.id"
      (pressed)="select(item.id)"
    />
  }
</div>
