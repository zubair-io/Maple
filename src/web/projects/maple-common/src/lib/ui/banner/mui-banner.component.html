<div
  class="mui-banner flex items-center gap-2 py-2 px-4 rounded-lg"
  [class]="'variant-' + variant() + ' ' + bannerBgClasses()"
  [attr.role]="role()"
>
  @if (variant() === 'loading') {
    <mui-spinner size="sm" placement="inline" class="banner-icon" [class]="iconClasses()" />
  } @else {
    <mui-icon [name]="icon()!" size="sm" class="banner-icon" [class]="iconClasses()" />
  }
  <mui-text variant="body" class="message flex-1 min-w-0">{{ message() }}</mui-text>
  @if (linkLabel() && linkHref()) {
    <mui-link [href]="linkHref()!">{{ linkLabel() }}</mui-link>
  }
  @if (actionLabel()) {
    <mui-button variant="ghost" size="sm" (pressed)="actionPressed.emit()">
      {{ actionLabel() }}
    </mui-button>
  }
  @if (dismissible()) {
    <mui-button
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      iconLeading="x"
      ariaLabel="Dismiss"
      (pressed)="dismissed.emit()"
    />
  }
</div>
