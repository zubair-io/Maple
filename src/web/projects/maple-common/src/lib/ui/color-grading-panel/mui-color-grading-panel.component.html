<div class="mui-color-grading-panel flex flex-col gap-4">
  <div class="columns flex gap-4">
    <div class="column flex-1 flex flex-col items-center gap-2 min-w-0">
      <mui-text variant="tool-label" color="muted">Shadows</mui-text>
      <mui-color-wheel [(value)]="shadows" [size]="72" ariaLabel="Shadows color wheel" />
      <mui-living-slider
        label="Luminance"
        [(value)]="shadowsLuminance"
        [min]="-100"
        [max]="100"
        [bipolar]="true"
        (resetRequest)="shadowsLuminance.set(0)"
      />
    </div>
    <div class="column flex-1 flex flex-col items-center gap-2 min-w-0">
      <mui-text variant="tool-label" color="muted">Midtones</mui-text>
      <mui-color-wheel [(value)]="midtones" [size]="72" ariaLabel="Midtones color wheel" />
      <mui-living-slider
        label="Luminance"
        [(value)]="midtonesLuminance"
        [min]="-100"
        [max]="100"
        [bipolar]="true"
        (resetRequest)="midtonesLuminance.set(0)"
      />
    </div>
    <div class="column flex-1 flex flex-col items-center gap-2 min-w-0">
      <mui-text variant="tool-label" color="muted">Highlights</mui-text>
      <mui-color-wheel [(value)]="highlights" [size]="72" ariaLabel="Highlights color wheel" />
      <mui-living-slider
        label="Luminance"
        [(value)]="highlightsLuminance"
        [min]="-100"
        [max]="100"
        [bipolar]="true"
        (resetRequest)="highlightsLuminance.set(0)"
      />
    </div>
  </div>
  <div class="global-sliders flex flex-col gap-2">
    <mui-living-slider
      label="Blending"
      [(value)]="blending"
      [min]="0"
      [max]="100"
      (resetRequest)="blending.set(50)"
    />
    <mui-living-slider
      label="Balance"
      [(value)]="balance"
      [min]="-100"
      [max]="100"
      [bipolar]="true"
      (resetRequest)="balance.set(0)"
    />
  </div>
</div>
