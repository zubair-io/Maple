<form
  (submit)="submit(); $event.preventDefault()"
  class="flex flex-col gap-4 w-full max-w-[360px] p-8 bg-surface border border-border rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)]"
>
  <h2 class="mb-3 text-[20px] font-semibold tracking-[-0.01em]">Join this server</h2>
  <p class="m-0 text-[13px] text-text-muted">
    Enter the one-time invite code shared with you. New Maple accounts use a passkey and do not need
    an email address.
  </p>
  <label for="invite-code" class="text-[13px] font-medium">Invite code</label>
  <mui-input
    size="lg"
    inputId="invite-code"
    name="code"
    [value]="code"
    (valueChange)="code = $event"
    placeholder="Invite code"
    [minLength]="8"
    [maxLength]="8"
    [required]="true"
    autocapitalize="characters"
    autocomplete="one-time-code"
    [spellcheck]="false"
  />
  <mui-button
    type="submit"
    variant="primary"
    size="lg"
    [fullWidth]="true"
    [loading]="busy()"
    [disabled]="!canSubmit()"
    >Create passkey</mui-button
  >
  @if (error(); as e) {
    <p role="alert" class="m-0 px-3 py-2 text-[13px] text-error-text bg-error-bg rounded-md">
      {{ e }}
    </p>
  }
  <a
    routerLink="/sign-in"
    class="self-center mt-2 text-[13px] text-text-muted no-underline hover:text-text-main hover:underline"
    >Already have an account?</a
  >
</form>
