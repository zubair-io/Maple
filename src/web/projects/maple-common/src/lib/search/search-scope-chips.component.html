<div class="row" role="tablist" aria-label="Search scope">
  @for (chip of chips; track trackScope($index, chip)) {
    <button
      type="button"
      role="tab"
      class="chip"
      [class.selected]="chip.scope === scope()"
      [attr.aria-selected]="chip.scope === scope()"
      [attr.data-testid]="'search-scope-' + chip.scope"
      (click)="onSelect(chip.scope)"
    >
      {{ chip.label }}
    </button>
  }
</div>
