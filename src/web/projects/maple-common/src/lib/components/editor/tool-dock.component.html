<!-- ToolDock — glass column (vertical) or bar (horizontal, phone) wrapping
     `mui-tool-dock`, which owns the circle+label+dot button chrome. -->
<nav [class]="dockGlassClass()" aria-label="Editor tools">
  <mui-tool-dock
    [entries]="dockEntries()"
    [orientation]="orientation()"
    itemOrientationOverride="stacked"
    (toolSelected)="onDockToolSelected($event)"
  />
</nav>
