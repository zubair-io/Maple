@if (insideSheet()) {
  <header
    class="info-panel-header mb-4 flex items-center justify-between border-b-[0.5px] border-border pb-2"
  >
    <h2 class="m-0 font-['Merriweather',serif] text-[17px] font-bold text-text-main">Info</h2>
    <mui-button
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      iconLeading="x"
      ariaLabel="Close"
      (pressed)="onClose()"
    />
  </header>
}

<div class="flex flex-col gap-4">
  <app-info-filename-row [asset]="asset()" />
  <mui-rating-flags
    variant="pills"
    [rating]="currentRating()"
    (ratingChange)="onRatingChange($event)"
    [flag]="currentFlagState()"
    (flagChange)="onFlagChange($event)"
    [disabled]="ratingFlagsDisabled()"
  />
  @if (histogramBins(); as bins) {
    <mui-histogram [r]="bins.r" [g]="bins.g" [b]="bins.b" />
  }
  <mui-label-value-grid [rows]="metadataRows()" />
  <mui-keyword-row
    [keywords]="keywords()"
    (added)="onKeywordAdded($event)"
    (removed)="onKeywordRemoved($event)"
  />
  @if (extension; as extensionComponent) {
    <ng-container *ngComponentOutlet="extensionComponent" />
  }
</div>
