[package]
name = "maple-android"
version = "0.1.0"
edition = "2021"
publish = false
license = "Proprietary"

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
raw-core = { path = "../../raw-pipeline/raw-core", features = ["gpu", "avif"] }
raw-gpu = { path = "../../raw-pipeline/raw-gpu" }
serde_json = "1"
half = "=2.7.1"
moxcms = "=0.8.1"
tiff = "=0.11.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
raw-core = { path = "../../raw-pipeline/raw-core", features = ["test-support"] }

[profile.release]
debug = 0

[patch.crates-io]
rawler = { path = "../../raw-pipeline/third_party/rawler" }
rav1d = { path = "../../raw-pipeline/third_party/rav1d" }
zune-jpeg = { path = "../../raw-pipeline/third_party/zune-jpeg" }
avif-parse = { path = "../../raw-pipeline/third_party/avif-parse" }
ravif = { path = "../../raw-pipeline/third_party/ravif" }
avif-serialize = { path = "../../raw-pipeline/third_party/avif-serialize" }
