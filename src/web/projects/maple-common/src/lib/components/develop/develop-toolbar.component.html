<div class="develop-toolbar" role="group" aria-label="Develop actions">
  <button
    type="button"
    class="toolbar-button"
    [class.in-flight]="editor.autoInFlight()"
    [disabled]="autoDisabled()"
    [attr.aria-busy]="editor.autoInFlight() ? 'true' : null"
    aria-label="Auto adjust"
    (click)="onAuto()"
  >
    @if (editor.autoInFlight()) {
      <span class="spinner" aria-hidden="true"></span>
    }
    Auto
  </button>

  <button
    type="button"
    class="toolbar-button"
    aria-label="Reset all adjustments"
    [disabled]="!hasImage()"
    (click)="onReset()"
  >
    Reset
  </button>
</div>
