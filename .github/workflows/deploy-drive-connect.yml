name: Deploy Drive connection pages and OAuth proxy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-drive-connect
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: src/cloudflare/drive-connect
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install connection page Worker dependencies
        working-directory: src/cloudflare/ssr
        run: npm ci
      - name: Validate deployment credentials
        run: node -e 'if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) throw new Error("Cloudflare deployment credentials required")'
      - name: Prepare production routing and Google client secrets for atomic deployment
        env:
          RELAY_SIGNING_KEY: ${{ secrets.RELAY_SIGNING_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/prepare-deploy-secrets.mjs "$RUNNER_TEMP/drive-relay-secrets.json"
      - name: Validate connection page Worker bundle
        working-directory: src/cloudflare/ssr
        run: npx wrangler deploy --config wrangler.drive-connect.jsonc --dry-run
      - name: Validate callback relay bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy connection pages before callbacks
        working-directory: src/cloudflare/ssr
        run: npx wrangler deploy --config wrangler.drive-connect.jsonc
      - run: npm run deploy -- --secrets-file "$RUNNER_TEMP/drive-relay-secrets.json"
      - name: Remove temporary deployment secret
        if: always()
        run: node -e 'require("node:fs").rmSync(process.env.RUNNER_TEMP+"/drive-relay-secrets.json",{force:true})'
