<div
  class="mui-drag-bar mui-chrome-control-column"
  [class.is-disabled]="disabled()"
  [class.mui-chrome-control-disabled]="disabled()"
>
  @if (label()) {
    <div class="row mui-chrome-control-row">
      <mui-text variant="tool-label" color="muted" class="label">{{ label() }}</mui-text>
      <mui-text variant="value-chip" color="main" class="readout mui-chrome-control-readout">{{
        valueLabel()
      }}</mui-text>
    </div>
  }
  <div
    #barEl
    class="bar relative h-5 touch-none cursor-ew-resize outline-offset-4"
    [class]="outlineClass()"
    role="slider"
    tabindex="0"
    [attr.aria-label]="ariaLabel() ?? label() ?? 'Scrub'"
    [attr.data-testid]="testId()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="value()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [class.is-dragging]="dragging()"
    [class.is-fine-mode]="fineMode()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (keydown)="onKeydown($event)"
  >
    @for (tick of ticks; track tick.pct) {
      <div
        class="tick absolute bottom-[3px] w-px -translate-x-1/2"
        [class]="tick.emphasized ? 'h-[14px] bg-primary' : 'h-[6px] bg-border'"
        [class.emphasized]="tick.emphasized"
        [style.left.%]="tick.pct"
      ></div>
    }
    <div
      class="marker absolute top-0 h-full w-[2px] -translate-x-1/2 bg-text-main"
      [style.left.%]="markerPct()"
    ></div>
  </div>
</div>
