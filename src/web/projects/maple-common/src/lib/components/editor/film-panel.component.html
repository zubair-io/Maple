<!-- FilmPanelComponent — category chip row + filtered catalog picker +
     strength slider (#2683, #2780). One category's looks at a time, not all
     100 stacked into a single scroll — see the file banner. -->
<div class="flex min-h-0 flex-col gap-2.5 p-2.5" data-testid="film-panel">
  <div
    class="flex gap-1.5 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
    role="group"
    aria-label="Film categories"
    data-testid="film-category-row"
  >
    @for (category of categories; track category.id) {
      <button
        type="button"
        [class]="filmCategoryChipClass(isCategoryActive(category.id))"
        [attr.aria-pressed]="isCategoryActive(category.id)"
        [attr.data-testid]="'film-category-' + category.id"
        (click)="selectCategory(category.id)"
      >
        {{ category.label }}
      </button>
    }
  </div>

  <div
    class="flex max-h-[240px] flex-col gap-0.5 overflow-y-auto"
    role="listbox"
    aria-label="Film looks"
  >
    <button
      type="button"
      [class]="filmLookRowClass(!hasActiveLook(), true)"
      role="option"
      [attr.aria-selected]="!hasActiveLook()"
      data-testid="film-look-none"
      (click)="selectNone()"
    >
      None
    </button>

    <div class="mt-1.5 flex flex-col gap-0.5 first-of-type:mt-1">
      <div
        class="px-2 pt-1 pb-0.5 text-[11px] font-semibold tracking-[0.04em] text-text-muted uppercase"
      >
        {{ activeGroup().label }}
      </div>
      @for (look of activeGroup().looks; track look.id) {
        <button
          type="button"
          [class]="filmLookRowClass(isActive(look.id), false)"
          role="option"
          [attr.aria-selected]="isActive(look.id)"
          [attr.data-testid]="'film-look-row-' + look.id"
          (click)="selectLook(look.id)"
        >
          {{ look.name }}
        </button>
      }
    </div>
  </div>

  @if (hasActiveLook()) {
    <div class="border-t border-border pt-1" data-testid="film-strength-row">
      <mui-living-slider
        label="Strength"
        [value]="strength()"
        [min]="strengthMin"
        [max]="strengthMax"
        gradient="linear-gradient(90deg, #4a443b 0%, #a8a097 100%)"
        (valueChange)="onStrengthChange($event)"
        (resetRequest)="onStrengthReset()"
      />
    </div>
  }
</div>
