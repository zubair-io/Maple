[package]
name = "raw-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rawler.workspace = true
image.workspace = true
# Direct dep so TIFF compression, predictor, bit depth and the IFD0
# Orientation tag are all reachable — `image`'s TiffEncoder wrapper
# hard-codes the first three and exposes only an ICC hook (#3506 F5, #3507
# round 5). Same version `image/tiff` already resolves (0.11), so the vendor
# tree is unchanged.
tiff.workspace = true
fast_image_resize.workspace = true
png.workspace = true
miniz_oxide.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
exr = { version = "1.73", optional = true }
rav1d = { workspace = true, optional = true }
avif-parse = { workspace = true, optional = true }
# dav1d's `EAGAIN` return value is `-(libc::EAGAIN as c_int)`, and that errno
# differs per OS (11 on Linux, 35 on macOS); rav1d's own `error` module that
# defines it is crate-private, so `avif_decode` pulls the same well-known
# `libc` crate directly rather than hard-coding a platform-specific number.
libc = { version = "0.2", optional = true }
# Direct dep so the AVIF encoder's own options (EXIF item, chroma subsampling,
# alpha quality) are reachable — `image`'s AvifEncoder wrapper exposes only
# speed and quality. Same version `image/avif` already resolves; matching
# `image`'s own `default-features = false` on `ravif`/`rgb` keeps the enabled
# feature set (and so the vendor tree and Cargo.lock) unchanged too — ravif's
# own defaults turn on `asm`/`threading`, which would newly pull nasm/cc build
# tooling into the graph for a resolver artifact, not a real requirement.
ravif = { version = "0.13", optional = true, default-features = false }
rgb = { version = "0.8", optional = true, default-features = false }
imgref = { version = "1", optional = true }
zune-jpeg.workspace = true
jpeg-encoder.workspace = true
# GPU resource core (epic #925), feature-gated and OFF by default. All GPU code
# (wgpu/WGSL/runner) lives in the `raw-gpu` crate; raw-core only pulls it in when
# the `gpu` feature is enabled, so default + CI-without-GPU builds stay unchanged
# and wgpu is absent from the default dependency tree.
raw-gpu = { path = "../raw-gpu", optional = true }
rayon = { workspace = true }
blake3 = "1"
sha1 = "0.10"
# f16 storage for the `.mlut` film-LUT codec (#2683, `film.rs`).
half = { workspace = true }
# Used by `types::local_adjustment` for the Slice 1 XMP wire format (compact
# JSON in a single `papp:LocalAdjustments` attribute). When that converts to
# canonical `crs:GradientBasedCorrections` nested-RDF in a follow-up, this
# dep can move back to `[dev-dependencies]` or drop entirely.
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
tempfile = "3"
clap = { workspace = true }

[features]
# Opt-in integration tests that shell out to compare_images.py.
golden = []
# Test-only DNG synthesis helpers. NEVER enable in shipping artifacts.
test-support = []
# Gates fixture-dependent tests under `test-fixtures/{raws,references}/`
# (repo-root, gitignored). WITHOUT the feature those tests are visibly
# `ignored`; WITH `--features fixtures` they run and a MISSING fixture
# panics (fail-closed, #1082 — see `test_support::fixtures`). Enable on
# fixture-provisioned machines only. Build-time only; no runtime impact.
fixtures = []
# When enabled, raw-core writes one OpenEXR file per pipeline stage to the
# directory named by the MAPLE_STAGE_DUMP env var (no-op when the env var is
# unset). Used by src/scripts/stage_diff.py to localize divergence to a
# specific stage. Adds ~2 MB to the binary; do NOT enable in shipping
# artifacts.
stage-dump = ["dep:exr"]
# Epic #925: pull in the headless GPU resource core (`raw-gpu`). OFF by default
# — enable with `--features gpu`. Build-time only; no default impact.
gpu = ["dep:raw-gpu"]
# Pulls in the `image` crate's AVIF codec (pure-Rust `ravif`/`rav1e`, no C
# toolchain) for the thumbnail encoder. OFF by default so raw-wasm — which
# only ever needs raw-core's JPEG/decode path — never pulls ravif/rav1e into
# the wasm32 build; raw-ffi and maple-pano opt in explicitly since they're
# the only real consumers of `raw_core::avif::encode`.
avif = ["image/avif", "dep:rav1d", "dep:avif-parse", "dep:libc", "dep:ravif", "dep:rgb", "dep:imgref"]

[[example]]
name = "synth-grey"
required-features = ["test-support"]

[[example]]
name = "synth-chart"
required-features = ["test-support"]

[[example]]
name = "gen-synthetic-dng"
required-features = ["test-support"]

[[example]]
name = "extract-dcp"
required-features = ["test-support"]

[[example]]
name = "gen-batch-transfer-fixtures"
required-features = ["test-support"]
