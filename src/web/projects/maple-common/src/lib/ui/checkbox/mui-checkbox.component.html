<label
  class="mui-checkbox relative inline-flex items-center gap-1 before:content-[''] before:absolute before:left-0 before:top-1/2 before:w-11 before:h-11 before:-translate-y-1/2"
  [class.is-disabled]="disabled()"
  [class]="labelStateClasses()"
>
  <input
    type="checkbox"
    class="box peer absolute w-[18px] h-[18px] m-0 opacity-0 cursor-inherit"
    [attr.id]="inputId()"
    [checked]="isChecked()"
    [indeterminate]="isIndeterminate()"
    [disabled]="disabled()"
    [attr.aria-label]="label() ? null : ariaLabel()"
    (change)="onChange($any($event.target).checked)"
  />
  <span
    class="mark inline-flex items-center justify-center w-[18px] h-[18px] flex-none border rounded-sm transition-[background-color,border-color] duration-150 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:border-primary peer-focus-visible:outline-[color-mix(in_srgb,var(--color-primary)_20%,transparent)]"
    [class.is-checked]="isChecked()"
    [class.is-indeterminate]="isIndeterminate()"
    [class]="markStateClasses()"
    aria-hidden="true"
  >
    @if (isIndeterminate()) {
      <span class="dash w-[9px] h-[2px] bg-text-main"></span>
    } @else if (isChecked()) {
      <span
        class="check w-[9px] h-[6px] border-l-2 border-b-2 border-text-main [transform:rotate(-45deg)_translate(1px,-1px)]"
      ></span>
    }
  </span>
  @if (label()) {
    <span class="label text-[13px] text-text-main">{{ label() }}</span>
  }
</label>
