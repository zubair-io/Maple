<div class="mui-endpoint-form flex flex-col gap-2">
  <div class="methods flex gap-1" role="radiogroup" aria-label="HTTP method">
    @for (m of methods(); track m) {
      <button
        type="button"
        class="method cursor-pointer rounded-full border-none bg-transparent p-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [attr.aria-pressed]="method() === m"
        (click)="selectMethod(m)"
      >
        <mui-badge [variant]="method() === m ? 'signal' : 'count'" [value]="m" />
      </button>
    }
  </div>
  <mui-form-field label="URL" [(value)]="url" placeholder="/api/photos" />
  <mui-button variant="primary" [loading]="sending()" (pressed)="onSend()">Send</mui-button>
</div>
