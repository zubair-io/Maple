<!-- WbPadComponent — 2-D white balance pad (#1540) -->
<div class="wb-widget">
  <!-- Readout row: K label + eyedropper -->
  <div class="readout-row">
    <span class="temp-label" aria-label="Color temperature">{{ tempLabel() }}</span>
    <span class="tint-label" aria-label="Tint">{{ tintLabel() }}</span>
    <div class="readout-spacer"></div>
    <button
      class="eyedrop-btn"
      [class.eyedrop-btn--active]="eyedropperActive()"
      title="Sample neutral grey point from canvas"
      aria-label="Eyedropper: set neutral white balance from canvas"
      (click)="onEyedropperClick()"
    >
      <!-- Eyedropper icon (inline SVG — no icon registry dep) -->
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path
          d="M10.5 1.5L12.5 3.5L5 11l-2 .5.5-2L10.5 1.5Z"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
        <circle cx="3.5" cy="10.5" r="1" fill="currentColor" />
      </svg>
    </button>
  </div>

  <!-- 2-D pad — mui-pad-2d owns the puck/crosshair chrome and the
       pointer-capture drag; the WB-specific Kelvin/tint domain (and the
       #2412 clamped arrow-key stepping, still `onPadKeyDown` below) stays
       owned by this wrapper via `[stepKeyboard]="false"` + `(arrowKey)`. -->
  <mui-pad-2d
    ariaLabel="White balance — drag to set temperature and tint"
    [valueText]="'Temp ' + tempLabel() + ', Tint ' + tintLabel()"
    [fill]="true"
    [aspectRatio]="2"
    [crosshair]="true"
    [value]="padValue()"
    (valueChange)="onPadValueChange($event)"
    [stepKeyboard]="false"
    (arrowKey)="onPadKeyDown($event)"
  >
    <!-- Gradient layers (WB-specific fill; mui-pad-2d's own `gradient` input
         paints a single flat background, so the two-axis composited fill
         stays a projected overlay rather than one CSS string). -->
    <div class="pad-grad-temp"></div>
    <div class="pad-grad-tint"></div>
  </mui-pad-2d>

  <!-- Axis labels -->
  <div class="axis-row" aria-hidden="true">
    <span>2000 K</span>
    <span>12000 K</span>
  </div>
</div>
