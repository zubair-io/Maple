<div class="flex flex-col gap-6">
  <div class="indicator flex flex-col gap-4 rounded-lg border border-border bg-surface p-4">
    @for (label of steps(); track label + $index) {
      <mui-progress-step
        [index]="$index + 1"
        [label]="label"
        [status]="statusFor($index)"
        [continueLabel]="$index === steps().length - 1 ? 'Finish' : 'Next'"
        (continued)="attemptAdvance()"
      />
    }
  </div>

  <div
    class="step-body flex min-h-[96px] flex-col gap-2 rounded-lg border border-border bg-surface-alt p-4"
  >
    @if (activeTemplate(); as template) {
      <ng-container [ngTemplateOutlet]="template" />
    }
  </div>

  <div class="footer flex justify-between gap-2">
    <mui-button variant="secondary" [disabled]="stepIndex() === 0" (pressed)="goBack()">
      Back
    </mui-button>
    <mui-button variant="primary" [disabled]="!canGoNext()" (pressed)="attemptAdvance()">
      {{ nextLabel() }}
    </mui-button>
  </div>
</div>
