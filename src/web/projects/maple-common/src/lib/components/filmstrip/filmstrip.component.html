@if (collapsed()) {
  <button
    type="button"
    class="strip-toggle film-tab flex w-full cursor-pointer flex-col items-center gap-2 py-3 text-text-muted transition-colors duration-[120ms] ease-out hover:bg-white/8"
    (click)="toggleCollapsed()"
    aria-expanded="false"
    aria-label="Show filmstrip"
    title="Show filmstrip"
    data-testid="film-tab"
  >
    <maple-icon name="chevron-right" [size]="11" color="var(--color-text-muted)" class="block" />
    <span class="text-[9px] font-semibold uppercase tracking-[0.08em] [writing-mode:vertical-rl]"
      >FILM</span
    >
  </button>
} @else {
  <div
    class="strip-title flex items-center justify-between shrink-0 border-b-[0.5px] border-border pl-2.5 pr-1.5 pt-2 pb-1.5 text-[9px] font-semibold uppercase tracking-[0.08em] text-text-muted"
  >
    <span>FILM</span>
    <button
      type="button"
      class="strip-toggle -m-0.5 inline-flex cursor-pointer items-center justify-center rounded p-0.5 text-text-muted transition-colors duration-[120ms] ease-out hover:bg-white/8"
      (click)="toggleCollapsed()"
      aria-expanded="true"
      aria-label="Hide filmstrip"
      title="Hide filmstrip"
    >
      <maple-icon name="back" [size]="11" color="var(--color-text-muted)" class="block" />
    </button>
  </div>

  <div
    class="strip-scroll overflow-y-auto p-1 flex flex-col gap-[3px] max-h-[calc(100dvh-56px)]"
    #scrollContainer
  >
    @for (asset of state.assetsInSelectedFolder(); track asset.id) {
      @let isFocused = state.focusedAssetId() === asset.id;
      <div class="shrink-0" [style.height.px]="thumbH(asset)" [attr.data-id]="asset.id">
        <maple-asset-thumb [asset]="asset" [focused]="isFocused" (thumbClick)="select(asset)" />
      </div>
    }
  </div>
}
