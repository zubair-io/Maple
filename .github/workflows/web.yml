# .github/workflows/web.yml
#
# Web gates. Three jobs:
#
#   web-build        — compiles the Angular app the way a release does
#                      (`bun run build` == `ng build maple`); fails on any TS /
#                      template compile error. Closes the gap that let #749 ship.
#                      Also builds the Hosted app (`ng build maple-syrup`) in
#                      the same job, so a Hosted-only compile break fails CI
#                      too (#2283).
#   web-test         — RUNS the `maple` app unit tests (`ng test maple`, the
#                      @angular/build:unit-test / vitest runner). A build gate
#                      catches type/template errors but NOT logic regressions,
#                      broken HTTP mocks, or assertion drift — exactly what
#                      slipped onto `main` in #748 (an unflushed poll failed 19
#                      specs) and a stale `MOCK_STATUS` assertion. See #767.
#   web-test-common  — RUNS the `Maple-common` library unit tests
#                      (`ng test Maple-common`). The shared library holds most
#                      cross-cutting specs (observability, xmp, raw-pipeline,
#                      api, state, components), but `ng test maple` never runs
#                      them — so breaks like the #794 observability spec slipped
#                      onto `main`. A separate sibling job (not a step appended
#                      to web-test) so it runs in parallel and still fires even
#                      when the `maple` suite is red. See #845.
#
# All three jobs need the Rust -> WASM `pkg/` built first (the app and library
# both import it), so they share the same toolchain provisioning + cargo cache
# key; on a cache hit that shared cache makes each later job's WASM build a fast
# restore rather than another full `-Z build-std` recompile. On a cold cache
# there's nothing to restore, so each job builds the WASM once.
#
# Why this job is heavier than the other cross-cutting jobs:
#
#   The web build has a hard dependency on the Rust -> WASM `pkg/`. The
#   pipeline consumer imports it directly —
#     projects/maple-common/.../raw-pipeline/raw-wasm-init.ts:
#       import init, { install_panic_hook, initThreadPool } from './pkg/raw_wasm';
#   — and that synced `pkg/` is gitignored (built artifact). `ng build`
#   therefore fails at module resolution unless the WASM is built first.
#   `bun run build`'s `prebuild` lifecycle hook builds it via
#   `raw-wasm/build.sh` -> `wasm-pack build --features gpu,parallel
#   -Z build-std=panic_abort,std`, which needs nightly Rust + rust-src +
#   the wasm32 target + wasm-pack. `initThreadPool` only exists with
#   `--features parallel` (wasm-bindgen-rayon) and the WebGPU live entry
#   (`render_bytes_gpu` / `WebLiveSession`) only with `--features gpu`
#   (#1059), so a plain `wasm-pack build` is not enough — the canonical
#   build (one bundle, both features) is required.
#
#   So this gate provisions a Rust + wasm toolchain (unlike the lightweight
#   cross.yml jobs) and builds the WASM explicitly before `ng build`. We run
#   `bun run raw-wasm` ourselves first so it builds + syncs + writes the
#   build stamp; the subsequent `prebuild` hook then no-ops off that stamp
#   (no double build) and correctness doesn't depend on whether bun fires
#   the lifecycle hook.
#
# Trigger: every push to `main` and every PR, with NO path filter. The web
# app imports types from `src/api`, so an API type change can break the web
# build without touching `src/web` — narrowing the filter would let that
# class of break through, which is the opposite of this gate's purpose.

name: web

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-build:
    name: web-build (ng build maple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned to match raw-wasm/rust-toolchain.toml. rustup would resolve
      # the toolchain file automatically when wasm-pack runs from raw-wasm/,
      # but installing it explicitly makes the version visible and lets the
      # components/target install happen once, up front.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      # Prebuilt binary — `cargo install wasm-pack` would add a ~2-minute
      # compile to every run.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # `-Z build-std` rebuilds the standard library, which is slow uncached.
      # Mirror raw-pipeline.yml's cache step.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      # Build + sync the WASM pkg/ explicitly. Writes the build stamp so the
      # `prebuild` hook fired by `bun run build` below no-ops (no double
      # build), and the WASM is built even if bun skips the lifecycle hook.
      - name: Build raw-wasm (pkg/)
        working-directory: src/web
        run: bun run raw-wasm

      # The real gate. `ng build maple` exits non-zero on any TS / template
      # compile error; a plain `run:` step propagates that exit code.
      - name: Production web build (ng build maple)
        working-directory: src/web
        run: bun run build

      # Same gate for the Hosted app (`maple-syrup`) — it shares the WASM
      # `pkg/` built above but has its own routes/app.config, so a Hosted-only
      # compile break (e.g. #2283's `/settings` route) wouldn't otherwise fail
      # CI. Same job as `ng build maple` so a Hosted build break fails the
      # same gate.
      - name: Production Hosted web build (ng build maple-syrup)
        working-directory: src/web
        run: bunx ng build maple-syrup

      - name: Hosted artifact contract
        working-directory: src/web
        run: bun run check:hosted-artifact

  web-test:
    name: web-test (ng test maple)
    runs-on: ubuntu-latest
    # Single-run on CI (the @angular/build:unit-test builder is non-watch in a
    # non-interactive env). `timeout-minutes` is a backstop against any
    # accidental watch-mode hang burning the full job budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same toolchain as web-build — `ng test` transforms the app, which
      # imports the WASM `pkg/`, so it must be built first.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Same cache key as web-build, so the `-Z build-std` WASM compile is a
      # restore here rather than a second full build.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Build raw-wasm (pkg/)
        working-directory: src/web
        run: bun run raw-wasm

      # The gate. `ng test maple` runs the unit suite and exits non-zero on any
      # failing spec; a plain `run:` step propagates that exit code.
      - name: Run web unit tests (ng test maple)
        working-directory: src/web
        run: bun x ng test maple

  web-test-common:
    name: web-test (ng test Maple-common)
    runs-on: ubuntu-latest
    # Single-run on CI (the @angular/build:unit-test builder is non-watch in a
    # non-interactive env). `timeout-minutes` is a backstop against any
    # accidental watch-mode hang burning the full job budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same toolchain as web-build — `ng test` transforms the library, which
      # imports the WASM `pkg/`, so it must be built first.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-10-01
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Same cache key as web-build, so on a cache hit the `-Z build-std` WASM
      # compile is a restore here rather than a third full build; on a cold
      # cache this job builds the WASM once.
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: web-wasm-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Install web deps
        working-directory: src/web
        run: bun install --frozen-lockfile

      - name: Build raw-wasm (pkg/)
        working-directory: src/web
        run: bun run raw-wasm

      # The gate. `ng test Maple-common` runs the shared-library unit suite and
      # exits non-zero on any failing spec; a plain `run:` step propagates that
      # exit code. Capital-M `Maple-common` is the angular.json project name.
      - name: Run web unit tests (ng test Maple-common)
        working-directory: src/web
        run: bun x ng test Maple-common
