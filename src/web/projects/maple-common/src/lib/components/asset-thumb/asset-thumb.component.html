<!-- Filmstrip-only remnant — see this component's header comment. Every
     conditional below that used to branch on `variant()` collapsed to its
     `variant === 'filmstrip'` arm once the `grid` arm moved to
     `<maple-asset-tile>`; the RENDERED OUTPUT for a given asset is
     unchanged from before that split (verified in
     asset-thumb.component.spec.ts). -->
@let a = asset();
@let url = thumbUrl();
<button
  type="button"
  class="thumb block text-left relative h-full w-full flex-shrink-0 cursor-pointer overflow-hidden rounded-[2px] bg-cover bg-center outline-none variant-filmstrip"
  [class.focused]="focused()"
  [class.dimmed]="a.hidden"
  [style.background-image]="url ? '' : 'url(' + a.thumbnailGradient + ')'"
  [attr.aria-label]="a.filename"
  [attr.aria-pressed]="focused()"
  [attr.aria-current]="focused() ? 'true' : null"
  (click)="thumbClick.emit($event)"
>
  @if (url) {
    <img
      class="absolute inset-0 block h-full w-full object-cover"
      [src]="url"
      alt=""
      aria-hidden="true"
      role="presentation"
      loading="lazy"
      decoding="async"
    />
  }

  <!-- Selection / focus ring. Separate overlay element so it stacks
       above the absolutely-positioned <img>; box-shadow/outline render
       on the .thumb itself which the img completely obscures. -->
  <div
    class="thumb-ring pointer-events-none absolute inset-0 rounded-[2px] border-2 border-transparent transition-[border-color] duration-[80ms]"
    aria-hidden="true"
  ></div>

  @if (a.edited) {
    <div class="absolute right-[3px] top-[3px] h-[5px] w-[5px] rounded-full bg-primary"></div>
  }

  @if (a.flag === 'pick') {
    <div
      class="absolute bottom-[3px] left-[3px] h-[6px] w-[6px] rounded-full bg-success-text"
    ></div>
  } @else if (a.flag === 'reject') {
    <div class="absolute bottom-[3px] left-[3px] h-[6px] w-[6px] rounded-full bg-error-text"></div>
  }
</button>
