@if (toast(); as message) {
  <div
    class="dlg-toast static mt-2 mx-4 translate-x-0 border-[0.5px] border-border bg-surface-hover text-text-main"
    role="status"
  >
    <span>{{ message }}</span>
    <mui-button
      variant="ghost"
      size="sm"
      (pressed)="dismissToast.emit()"
      ariaLabel="Dismiss"
      [iconOnly]="true"
      iconLeading="x"
    ></mui-button>
  </div>
}

@if (loadError(); as error) {
  <div class="mt-2 mx-4 text-[11px] text-error-text" role="alert">{{ error }}</div>
}
