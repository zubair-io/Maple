version: '3.9'

# Maple Self Hosted — Docker Compose
#
# Usage:
#   docker compose --profile app up -d            # start the Maple server
#   docker compose --profile app --profile proxy up -d
#                                                 # …and expose it via a Cloudflare Tunnel
#
# Maple keeps its whole library index in one SQLite file, so there is no
# database service here. The `app` profile starts two containers: the Maple
# server, and the Temporal server Maple runs its background work on. A plain
# `docker compose up -d` has no work to do.
#
# For development, skip Compose entirely and run the Bun server natively from
# src/api with `bun src/index.ts`.

services:
  # ---------------------------------------------------------------------------
  # Maple Self Hosted server — built from src/api/Dockerfile, behind the `app`
  # profile so `docker compose up -d` alone starts nothing.
  # ---------------------------------------------------------------------------
  maple:
    profiles: ['app']
    build:
      context: ../.. # monorepo root
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
      # Managed LAN HTTPS (Settings → Network). Keep these LAN-only in your firewall.
      # If the runtime HTTPS port changes, update both mappings accordingly.
      - '3443:3443/tcp'
      - '3443:3443/udp'
    environment:
      PORT: '3000'
      # Where Maple finds the `temporal` service below. Only a starting point:
      # an address saved under Settings → Workers takes precedence.
      MAPLE_TEMPORAL_ADDRESS: temporal:7233
      # The library database, on the maple_data volume below. Nothing else in
      # this file matters as much as keeping those two in agreement.
      MAPLE_SQLITE_PATH: /app/data/maple.sqlite
      # Mount your photo library here (also set MAPLE_ROOTS):
      # MAPLE_ROOTS: /photos
    volumes:
      # THE IMPORTANT ONE. Your whole library — every folder, every asset row,
      # every setting, the JWT signing secret — is one SQLite file under
      # /app/data. The container filesystem is thrown away on every recreate,
      # so without this volume a `docker compose up --build` starts you over
      # with an empty library and logs everyone out. Your photos are safe
      # either way (Maple never writes to originals), but everything Maple
      # derived from them would have to be indexed again from scratch.
      - maple_data:/app/data
      # Mount photo library directories here, e.g.:
      # - /path/to/your/photos:/photos:rw
      #
      # /app/config holds the on-disk FALLBACK JWT secret, used only on a boot
      # where the database cannot be opened. The real secret lives in the
      # database on maple_data; persisting this one keeps even the degraded
      # path from rotating it.
      - maple_config:/app/config
    depends_on:
      temporal:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Temporal — the server Maple runs all its background work on: pipeline
  # stages, the discover sweep, maintenance, jobs and imports (docs/temporal.md).
  # This is Temporal's single-binary server with its state in one SQLite file,
  # which suits one Maple server; to use a Temporal cluster you already run,
  # delete this service and point Settings → Workers at it, with a namespace no
  # other Maple server uses.
  #
  # Nothing is published to the host: only the `maple` container needs to reach
  # port 7233. Temporal's own web UI is on 8233 — add `ports: ['8233:8233']` if
  # you want to browse workflow history, and keep it LAN-only, it has no login.
  # ---------------------------------------------------------------------------
  temporal:
    profiles: ['app']
    image: temporalio/temporal:1.10.0
    restart: unless-stopped
    # The image runs as an unprivileged user, which cannot write to a freshly
    # created named volume.
    user: root
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    volumes:
      - temporal_data:/data

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (optional — exposes Maple via a Cloudflare-proxied domain
  # without opening any ports on your firewall).
  #
  # 1. In the Cloudflare Zero Trust dashboard, go to
  #    Networks → Tunnels → Create a tunnel → Cloudflared.
  # 2. Copy the token the dashboard issues and put it in a `.env` file next to
  #    this docker-compose.yml:
  #
  #        CLOUDFLARE_TUNNEL_TOKEN=eyJh...
  #
  # 3. In the dashboard, add a Public Hostname for the tunnel pointing to
  #    `http://maple:3000` (the service name on the compose network).
  # 4. Bring it up:  docker compose --profile app --profile proxy up -d
  # ---------------------------------------------------------------------------
  cloudflared:
    profiles: ['proxy']
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      maple:
        condition: service_started

volumes:
  # The library database. Back this up; recreating it is a full re-index.
  maple_data:
    driver: local
  maple_config:
    driver: local
  # Job history. Losing it loses no photos, edits or queued jobs: the queue is
  # in Maple's own database, and a job that was running is submitted again.
  temporal_data:
    driver: local
