[package]
name = "bitarray"
version = "0.2.6"
edition = "2018"
description = "Stable-Rust patch of bitarray 0.2.6 (removes stale nightly feature attribute)"
license = "MIT"
# Vendored from crates.io/crates/bitarray/0.2.6 — single-line change:
# removed `#![feature(min_const_generics)]` which became stable in Rust 1.51.

[dependencies.cfg-if]
version = "0.1"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true
default-features = false

[dependencies.space]
version = "0.10"
optional = true

[features]
unstable-512-bit-simd = []
