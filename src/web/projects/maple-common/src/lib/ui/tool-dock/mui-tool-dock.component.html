<div [class]="rootClass()" role="toolbar">
  @for (entry of entries(); track $index) {
    @if (asItem(entry); as item) {
      <mui-action-button
        [icon]="item.icon"
        [label]="item.label"
        [orientation]="itemOrientation()"
        [selected]="isSelected(item)"
        [disabled]="item.disabled ?? false"
        [title]="item.title ?? null"
        [ariaHidden]="item.ariaHidden ?? false"
        [modified]="item.modified ?? false"
        (pressed)="select(item)"
      />
    } @else {
      <mui-divider [orientation]="dividerOrientation()" />
    }
  }
</div>
