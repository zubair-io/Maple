<div class="mui-place-row flex items-center gap-1">
  @if (editing()) {
    <mui-input
      [value]="draft()"
      (valueChange)="draft.set($event)"
      ariaLabel="Place"
      (keydown)="onKeydown($event)"
      (focusout)="commit()"
    />
  } @else {
    <button
      type="button"
      class="display inline-flex max-w-full cursor-text items-center gap-1 -mx-2 -my-1 rounded-md border border-transparent px-2 py-1 text-left hover:border-border hover:bg-surface-hover"
      (click)="startEditing()"
    >
      <mui-text variant="row-label" [truncate]="true">{{ place() || 'Unknown location' }}</mui-text>
    </button>
    @if (overridden()) {
      <mui-button
        variant="ghost"
        size="sm"
        iconLeading="revert"
        ariaLabel="Clear override"
        (pressed)="clear()"
      />
    }
  }
</div>
