# .github/workflows/publish-package.yml
#
# Automated multi-platform compilation and npm publish pipeline for @justmaple/maple.
# Compiles prebuilt native libraries for 7 Tier-1 target platforms, performs
# zero-dependency linkage auditing, and publishes modular platform packages with provenance.

name: publish-package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate builds and packaging without publishing to npm)'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'src/maple/**'
      - '.github/workflows/publish-package.yml'

concurrency:
  group: publish-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-linux:
    name: build-linux (${{ matrix.pkg_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.31
            pkg_name: maple-linux-x64-gnu
            libc_type: glibc
          - target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
            pkg_name: maple-linux-x64-musl
            libc_type: musl
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.31
            pkg_name: maple-linux-arm64-gnu
            libc_type: glibc
          - target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
            pkg_name: maple-linux-arm64-musl
            libc_type: musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/raw-pipeline -> target
          key: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: pipx install cargo-zigbuild

      - name: Build libraw_ffi (${{ matrix.pkg_name }})
        env:
          RUSTFLAGS: ${{ matrix.libc_type == 'musl' && '-C target-feature=-crt-static' || '' }}
        run: |
          cargo zigbuild --manifest-path src/raw-pipeline/Cargo.toml --release -p raw-ffi --target ${{ matrix.zig_target }}

      - name: Zero-dependency linkage verification (readelf audit)
        run: |
          chmod +x src/maple/scripts/audit-linkage.sh
          ./src/maple/scripts/audit-linkage.sh "src/raw-pipeline/target/${{ matrix.target }}/release/libraw_ffi.so" "${{ matrix.libc_type }}"

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg_name }}
          path: src/raw-pipeline/target/${{ matrix.target }}/release/libraw_ffi.so
          if-no-files-found: error

  build-macos:
    name: build-macos (${{ matrix.pkg_name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            pkg_name: maple-darwin-arm64
          - target: x86_64-apple-darwin
            pkg_name: maple-darwin-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/raw-pipeline -> target
          key: ${{ matrix.target }}

      - name: Build libraw_ffi (${{ matrix.pkg_name }})
        run: |
          cargo build --manifest-path src/raw-pipeline/Cargo.toml --release -p raw-ffi --target ${{ matrix.target }}

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg_name }}
          path: src/raw-pipeline/target/${{ matrix.target }}/release/libraw_ffi.dylib
          if-no-files-found: error

  build-windows:
    name: build-windows (maple-win32-x64-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/raw-pipeline -> target
          key: x86_64-pc-windows-msvc

      - name: Build raw_ffi (maple-win32-x64-msvc)
        run: |
          cargo build --manifest-path src/raw-pipeline/Cargo.toml --release -p raw-ffi --target x86_64-pc-windows-msvc

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: maple-win32-x64-msvc
          path: src/raw-pipeline/target/x86_64-pc-windows-msvc/release/raw_ffi.dll
          if-no-files-found: error

  publish:
    name: Assemble & Publish Packages
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        run: |
          npm install --global npm@11
          npm --version

      - name: Download all compiled binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Synchronize package versions
        run: |
          bun src/maple/scripts/sync-versions.ts

      - name: Assemble platform packages
        run: |
          bun src/maple/scripts/assemble-packages.ts artifacts

      - name: Build root @justmaple/maple package
        working-directory: src/maple
        env:
          # Test against the binary this run just assembled, never the
          # previously published platform package that bun install pulls in
          # as an optionalDependency (it predates any new FFI symbols).
          MAPLE_NATIVE_LIB: ${{ github.workspace }}/src/maple/npm/linux-x64-gnu/libraw_ffi.so
        run: |
          bun install
          bun run build
          bun test

      - name: Publish to npm (dry-run on PR/dispatch, release on v* tags)
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run || '' }}
        run: |
          set -euo pipefail

          DRY_RUN="false"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$DRY_RUN_INPUT" = "true" ]; then
            DRY_RUN="true"
          fi

          echo "=========================================================="
          echo "Publish execution mode: DRY_RUN=$DRY_RUN"
          echo "=========================================================="

          # Publish one package directory. The path is passed with an explicit
          # "./" — a bare "src/maple" parses as the GitHub shorthand
          # "user/repo" and npm tries git ls-remote instead of packing the dir.
          # Outside dry-run, a version that is already on the registry is
          # skipped instead of failing, so a run that died part-way (network
          # blip, registry 5xx, OIDC hiccup) can be re-run and will pick up
          # exactly the packages that never landed — npm rejects publishing
          # over an existing version with E403.
          #
          # Dist-tag: the release pipeline only ever mints plain numbered tags
          # (v0.1.2), so those land on `latest` and are what a bare
          # `npm install @justmaple/maple` resolves. A prerelease version
          # (v0.1.2-test.1, always a manual tag push) goes to `next` instead,
          # so a hand-pushed test build can never become the default.
          publish_pkg() {
            local dir="$1"
            local name version dist_tag
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            case "$version" in
              *-*) dist_tag="next" ;;
              *)   dist_tag="latest" ;;
            esac
            echo "Publishing $name@$version from $dir (dist-tag: $dist_tag)"
            if [ "$DRY_RUN" = "true" ]; then
              # `npm publish --dry-run` still asks the registry and refuses a
              # version that is already published, which is the normal state
              # of a PR right after a release (the version-sync PR sets
              # package.json to the version that just shipped). `npm pack
              # --dry-run` packs and lists the tarball the same way without
              # touching the registry.
              npm pack "./$dir" --dry-run
              return
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "  already published — skipping"
              return
            fi
            npm publish "./$dir" --access public --provenance --tag "$dist_tag"
          }

          PLATFORM_PKGS=(
            "src/maple/npm/darwin-arm64"
            "src/maple/npm/darwin-x64"
            "src/maple/npm/linux-x64-gnu"
            "src/maple/npm/linux-x64-musl"
            "src/maple/npm/linux-arm64-gnu"
            "src/maple/npm/linux-arm64-musl"
            "src/maple/npm/win32-x64-msvc"
          )

          # Platform packages first, root last: if any platform publish fails
          # the previously published root stays live and consumers are
          # unaffected, and a re-run resumes from the first missing package.
          for pkg in "${PLATFORM_PKGS[@]}"; do
            publish_pkg "$pkg"
          done
          publish_pkg "src/maple"

          echo "Publish workflow completed successfully."
