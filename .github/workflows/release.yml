# .github/workflows/release.yml
#
# Signed Windows artifacts and coordinated publication of stable releases.
#
# Stable release tags are created by version-sync.yml. Xcode Cloud consumes
# the same tag and uploads the notarized Mac DMG from its production
# archive; this workflow builds Windows, maintains the shared draft release,
# and publishes only after both platforms are present.
#
# workflow_dispatch remains a Windows dry run: its artifacts stay on the
# workflow run and no GitHub Release is created.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-app:
    name: Windows x64 (build, sign)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/raw-pipeline -> target

      # No --target flag: the csproj bundles raw_ffi.dll + maple-cli.exe
      # from target/release/ (not the triple-suffixed dir).
      - name: Build native core (raw_ffi.dll + maple-cli.exe)
        run: |
          cargo build --release --manifest-path src/raw-pipeline/Cargo.toml -p raw-ffi --features gpu
          cargo build --release --manifest-path src/raw-pipeline/Cargo.toml -p maple-cli --features pano

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish WinUI app (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/windows/Maple.WinUI/Maple.WinUI.csproj `
            -c Release -r win-x64 --self-contained `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish

      # Stage only OUR binaries for signing — the runtime/framework DLLs in
      # the publish folder are already Microsoft-signed, and Trusted Signing
      # signs a whole folder.
      - name: Stage binaries for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory signing | Out-Null
          foreach ($f in 'Maple.WinUI.exe', 'raw_ffi.dll', 'maple-cli.exe') {
            if (-not (Test-Path "publish\$f")) { throw "$f missing from publish output" }
            Copy-Item "publish\$f" signing\
          }

      - name: Sign binaries (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\signing
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Fold signed binaries back into publish
        shell: pwsh
        run: |
          Copy-Item signing\* publish\ -Force
          $sig = Get-AuthenticodeSignature publish\Maple.WinUI.exe
          if ($sig.Status -ne 'Valid') { throw "Maple.WinUI.exe signature is $($sig.Status)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DPublishDir="$env:GITHUB_WORKSPACE\publish" `
            /DOutputDir="$env:GITHUB_WORKSPACE\installer-out" `
            src\windows\installer\maple.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Sign installer (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\installer-out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Portable zip alongside the installer, from the same signed payload
      # (the shim rides along so PATH-less use still has bin\maple.cmd).
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item installer-out\*.exe out\
          New-Item -ItemType Directory publish\bin -Force | Out-Null
          Copy-Item src\windows\installer\maple.cmd publish\bin\maple.cmd
          Compress-Archive -Path publish\* -DestinationPath "out\Maple-Windows-x64-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: out/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [windows-app]
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: windows-app
          merge-multiple: true

      - name: Create or reuse draft release
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            RELEASE_ARGS=(
              "$GITHUB_REF_NAME"
              --repo "$REPOSITORY"
              --draft
              --title "Maple $GITHUB_REF_NAME"
              --generate-notes
            )
            case "$GITHUB_REF_NAME" in *-*) RELEASE_ARGS+=(--prerelease);; esac
            gh release create "${RELEASE_ARGS[@]}" \
              || gh release view "$GITHUB_REF_NAME" --repo "$REPOSITORY" >/dev/null
          fi

      - name: Upload Windows assets
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$REPOSITORY" --clobber

      - name: Wait for Xcode Cloud Mac asset
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED_ASSET="Maple-macOS-$VERSION.dmg"
          DEADLINE=$((SECONDS + 10800))

          while (( SECONDS < DEADLINE )); do
            if gh release view "$GITHUB_REF_NAME" --repo "$REPOSITORY" \
                --json assets --jq ".assets[].name" | grep -Fxq "$EXPECTED_ASSET"; then
              echo "Found $EXPECTED_ASSET"
              exit 0
            fi
            echo "Waiting for Xcode Cloud to upload $EXPECTED_ASSET"
            sleep 30
          done

          echo "::error::Timed out waiting for $EXPECTED_ASSET. The release remains a draft."
          exit 1

      - name: Publish complete release
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$REPOSITORY" \
              --draft=false --prerelease=true
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$REPOSITORY" \
              --draft=false --prerelease=false --latest
          fi
