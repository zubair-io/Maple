# .github/workflows/raw-pipeline.yml
#
# Color-parity gate for the Rust raw pipeline. Per CLAUDE.md §
# "Objective color testing — no eyeballing": every color-pipeline
# change must pass src/scripts/test_color_pipeline.sh against the
# committed test-fixtures/budgets.json (which is a one-way ratchet).
#
# This workflow exists because the rule was previously enforced only
# on the local laptop of whoever ran the harness before merging — see
# test-fixtures/BUDGETS_DRIFT.md for the resulting drift on main.
#
# Fixtures: test-fixtures/raws/ and test-fixtures/references/ are
# gitignored (6.5 GB). The harness skip-passes at preflight when its
# manifest or budgets file is missing (src/scripts/test_color_pipeline.sh
# preflight section); a missing raws/ directory is *not* checked by the
# script directly — with manifest + budgets present but RAWs absent the
# script now FAILS CLOSED via its compared==0 gate (#1082) rather than
# green-no-opping. To keep the workflow robust against partial-fixture
# states, the probe below treats raws/ AND manifest as load-bearing, and
# the skip-pass branch points the script at a synthetic non-existent
# manifest so it unconditionally takes its preflight exit. The job is
# therefore a no-op on stock runners; it becomes meaningful on a
# self-hosted runner (or any environment) where fixtures have been
# provisioned. Fixture provisioning is tracked separately.

name: raw-pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/raw-pipeline/**'
      - 'test-fixtures/budgets.json'
      - 'test-fixtures/pano-budgets.json'
      - 'src/scripts/test_color_pipeline.sh'
      - 'src/scripts/check_wgsl.sh'
      - 'src/scripts/compare_images.py'
      - 'src/scripts/test_pano_pipeline.sh'
      - 'src/scripts/pano_metrics.py'
      - 'src/scripts/test_synthetic_grey.sh'
      - 'src/scripts/test_synthetic_color_chart.sh'
      - 'src/scripts/test_grey_adjustments.sh'
      - 'src/scripts/test_grey_dcp.sh'
      - 'src/scripts/test_banding.sh'
      - 'src/scripts/banding_check.py'
      - 'src/scripts/banding_check_test.py'
      - 'src/scripts/stage_stats*.py'
      - 'src/scripts/stage_diff*.py'
      - 'test-fixtures/banding_budgets.json'
      - 'test-fixtures/qualification/**'
      - 'tools/qualification/**'
      - '.github/workflows/raw-pipeline.yml'
  pull_request:
    paths:
      - 'src/raw-pipeline/**'
      - 'test-fixtures/budgets.json'
      - 'test-fixtures/pano-budgets.json'
      - 'src/scripts/test_color_pipeline.sh'
      - 'src/scripts/check_wgsl.sh'
      - 'src/scripts/compare_images.py'
      - 'src/scripts/test_pano_pipeline.sh'
      - 'src/scripts/pano_metrics.py'
      - 'src/scripts/test_synthetic_grey.sh'
      - 'src/scripts/test_synthetic_color_chart.sh'
      - 'src/scripts/test_grey_adjustments.sh'
      - 'src/scripts/test_grey_dcp.sh'
      - 'src/scripts/test_banding.sh'
      - 'src/scripts/banding_check.py'
      - 'src/scripts/banding_check_test.py'
      - 'src/scripts/stage_stats*.py'
      - 'src/scripts/stage_diff*.py'
      - 'test-fixtures/banding_budgets.json'
      - 'test-fixtures/qualification/**'
      - 'tools/qualification/**'
      - '.github/workflows/raw-pipeline.yml'

concurrency:
  group: raw-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap, unconditional compile gate for the Apple FFI crate. This does NOT
  # need fixtures or the color harness — it exists to catch the "raw-ffi
  # doesn't compile against raw-core" failure class (e.g. an unresolved
  # import after a raw-core API change), which is one of the two ways #876's
  # device build broke. It runs on the host target on a Linux runner; that's
  # sufficient because a compile error in raw-ffi is platform-independent.
  #
  # NOTE: this CANNOT catch per-slice symbol *staleness* in the committed
  # xcframework — that requires building the Apple target slices, which needs
  # a macOS runner (this repo's CI is Linux-only). That class is guarded
  # locally instead: build-xcframework.sh runs a symbol-consistency check
  # after assembling the xcframework (see src/apple/scripts/build-xcframework.sh).
  build-raw-ffi:
    name: build-raw-ffi (host compile gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-ffi-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: cargo build -p raw-ffi
        working-directory: src/raw-pipeline
        run: cargo build -p raw-ffi
      # Lib test gate: until this step existed, the raw-ffi shim tests
      # (pointer/geometry guards + the #877 encode contract in
      # scene_linear_chain_tests.rs) ran only on laptops — the #1621
      # soft-gamut change landed with a red raw-ffi test that no CI job
      # executed. These are fixture-free unit tests on the host target,
      # sharing the compile cache with the build step above.
      - name: cargo test -p raw-ffi --lib
        working-directory: src/raw-pipeline
        run: cargo test -p raw-ffi --lib
      # Developed-preview parity gate (#1964): compiles + runs the CIEDE2000
      # cross-check of the FFI develop extern vs the raw-core reference. On CI
      # it skip-passes (no gitignored RAW fixtures, no python numpy/PIL), so
      # the value here is compile-rot coverage — the fixture+python run happens
      # locally / on a fixture-provisioned machine. Shares the compile cache
      # with the steps above.
      - name: cargo test -p raw-ffi --test develop_preview_parity
        working-directory: src/raw-pipeline
        run: cargo test -p raw-ffi --test develop_preview_parity
      # Scoped fmt gate (#1247): raw-ffi files are now rustfmt-canonical; this
      # step ensures they stay that way so future `cargo fmt` runs are no-ops
      # and don't bloat files or trip the file-budget gate again. NOT a
      # workspace-wide check — raw-core and other crates remain non-canonical.
      - name: cargo fmt --check -p raw-ffi
        working-directory: src/raw-pipeline
        run: cargo fmt --check -p raw-ffi
      # Pano feature compile gate (#1259): `--features pano` pulls maple-pano
      # with its ML stack; this is the only always-on CI step that compiles
      # maple-cli with that feature. The gate is compile-only — no tests, no
      # fixtures. It prevents the class of breakage that occurred in #1253
      # (StitchOptions field added without updating the maple-cli construction
      # site), which was invisible to CI until #1258 fixed it.
      - name: cargo build --bin maple-cli --features pano (compile gate)
        working-directory: src/raw-pipeline
        run: cargo build --bin maple-cli --features pano

  # GPU path gate (#1937, made a real parity gate in #1973). CLAUDE.md treats
  # CPU↔GPU parity as a merge gate; until #1973 it was not one. #1937 landed the
  # two GPU-FREE halves of this job — the `--features gpu` compile gate and the
  # naga WGSL validation — but the half that actually compares WGSL output
  # against the raw-core Rust stage was dropped, because the first attempt at a
  # software-adapter step found no wgpu adapter and every one of the ~180 raw-gpu
  # tests panicked on `GpuContext::new_blocking().expect("gpu context")`. So the
  # job's green tick certified "the shaders parse", never "the shaders compute
  # the same numbers as raw-core" — which is exactly how the #1918/#1948 CPU-vs-
  # WGSL divergence reached main.
  #
  # The missing piece was the Vulkan userspace, not the hardware. ubuntu-latest
  # ships no Vulkan loader and no ICD at all, so wgpu's Vulkan backend enumerates
  # nothing and `request_adapter` returns None; `vulkaninfo` reporting llvmpipe
  # on some images comes from a different Mesa path. Installing `libvulkan1` +
  # `mesa-vulkan-drivers` puts Mesa's lavapipe ICD on the loader search path, and
  # wgpu-core accepts a `DeviceType::Cpu` adapter (it is only excluded when
  # `force_fallback_adapter` is set, wgpu-core-23 instance.rs) — so the whole
  # suite runs, headless and compute-only, on the stock runner.
  #
  # The four gates, cheapest first:
  #   1. `cargo build -p raw-ffi --features gpu` — the FFI GPU surface
  #      (src/gpu.rs + src/gpu_live.rs) that delegates into raw-gpu/wgpu; a
  #      compile-only gate needing no GPU. Catches the "raw-ffi --features gpu
  #      doesn't compile against raw-gpu/raw-core" failure class.
  #   2. `cargo check -p raw-wasm --all-features --all-targets` — raw-wasm's
  #      `gpu` feature gates a whole module tree (src/gpu_render/, including
  #      model.rs) that a default `cargo check` never compiles, so type-level rot
  #      there was invisible to every job. `--all-features` also pulls `parallel`;
  #      both resolve on the host target.
  #   3. `check_wgsl.sh` — naga's CPU WGSL front-end + validator over every
  #      hand-written kernel (assembled with its generated headers, mirroring
  #      the runtime concat). Needs no GPU. naga-cli is pinned to 23.0.0 to
  #      match the naga 23.1.0 that wgpu 23.0.1 bundles (Cargo.lock), so the
  #      gate matches the compiler the app actually runs.
  #   4. THE PARITY GATE: `cargo test -p raw-gpu` (every WGSL kernel against its
  #      raw-core Rust stage) followed by `cargo test -p raw-wasm --features gpu`
  #      (the whole `render_bytes_gpu` chain against `render_bytes`, on the
  #      committed synthetic grey DNG). A WGSL kernel that stops agreeing with
  #      raw-core now turns this job red.
  #
  # Fail-closed, never silently green. The raw-gpu tests `.expect()` a context,
  # so a vanished adapter is ~180 loud failures, not a skip. The raw-wasm
  # gpu_render tests DO have a `gpu_available()` soft-pass for developer boxes —
  # `MAPLE_REQUIRE_GPU=1` turns that soft-pass into a panic here, so this job can
  # never report green on a run that quietly executed no parity comparison.
  #
  # Still uncovered, deliberately: lavapipe is a Vulkan/SPIR-V target, so this
  # gate proves raw-core↔WGSL agreement but not Metal-backend-specific behaviour
  # (naga's MSL output, Apple driver rounding) or a browser's real WebGPU
  # implementation. Those keep running on real hardware — Metal locally and via
  # the Apple UITest harness. Tracked in #2315.
  #
  # #2336 root cause and fix: `cargo test -p raw-gpu` intermittently SIGSEGV'd
  # the WHOLE test binary (not a single test failure) on this lavapipe adapter.
  # Investigation of 7 real CI failures (all on `main`, 2026-09-02) found every
  # one identical: same crash signature, same test-binary hash across different
  # commits (proving the source diff under test is not the cause — see #2336's
  # own #2484 control), and the SAME three tests always mid-flight
  # ("has been running for over 60 seconds") at the moment of the crash:
  # `present_chain::tests::offscreen_present_matches_cpu_render_within_1_lsb`,
  # `present_chain::tests::offscreen_present_row_alignment_misaligned_width`,
  # `present_chain::tests::present_paints_the_image_not_the_clear_color`
  # (src/raw-pipeline/raw-gpu/src/present_chain/tests.rs).
  #
  # `present_chain.rs` is the ONLY file in this crate that creates a
  # `wgpu::Texture` and does `copy_texture_to_buffer` (every other one of the
  # ~200 `raw-gpu` tests is compute-only: a storage buffer in, a storage buffer
  # read back, no render-target texture, no format-conversion blit). Under
  # `cargo test`'s default parallelism (one thread per logical CPU — 4 on a
  # `ubuntu-latest` runner), those texture-creating tests run concurrently with
  # every other test's own from-scratch `GpuContext::new_blocking()` (a fresh
  # wgpu Instance+Adapter+Device per test — 190+ of them across the binary).
  # llvmpipe/lavapipe's software rasterizer is not validated for concurrent
  # multi-context creation/teardown from independent OS threads in one process;
  # the texture render-target + row-padded readback path is measurably heavier
  # than a plain buffer dispatch, which is exactly why these three tests are
  # consistently still running when a sibling thread's context churn corrupts
  # process state — a race in Mesa's shared software-rasterizer state, not a
  # defect in the WGSL kernels or the Rust bounds/stride math (reviewed: the
  # readback unpad loop is bounds-safe, `padded_bpr` always rounds `width*4` up
  # to `COPY_BYTES_PER_ROW_ALIGNMENT` before the buffer is sized).
  #
  # The fix: serialise this binary's tests (`--test-threads=1`) so no two
  # `GpuContext`s are ever alive-and-churning on the software rasterizer at
  # once. This keeps every test and every assertion running (no coverage lost,
  # unlike skipping the three tests) and removes the concurrency dimension the
  # crash requires. Homebrew's macOS `mesa` formula does not build the Vulkan
  # `lvp`/swrast driver lavapipe needs (Linux-only in Mesa's own build matrix;
  # verified via `brew cat mesa` — no vulkan/lvp/swrast driver entries, and
  # there is no separate `mesa-vulkan-drivers` formula), so this could not be
  # reproduced locally on this Mac; the diagnosis above is from the CI log
  # evidence and a source review of `present_chain.rs`, not a local repro.
  raw-gpu:
    name: raw-gpu (gpu build + WGSL validate + raw-core↔GPU parity)
    runs-on: ubuntu-latest
    env:
      # Turns the raw-wasm gpu_render `gpu_available()` soft-pass into a hard
      # failure (#1973): on a runner we have deliberately provisioned with an
      # adapter, "no adapter, skipping" is a broken gate, not a valid outcome.
      MAPLE_REQUIRE_GPU: '1'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-gpu-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      # Mesa lavapipe — the software Vulkan ICD the parity suite runs on. The
      # loader (`libvulkan1`) is as load-bearing as the driver: without it wgpu's
      # Vulkan backend fails to initialise and reports no adapter at all.
      # `vulkan-tools` is diagnostic only, but `vulkaninfo --summary` in the CI
      # log is what tells a future debugger which adapter the suite actually got.
      - name: Install Mesa lavapipe (software Vulkan adapter)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Report the Vulkan adapter (fails closed if there is none)
        run: |
          vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -q 'deviceName' /tmp/vulkaninfo.txt || {
            echo "::error::no Vulkan device enumerated — the raw-gpu parity gate would not be running"
            exit 1
          }

      # 1. Compile gate — the raw-ffi GPU FFI surface + raw-gpu + wgpu. No GPU
      #    required; this is what a bare `cargo build -p raw-ffi` (the
      #    build-raw-ffi job) deliberately does NOT cover.
      - name: cargo build -p raw-ffi --features gpu
        working-directory: src/raw-pipeline
        run: cargo build -p raw-ffi --features gpu

      # 2. The other feature-gated GPU surface: raw-wasm's `gpu` module tree.
      - name: cargo check -p raw-wasm --all-features --all-targets
        working-directory: src/raw-pipeline
        run: cargo check -p raw-wasm --all-features --all-targets

      # 3. WGSL syntax/type gate — CPU-only naga validation. Pinned to the naga
      #    version wgpu bundles so the gate mirrors the app's own compiler.
      - name: Install naga-cli (pinned to wgpu 23's naga)
        run: cargo install naga-cli --locked --version 23.0.0
      - name: WGSL validate (check_wgsl.sh)
        run: bash src/scripts/check_wgsl.sh

      # 4. The parity gate proper. raw-gpu first: its ~180 tests hard-`.expect()`
      #    a context, so if the adapter ever disappears this step is the loud
      #    failure that stops the job before anything downstream can soft-pass.
      # --test-threads=1 (#2336): serialised, not a retry band-aid — see the
      # job-level comment above for the root-cause evidence. Concurrent
      # GpuContext creation/teardown across this binary's 190+ tests is what
      # crashes lavapipe; running them one at a time removes that dimension
      # while keeping every test (and its assertions) in the gate.
      - name: cargo test -p raw-gpu (raw-core↔WGSL parity)
        working-directory: src/raw-pipeline
        run: cargo test -p raw-gpu -- --test-threads=1
      - name: cargo test -p raw-wasm --features gpu (render_bytes_gpu↔CPU parity)
        working-directory: src/raw-pipeline
        run: cargo test -p raw-wasm --features gpu
      # Capability-registry evidence for the GPU chain on lavapipe (#2430).
      # lavapipe only exists on Linux, so this record cannot be produced on a
      # developer Mac: with a committed record the run is checked against it
      # (drift fails the job); without one the run writes the record and
      # uploads it as an artifact for a human to commit. The registry treats
      # a missing record as "no evidence" — every Web-surfaced capability
      # stays `core` until the file lands — so the gap is reported, not
      # hidden. The suite re-runs the gpu_render tests already covered by the
      # step above; they take seconds against the cached build.
      - name: GPU chain parity evidence record (lavapipe)
        run: |
          cmd="cd src/raw-pipeline && cargo test -p raw-wasm --features gpu gpu_render"
          if [ -f test-fixtures/qualification/gpu_chain_parity_lavapipe.json ]; then
            bash tools/qualification/record.sh --check gpu_chain_parity_lavapipe vulkan-lavapipe -- bash -c "$cmd"
          else
            bash tools/qualification/record.sh gpu_chain_parity_lavapipe vulkan-lavapipe -- bash -c "$cmd"
            echo "::warning::no committed test-fixtures/qualification/gpu_chain_parity_lavapipe.json — download the qualification-gpu_chain_parity_lavapipe artifact from this run and commit it (docs/testing.md § Capability registry)."
          fi
      - name: Upload the lavapipe evidence record
        uses: actions/upload-artifact@v4
        with:
          name: qualification-gpu_chain_parity_lavapipe
          path: test-fixtures/qualification/gpu_chain_parity_lavapipe.json
          if-no-files-found: error

  # Metal-backend parity gate (#2315). `raw-gpu` above proves raw-core↔WGSL
  # agreement through naga's SPIR-V output on lavapipe — it says nothing about
  # naga's *MSL* output or an Apple GPU driver, which is the actual code path
  # every Apple build ships (macOS, iOS, iPadOS all run Metal). Before this
  # job, that surface was covered only by a human remembering to run
  # `cargo test -p raw-gpu` locally on Metal, or by the Apple `MapleUITests`
  # visual harness — both opt-in, neither in CI.
  #
  # GitHub-hosted `macos-latest` runners expose a real Metal adapter to
  # headless wgpu (Apple Silicon, Metal available through the runner's own
  # virtualization layer — no `CAMetalLayer`/window needed for compute, which
  # is all `raw-gpu`'s tests do). This job is the empirical proof of that
  # premise as much as it is the gate: `raw-gpu`'s tests hard-`.expect()` a
  # `GpuContext`, so if a Metal adapter were NOT available here the job would
  # fail loudly on its very first test, not soft-pass.
  #
  # Deliberately minimal — this job's only reason to exist is the ONE thing
  # the Linux `raw-gpu` job structurally cannot cover (a different naga
  # backend, a different driver). The compile gates (`raw-ffi --features gpu`,
  # `raw-wasm --all-features`) and the WGSL naga-frontend validation are
  # backend-independent and already run on Linux; duplicating them here would
  # cost CI minutes for zero additional signal.
  #
  # Non-required for now (#2315): new coverage, no history yet of its own
  # flake rate on a real (rather than software) adapter. Once it has run
  # clean for a while, promote it to the same standing as `raw-gpu` by
  # dropping `continue-on-error`. See docs/testing.md § GPU parity.
  # `continue-on-error` is the honest mechanism for that — this repo has no
  # server-side required-checks config to exempt a job from (docs/testing.md:
  # "required" is a project convention, not a server-side rule), so this is
  # what actually keeps a red run here from reading as a blocking failure
  # while the job is unproven.
  raw-gpu-metal:
    name: raw-gpu-metal (raw-core↔WGSL parity on Metal, macOS)
    runs-on: macos-latest
    continue-on-error: true
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-gpu-metal-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      # The parity gate proper, on the real backend. No lavapipe install, no
      # Vulkan probe — `macos-latest` carries Metal natively, and wgpu's
      # Metal backend needs no software ICD. Not serialised with
      # --test-threads=1 (#2336 is specific to lavapipe/llvmpipe's software
      # rasterizer under concurrent context churn); Metal is a real,
      # concurrency-validated driver, so the default parallel run is the
      # cheaper choice unless this job's own history says otherwise.
      - name: cargo test -p raw-gpu (raw-core↔WGSL parity, Metal)
        working-directory: src/raw-pipeline
        run: cargo test -p raw-gpu

  # Fixture-free Rust test gate (#1082). Before this job, NO CI executed
  # `cargo test` anywhere — the ~750 raw-core lib tests ran only on laptops.
  # Everything here runs on a stock Linux runner with no fixtures:
  #   * `cargo test -p raw-core --features test-support` — lib + integration
  #     targets. Fixture-dependent tests are `#[cfg_attr(not(feature =
  #     "fixtures"), ignore)]`, so they are *visibly* ignored here (and fail
  #     closed — panic on a missing fixture — when `--features fixtures` is
  #     enabled on a fixture-provisioned machine).
  #   * The three grey gates (synthetic in-memory DNGs, never skip):
  #     test_synthetic_grey.sh, test_grey_adjustments.sh, test_grey_dcp.sh.
  #     They re-run their `--test` targets with `--nocapture` so the
  #     per-predictor tables land in the CI log; the compile cache is shared
  #     with the cargo-test step, so the duplication costs seconds.
  rust-tests:
    name: rust-tests (cargo test -p raw-core + grey gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # banding_check.py (#1627) needs numpy + an EXR reader (OpenEXR
      # preferred, imageio fallback) — installed here rather than the full
      # src/scripts/requirements.txt so this job doesn't pick up
      # scipy/tifffile it doesn't use. stage_stats_test.py and
      # stage_diff_test.py (#2813) ride this same install for their
      # numpy/OpenEXR/imageio EXR-synthesis needs, but stage_diff.py also
      # does `import colour` (colour-science) for its ΔE00 math
      # (RGB_to_XYZ/XYZ_to_Lab/delta_E) — verified against a clean venv
      # containing only this install line, which reproduces a CI-exact
      # failure without it. Add it explicitly rather than assuming
      # stage_stats' narrower numpy-only need covers stage_diff too.
      - name: Install Python deps for the banding gate
        run: pip install 'numpy>=1.26' 'OpenEXR>=3.2' 'imageio>=2.34' 'colour-science>=0.4.4'
      - name: Cache cargo registry + raw-pipeline target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: rust-tests-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: cargo test -p raw-core (fixture-free)
        working-directory: src/raw-pipeline
        run: cargo test -p raw-core --features test-support
      # Each synthetic gate runs through tools/qualification/record.sh --check
      # (#2430): the gate itself is unchanged, and afterwards its executed /
      # failed / skipped counts are compared against the committed evidence
      # record in test-fixtures/qualification/<source>.json that the capability
      # registry (docs/capability-registry.md) is generated from. A suite that
      # gained or lost a case, or whose corpus changed, fails here until the
      # record is re-recorded locally (same script without --check) and
      # committed — so the registry can never cite a run that no longer
      # matches the code.
      - name: Synthetic grey gate (test_synthetic_grey.sh) + evidence check
        run: bash tools/qualification/record.sh --check synthetic_grey cpu-reference -- bash src/scripts/test_synthetic_grey.sh
      - name: Synthetic color-chart gate (test_synthetic_color_chart.sh) + evidence check
        run: bash tools/qualification/record.sh --check color_chart cpu-reference -- bash src/scripts/test_synthetic_color_chart.sh
      - name: Grey adjustments gate (test_grey_adjustments.sh) + evidence check
        run: bash tools/qualification/record.sh --check grey_adjustments cpu-reference -- bash src/scripts/test_grey_adjustments.sh
      - name: Grey DCP gate (test_grey_dcp.sh) + evidence check
        run: bash tools/qualification/record.sh --check grey_dcp cpu-reference -- bash src/scripts/test_grey_dcp.sh
      - name: banding_check.py unit tests
        run: python3 src/scripts/banding_check_test.py
      - name: Banding second-difference gate (test_banding.sh, #1627/#1733)
        run: bash src/scripts/test_banding.sh
      # stage_stats.py / stage_diff.py (#2813) — these tools and their tests
      # existed on disk untouched by any CI job (added in f89204d57). Wired
      # in here alongside banding_check_test.py: same standalone-script
      # convention, same synthetic-EXR-fixture pattern, same Python deps.
      - name: stage_stats.py unit tests
        run: python3 src/scripts/stage_stats_test.py
      - name: stage_diff.py unit tests
        run: python3 src/scripts/stage_diff_test.py

  color-pipeline:
    name: color-pipeline (test_color_pipeline.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Probe for fixtures up front so the rest of the job (Rust
      # toolchain install, cargo build) can be skipped on stock
      # runners. The harness itself also skip-passes, but doing the
      # check here saves ~3 minutes of toolchain setup per PR.
      - name: Probe fixtures
        id: probe
        run: |
          if [ -d test-fixtures/raws ] && [ -f test-fixtures/references/manifest.json ]; then
            echo "have_fixtures=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_fixtures=false" >> "$GITHUB_OUTPUT"
            echo "::notice::test-fixtures/raws or references/manifest.json not present — color-pipeline gate is a no-op on this runner. See test-fixtures/BUDGETS_DRIFT.md."
          fi

      - uses: actions/setup-python@v5
        if: steps.probe.outputs.have_fixtures == 'true'
        with:
          python-version: '3.12'

      - name: Install Python diff deps
        if: steps.probe.outputs.have_fixtures == 'true'
        run: pip install -r src/scripts/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.have_fixtures == 'true'

      - name: Cache cargo registry + raw-pipeline target
        if: steps.probe.outputs.have_fixtures == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-pipeline-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      - name: Run color-pipeline harness
        if: steps.probe.outputs.have_fixtures == 'true'
        run: bash src/scripts/test_color_pipeline.sh

      # Soft-pass branch: still invoke the script so its own skip-pass
      # message lands in the log (helps a self-hosted-runner debugger
      # confirm the path the gate took). We override MANIFEST to a path
      # that cannot exist so the script unconditionally takes its
      # manifest-missing preflight exit — guarding against the
      # partial-fixture case where references/manifest.json is present
      # but raws/ isn't, which would otherwise let the script proceed
      # into cargo build with no Rust toolchain installed.
      - name: Run color-pipeline harness (skip-pass)
        if: steps.probe.outputs.have_fixtures == 'false'
        env:
          MANIFEST: /nonexistent/test-fixtures-not-provisioned.json
        run: bash src/scripts/test_color_pipeline.sh

  # Pano regression harness (Maple Pano M0b, #1120). Mirrors the
  # color-pipeline job: fixture probe up front, the harness itself
  # skip-passes without the gitignored corpus (test-fixtures/raws/pano_*/
  # + references/<set>/<set>.png), and the per-set ceilings in the tracked
  # test-fixtures/pano-budgets.json are a one-way ratchet.
  #
  # Two deliberate differences from the color job:
  #   * Python deps (numpy + Pillow) install on BOTH branches because the
  #     harness's always-on validation — pano_metrics.py --self-test — runs
  #     procedurally even without fixtures, so this job gates the metric
  #     implementation on every PR that touches it.
  #   * The Rust toolchain is only provisioned when fixtures exist: that is
  #     the only path on which the harness builds maple-cli (to probe for
  #     the `pano stitch` candidate generator, which does not exist yet —
  #     the harness prints "candidate generator not available" and exits 0
  #     until Maple Pano M1+ lands the subcommand).
  pano-pipeline:
    name: pano-pipeline (test_pano_pipeline.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe fixtures
        id: probe
        run: |
          if ls -d test-fixtures/raws/pano_*/ >/dev/null 2>&1; then
            echo "have_fixtures=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_fixtures=false" >> "$GITHUB_OUTPUT"
            echo "::notice::test-fixtures/raws/pano_* not present — pano candidate gates are a no-op on this runner; the metrics self-test still runs."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The pano metric tool deliberately needs only numpy + Pillow (a
      # subset of src/scripts/requirements.txt) — keep this install tight
      # so the fixture-less self-test branch stays fast.
      - name: Install Python metric deps
        run: pip install 'numpy>=1.26' 'Pillow>=10'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.have_fixtures == 'true'

      - name: Cache cargo registry + raw-pipeline target
        if: steps.probe.outputs.have_fixtures == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: raw-pipeline-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}

      # One step for both branches: the harness's own discovery decides
      # whether the candidate phase runs (no fixtures → self-test + budgets
      # validation, then an explicit skip-pass with exit 0).
      - name: Run pano-pipeline harness
        run: bash src/scripts/test_pano_pipeline.sh
