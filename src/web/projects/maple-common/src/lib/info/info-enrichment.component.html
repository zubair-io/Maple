@let d = detail();
@if (d) {
  <mui-enrichment-panel
    [description]="d.description ?? ''"
    (descriptionCommitted)="onDescriptionCommitted($event)"
    (descriptionRegenerate)="onRequeue('describe')"
    [descriptionStageStatus]="describeStatus()"
    [descriptionError]="describeError()"
    [descriptionStale]="describeStale()"
    [people]="peopleChips()"
    [facesTotalCount]="facesTotalCount()"
    [facesUntaggedCount]="facesUntaggedCount()"
    [(selectedPersonId)]="selectedPersonId"
    (peopleRedetect)="onRequeue('face')"
    (facesUntaggedClicked)="onFacesUntaggedClicked()"
    [faceStatus]="faceStatus()"
    [faceError]="faceError()"
    [faceStale]="faceStale()"
    [showPlace]="showPlace()"
    [place]="placeDisplay()"
    [placeOverridden]="placeOverridden()"
    (placeCommitted)="onPlaceCommitted($event)"
    (placeCleared)="onPlaceSave(null)"
    (placeRequeue)="onRequeue('geocode')"
    [placeStatus]="placeStatus()"
    [placeError]="placeError()"
    [placeStale]="placeStale()"
    [showVision]="false"
    [visionLabels]="[]"
  />

  <app-info-vision [detail]="d" />

  <app-info-transcript [detail]="d" />
}
