<div
  class="flex max-h-[280px] flex-col gap-0.5 overflow-y-auto rounded-md border-[0.5px] border-border p-2"
  role="list"
  [attr.aria-label]="ariaLabel()"
>
  @if (loading()) {
    <p class="m-0 p-1 text-[12px] text-text-muted">{{ loadingLabel() }}</p>
  } @else {
    @for (row of rows(); track row.key) {
      <div [class]="rowClass(row.isError)" role="listitem">
        <span
          class="min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-text-muted"
          >{{ row.oldText }}</span
        >
        <span class="shrink-0 text-text-muted">→</span>
        <span [class]="newTextClass(row.isError)">
          {{ row.newText }}
          @if (row.badge; as badge) {
            <span [class]="badgeClass(badge.kind)">{{ badge.label }}</span>
          }
        </span>
      </div>
    }
  }
</div>
