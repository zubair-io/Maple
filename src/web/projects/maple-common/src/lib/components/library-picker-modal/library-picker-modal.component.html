@if (state.pickerVisible()) {
  <div
    class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/55"
    (click)="onBackdropClick()"
  >
    <div class="flex w-full max-w-[600px]" (click)="$event.stopPropagation()">
      <app-library-picker
        (pick)="onPick($event)"
        (cancel)="onCancel()"
      />
    </div>
  </div>
}
