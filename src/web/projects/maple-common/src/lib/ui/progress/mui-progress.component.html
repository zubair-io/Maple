<div
  [class]="rootClasses()"
  role="progressbar"
  [attr.aria-valuenow]="clampedValue()"
  [attr.aria-valuemin]="isIndeterminate() ? null : 0"
  [attr.aria-valuemax]="isIndeterminate() ? null : 100"
  [attr.aria-label]="label()"
>
  @if (shape() === 'bar') {
    <div [class]="trackClasses()">
      @if (isIndeterminate()) {
        <div [class]="fillClasses()"></div>
      } @else {
        <div [class]="fillClasses()" [style.width.%]="clampedValue()"></div>
      }
    </div>
  } @else {
    <svg [class]="ringClasses()" viewBox="0 0 36 36">
      <circle
        class="ring-track fill-none stroke-surface stroke-[3]"
        cx="18"
        cy="18"
        [attr.r]="ringRadius"
      />
      <circle
        class="ring-fill fill-none stroke-primary stroke-[3] [stroke-linecap:round] transition-[stroke-dashoffset_200ms_ease]"
        cx="18"
        cy="18"
        [attr.r]="ringRadius"
        [attr.stroke-dasharray]="ringCircumference"
        [attr.stroke-dashoffset]="isIndeterminate() ? ringCircumference * 0.75 : ringOffset()"
      />
    </svg>
  }
  @if (label()) {
    <span class="label whitespace-nowrap text-[12px] text-text-muted">{{ label() }}</span>
  }
</div>
