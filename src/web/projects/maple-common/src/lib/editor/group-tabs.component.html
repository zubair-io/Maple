<div class="tabs" role="tablist">
  @for (g of groups; track g) {
    <button
      type="button"
      role="tab"
      class="tab"
      [class.selected]="state.armedGroup() === g"
      [attr.aria-selected]="state.armedGroup() === g"
      [attr.data-testid]="'editor-group-' + g"
      (click)="select(g)"
    >
      <span class="label">{{ displayName[g] }}</span>
      <span class="underline"></span>
    </button>
  }
</div>
