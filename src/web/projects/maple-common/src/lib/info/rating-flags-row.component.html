<div class="row" [class.disabled]="disabled()">
  <div class="flags" role="group" aria-label="Flag">
    <button
      type="button"
      class="pill pill-pick"
      [class.active]="currentFlag() === 'pick'"
      [attr.aria-pressed]="currentFlag() === 'pick'"
      [attr.aria-label]="'Pick'"
      [attr.data-testid]="'info-flag-pick'"
      [disabled]="disabled()"
      (click)="setFlag('pick')"
    >
      <span class="glyph">P</span>
    </button>
    <button
      type="button"
      class="pill pill-unflagged"
      [class.active]="currentFlag() === 'unflagged'"
      [attr.aria-pressed]="currentFlag() === 'unflagged'"
      [attr.aria-label]="'Unflagged'"
      [attr.data-testid]="'info-flag-unflagged'"
      [disabled]="disabled()"
      (click)="setFlag('unflagged')"
    >
      <span class="glyph">&mdash;</span>
    </button>
    <button
      type="button"
      class="pill pill-reject"
      [class.active]="currentFlag() === 'reject'"
      [attr.aria-pressed]="currentFlag() === 'reject'"
      [attr.aria-label]="'Reject'"
      [attr.data-testid]="'info-flag-reject'"
      [disabled]="disabled()"
      (click)="setFlag('reject')"
    >
      <span class="glyph">&#x2715;</span>
    </button>
  </div>

  <div class="stars" role="radiogroup" aria-label="Rating">
    @for (i of STARS; track i) {
      <button
        type="button"
        class="star"
        [class.filled]="i <= currentStars()"
        [attr.aria-checked]="i === currentStars()"
        [attr.aria-label]="i + ' star' + (i === 1 ? '' : 's')"
        [attr.data-testid]="'info-star-' + i"
        role="radio"
        [disabled]="disabled()"
        (click)="setStar(i)"
      >
        @if (i <= currentStars()) {
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
            <path
              d="M7 1l1.85 4.16 4.55.42-3.45 3 1.04 4.42L7 10.7l-3.99 2.3 1.04-4.42-3.45-3 4.55-.42L7 1z"
            />
          </svg>
        } @else {
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            aria-hidden="true"
          >
            <path
              d="M7 1l1.85 4.16 4.55.42-3.45 3 1.04 4.42L7 10.7l-3.99 2.3 1.04-4.42-3.45-3 4.55-.42L7 1z"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>
    }
  </div>
</div>
