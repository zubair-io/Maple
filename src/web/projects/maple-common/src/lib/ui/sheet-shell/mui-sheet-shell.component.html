@if (open()) {
  <div [class]="scrimClasses()" (click)="onScrimClick()"></div>
  <div
    #sheetEl
    [class]="sheetClasses()"
    data-testid="bottom-sheet"
    [style.height.%]="heightFraction() * 100"
    [style.transform]="'translateY(' + dragOffsetPx() + 'px)'"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
  >
    <div
      class="drag-area flex h-[30px] flex-none items-start justify-center pt-2 [touch-action:none] cursor-grab active:cursor-grabbing"
      aria-hidden="true"
      data-testid="bottom-sheet-drag-area"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerCancel($event)"
    >
      <div class="grab-handle h-1 w-[38px] flex-none rounded-sm bg-border-hi"></div>
    </div>
    <div class="body flex-1 overflow-auto [touch-action:auto]"><ng-content /></div>
  </div>
}
