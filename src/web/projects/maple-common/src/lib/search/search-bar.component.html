<form
  class="flex min-h-[38px] flex-wrap items-center gap-1.5 rounded-full border border-border bg-input-bg py-1 pr-1.5 pl-3"
  (submit)="onSubmit($event)"
  role="search"
>
  <maple-icon name="search-glass" [size]="16" class="shrink-0 text-text-muted" />
  @for (chip of chips(); track chip.kind + ':' + chip.label) {
    <span
      class="inline-flex h-6 max-w-[180px] shrink-0 items-center gap-[5px] rounded-full border border-border bg-surface-alt py-0 pr-1 pl-2 font-['Lato',sans-serif] text-[11px] leading-none font-semibold text-text-main"
      [class.border-dashed]="chip.kind === 'inferred-date'"
      [class.opacity-85]="chip.kind === 'inferred-date'"
      [attr.title]="chipTitle(chip)"
      data-testid="search-active-chip"
    >
      <maple-icon [name]="chipIcon(chip)" [size]="12" class="shrink-0 text-text-muted" />
      <span class="overflow-hidden text-ellipsis whitespace-nowrap">{{ chip.label }}</span>
      @if (chip.removable !== false) {
        <button
          type="button"
          class="flex h-4 w-4 shrink-0 cursor-pointer items-center justify-center rounded-full border-none bg-transparent p-0 text-text-muted hover:bg-surface-hover hover:text-text-main"
          [attr.aria-label]="'Remove filter ' + chip.label"
          [attr.data-testid]="'search-chip-remove-' + chip.label"
          (click)="chipRemove.emit(chip)"
        >
          <maple-icon name="search-chip-remove" [size]="10" />
        </button>
      }
    </span>
  }
  @if (overflowCount() > 0) {
    <button
      type="button"
      class="h-6 max-w-[180px] shrink-0 cursor-pointer items-center gap-[5px] rounded-full border border-border bg-surface-alt px-2.5 font-['Lato',sans-serif] text-[11px] leading-none font-semibold text-text-muted hover:text-text-main"
      data-testid="search-chip-overflow"
      [attr.aria-label]="overflowCount() + ' more filters'"
      (click)="filtersTap.emit()"
    >
      +{{ overflowCount() }}
    </button>
  }
  <input
    #input
    type="search"
    class="search-field h-7 min-w-[80px] flex-1 border-none bg-transparent font-['Lato',sans-serif] text-[14px] leading-[1.2] text-text-main caret-primary outline-none placeholder:text-text-muted"
    [value]="query()"
    (input)="onInput($event)"
    placeholder="Search photos…"
    aria-label="Search photos"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    data-testid="search-input"
  />
  @if (hasQuery()) {
    <button
      type="button"
      class="flex h-[22px] w-[22px] shrink-0 cursor-pointer items-center justify-center rounded-full border-none bg-surface-alt p-0 text-text-muted hover:text-text-main"
      aria-label="Clear search"
      data-testid="search-clear"
      (click)="onClearClick()"
    >
      <maple-icon name="search-close" [size]="14" />
    </button>
  }
  <button
    type="button"
    class="relative flex h-7 shrink-0 cursor-pointer items-center gap-1.5 rounded-full border-none bg-transparent px-2.5 font-['Lato',sans-serif] text-[13px] leading-none font-medium text-text-main hover:bg-surface-hover"
    aria-label="Open filters"
    data-testid="search-filters"
    (click)="filtersTap.emit()"
  >
    <maple-icon name="search-sliders" [size]="16" />
    <span class="hidden md:inline">Filters</span>
    @if (filterCount() > 0) {
      <span
        class="absolute -top-[3px] -right-[3px] flex h-4 min-w-[16px] items-center justify-center rounded-full bg-primary px-[3px] text-[9px] font-bold text-white"
        data-testid="search-filter-count"
        >{{ filterCount() }}</span
      >
    }
  </button>
</form>
