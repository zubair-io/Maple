version: '3.9'

# Maple Self Hosted — Docker Compose
#
# Usage:
#   docker compose up -d                          # start MongoDB (uses host-built Bun server)
#   docker compose --profile app up -d            # also start the Maple server in Docker
#   docker compose --profile app --profile proxy up -d
#                                                 # …and expose it via a Cloudflare Tunnel
#
# For development, start MongoDB only and run the Bun server natively:
#   docker compose up -d mongo
#   bun src/index.ts

services:
  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: maple
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Maple Self Hosted server (optional — build with Dockerfile)
  # ---------------------------------------------------------------------------
  maple:
    profiles: ['app']
    build:
      context: ../.. # monorepo root
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      MAPLE_MONGO_URI: 'mongodb://mongo:27017'
      MAPLE_MONGO_DB: 'maple'
      # Hybrid search is enabled by default for container deployments once
      # MAPLE_MEILISEARCH_URL points at a reachable v1 Meilisearch instance.
      MAPLE_MEILISEARCH_URL: ${MAPLE_MEILISEARCH_URL:-}
      MAPLE_MEILISEARCH_API_KEY: ${MAPLE_MEILISEARCH_API_KEY:-}
      MAPLE_MEILISEARCH_SEMANTIC: ${MAPLE_MEILISEARCH_SEMANTIC:-true}
      MAPLE_MEILISEARCH_EMBEDDER_URL: ${MAPLE_MEILISEARCH_EMBEDDER_URL:-http://host.docker.internal:11434}
      MAPLE_MEILISEARCH_EMBEDDER_MODEL: ${MAPLE_MEILISEARCH_EMBEDDER_MODEL:-nomic-embed-text}
      MAPLE_MEILISEARCH_SEMANTIC_RATIO: ${MAPLE_MEILISEARCH_SEMANTIC_RATIO:-0.5}
      MAPLE_SERVICE_SEARCH_RATE_LIMIT_PER_MINUTE: ${MAPLE_SERVICE_SEARCH_RATE_LIMIT_PER_MINUTE:-60}
      # Mount your photo library here (also set MAPLE_ROOTS):
      # MAPLE_ROOTS: /photos
    volumes:
      # Mount photo library directories here, e.g.:
      # - /path/to/your/photos:/photos:rw
      # The JWT secret lives in MongoDB (mongo_data volume) and is shared
      # across instances — no extra config needed for it to survive redeploys.
      # /app/config only holds the on-disk FALLBACK secret used if Mongo is
      # unreachable at boot; persisting it keeps even that path stable.
      - maple_config:/app/config
    depends_on:
      mongo:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (optional — exposes Maple via a Cloudflare-proxied domain
  # without opening any ports on your firewall).
  #
  # 1. In the Cloudflare Zero Trust dashboard, go to
  #    Networks → Tunnels → Create a tunnel → Cloudflared.
  # 2. Copy the token the dashboard issues and put it in a `.env` file next to
  #    this docker-compose.yml:
  #
  #        CLOUDFLARE_TUNNEL_TOKEN=eyJh...
  #
  # 3. In the dashboard, add a Public Hostname for the tunnel pointing to
  #    `http://maple:3000` (the service name on the compose network).
  # 4. Bring it up:  docker compose --profile app --profile proxy up -d
  # ---------------------------------------------------------------------------
  cloudflared:
    profiles: ['proxy']
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      maple:
        condition: service_started

volumes:
  mongo_data:
    driver: local
  maple_config:
    driver: local
