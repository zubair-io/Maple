<div class="mui-chat flex flex-col h-full min-h-0">
  <div class="messages flex-1 min-h-0 overflow-y-auto flex flex-col gap-2 p-4">
    @for (message of messages(); track message.id) {
      <mui-chat-message
        [author]="message.author"
        [text]="message.text"
        [sentAt]="message.sentAt"
        [own]="message.own ?? false"
      />
    }
    @if (othersTyping()) {
      <mui-typing-indicator [name]="typingUserName()" />
    }
  </div>

  <div
    class="composer relative flex-none py-2 px-4 border-t border-border"
    (keydown)="onComposerKeydown($event)"
  >
    <mui-input
      [value]="composerValue()"
      (valueChange)="composerValue.set($event)"
      (committed)="onComposerCommitted($event)"
      placeholder="Message… use @ to mention someone"
      ariaLabel="Message"
    />
    <mui-suggestion-menu
      [open]="suggestionsOpen()"
      [items]="suggestionItems()"
      placement="top"
      (select)="onMentionSelect($event)"
    />
  </div>
</div>
