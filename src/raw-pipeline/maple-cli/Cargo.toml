[package]
name = "maple-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "maple-cli"
path = "src/main.rs"

[features]
stage-dump = ["raw-core/stage-dump"]
# Same contract as raw-core's `fixtures` feature (#1082): fixture-backed
# integration tests are `ignored` without it, and fail closed (panic on a
# missing fixture) with it. Enable on fixture-provisioned machines only.
fixtures = []

[dependencies]
raw-core = { path = "../raw-core" }
bytemuck.workspace = true
clap.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
