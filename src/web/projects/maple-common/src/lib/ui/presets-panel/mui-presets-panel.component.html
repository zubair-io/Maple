<div class="flex flex-col gap-1">
  @if (showSaveTrigger()) {
    <div class="header flex justify-end pb-1">
      <mui-button variant="secondary" size="sm" iconLeading="plus" (pressed)="openSavePrompt()">
        Save preset
      </mui-button>
    </div>
  }

  @if (loading()) {
    <mui-spinner placement="centered" />
  } @else if (presets().length === 0) {
    <mui-empty-state
      icon="star"
      title="No presets yet"
      message="Save your current adjustments as a preset to reuse them later."
    />
  } @else {
    @for (preset of presets(); track preset.id) {
      @if (isConfirmingDelete(preset.id)) {
        <mui-list-row
          icon="star"
          [label]="'Delete “' + preset.name + '”?'"
          [disabled]="true"
          [testId]="'preset-delete-confirm-row-' + preset.id"
        >
          <mui-button
            trailing
            variant="ghost"
            size="sm"
            [iconOnly]="true"
            iconLeading="check"
            ariaLabel="Confirm delete"
            [testId]="'preset-delete-confirm-' + preset.id"
            (pressed)="confirmInlineDelete(preset.id)"
          />
          <mui-button
            trailing
            variant="ghost"
            size="sm"
            [iconOnly]="true"
            iconLeading="x"
            ariaLabel="Cancel delete"
            [testId]="'preset-delete-cancel-' + preset.id"
            (pressed)="cancelInlineDelete()"
          />
        </mui-list-row>
      } @else {
        <mui-list-row
          icon="star"
          [label]="preset.name"
          [timestampValue]="timestampFor(preset)"
          [subtitle]="subtitleFor(preset)"
          [testId]="'preset-apply-' + preset.id"
          (pressed)="applied.emit(preset.id)"
        >
          @if (showDeleteAction()) {
            <mui-button
              trailing
              variant="ghost"
              size="sm"
              [iconOnly]="true"
              iconLeading="trash"
              ariaLabel="Delete preset"
              [testId]="'preset-delete-' + preset.id"
              (pressed)="requestDelete(preset.id, $event)"
            />
          }
        </mui-list-row>
      }
    }
  }

  <mui-dialog
    [open]="dialogMode() === 'confirmDelete'"
    title="Delete preset?"
    variant="confirm"
    confirmLabel="Delete"
    [destructive]="true"
    (confirmed)="confirmDelete()"
    (dismissed)="closeDialog()"
  />
  @if (showSaveTrigger()) {
    <mui-dialog
      [open]="dialogMode() === 'savePrompt'"
      title="Save preset"
      variant="prompt"
      confirmLabel="Save"
      promptPlaceholder="Preset name"
      [(promptValue)]="savePromptValue"
      (confirmed)="confirmSave($event)"
      (dismissed)="closeDialog()"
    />
  }
</div>
