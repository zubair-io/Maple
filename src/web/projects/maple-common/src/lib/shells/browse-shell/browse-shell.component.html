<!-- The action-pills/overflow-menu block (the largest single contributor)
     was extracted to app-toolbar-actions (#2293 fallow-audit-web fix),
     which brought this template from 29 cyclomatic / 44 cognitive down to
     20 / 31 — a real reduction, but not under the 20/15 gate on its own.
     What's left is BrowseShell's top-level layout branching: the
     phone-drawer-vs-inline-sidebar toggle, projected app capabilities, and
     the shared Hosted content fallback — each branch reads
     as one deliberate structural decision, not accidental nesting, and
     further splitting risks the kind of prop-drilling / indirection this
     shell (like timeline-view.component.html, asset-thumb.component.html,
     export-dialog.component.html — same suppression) already accepts as
     the more readable tradeoff. See the fallow-audit-web findings on
     PR #2293. -->
<div class="w-full h-full bg-bg overflow-hidden flex flex-col font-sans">
  <!-- Toolbar -->
  <div
    class="toolbar flex h-auto min-h-[2.75rem] min-w-0 flex-shrink-0 flex-wrap items-center gap-2 gap-y-1.5 border-b-[0.5px] border-border bg-surface px-3 md:h-11 md:min-h-0 md:flex-nowrap md:gap-y-2"
  >
    @if (layout() === 'phone') {
      <!-- Phone: the inline sidebar is replaced by the source-picker
           overlay drawer (#2280); this hamburger opens it. -->
      <mui-button
        variant="ghost"
        [iconOnly]="true"
        iconLeading="sidebar"
        data-testid="source-drawer-toggle"
        title="Open sources"
        ariaLabel="Open sources"
        (pressed)="openSourceDrawer()"
      />
    } @else {
      <!-- Sidebar toggle -->
      <mui-button
        variant="ghost"
        [iconOnly]="true"
        iconLeading="sidebar"
        [toggled]="state.sidebarVisible()"
        [title]="(state.sidebarVisible() ? 'Hide' : 'Show') + ' sidebar  ⌥⌘S'"
        [ariaLabel]="(state.sidebarVisible() ? 'Hide' : 'Show') + ' sidebar'"
        (pressed)="state.toggleSidebar()"
      />
    }

    <ng-content select="[browse-controls]" />

    <div class="flex-1"></div>

    <!-- Action pills: inline row at desktop; collapsed into a kebab menu
         below the desktop breakpoint (#2280). Extracted to
         app-toolbar-actions (#2293 fallow-audit-web fix) — same handlers
         either way, the child owns the collapse/kebab presentation. -->
    <app-toolbar-actions
      [collapsed]="layout() !== 'desktop'"
      [canCopySettings]="canCopySettings()"
      [canPasteSettings]="canPasteSettings()"
      [canSyncSettings]="canSyncSettings()"
      [selectedCount]="state.selectedCount()"
      [isSelecting]="state.isSelecting()"
      (copySettings)="onCopySettings()"
      (openPasteDialog)="onOpenPasteDialog()"
      (syncSettings)="onSyncSettings()"
      (toggleSelectMode)="state.toggleSelectMode()"
    >
      <ng-content select="[browse-server-actions]" />
    </app-toolbar-actions>
  </div>

  <!-- Body — `cdkDropListGroup` connects every descendant `cdkDropList`
       regardless of DOM position: the grid's tile drop-list (asset-grid,
       under "Center" below) and each folder-tree row's drop-list (under
       "Left", inside `app-folder-tree`) are both descendants of this div,
       so a tile dragged out of the grid can enter any folder row without
       either side needing to know the other's `id` (#2644 review — a
       one-way `[cdkDropListConnectedTo]` on the folder rows pointing at
       the grid's id was backwards: CDK's `connectedTo` grants THAT list's
       OWN items entry into the named targets, so it let folder rows' (empty)
       item set enter the grid, not grid tiles enter folder rows — the drag
       gesture never worked). `cdkDropListEnterPredicate` on each row still
       gates eligibility; folder rows expose no `cdkDrag` items themselves,
       so the reverse direction (grid accepting a "drop" from a folder row)
       is inert regardless of group membership. -->
  <div class="flex-1 flex min-h-0 min-w-0 bg-bg" cdkDropListGroup>
    <!-- Left: sidebar (folder tree) — inline pane at tablet+; on phone the
         source-picker overlay drawer (below) replaces it. Search is a
         top-level destination (the /search route), not an in-sidebar field
         — the sidebar search pill + its anchored overlay were removed in
         #692. -->
    @if (layout() !== 'phone') {
      <div
        class="source-sidebar relative flex w-[196px] flex-shrink-0 flex-col overflow-hidden transition-[width] duration-[220ms] ease-default lg:w-[240px]"
        data-testid="source-sidebar"
        [style.width]="state.sidebarVisible() ? null : '0px'"
      >
        <div class="flex-1 min-h-0 overflow-hidden">
          <app-folder-tree />
        </div>
      </div>
    }

    <!-- Center: Hosted fallback or app-provided Browse content. -->
    <div class="flex-1 flex flex-col min-w-0">
      <ng-content select="[browse-content]">
        <app-drop-zone />
        <app-asset-grid />
      </ng-content>
    </div>
  </div>
</div>

<!-- Phone: source-picker overlay drawer, replacing the inline sidebar
     (#2280). Selecting a source or tapping search reuses the same
     handlers the inline tree / toolbar search already call. -->
@if (layout() === 'phone') {
  <app-source-picker-drawer
    [(isOpen)]="sourceDrawerOpen"
    [sourceTree]="state.sidebarTree()"
    [showSearch]="showServerSearch()"
    (sourceSelected)="onDrawerSourceSelected($event)"
    (searchPillTap)="serverSearchRequested.emit()"
  />
}

<!-- Selective paste dialog (#944) -->
@defer (when pasteDialogVisible()) {
  <app-paste-settings-dialog
    [visible]="pasteDialogVisible()"
    [targetCount]="pasteTargetIds().length"
    [sourceLabel]="clipboardSourceLabel()"
    [sourceModel]="clipboardModel()"
    [targetModels]="pastePreviewTargets()"
    [previewError]="pastePreviewError()"
    (paste)="onPasteDialogConfirm($event)"
    (dismiss)="onPasteDialogDismiss()"
  />
}

<!-- Drag-move/copy collision prompt + completion summary (#2644). Both
     signals default to null on the NOOP capability (Hosted), so mounting
     these unconditionally is safe — no `@defer` needed. Lives here rather
     than inside `app-folder-tree` so it stays reachable on phone, where the
     inline sidebar (and any `FolderTreeComponent` instance inside it) is
     torn down whenever the source-picker drawer is closed; the "Move to…"
     keyboard equivalent has no folder-tree row of its own to anchor to. -->
@if (dragMove.collisionPrompt(); as prompt) {
  <app-drag-move-collision-dialog
    [filename]="prompt.filename"
    (resolve)="onDragMoveCollisionResolved($event)"
  />
}

<!-- Batch adjustment transfer progress / summary (#2436). Self-gating: the
     banner renders nothing unless a run is in flight or one has finished. -->
<app-batch-sync-banner (retryFailed)="onRetryFailedBatch()" />

@if (dragMove.resultSummary(); as summary) {
  <app-drag-move-summary-banner [summary]="summary" (dismiss)="onDismissDragMoveSummary()" />
}
