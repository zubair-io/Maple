<div class="mui-control-surface">
  <mui-tabs
    [tabs]="tabs()"
    [(activeId)]="activeTab"
    (activeIdChange)="tabChanged.emit($event)"
    ariaLabel="Tool"
  />

  <div class="body">
    @if (sliders().length === 0) {
      <mui-empty-state
        icon="info"
        title="No adjustments here"
        message="This tool has no sliders for the current selection."
      />
    } @else {
      <div class="summary">
        <mui-value-chip label="Adjustments" [value]="sliderCount()" />
      </div>
      <div class="sliders">
        @for (s of sliders(); track s.id) {
          <mui-living-slider
            [label]="s.label"
            [value]="s.value"
            (valueChange)="onSliderChange(s.id, $event)"
            (resetRequest)="onSliderReset(s.id)"
            [min]="s.min"
            [max]="s.max"
            [step]="s.step"
            [unit]="s.unit"
            [bipolar]="bipolar(s)"
          />
        }
      </div>
    }
  </div>
</div>
