[package]
name = "raw-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Epic #925: compile the GPU FFI surface (`src/gpu.rs` + `src/gpu_live.rs`),
# which calls `raw_gpu` directly. Build-time only, and OFF by default at the
# Cargo level — a bare `cargo build -p raw-ffi` stays wgpu-free (the CI
# `build-raw-ffi` gate depends on this). The Apple xcframework build is the one
# consumer that turns it ON: as of #1064 `build-xcframework.sh` passes
# `--features gpu` unconditionally (the Apple build is always-gpu), so every
# slice contains `maple_gpu_*`. The host GPU validation tests also enable it.
#
# `dep:raw-gpu` is required because raw-core's own `gpu` feature only pulls
# raw-gpu into the dependency *tree* — it does not re-export the crate, so the
# FFI needs a direct (optional) path dep to name `raw_gpu::`. We also flip
# `raw-core/gpu` so both crates resolve to the same `raw-gpu` build (mirrors
# raw-wasm's `gpu = ["dep:raw-gpu", ...]`).
gpu = ["dep:raw-gpu", "raw-core/gpu"]

# Gates fixture-dependent tests on the gitignored `test-fixtures/` tree —
# forwards raw-core's `fixtures` feature (#1082 semantics: without it the
# tests are visibly `ignored`; with it a missing fixture fails closed).
# Used by the #1781 live-vs-refine seam gate (`gpu_live_wb_frame_tests`).
fixtures = ["raw-core/fixtures"]

# Epic #1234 / M3 (#1235): panorama stitch C-FFI (`src/pano.rs`).
#
# Two variants, same `dep:maple-pano` (M6 #1244 redesign):
#
# `pano` (macOS slices): activates `maple-pano` with `ml` (ALIKED +
# LightGlue via ort `load-dynamic`). The dylib is dlopen'd at runtime.
# xcframework build: `--features gpu,pano` for macOS targets.
#
# `pano-ios` (iOS + iOS-sim slices, M6 #1244): activates `maple-pano`
# with `ml-static` (ort WITHOUT `load-dynamic`). The xcframework build
# script sets `ORT_LIB_LOCATION` to the official iOS static xcframework
# (pod-archive-onnxruntime-c-1.22.0.zip). ort-sys sees `libonnxruntime.a`
# in that dir and emits `cargo:rustc-link-lib=static=onnxruntime`. The
# `pano.rs` stub that returned error −3 is removed — both iOS slices now
# call the real `maple_pano::stitch` orchestration via `pano_apple.rs`.
# xcframework build: `--features gpu,pano-ios` for iOS/iOS-sim targets.
#
# All transitive deps (ort, ort-sys, sha2, toml and their tree) are
# vendored under `vendor/` — the offline xcframework build is hermetic.
pano = ["dep:maple-pano", "maple-pano/ml"]
pano-ios = ["dep:maple-pano", "maple-pano/ml-static"]

[dependencies]
raw-core = { path = "../raw-core" }
# Headless GPU resource core (epic #925). Gated by the `gpu` feature; absent
# from default builds. wgpu is pulled in transitively through here.
raw-gpu = { path = "../raw-gpu", optional = true }
# Panorama stitching core (epic #1234 / M3 #1235). Gated by the `pano`
# feature; absent from default builds. The `ml` sub-feature (ALIKED +
# LightGlue via ort) is unconditionally enabled here because the FFI surface
# exposes the ML stitch path directly. On iOS targets the ML code-path is
# `#[cfg(target_os = "macos")]`-gated inside `src/pano.rs` so no ort
# dylib is required at runtime on iOS.
# Single dep entry for both `pano` (macOS) and `pano-ios` (iOS) features.
# The features are additive to `maple-pano`'s feature set; `pano` activates
# `ml` (load-dynamic ort) and `pano-ios` activates `ml-static` (static ort).
# Since both features activate the same optional dep, `pano` and `pano-ios`
# can coexist safely if needed (Cargo unifies `ml` + `ml-static`, which
# means `load-dynamic` wins — but in practice the build script never
# activates both simultaneously).
maple-pano = { path = "../maple-pano", optional = true }
rawler.workspace = true
image.workspace = true
thiserror.workspace = true

[[test]]
# End-to-end parity gate for maple_pano_stitch (M3 #1235 / epic #1234).
# Uses the `pano` feature (maple-pano + ml); skip-passes when fixtures or ML
# environment are absent (same house rule as maple-pano's ml_smoke.rs).
name = "pano_ffi_gates"
path = "tests/pano_ffi_gates.rs"
required-features = ["pano"]

[dev-dependencies]
# Enable raw-core's synthetic-DNG writer for thumbnail tests that need a
# RAW with no embedded JPEG preview (exercises the rc=8 fall-through).
raw-core = { path = "../raw-core", features = ["test-support"] }
tempfile = "3"
