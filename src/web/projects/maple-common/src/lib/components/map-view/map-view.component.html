<div class="map-canvas absolute inset-0" #mapContainer></div>

@if (tilesUnreachable()) {
  <div
    class="absolute inset-x-0 top-0 z-10 flex items-center gap-3 px-3 py-2 text-xs text-text-main bg-[rgba(220,80,80,0.12)] border-b border-[rgba(220,80,80,0.35)]"
    role="alert"
  >
    <span class="flex-1">Map tiles are unreachable.</span>
    <a class="text-[#7aa6ff] no-underline hover:underline" routerLink="/settings/map">
      Check the tile-source setting
    </a>
  </div>
}

<!-- Empty-viewport notice (design doc § "Error / empty states") — layers
     over the canvas without blocking it, so the map keeps panning. Only
     shown once tiles are actually reachable; the tiles-unreachable notice
     above already explains why nothing else is visible in that case. -->
@if (noLocatedPhotos() && !tilesUnreachable()) {
  <div class="pointer-events-none absolute inset-x-0 top-3 z-10 flex justify-center" role="status">
    <span class="rounded-full bg-black/60 px-3 py-1 text-xs text-white backdrop-blur-[4px]">
      No photos with location here
    </span>
  </div>
}
