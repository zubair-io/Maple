@if (layout() === 'overlay') {
  <!-- Overlay layout: a real <button> (not the `stacked` layout's
       role="button" div below) — its interior only ever holds
       non-interactive content (image, ring, static badges, the readonly
       rating-flags display), so native button semantics are safe here and
       give Enter/Space activation for free. The `mediaCellFooter`
       projection slot (e.g. a caller's hover-reveal rename trigger) is
       rendered OUTSIDE this button, as a template-level sibling below —
       nesting another interactive control inside a <button> is invalid
       HTML and the exact nested-interactive anti-pattern this two-slot
       split exists to avoid. -->
  <button
    type="button"
    class="mui-media-cell overlay relative block h-full w-full cursor-pointer overflow-hidden rounded-[2px] border-none bg-transparent p-0 text-left outline-none"
    [class.is-selected]="selected()"
    [class.is-dimmed]="dimmed()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-pressed]="selected()"
    (click)="onCellClick($event)"
  >
    <mui-image
      [src]="src()"
      [alt]="alt()"
      fit="fill"
      radius="none"
      class="block h-full w-full"
      [placeholderBackground]="placeholderBackground()"
    />
    <div
      class="thumb-ring pointer-events-none absolute inset-0 rounded-[2px] border-2 border-transparent transition-[border-color] duration-75 ease-out"
      aria-hidden="true"
    ></div>
    <div
      class="overlay-slot top-left pointer-events-none absolute top-[5px] left-[5px] flex flex-col items-start gap-[3px]"
    >
      <ng-content select="[mediaCellTopLeft]" />
    </div>
    <div
      class="overlay-slot top-right pointer-events-none absolute top-[5px] right-[5px] flex flex-row-reverse items-start gap-[3px]"
    >
      <ng-content select="[mediaCellTopRight]" />
    </div>
    <mui-rating-flags
      class="overlay-rating pointer-events-none absolute right-[5px] bottom-[5px] left-[5px]"
      [rating]="rating()"
      [flag]="flag()"
      [readonly]="true"
    />
  </button>
} @else {
  <div
    class="mui-media-cell flex w-full flex-col gap-1 rounded-lg border-none bg-transparent p-1 cursor-pointer"
    [class]="'size-' + size()"
    [class.is-selected]="selected()"
    role="button"
    tabindex="0"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-pressed]="selected()"
    (click)="onCellClick($event)"
    (keydown)="onKeydown($event)"
  >
    <div class="thumb relative rounded-md outline-2 outline-offset-2 outline-transparent">
      <mui-image [src]="src()" [alt]="alt()" fit="fill" radius="sm" [aspectRatio]="1" />
      @if (badges().length > 0) {
        <div class="badges absolute top-1 left-1 flex gap-0.5">
          @for (badge of badges(); track badge) {
            <mui-badge variant="count" size="sm" [value]="badge" />
          }
        </div>
      }
    </div>
    <div
      class="meta flex items-center justify-between gap-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <mui-inline-rename-field
        [(value)]="filename"
        [ariaLabel]="'Rename ' + filename()"
        (renamed)="renamed.emit($event)"
      />
      <mui-rating-flags [(rating)]="rating" [(flag)]="flag" />
    </div>
  </div>
}
<ng-content select="[mediaCellFooter]" />
