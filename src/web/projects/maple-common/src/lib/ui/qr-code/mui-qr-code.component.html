<div class="mui-qr-code" [class]="'size-' + size()">
  <canvas
    #canvas
    role="img"
    [attr.aria-label]="ariaLabel() ?? 'QR code for ' + value()"
    [width]="pixelSize()"
    [height]="pixelSize()"
  ></canvas>
  @if (renderError()) {
    <div class="error" role="alert">{{ renderError() }}</div>
  }
</div>
