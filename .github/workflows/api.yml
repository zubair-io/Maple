name: Owned 4051 mixed-method correlation
on:
  workflow_dispatch:
concurrency:
  group: owned-4051-chronology-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.50.0
        ports: ['7700:7700']
        env:
          MEILI_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/raw-pipeline/target
          key: api-native-cargo-${{ runner.os }}-${{ hashFiles('src/raw-pipeline/**/Cargo.lock', 'src/raw-pipeline/**/Cargo.toml') }}
      - name: Install actual locked dependencies
        working-directory: src/api
        run: bun install --frozen-lockfile
      - name: Build own actual Linux native library
        run: bash src/api/scripts/build-raw-ffi.sh
      - name: Record source and native identities
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/head.txt
          git status --porcelain > diagnostics/status-before.txt
          bun --version > diagnostics/bun.txt
          sha256sum src/api/native/libraw_ffi.so src/raw-pipeline/target/x86_64-unknown-linux-gnu/release/libraw_ffi.so > diagnostics/native-before.sha256
          git ls-files -z | xargs -0 sha256sum > diagnostics/source-before.sha256
      - name: One bounded sixteen-call mixed-method correlation control
        env:
          MAPLE_JWT_SECRET: ci-test-secret-not-for-production-only
          MAPLE_NAPI: '0'
        run: |
          set +e
          (cd src/api && bun test tests/4051-discriminator/mixed-method.test.ts --timeout 30000) > diagnostics/mixed-method.log 2>&1
          actual=$?
          printf '%s\n' "$actual" > diagnostics/mixed-method.exit
          cat diagnostics/mixed-method.log
          sha256sum --check diagnostics/source-before.sha256 > diagnostics/source-after-mixed-method.log
          source_guard=$?
          sha256sum --check diagnostics/native-before.sha256 > diagnostics/native-after-mixed-method.log
          native_guard=$?
          if [ "$source_guard" -ne 0 ] || [ "$native_guard" -ne 0 ]; then actual=99; fi
          printf '%s\n' "$actual" > diagnostics/final.exit
          exit "$actual"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-4051-real-linux-chronology
          path: diagnostics
