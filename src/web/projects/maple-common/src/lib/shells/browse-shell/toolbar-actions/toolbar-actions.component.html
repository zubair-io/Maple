<!-- 10 cyclomatic / 13 cognitive — both comfortably under the 20/15
     thresholds. The lone finding here is a CRAP-score flag (31.6 > 30):
     fallow's offline `estimated` coverage heuristic (no --coverage/V8 data
     passed in CI) credits this brand-new file with partial coverage
     despite toolbar-actions.component.spec.ts covering every branch
     (inline vs. collapsed, projected actions, each pill's output, the
     disabled/selection-count states) — see fallow's own suggested fix
     for this exact finding (suppress-file). #2293 fallow-audit-web fix. -->
@if (collapsed()) {
  <div class="toolbar-overflow relative">
    <mui-button
      variant="ghost"
      [iconOnly]="true"
      iconLeading="ellipsis-horizontal"
      data-testid="toolbar-overflow-toggle"
      [toggled]="overflowMenuOpen()"
      title="More actions"
      ariaLabel="More actions"
      ariaHasPopup="menu"
      [ariaExpanded]="overflowMenuOpen()"
      (pressed)="toggleOverflowMenu()"
    />
    @if (overflowMenuOpen()) {
      <div
        class="toolbar-overflow-menu absolute top-[calc(100%+4px)] right-0 z-20 flex min-w-[200px] flex-col gap-1 rounded-lg border-[0.5px] border-border bg-surface p-1.5 shadow-[0_8px_24px_rgba(0,0,0,0.35)]"
        role="menu"
        data-testid="toolbar-overflow-menu"
        (click)="closeOverflowMenu()"
      >
        <ng-container *ngTemplateOutlet="actionPills" />
      </div>
    }
  </div>
} @else {
  <ng-container *ngTemplateOutlet="actionPills" />
}

<ng-template #actionPills>
  <!-- Select mode (#2404) — a keyboard-less tablet's only way to build a
       selection now that a plain click navigates. Toggle, not a gated
       action, so it's always enabled; state lives on LibraryStateService,
       not persisted, and survives leaving the mode so the pills below stay
       usable. -->
  <mui-button
    variant="secondary"
    [active]="isSelecting()"
    [ariaPressed]="isSelecting()"
    [fullWidth]="collapsed()"
    iconLeading="check"
    title="Toggle select mode"
    ariaLabel="Select"
    (pressed)="toggleSelectMode.emit()"
  >
    Select
  </mui-button>

  <ng-content />

  <!--
    Copy / Paste / Sync develop settings (#944). These shared actions are
    available in both applications: the write path
    (`LibraryStateService.updateAdjustment` → `scheduleSidecarWrite`)
    supports Hosted's FS Access writer as well as the server adapter, and
    the ⌘C / ⌘V shortcuts are ungated. App-specific actions are projected
    immediately above this block.
  -->
  <!-- Copy Settings — requires a focused asset. -->
  <mui-button
    variant="secondary"
    [active]="canCopySettings()"
    [disabled]="!canCopySettings()"
    [fullWidth]="collapsed()"
    title="Copy the focused photo's develop settings  ⌘C"
    ariaLabel="Copy settings"
    (pressed)="copySettings.emit()"
  >
    Copy Settings
  </mui-button>

  <!-- Paste Settings — requires clipboard contents + ≥1 selected. -->
  <mui-button
    variant="secondary"
    [active]="canPasteSettings()"
    [disabled]="!canPasteSettings()"
    [fullWidth]="collapsed()"
    title="Choose which develop-setting groups to paste  ⌘⇧V"
    ariaLabel="Paste settings"
    (pressed)="openPasteDialog.emit()"
  >
    Paste Settings…{{ canPasteSettings() ? ' (' + selectedCount() + ')' : '' }}
  </mui-button>

  <!-- Sync Settings — requires a focused asset + ≥2 selected. -->
  <mui-button
    variant="secondary"
    [active]="canSyncSettings()"
    [disabled]="!canSyncSettings()"
    [fullWidth]="collapsed()"
    title="Apply the focused photo's settings to the rest of the selection"
    ariaLabel="Sync settings"
    (pressed)="syncSettings.emit()"
  >
    Sync Settings{{ canSyncSettings() ? ' (' + selectedCount() + ')' : '' }}
  </mui-button>
</ng-template>
